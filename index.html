 She began to wet His feet with her tears and wiped them with her hair. She kissed His feet and anointed them with perfume.","status":"source_text","id":"luk-7-38"},{"book":"luk","chapter":7,"verse":39,"text":"And the Pharisee who had invited Him, seeing this, said within himself, “If this Man were a prophet, He would know who and what sort of woman is touching Him, that she is a sinner.”","status":"source_text","id":"luk-7-39"},{"book":"luk","chapter":7,"verse":40,"text":"And Jesus answered and said to him, “Simon, I have something to say to you.” And he said, “Teacher, speak.”","status":"source_text","id":"luk-7-40"},{"book":"luk","chapter":7,"verse":41,"text":"“A creditor had two debtors. One owed five hundred denarii, the other fifty.”","status":"source_text","id":"luk-7-41"},{"book":"luk","chapter":7,"verse":42,"text":"“When neither could repay him, he canceled the debts of both. So which of them will love him more?”","status":"source_text","id":"luk-7-42"},{"book":"luk","chapter":7,"verse":43,"text":"Simon answered and said, “I suppose the one to whom he forgave the greater amount.” And He said to him, “You have judged rightly.”","status":"source_text","id":"luk-7-43"},{"book":"luk","chapter":7,"verse":44,"text":"And turning toward the woman, He said to Simon, “Do you see this woman? I entered your house; you gave Me no water for My feet, but she wet My feet with tears and wiped them with her hair.”","status":"source_text","id":"luk-7-44"},{"book":"luk","chapter":7,"verse":45,"text":"“You gave Me no kiss, but since I came in she has not stopped kissing My feet.”","status":"source_text","id":"luk-7-45"},{"book":"luk","chapter":7,"verse":46,"text":"“You did not anoint My head with oil, but she has anointed My feet with perfume.”","status":"source_text","id":"luk-7-46"},{"book":"luk","chapter":7,"verse":47,"text":"“Therefore I tell you, her many sins have been forgiven, because she loved much. But the one forgiven little loves little.”","status":"source_text","id":"luk-7-47"},{"book":"luk","chapter":7,"verse":48,"text":"And He said to her, “Your sins are forgiven.”","status":"source_text","id":"luk-7-48"},{"book":"luk","chapter":7,"verse":49,"text":"And those reclining with Him began to say among themselves, “Who is this who even forgives sins?”","status":"source_text","id":"luk-7-49"},{"book":"luk","chapter":7,"verse":50,"text":"Jesus said to the woman, “Your faith has saved you. Go in peace.”","status":"source_text","id":"luk-7-50"},{"book":"luk","chapter":8,"verse":1,"text":"And afterward Jesus traveled through towns and villages, proclaiming and announcing the good news of the kingdom of God. The Twelve were with Him.","status":"source_text","id":"luk-8-1"},{"book":"luk","chapter":8,"verse":2,"text":"and certain women who had been healed of evil spirits and infirmities: Mary called Magdalene, from whom seven demons had gone out,","status":"source_text","id":"luk-8-2"},{"book":"luk","chapter":8,"verse":3,"text":"and Joanna, wife of Chuza, Herod’s steward, and Susanna, and many others, who were serving them out of their possessions.","status":"source_text","id":"luk-8-3"},{"book":"luk","chapter":8,"verse":4,"text":"When a large crowd gathered and people came to Him from one town after another, He spoke in a parable.","status":"source_text","id":"luk-8-4"},{"book":"luk","chapter":8,"verse":5,"text":"“A sower went out to sow his seed. As he sowed, some fell along the path. It was trampled, and birds of the sky ate it.”","status":"source_text","id":"luk-8-5"},{"book":"luk","chapter":8,"verse":6,"text":"“Some fell on rock. It sprouted and withered, because it had no moisture.”","status":"source_text","id":"luk-8-6"},{"book":"luk","chapter":8,"verse":7,"text":"“Some fell among thorns; the thorns grew alongside it and choked it.”","status":"source_text","id":"luk-8-7"},{"book":"luk","chapter":8,"verse":8,"text":"Some fell in good soil. It grew and produced a hundredfold. After saying this, Jesus called out, “Let anyone with ears to hear listen.”","status":"source_text","id":"luk-8-8"},{"book":"luk","chapter":8,"verse":9,"text":"His disciples asked Him what the parable meant.","status":"source_text","id":"luk-8-9"},{"book":"luk","chapter":8,"verse":10,"text":"Jesus said, “To you it has been granted to know the mysteries of the kingdom of God, but to the others they come in parables, so that looking they may not see and hearing they may not understand.”","status":"source_text","id":"luk-8-10"},{"book":"luk","chapter":8,"verse":11,"text":"“This is the parable: the seed is the word of God.”","status":"source_text","id":"luk-8-11"},{"book":"luk","chapter":8,"verse":12,"text":"“Those along the path are people who hear; then the devil comes and takes the word from their hearts so that they may not believe and be saved.”","status":"source_text","id":"luk-8-12"},{"book":"luk","chapter":8,"verse":13,"text":"“Those on the rock, when they hear the word, receive it with joy, but have no root. They believe for a while, then fall away in a time of testing.”","status":"source_text","id":"luk-8-13"},{"book":"luk","chapter":8,"verse":14,"text":"“The seed among thorns stands for those who hear, but as life goes on they are choked by worries, riches, and pleasures of life and bring no fruit to maturity.”","status":"source_text","id":"luk-8-14"},{"book":"luk","chapter":8,"verse":15,"text":"“Those in good soil hear the word with an honest and good heart and hold it fast, and bear fruit with perseverance.”","status":"source_text","id":"luk-8-15"},{"book":"luk","chapter":8,"verse":16,"text":"“No one lights a lamp and covers it with a container or puts it under a bed. One puts it on a stand so that those entering may see the light.”","status":"source_text","id":"luk-8-16"},{"book":"luk","chapter":8,"verse":17,"text":"“Nothing hidden will remain undisclosed, and nothing concealed will fail to become known and come to light.”","status":"source_text","id":"luk-8-17"},{"book":"luk","chapter":8,"verse":18,"text":"“So pay attention to how you hear; for whoever has, it will be given to him, and whoever does not have, even what he thinks he has will be taken from him.”","status":"source_text","id":"luk-8-18"},{"book":"luk","chapter":8,"verse":19,"text":"Jesus’ mother and brothers came to Him, but they could not reach Him because of the crowd.","status":"source_text","id":"luk-8-19"},{"book":"luk","chapter":8,"verse":20,"text":"Someone told Him, “Your mother and brothers are standing outside, wanting to see You.”","status":"source_text","id":"luk-8-20"},{"book":"luk","chapter":8,"verse":21,"text":"Jesus replied to them, “My mother and brothers are those who hear the word of God and do it.”","status":"source_text","id":"luk-8-21"},{"book":"luk","chapter":8,"verse":22,"text":"One day Jesus got into a boat with His disciples. He told them, “Let us cross to the other side of the lake,” and they set out.","status":"source_text","id":"luk-8-22"},{"book":"luk","chapter":8,"verse":23,"text":"As they sailed, Jesus fell asleep. A windstorm swept down on the lake, and the boat was filling with water, putting them in danger.","status":"source_text","id":"luk-8-23"},{"book":"luk","chapter":8,"verse":24,"text":"They came and woke Him, saying, “Master, Master, we are perishing!” Jesus rose and rebuked the wind and the raging waves; they ceased, and it became calm.","status":"source_text","id":"luk-8-24"},{"book":"luk","chapter":8,"verse":25,"text":"And He said to them, “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that He commands even the winds and the water, and they obey Him?”","status":"source_text","id":"luk-8-25"},{"book":"luk","chapter":8,"verse":26,"text":"And they sailed to the region of the Gerasenes, opposite Galilee.","status":"source_text","id":"luk-8-26"},{"book":"luk","chapter":8,"verse":27,"text":"And when He stepped out onto the land, a certain man from the town, who had demons, met Him; and for a considerable time he had worn no clothing, and he did not live in a house but in the tombs.","status":"source_text","id":"luk-8-27"},{"book":"luk","chapter":8,"verse":28,"text":"And seeing Jesus, he cried out and fell before Him and said with a loud voice, “What is there between me and You, Jesus, Son of the Most High God? I beg You, do not torment me.”","status":"source_text","id":"luk-8-28"},{"book":"luk","chapter":8,"verse":29,"text":"For Jesus had commanded the unclean spirit to come out of the man. It had often seized him. Though guarded and bound with chains and shackles, he broke the restraints and was driven by the demon into deserted places.","status":"source_text","id":"luk-8-29"},{"book":"luk","chapter":8,"verse":30,"text":"And Jesus asked him, “What is your name?” And he said, “Legion,” because many demons had entered him.","status":"source_text","id":"luk-8-30"},{"book":"luk","chapter":8,"verse":31,"text":"And they begged Jesus not to command them to depart into the abyss.","status":"source_text","id":"luk-8-31"},{"book":"luk","chapter":8,"verse":32,"text":"A large herd of pigs was feeding on the hillside. The demons begged permission to enter them, and Jesus allowed it.","status":"source_text","id":"luk-8-32"},{"book":"luk","chapter":8,"verse":33,"text":"The demons came out of the man and entered the pigs; the herd rushed down the slope into the lake and drowned.","status":"source_text","id":"luk-8-33"},{"book":"luk","chapter":8,"verse":34,"text":"When the herdsmen saw what had happened, they fled and reported it in the town and countryside.","status":"source_text","id":"luk-8-34"},{"book":"luk","chapter":8,"verse":35,"text":"People came to see what had happened and reached Jesus. They found sitting there the man from whom the demons had gone. He was clothed, in his right mind, at Jesus’ feet. And the people were afraid.","status":"source_text","id":"luk-8-35"},{"book":"luk","chapter":8,"verse":36,"text":"Those who had witnessed it told them how the man who had been possessed had been saved.","status":"source_text","id":"luk-8-36"},{"book":"luk","chapter":8,"verse":37,"text":"And all the people from the region of the Gerasenes asked Jesus to leave them. They were seized by great fear. He got into the boat and returned.","status":"source_text","id":"luk-8-37"},{"book":"luk","chapter":8,"verse":38,"text":"The man from whom the demons had gone begged to be with Jesus. But Jesus sent him away, saying,","status":"source_text","id":"luk-8-38"},{"book":"luk","chapter":8,"verse":39,"text":"“Return to your house and recount all that God has done for you.” And he went away, proclaiming throughout the whole town all that Jesus had done for him.","status":"source_text","id":"luk-8-39"},{"book":"luk","chapter":8,"verse":40,"text":"When Jesus returned, the crowd welcomed Him, for they had all been waiting for Him.","status":"source_text","id":"luk-8-40"},{"book":"luk","chapter":8,"verse":41,"text":"And look, a man named Jairus came, and he was a ruler of the synagogue; and falling at the feet of Jesus, he was pleading with Him to enter his house,","status":"source_text","id":"luk-8-41"},{"book":"luk","chapter":8,"verse":42,"text":"because he had an only daughter, about twelve years old, and she was dying. But as He went, the crowds were pressing against Him.","status":"source_text","id":"luk-8-42"},{"book":"luk","chapter":8,"verse":43,"text":"And a woman had suffered bleeding for twelve years. She had spent her whole livelihood on physicians, but could not be healed by anyone.","status":"source_text","id":"luk-8-43"},{"book":"luk","chapter":8,"verse":44,"text":"She came up behind Jesus and touched the fringe of His garment, and immediately her bleeding stopped.","status":"source_text","id":"luk-8-44"},{"book":"luk","chapter":8,"verse":45,"text":"And Jesus asked, “Who touched Me?” When everyone denied it, Peter said, “Master, the crowds surround You and press against You.”","status":"source_text","id":"luk-8-45"},{"book":"luk","chapter":8,"verse":46,"text":"Jesus said, “Someone touched Me, for I know that power has gone out from Me.”","status":"source_text","id":"luk-8-46"},{"book":"luk","chapter":8,"verse":47,"text":"The woman realized she could not remain hidden. She came trembling and fell before Jesus. In front of everyone she told why she had touched Him and how she had been healed at once.","status":"source_text","id":"luk-8-47"},{"book":"luk","chapter":8,"verse":48,"text":"Jesus said to the woman, “Daughter, your faith has saved you. Go in peace.”","status":"source_text","id":"luk-8-48"},{"book":"luk","chapter":8,"verse":49,"text":"While He was still speaking, someone comes from the synagogue ruler’s house, saying, “Your daughter has died; do not trouble the Teacher any longer.”","status":"source_text","id":"luk-8-49"},{"book":"luk","chapter":8,"verse":50,"text":"Jesus heard and answered him, “Do not be afraid. Only believe, and she will be saved.”","status":"source_text","id":"luk-8-50"},{"book":"luk","chapter":8,"verse":51,"text":"And coming to the house, He did not allow anyone to enter with Him except Peter and John and James, and the father and mother of the child.","status":"source_text","id":"luk-8-51"},{"book":"luk","chapter":8,"verse":52,"text":"And all were weeping and mourning for her. But He said, “Do not weep, for she did not die, but is sleeping.”","status":"source_text","id":"luk-8-52"},{"book":"luk","chapter":8,"verse":53,"text":"And they laughed at Him because they knew she had died.","status":"source_text","id":"luk-8-53"},{"book":"luk","chapter":8,"verse":54,"text":"Jesus took her by the hand and called out, “Child, arise.”","status":"source_text","id":"luk-8-54"},{"book":"luk","chapter":8,"verse":55,"text":"And her spirit returned, and she got up at once. Jesus told them to give her something to eat.","status":"source_text","id":"luk-8-55"},{"book":"luk","chapter":8,"verse":56,"text":"And her parents were astonished, but Jesus instructed them to tell no one what had happened.","status":"source_text","id":"luk-8-56"},{"book":"luk","chapter":9,"verse":1,"text":"Jesus called the Twelve together. He gave them power and authority over all demons and to cure diseases.","status":"source_text","id":"luk-9-1"},{"book":"luk","chapter":9,"verse":2,"text":"And He sent them out to proclaim the kingdom of God and heal the sick.","status":"source_text","id":"luk-9-2"},{"book":"luk","chapter":9,"verse":3,"text":"And He said to them, “Take nothing for the journey: no staff, bag, bread, money, or second tunic.”","status":"source_text","id":"luk-9-3"},{"book":"luk","chapter":9,"verse":4,"text":"“And whatever house you enter, stay there and depart from there.”","status":"source_text","id":"luk-9-4"},{"book":"luk","chapter":9,"verse":5,"text":"“And wherever people do not welcome you, shake the dust from your feet as you leave that town, as testimony against them.”","status":"source_text","id":"luk-9-5"},{"book":"luk","chapter":9,"verse":6,"text":"They went out through the villages, announcing the good news and healing people everywhere.","status":"source_text","id":"luk-9-6"},{"book":"luk","chapter":9,"verse":7,"text":"Herod the tetrarch heard of all that was happening and was perplexed, for some said that John had been raised from the dead.","status":"source_text","id":"luk-9-7"},{"book":"luk","chapter":9,"verse":8,"text":"and by others that Elijah had appeared, and by others that one of the ancient prophets had risen.","status":"source_text","id":"luk-9-8"},{"book":"luk","chapter":9,"verse":9,"text":"But Herod said, “John I beheaded, but who is this about whom I hear such things?” And he was seeking to see Him.","status":"source_text","id":"luk-9-9"},{"book":"luk","chapter":9,"verse":10,"text":"And returning, the apostles recounted to Him all that they had done. And taking them, He withdrew privately to a town called Bethsaida.","status":"source_text","id":"luk-9-10"},{"book":"luk","chapter":9,"verse":11,"text":"The crowds learned of it and followed. Jesus welcomed them, spoke to them about the kingdom of God, and healed those who needed healing.","status":"source_text","id":"luk-9-11"},{"book":"luk","chapter":9,"verse":12,"text":"Now the day began to decline, and the Twelve came and said to Him, “Send the crowd away, so that they may go into the surrounding villages and countryside and lodge and find provisions, because we are here in a deserted place.”","status":"source_text","id":"luk-9-12"},{"book":"luk","chapter":9,"verse":13,"text":"Jesus said to them, “You give them something to eat.” They replied, “We have no more than five loaves and two fish, unless we go and buy food for all these people.”","status":"source_text","id":"luk-9-13"},{"book":"luk","chapter":9,"verse":14,"text":"For there were about five thousand men. And He said to His disciples, “Have them recline in groups of about fifty each.”","status":"source_text","id":"luk-9-14"},{"book":"luk","chapter":9,"verse":15,"text":"And they did so and had everyone sit down.","status":"source_text","id":"luk-9-15"},{"book":"luk","chapter":9,"verse":16,"text":"Jesus took the five loaves and two fish, looked up to heaven, and blessed them. He broke them and gave them to the disciples to set before the crowd.","status":"source_text","id":"luk-9-16"},{"book":"luk","chapter":9,"verse":17,"text":"And everyone ate and was satisfied. The pieces left over filled twelve baskets.","status":"source_text","id":"luk-9-17"},{"book":"luk","chapter":9,"verse":18,"text":"And once when Jesus was praying alone and the disciples were with Him, He asked, “Who do the crowds say I am?”","status":"source_text","id":"luk-9-18"},{"book":"luk","chapter":9,"verse":19,"text":"And they answered and said, “John the Baptist; but others, Elijah; and others, that one of the ancient prophets has risen.”","status":"source_text","id":"luk-9-19"},{"book":"luk","chapter":9,"verse":20,"text":"And He said to them, “But you, who do you say I am?” And Peter answered and said, “The Christ of God.”","status":"source_text","id":"luk-9-20"},{"book":"luk","chapter":9,"verse":21,"text":"Jesus sternly instructed them not to tell anyone this.","status":"source_text","id":"luk-9-21"},{"book":"luk","chapter":9,"verse":22,"text":"He said, “The Son of Man must suffer greatly, be rejected by the elders, chief priests, and scribes, be killed, and rise on the third day.”","status":"source_text","id":"luk-9-22"},{"book":"luk","chapter":9,"verse":23,"text":"And He said to all, “If anyone wishes to come after Me, let him deny himself and take up his cross daily and follow Me.”","status":"source_text","id":"luk-9-23"},{"book":"luk","chapter":9,"verse":24,"text":"“For whoever wishes to save his life will lose it, but whoever loses his life for My sake, this one will save it.”","status":"source_text","id":"luk-9-24"},{"book":"luk","chapter":9,"verse":25,"text":"“For what does a man gain if he gains the whole world but loses or forfeits himself?”","status":"source_text","id":"luk-9-25"},{"book":"luk","chapter":9,"verse":26,"text":"“For whoever is ashamed of Me and My words, of this one the Son of Man will be ashamed when He comes in His glory and that of the Father and the holy angels.”","status":"source_text","id":"luk-9-26"},{"book":"luk","chapter":9,"verse":27,"text":"“Truly I tell you, some standing here will not taste death before they see the kingdom of God.”","status":"source_text","id":"luk-9-27"},{"book":"luk","chapter":9,"verse":28,"text":"About eight days after these sayings, Jesus took Peter, John, and James and went up the mountain to pray.","status":"source_text","id":"luk-9-28"},{"book":"luk","chapter":9,"verse":29,"text":"And as He prayed, the appearance of His face changed and His clothing became dazzling white.","status":"source_text","id":"luk-9-29"},{"book":"luk","chapter":9,"verse":30,"text":"And suddenly two men were talking with Jesus: Moses and Elijah.","status":"source_text","id":"luk-9-30"},{"book":"luk","chapter":9,"verse":31,"text":"who, appearing in glory, were speaking of His departure, which He was about to fulfill in Jerusalem.","status":"source_text","id":"luk-9-31"},{"book":"luk","chapter":9,"verse":32,"text":"But Peter and those with him were weighed down with sleep; and becoming fully awake, they saw His glory and the two men standing with Him.","status":"source_text","id":"luk-9-32"},{"book":"luk","chapter":9,"verse":33,"text":"And as they were departing from Him, Peter said to Jesus, “Master, it is good for us to be here; and let us make three shelters, one for You and one for Moses and one for Elijah,” not knowing what he was saying.","status":"source_text","id":"luk-9-33"},{"book":"luk","chapter":9,"verse":34,"text":"But while he was saying these things, a cloud came and overshadowed them; and they were afraid as they entered the cloud.","status":"source_text","id":"luk-9-34"},{"book":"luk","chapter":9,"verse":35,"text":"And a voice came from the cloud, saying, “This is My Son, the Chosen One; listen to Him.”","status":"source_text","id":"luk-9-35"},{"book":"luk","chapter":9,"verse":36,"text":"And when the voice ceased, Jesus was found alone. They kept silent and told no one at that time what they had seen.","status":"source_text","id":"luk-9-36"},{"book":"luk","chapter":9,"verse":37,"text":"The next day, as they came down the mountain, a large crowd met Jesus.","status":"source_text","id":"luk-9-37"},{"book":"luk","chapter":9,"verse":38,"text":"And look, a man from the crowd cried out, saying, “Teacher, I beg You to look upon my son, because he is my only child,”","status":"source_text","id":"luk-9-38"},{"book":"luk","chapter":9,"verse":39,"text":"“and look, a spirit takes him, and suddenly he cries out, and it convulses him with foam, and scarcely leaves him, crushing him.”","status":"source_text","id":"luk-9-39"},{"book":"luk","chapter":9,"verse":40,"text":"“And I begged Your disciples to cast it out, and they could not.”","status":"source_text","id":"luk-9-40"},{"book":"luk","chapter":9,"verse":41,"text":"Jesus answered, “Faithless and twisted generation, how long must I be with you and bear with you? Bring your son here.”","status":"source_text","id":"luk-9-41"},{"book":"luk","chapter":9,"verse":42,"text":"Even as the boy approached, the demon threw him down and convulsed him. Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.","status":"source_text","id":"luk-9-42"},{"book":"luk","chapter":9,"verse":43,"text":"And all were astonished at the majesty of God. But while all were marveling at all the things He was doing, He said to His disciples,","status":"source_text","id":"luk-9-43"},{"book":"luk","chapter":9,"verse":44,"text":"“Let these words sink into your ears: the Son of Man is about to be handed over into human hands.”","status":"source_text","id":"luk-9-44"},{"book":"luk","chapter":9,"verse":45,"text":"They did not understand this saying; its meaning was concealed from them so that they could not grasp it, and they were afraid to ask Him about it.","status":"source_text","id":"luk-9-45"},{"book":"luk","chapter":9,"verse":46,"text":"An argument arose among the disciples about which of them was greatest.","status":"source_text","id":"luk-9-46"},{"book":"luk","chapter":9,"verse":47,"text":"Jesus knew the thoughts in their hearts, took a child, and placed the child beside Him.","status":"source_text","id":"luk-9-47"},{"book":"luk","chapter":9,"verse":48,"text":"and said to them, “Whoever receives this child in My name receives Me, and whoever receives Me receives Him who sent Me; for the one who is least among you all, this one is great.”","status":"source_text","id":"luk-9-48"},{"book":"luk","chapter":9,"verse":49,"text":"And John answered and said, “Master, we saw someone casting out demons in Your name, and we were preventing him because he does not follow with us.”","status":"source_text","id":"luk-9-49"},{"book":"luk","chapter":9,"verse":50,"text":"Jesus said to him, “Do not stop him, for whoever is not against you is for you.”","status":"source_text","id":"luk-9-50"},{"book":"luk","chapter":9,"verse":51,"text":"As the days drew near for Jesus to be taken up, He set His face firmly toward Jerusalem.","status":"source_text","id":"luk-9-51"},{"book":"luk","chapter":9,"verse":52,"text":"And He sent messengers ahead of Him; they entered a Samaritan village to prepare for Him.","status":"source_text","id":"luk-9-52"},{"book":"luk","chapter":9,"verse":53,"text":"But the people did not welcome Him, because He was heading toward Jerusalem.","status":"source_text","id":"luk-9-53"},{"book":"luk","chapter":9,"verse":54,"text":"When the disciples James and John saw this, they said, “Lord, do You want us to call down fire from heaven to destroy them?”","status":"source_text","id":"luk-9-54"},{"book":"luk","chapter":9,"verse":55,"text":"Jesus turned and rebuked them.","status":"source_text","id":"luk-9-55"},{"book":"luk","chapter":9,"verse":56,"text":"Then they went to another village.","status":"source_text","id":"luk-9-56"},{"book":"luk","chapter":9,"verse":57,"text":"And as they traveled, someone said to Jesus, “I will follow You wherever You go.”","status":"source_text","id":"luk-9-57"},{"book":"luk","chapter":9,"verse":58,"text":"And Jesus said to him, “Foxes have dens and the birds of the sky have nests, but the Son of Man has nowhere to lay His head.”","status":"source_text","id":"luk-9-58"},{"book":"luk","chapter":9,"verse":59,"text":"And He said to another, “Follow Me.” But he said, “Lord, allow me first to go and bury my father.”","status":"source_text","id":"luk-9-59"},{"book":"luk","chapter":9,"verse":60,"text":"But He said to him, “Leave the dead to bury their own dead, but you go and proclaim the kingdom of God.”","status":"source_text","id":"luk-9-60"},{"book":"luk","chapter":9,"verse":61,"text":"Another said, “Lord, I will follow You. But first let me say farewell to those at home.”","status":"source_text","id":"luk-9-61"},{"book":"luk","chapter":9,"verse":62,"text":"Jesus said, “No one who puts a hand to the plow and looks back is fit for the kingdom of God.”","status":"source_text","id":"luk-9-62"},{"book":"luk","chapter":10,"verse":1,"text":"After this, the Lord appointed seventy-two others. He sent them in pairs ahead of Him to every town and place He intended to visit.","status":"source_text","id":"luk-10-1"},{"book":"luk","chapter":10,"verse":2,"text":"He said, “The harvest is abundant but the workers are few. Ask the Lord of the harvest to send workers into His harvest.”","status":"source_text","id":"luk-10-2"},{"book":"luk","chapter":10,"verse":3,"text":"“Go! Look, I am sending you like lambs among wolves.”","status":"source_text","id":"luk-10-3"},{"book":"luk","chapter":10,"verse":4,"text":"“Carry no money bag, travel bag, or sandals, and greet no one along the road.”","status":"source_text","id":"luk-10-4"},{"book":"luk","chapter":10,"verse":5,"text":"“And into whatever house you enter, first say, ‘Peace to this house.’”","status":"source_text","id":"luk-10-5"},{"book":"luk","chapter":10,"verse":6,"text":"“And if a son of peace is there, your peace will rest upon him; but if not, it will return to you.”","status":"source_text","id":"luk-10-6"},{"book":"luk","chapter":10,"verse":7,"text":"“Stay in that house, eating and drinking what they provide, for a worker deserves wages. Do not move from house to house.”","status":"source_text","id":"luk-10-7"},{"book":"luk","chapter":10,"verse":8,"text":"“And whenever you enter a town and they welcome you, eat what is set before you.”","status":"source_text","id":"luk-10-8"},{"book":"luk","chapter":10,"verse":9,"text":"“And heal the sick in it and say to them, ‘The kingdom of God has drawn near to you.’”","status":"source_text","id":"luk-10-9"},{"book":"luk","chapter":10,"verse":10,"text":"“But if you enter a town and are not welcomed, go out into its streets and say,”","status":"source_text","id":"luk-10-10"},{"book":"luk","chapter":10,"verse":11,"text":"“And ‘Even the dust from your town that clings to our feet we wipe off against you; nevertheless know this, that the kingdom of God has drawn near.’”","status":"source_text","id":"luk-10-11"},{"book":"luk","chapter":10,"verse":12,"text":"“I tell you, on that day it will be more bearable for Sodom than for that town.”","status":"source_text","id":"luk-10-12"},{"book":"luk","chapter":10,"verse":13,"text":"“Woe to you, Chorazin! Woe to you, Bethsaida! If the powerful works done among you had happened in Tyre and Sidon, they would have repented long ago, sitting in sackcloth and ashes.”","status":"source_text","id":"luk-10-13"},{"book":"luk","chapter":10,"verse":14,"text":"“At the judgment it will be more bearable for Tyre and Sidon than for you.”","status":"source_text","id":"luk-10-14"},{"book":"luk","chapter":10,"verse":15,"text":"“And you, Capernaum: will you be exalted to heaven? You will be brought down to Hades.”","status":"source_text","id":"luk-10-15"},{"book":"luk","chapter":10,"verse":16,"text":"“The one who hears you hears Me, and the one who rejects you rejects Me; and the one who rejects Me rejects Him who sent Me.”","status":"source_text","id":"luk-10-16"},{"book":"luk","chapter":10,"verse":17,"text":"The seventy-two returned with joy, saying, “Lord, even the demons submit to us in Your name.”","status":"source_text","id":"luk-10-17"},{"book":"luk","chapter":10,"verse":18,"text":"Jesus said to them, “I saw Satan fall like lightning from heaven.”","status":"source_text","id":"luk-10-18"},{"book":"luk","chapter":10,"verse":19,"text":"“Look, I have given you authority to tread on snakes and scorpions and over all the enemy’s power; nothing will harm you.”","status":"source_text","id":"luk-10-19"},{"book":"luk","chapter":10,"verse":20,"text":"“Yet do not rejoice that the spirits submit to you; rejoice that your names are written in heaven.”","status":"source_text","id":"luk-10-20"},{"book":"luk","chapter":10,"verse":21,"text":"At that moment Jesus rejoiced in the Holy Spirit and said, “Father, Lord of heaven and earth, I thank You, because You have hidden these things from the wise and clever and revealed them to little children. Yes, Father, for this was pleasing in Your sight.”","status":"source_text","id":"luk-10-21"},{"book":"luk","chapter":10,"verse":22,"text":"“All things were handed over to Me by My Father, and no one knows who the Son is except the Father, and who the Father is except the Son and anyone to whom the Son wishes to reveal Him.”","status":"source_text","id":"luk-10-22"},{"book":"luk","chapter":10,"verse":23,"text":"And turning to the disciples, Jesus said privately, “Blessed are the eyes that see what you see.”","status":"source_text","id":"luk-10-23"},{"book":"luk","chapter":10,"verse":24,"text":"“I tell you, many prophets and kings wanted to see what you see but did not see it, and to hear what you hear but did not hear it.”","status":"source_text","id":"luk-10-24"},{"book":"luk","chapter":10,"verse":25,"text":"And look, a certain lawyer stood up, testing Him, saying, “Teacher, what shall I do to inherit eternal life?”","status":"source_text","id":"luk-10-25"},{"book":"luk","chapter":10,"verse":26,"text":"Jesus said to him, “What is written in the Law? How do you read it?”","status":"source_text","id":"luk-10-26"},{"book":"luk","chapter":10,"verse":27,"text":"And he answered and said, “You shall love the Lord your God from all your heart, and with all your soul, and with all your strength, and with all your mind, and your neighbor as yourself.”","status":"source_text","id":"luk-10-27"},{"book":"luk","chapter":10,"verse":28,"text":"Jesus said, “You have answered correctly. Do this, and you will live.”","status":"source_text","id":"luk-10-28"},{"book":"luk","chapter":10,"verse":29,"text":"But wishing to justify himself, he said to Jesus, “And who is my neighbor?”","status":"source_text","id":"luk-10-29"},{"book":"luk","chapter":10,"verse":30,"text":"Jesus replied, “A man was going down from Jerusalem to Jericho when robbers seized him. They stripped and beat him, then departed, leaving him half dead.”","status":"source_text","id":"luk-10-30"},{"book":"luk","chapter":10,"verse":31,"text":"“By chance a priest was going down that road; he saw the man and passed by on the opposite side.”","status":"source_text","id":"luk-10-31"},{"book":"luk","chapter":10,"verse":32,"text":"“Likewise a Levite came to that place, saw him, and passed by on the opposite side.”","status":"source_text","id":"luk-10-32"},{"book":"luk","chapter":10,"verse":33,"text":"“But a Samaritan traveling along came to him, saw him, and felt compassion.”","status":"source_text","id":"luk-10-33"},{"book":"luk","chapter":10,"verse":34,"text":"“And he went to him, bandaged his wounds, and poured on oil and wine. Then he put him on his own animal, brought him to an inn, and cared for him.”","status":"source_text","id":"luk-10-34"},{"book":"luk","chapter":10,"verse":35,"text":"“And on the next day he took out two denarii and gave them to the innkeeper and said, ‘Care for him, and whatever more you spend, I will repay you when I return.’”","status":"source_text","id":"luk-10-35"},{"book":"luk","chapter":10,"verse":36,"text":"“Which of these three do you think became a neighbor to the man who fell among the robbers?”","status":"source_text","id":"luk-10-36"},{"book":"luk","chapter":10,"verse":37,"text":"And he said, “The one who showed mercy to him.” And Jesus said to him, “Go, and you do likewise.”","status":"source_text","id":"luk-10-37"},{"book":"luk","chapter":10,"verse":38,"text":"As they traveled, Jesus entered a village, and a woman named Martha welcomed Him into her home.","status":"source_text","id":"luk-10-38"},{"book":"luk","chapter":10,"verse":39,"text":"And martha had a sister called Mary, who sat at the Lord’s feet and listened to His words.","status":"source_text","id":"luk-10-39"},{"book":"luk","chapter":10,"verse":40,"text":"Martha was distracted by much serving. She came up and said, “Lord, do You not care that my sister has left me to serve alone? So tell her to help me.”","status":"source_text","id":"luk-10-40"},{"book":"luk","chapter":10,"verse":41,"text":"The Lord answered her, “Martha, Martha, you are worried and troubled about many things.”","status":"source_text","id":"luk-10-41"},{"book":"luk","chapter":10,"verse":42,"text":"“But few things are needed, or one; for Mary chose the good portion, which will not be taken away from her.”","status":"source_text","id":"luk-10-42"},{"book":"luk","chapter":11,"verse":1,"text":"And it happened while He was praying in a certain place, when He ceased, one of His disciples said to Him, “Lord, teach us to pray, just as John also taught his disciples.”","status":"source_text","id":"luk-11-1"},{"book":"luk","chapter":11,"verse":2,"text":"And He said to them, “When you pray, say, ‘Father, let Your name be sanctified; let Your kingdom come.’”","status":"source_text","id":"luk-11-2"},{"book":"luk","chapter":11,"verse":3,"text":"“‘Give us our bread for the coming day day by day.’”","status":"source_text","id":"luk-11-3"},{"book":"luk","chapter":11,"verse":4,"text":"“‘And forgive us our sins, for we ourselves also forgive everyone indebted to us; and do not bring us into testing.’”","status":"source_text","id":"luk-11-4"},{"book":"luk","chapter":11,"verse":5,"text":"And He said to them, “Which of you will have a friend and will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”","status":"source_text","id":"luk-11-5"},{"book":"luk","chapter":11,"verse":6,"text":"“‘because a friend of mine has arrived at my home from a journey, and I have nothing to set before him,’”","status":"source_text","id":"luk-11-6"},{"book":"luk","chapter":11,"verse":7,"text":"“and that one will answer from within and say, ‘Do not cause me trouble; the door is already shut, and my children are with me in bed; I cannot rise and give to you’?”","status":"source_text","id":"luk-11-7"},{"book":"luk","chapter":11,"verse":8,"text":"“I tell you, even if he does not rise and give because he is his friend, because of his shameless persistence he will rise and give him as much as he needs.”","status":"source_text","id":"luk-11-8"},{"book":"luk","chapter":11,"verse":9,"text":"“And I say to you, Ask, and it will be given to you. Seek, and you will find. Knock, and it will be opened to you.”","status":"source_text","id":"luk-11-9"},{"book":"luk","chapter":11,"verse":10,"text":"“For everyone who asks receives, the one who seeks finds, and to the one who knocks it will be opened.”","status":"source_text","id":"luk-11-10"},{"book":"luk","chapter":11,"verse":11,"text":"“Which father among you, if his son asks for a fish, will give him a snake instead of a fish?”","status":"source_text","id":"luk-11-11"},{"book":"luk","chapter":11,"verse":12,"text":"“Or if he asks for an egg, will he give him a scorpion?”","status":"source_text","id":"luk-11-12"},{"book":"luk","chapter":11,"verse":13,"text":"“If then you, though evil, know how to give good gifts to your children, how much more will the Father from heaven give the Holy Spirit to those who ask Him!”","status":"source_text","id":"luk-11-13"},{"book":"luk","chapter":11,"verse":14,"text":"And Jesus was casting out a mute demon. When the demon went out, the mute person spoke. The crowds marveled.","status":"source_text","id":"luk-11-14"},{"book":"luk","chapter":11,"verse":15,"text":"But some of them said, “By Beelzebul, the ruler of the demons, He casts out the demons.”","status":"source_text","id":"luk-11-15"},{"book":"luk","chapter":11,"verse":16,"text":"Others, testing Him, kept seeking a sign from heaven from Him.","status":"source_text","id":"luk-11-16"},{"book":"luk","chapter":11,"verse":17,"text":"But He knew their thoughts and said to them, “Every kingdom divided against itself is laid waste, and house falls upon house.”","status":"source_text","id":"luk-11-17"},{"book":"luk","chapter":11,"verse":18,"text":"“If Satan too is divided against himself, how will his kingdom stand? For you say that I cast out demons by Beelzebul.”","status":"source_text","id":"luk-11-18"},{"book":"luk","chapter":11,"verse":19,"text":"“If I cast out demons by Beelzebul, by whom do your own sons cast them out? Therefore they will be your judges.”","status":"source_text","id":"luk-11-19"},{"book":"luk","chapter":11,"verse":20,"text":"“But if I cast out demons by the finger of God, then the kingdom of God has come upon you.”","status":"source_text","id":"luk-11-20"},{"book":"luk","chapter":11,"verse":21,"text":"“When a strong man, fully armed, guards his own courtyard, his possessions are at peace.”","status":"source_text","id":"luk-11-21"},{"book":"luk","chapter":11,"verse":22,"text":"“But when one stronger than he comes upon him and defeats him, he takes away his full armor in which he trusted and distributes his spoils.”","status":"source_text","id":"luk-11-22"},{"book":"luk","chapter":11,"verse":23,"text":"“The one who is not with Me is against Me, and the one who does not gather with Me scatters.”","status":"source_text","id":"luk-11-23"},{"book":"luk","chapter":11,"verse":24,"text":"“When the unclean spirit goes out of a man, it goes through waterless places seeking rest; and finding none, it says, ‘I will return to my house from which I came.’”","status":"source_text","id":"luk-11-24"},{"book":"luk","chapter":11,"verse":25,"text":"“And when it comes, it finds it swept and put in order.”","status":"source_text","id":"luk-11-25"},{"book":"luk","chapter":11,"verse":26,"text":"“Then it goes and brings seven other spirits more evil than itself. They enter and live there, and that person’s final condition becomes worse than the first.”","status":"source_text","id":"luk-11-26"},{"book":"luk","chapter":11,"verse":27,"text":"While He was saying these things, “A woman in the crowd raised her voice and said to Him, Blessed is the womb that bore You and the breasts at which You nursed!”","status":"source_text","id":"luk-11-27"},{"book":"luk","chapter":11,"verse":28,"text":"But He said, “Rather, blessed are those who hear the word of God and keep it.”","status":"source_text","id":"luk-11-28"},{"book":"luk","chapter":11,"verse":29,"text":"“As the crowds gathered, He began to say, This generation is an evil generation. It seeks a sign, but no sign will be given it except the sign of Jonah.”","status":"source_text","id":"luk-11-29"},{"book":"luk","chapter":11,"verse":30,"text":"“For just as Jonah became a sign to the Ninevites, so the Son of Man will be to this generation.”","status":"source_text","id":"luk-11-30"},{"book":"luk","chapter":11,"verse":31,"text":"“The queen of the south will rise with the people of this generation at the judgment and condemn them. For she came from the ends of the earth to hear Solomon’s wisdom. And look, something greater than Solomon is here.”","status":"source_text","id":"luk-11-31"},{"book":"luk","chapter":11,"verse":32,"text":"“The men of Nineveh will rise at the judgment with this generation and condemn it. For they repented at Jonah’s preaching. And look, something greater than Jonah is here.”","status":"source_text","id":"luk-11-32"},{"book":"luk","chapter":11,"verse":33,"text":"“No one lights a lamp and puts it in a hiding place or under a basket, but puts it on a lampstand, so that those who enter may see the light.”","status":"source_text","id":"luk-11-33"},{"book":"luk","chapter":11,"verse":34,"text":"“The lamp of your body is your eye. When your eye is sound, your whole body also is bright. But when it is bad, your body too is dark.”","status":"source_text","id":"luk-11-34"},{"book":"luk","chapter":11,"verse":35,"text":"“Therefore watch that the light in you is not darkness.”","status":"source_text","id":"luk-11-35"},{"book":"luk","chapter":11,"verse":36,"text":"“If then your whole body is bright, with no dark part, it will be wholly bright, as when a lamp illuminates you with its rays.”","status":"source_text","id":"luk-11-36"},{"book":"luk","chapter":11,"verse":37,"text":"Now while He was speaking, a Pharisee asked Him to dine with him; and He went in and reclined at table.","status":"source_text","id":"luk-11-37"},{"book":"luk","chapter":11,"verse":38,"text":"And the Pharisee, seeing it, marveled that He had not first washed before the meal.","status":"source_text","id":"luk-11-38"},{"book":"luk","chapter":11,"verse":39,"text":"And the Lord said to him, “You Pharisees clean the outside of cup and dish, but your inside is full of greed and wickedness.”","status":"source_text","id":"luk-11-39"},{"book":"luk","chapter":11,"verse":40,"text":"“Fools! Did not the One who made the outside also make the inside?”","status":"source_text","id":"luk-11-40"},{"book":"luk","chapter":11,"verse":41,"text":"“Rather, give what is within as alms, and look, all things are clean for you.”","status":"source_text","id":"luk-11-41"},{"book":"luk","chapter":11,"verse":42,"text":"“But woe to you Pharisees, for you tithe mint, rue, and every herb, yet neglect justice and the love of God. You ought to have done these without leaving the others aside.”","status":"source_text","id":"luk-11-42"},{"book":"luk","chapter":11,"verse":43,"text":"“Woe to you Pharisees, for you love the prominent seats in the synagogues and greetings in the marketplaces.”","status":"source_text","id":"luk-11-43"},{"book":"luk","chapter":11,"verse":44,"text":"“Woe to you, for you are like unmarked graves, and those who walk over them do not know it.”","status":"source_text","id":"luk-11-44"},{"book":"luk","chapter":11,"verse":45,"text":"One of the lawyers answered Him, “Teacher, by saying these things you insult us too.”","status":"source_text","id":"luk-11-45"},{"book":"luk","chapter":11,"verse":46,"text":"He said, “Woe to you lawyers too, for you load people with burdens hard to bear, while you yourselves do not touch the burdens with one of your fingers.”","status":"source_text","id":"luk-11-46"},{"book":"luk","chapter":11,"verse":47,"text":"“Woe to you, for you build the tombs of the prophets, but your fathers killed them.”","status":"source_text","id":"luk-11-47"},{"book":"luk","chapter":11,"verse":48,"text":"“So you bear witness to and approve the deeds of your fathers. They killed the prophets, and you build their tombs.”","status":"source_text","id":"luk-11-48"},{"book":"luk","chapter":11,"verse":49,"text":"“Therefore also the wisdom of God said, ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’”","status":"source_text","id":"luk-11-49"},{"book":"luk","chapter":11,"verse":50,"text":"“so that the blood of all the prophets, shed from the foundation of the world, may be required of this generation,”","status":"source_text","id":"luk-11-50"},{"book":"luk","chapter":11,"verse":51,"text":"“from the blood of Abel to the blood of Zechariah, who perished between the altar and the house. Yes, I tell you, it will be required of this generation.”","status":"source_text","id":"luk-11-51"},{"book":"luk","chapter":11,"verse":52,"text":"“Woe to you lawyers, for you have taken away the key of knowledge. You yourselves did not enter, and you hindered those who were entering.”","status":"source_text","id":"luk-11-52"},{"book":"luk","chapter":11,"verse":53,"text":"When He went out from there, the scribes and Pharisees began to press Him fiercely and to provoke Him to speak about many things.","status":"source_text","id":"luk-11-53"},{"book":"luk","chapter":11,"verse":54,"text":"They lay in wait for Him, seeking to catch something from His mouth.","status":"source_text","id":"luk-11-54"},{"book":"luk","chapter":12,"verse":1,"text":"Meanwhile, when the crowd of many thousands gathered, so that they were trampling one another, He began to say to His disciples first, “Beware of the leaven of the Pharisees, which is hypocrisy.”","status":"source_text","id":"luk-12-1"},{"book":"luk","chapter":12,"verse":2,"text":"“Nothing covered will remain undisclosed, and nothing hidden will remain unknown.”","status":"source_text","id":"luk-12-2"},{"book":"luk","chapter":12,"verse":3,"text":"Therefore what you said in the dark will be heard in the light, “And what you whispered in inner rooms will be proclaimed on the rooftops.”","status":"source_text","id":"luk-12-3"},{"book":"luk","chapter":12,"verse":4,"text":"“I say to you, My friends, do not fear those who kill the body and after that can do nothing more.”","status":"source_text","id":"luk-12-4"},{"book":"luk","chapter":12,"verse":5,"text":"“I will show you whom to fear. Fear the one who, after killing, has authority to cast into Gehenna. Yes, I tell you, fear Him.”","status":"source_text","id":"luk-12-5"},{"book":"luk","chapter":12,"verse":6,"text":"“Are not five sparrows sold for two small coins? Yet not one of them is forgotten before God.”","status":"source_text","id":"luk-12-6"},{"book":"luk","chapter":12,"verse":7,"text":"“Even the hairs of your head have all been counted. Do not fear. You are worth more than many sparrows.”","status":"source_text","id":"luk-12-7"},{"book":"luk","chapter":12,"verse":8,"text":"“And I tell you, everyone who acknowledges Me before people, the Son of Man also will acknowledge him before the angels of God.”","status":"source_text","id":"luk-12-8"},{"book":"luk","chapter":12,"verse":9,"text":"“But the one who denies Me before people will be denied before God’s angels.”","status":"source_text","id":"luk-12-9"},{"book":"luk","chapter":12,"verse":10,"text":"“And everyone who will speak a word against the Son of Man, it will be forgiven him; but the one who blasphemes against the Holy Spirit will not be forgiven.”","status":"source_text","id":"luk-12-10"},{"book":"luk","chapter":12,"verse":11,"text":"“And when they bring you before the synagogues and the rulers and the authorities, do not be anxious about how or what you should speak in defense, or what you should say,”","status":"source_text","id":"luk-12-11"},{"book":"luk","chapter":12,"verse":12,"text":"“For the Holy Spirit will teach you at that very hour what you must say.”","status":"source_text","id":"luk-12-12"},{"book":"luk","chapter":12,"verse":13,"text":"Someone in the crowd said to Him, “Teacher, tell my brother to divide the inheritance with me.”","status":"source_text","id":"luk-12-13"},{"book":"luk","chapter":12,"verse":14,"text":"He answered him, “Man, who appointed Me judge or divider over you?”","status":"source_text","id":"luk-12-14"},{"book":"luk","chapter":12,"verse":15,"text":"Then He said to them, “Watch out and guard against every kind of greed. A person’s life does not consist in the abundance of possessions.”","status":"source_text","id":"luk-12-15"},{"book":"luk","chapter":12,"verse":16,"text":"He told them a parable, saying, “The land of a rich man yielded abundantly.”","status":"source_text","id":"luk-12-16"},{"book":"luk","chapter":12,"verse":17,"text":"“And he reasoned within himself, saying, ‘What shall I do, because I have nowhere to gather my crops?’”","status":"source_text","id":"luk-12-17"},{"book":"luk","chapter":12,"verse":18,"text":"“And he said, ‘I will do this: I will tear down my barns and build larger ones, and there I will gather all my grain and my goods.’”","status":"source_text","id":"luk-12-18"},{"book":"luk","chapter":12,"verse":19,"text":"“‘And I will say to my soul, “Soul, you have many goods laid up for many years; rest, eat, drink, celebrate.”’”","status":"source_text","id":"luk-12-19"},{"book":"luk","chapter":12,"verse":20,"text":"“But God said to him, ‘Fool, this night they demand your soul from you; and the things you prepared, whose will they be?’”","status":"source_text","id":"luk-12-20"},{"book":"luk","chapter":12,"verse":21,"text":"“So it is with one who stores up for himself but is not rich toward God.”","status":"source_text","id":"luk-12-21"},{"book":"luk","chapter":12,"verse":22,"text":"Then He said to His disciples, “Therefore I tell you, do not worry about your life, what to eat, or about your body, what to wear.”","status":"source_text","id":"luk-12-22"},{"book":"luk","chapter":12,"verse":23,"text":"“For life is more than food, and the body more than clothing.”","status":"source_text","id":"luk-12-23"},{"book":"luk","chapter":12,"verse":24,"text":"“Consider the ravens: they neither sow nor reap, and have no storehouse or barn. Yet God feeds them. How much more valuable you are than birds!”","status":"source_text","id":"luk-12-24"},{"book":"luk","chapter":12,"verse":25,"text":"“And which of you by being anxious can add a cubit to his span of life?”","status":"source_text","id":"luk-12-25"},{"book":"luk","chapter":12,"verse":26,"text":"“If then you cannot do even that small thing, why worry about the rest?”","status":"source_text","id":"luk-12-26"},{"book":"luk","chapter":12,"verse":27,"text":"“Consider how the lilies grow. They neither labor nor spin. Yet I tell you, even Solomon in all his glory was not dressed like one of these.”","status":"source_text","id":"luk-12-27"},{"book":"luk","chapter":12,"verse":28,"text":"“If even the grass, here today and thrown into the oven tomorrow, God clothes in this way, how much more will He clothe you, people of little faith!”","status":"source_text","id":"luk-12-28"},{"book":"luk","chapter":12,"verse":29,"text":"“And do not seek what you will eat or drink, and do not be anxious.”","status":"source_text","id":"luk-12-29"},{"book":"luk","chapter":12,"verse":30,"text":"“For all these things the nations of the world seek. Your Father knows that you need them.”","status":"source_text","id":"luk-12-30"},{"book":"luk","chapter":12,"verse":31,"text":"“Instead seek His kingdom, and these things will be added to you.”","status":"source_text","id":"luk-12-31"},{"book":"luk","chapter":12,"verse":32,"text":"“Do not fear, little flock, for your Father is pleased to give you the kingdom.”","status":"source_text","id":"luk-12-32"},{"book":"luk","chapter":12,"verse":33,"text":"“Sell your possessions and give alms. Make purses for yourselves that do not wear out, an unfailing treasure in heaven, where no thief approaches and no moth destroys.”","status":"source_text","id":"luk-12-33"},{"book":"luk","chapter":12,"verse":34,"text":"“For where your treasure is, there your heart will be also.”","status":"source_text","id":"luk-12-34"},{"book":"luk","chapter":12,"verse":35,"text":"“Keep your waists girded and your lamps burning.”","status":"source_text","id":"luk-12-35"},{"book":"luk","chapter":12,"verse":36,"text":"“And be like people waiting for their master to return from a wedding feast, so that when he comes and knocks they open to him at once.”","status":"source_text","id":"luk-12-36"},{"book":"luk","chapter":12,"verse":37,"text":"“Blessed are those servants whom the master finds watching when he comes. Truly I tell you that he will gird himself and have them recline, and come and serve them.”","status":"source_text","id":"luk-12-37"},{"book":"luk","chapter":12,"verse":38,"text":"“And if he comes in the second or in the third watch and finds them so, blessed are those servants.”","status":"source_text","id":"luk-12-38"},{"book":"luk","chapter":12,"verse":39,"text":"“Understand this: if the householder knew at what hour the thief was coming, he would not have allowed his house to be broken into.”","status":"source_text","id":"luk-12-39"},{"book":"luk","chapter":12,"verse":40,"text":"“And you too must be ready, for the Son of Man comes at an hour you do not expect.”","status":"source_text","id":"luk-12-40"},{"book":"luk","chapter":12,"verse":41,"text":"And Peter said, “Lord, are You telling this parable to us, or also to everyone?”","status":"source_text","id":"luk-12-41"},{"book":"luk","chapter":12,"verse":42,"text":"And the Lord said, “Who then is the faithful and wise steward whom the master will appoint over his household to give the food allowance at the proper time?”","status":"source_text","id":"luk-12-42"},{"book":"luk","chapter":12,"verse":43,"text":"“Blessed is that servant whom his master finds doing so when he comes.”","status":"source_text","id":"luk-12-43"},{"book":"luk","chapter":12,"verse":44,"text":"“Truly I tell you, he will appoint him over all his possessions.”","status":"source_text","id":"luk-12-44"},{"book":"luk","chapter":12,"verse":45,"text":"“But if that servant says in his heart, ‘My master delays coming,’ and begins to beat the male and female servants, and to eat and drink and get drunk,”","status":"source_text","id":"luk-12-45"},{"book":"luk","chapter":12,"verse":46,"text":"“The master of that servant will come on a day he does not expect and an hour he does not know. He will cut him in two and assign his place with the unfaithful.”","status":"source_text","id":"luk-12-46"},{"book":"luk","chapter":12,"verse":47,"text":"“That servant who knew his master’s will but neither prepared nor acted according to it will receive many blows.”","status":"source_text","id":"luk-12-47"},{"book":"luk","chapter":12,"verse":48,"text":"“But one who did not know and did things worthy of blows will receive few. From everyone given much, much will be required, and from one entrusted with much, more will be asked.”","status":"source_text","id":"luk-12-48"},{"book":"luk","chapter":12,"verse":49,"text":"“I came to cast fire on the earth, and how I wish it were already kindled!”","status":"source_text","id":"luk-12-49"},{"book":"luk","chapter":12,"verse":50,"text":"“But I have a baptism to undergo, and how pressed I am until it is accomplished!”","status":"source_text","id":"luk-12-50"},{"book":"luk","chapter":12,"verse":51,"text":"“Do you think I came to give peace on earth? No, I tell you, but rather division.”","status":"source_text","id":"luk-12-51"},{"book":"luk","chapter":12,"verse":52,"text":"“For from now on five in one household will be divided, three against two and two against three.”","status":"source_text","id":"luk-12-52"},{"book":"luk","chapter":12,"verse":53,"text":"“Father will be divided against son and son against father, mother against daughter and daughter against mother, mother-in-law against daughter-in-law and daughter-in-law against mother-in-law.”","status":"source_text","id":"luk-12-53"},{"book":"luk","chapter":12,"verse":54,"text":"And He also said to the crowds, “When you see a cloud rising in the west, immediately you say, ‘A shower is coming,’ and so it happens.”","status":"source_text","id":"luk-12-54"},{"book":"luk","chapter":12,"verse":55,"text":"“And when you see a south wind blowing, you say, ‘There will be scorching heat,’ and it happens.”","status":"source_text","id":"luk-12-55"},{"book":"luk","chapter":12,"verse":56,"text":"“Hypocrites, you know how to interpret the appearance of earth and sky, but how do you not know how to interpret this time?”","status":"source_text","id":"luk-12-56"},{"book":"luk","chapter":12,"verse":57,"text":"“Why do you not judge for yourselves what is right?”","status":"source_text","id":"luk-12-57"},{"book":"luk","chapter":12,"verse":58,"text":"“As you go with your accuser before a magistrate, make an effort to settle with him on the way, lest he drag you before the judge. The judge will hand you to the officer, and the officer will put you in prison.”","status":"source_text","id":"luk-12-58"},{"book":"luk","chapter":12,"verse":59,"text":"“I tell you, you will not get out until you have paid the last small coin.”","status":"source_text","id":"luk-12-59"},{"book":"luk","chapter":13,"verse":1,"text":"At that time some people came and reported to Jesus about the Galileans whose blood Pilate had mingled with their sacrifices.","status":"source_text","id":"luk-13-1"},{"book":"luk","chapter":13,"verse":2,"text":"And He answered them, “Do you think these Galileans became worse sinners than all the other Galileans because they suffered these things?”","status":"source_text","id":"luk-13-2"},{"book":"luk","chapter":13,"verse":3,"text":"“No, I tell you. Unless you repent, you will all perish likewise.”","status":"source_text","id":"luk-13-3"},{"book":"luk","chapter":13,"verse":4,"text":"“Or those eighteen on whom the tower in Siloam fell and killed them, do you think that they were greater debtors than all the people dwelling in Jerusalem?”","status":"source_text","id":"luk-13-4"},{"book":"luk","chapter":13,"verse":5,"text":"“No, I tell you. Unless you repent, you will all perish in the same way.”","status":"source_text","id":"luk-13-5"},{"book":"luk","chapter":13,"verse":6,"text":"And He spoke this parable, “Someone had a fig tree planted in his vineyard, and he came seeking fruit on it and did not find any.”","status":"source_text","id":"luk-13-6"},{"book":"luk","chapter":13,"verse":7,"text":"“And he said to the vine dresser, ‘Look, for three years I come seeking fruit on this fig tree and do not find any. Cut it down; why does it also render the ground useless?’”","status":"source_text","id":"luk-13-7"},{"book":"luk","chapter":13,"verse":8,"text":"“But he answered and said to him, ‘Master, leave it also this year, until I dig around it and put on manure,’”","status":"source_text","id":"luk-13-8"},{"book":"luk","chapter":13,"verse":9,"text":"“‘and if it bears fruit in the coming year, well; but if not, you will cut it down.’”","status":"source_text","id":"luk-13-9"},{"book":"luk","chapter":13,"verse":10,"text":"On a Sabbath He was teaching in one of the synagogues.","status":"source_text","id":"luk-13-10"},{"book":"luk","chapter":13,"verse":11,"text":"And there was a woman who had had a spirit of infirmity for eighteen years. She was bent over and unable to straighten up at all.","status":"source_text","id":"luk-13-11"},{"book":"luk","chapter":13,"verse":12,"text":"When Jesus saw her, He called her and said, “Woman, you are released from your infirmity.”","status":"source_text","id":"luk-13-12"},{"book":"luk","chapter":13,"verse":13,"text":"And He laid His hands on her. Immediately she stood straight, and she glorified God.","status":"source_text","id":"luk-13-13"},{"book":"luk","chapter":13,"verse":14,"text":"But the synagogue leader, indignant that Jesus healed on the Sabbath, said to the crowd, “There are six days in which work should be done. Come and be healed on those days, not on the Sabbath.”","status":"source_text","id":"luk-13-14"},{"book":"luk","chapter":13,"verse":15,"text":"The Lord answered him, “Hypocrites, does not each of you untie his ox or donkey from the manger on the Sabbath and lead it away to drink?”","status":"source_text","id":"luk-13-15"},{"book":"luk","chapter":13,"verse":16,"text":"“Should not this woman, a daughter of Abraham, whom Satan bound for eighteen years, be released from this bond on the Sabbath day?”","status":"source_text","id":"luk-13-16"},{"book":"luk","chapter":13,"verse":17,"text":"And as He said these things, all His opponents were put to shame, and the whole crowd rejoiced over all the glorious things He was doing.","status":"source_text","id":"luk-13-17"},{"book":"luk","chapter":13,"verse":18,"text":"So He said, “What is the kingdom of God like? To what shall I compare it?”","status":"source_text","id":"luk-13-18"},{"book":"luk","chapter":13,"verse":19,"text":"“It is like a mustard seed. A man took it and put it in his garden. It grew and became a tree, and birds of the sky nested in its branches.”","status":"source_text","id":"luk-13-19"},{"book":"luk","chapter":13,"verse":20,"text":"And again He said, “To what shall I compare the kingdom of God?”","status":"source_text","id":"luk-13-20"},{"book":"luk","chapter":13,"verse":21,"text":"“It is like yeast. A woman took it and mixed it into three measures of flour until all of it was leavened.”","status":"source_text","id":"luk-13-21"},{"book":"luk","chapter":13,"verse":22,"text":"And He went through towns and villages teaching, making His way toward Jerusalem.","status":"source_text","id":"luk-13-22"},{"book":"luk","chapter":13,"verse":23,"text":"And someone said to Him, “Lord, are those being saved few?” And He said to them,","status":"source_text","id":"luk-13-23"},{"book":"luk","chapter":13,"verse":24,"text":"“Strive to enter through the narrow door. I tell you, many will seek to enter but will not be able.”","status":"source_text","id":"luk-13-24"},{"book":"luk","chapter":13,"verse":25,"text":"“From the time the master of the house rises and shuts the door, and you begin to stand outside and knock at the door, saying, ‘Lord, open to us,’ He will answer and say to you, ‘I do not know you, where you are from.’”","status":"source_text","id":"luk-13-25"},{"book":"luk","chapter":13,"verse":26,"text":"“Then you will begin to say, ‘We ate and drank before You, and You taught in our streets.’”","status":"source_text","id":"luk-13-26"},{"book":"luk","chapter":13,"verse":27,"text":"“And He will speak, saying to you, ‘I do not know where you are from; depart from Me, all workers of unrighteousness.’”","status":"source_text","id":"luk-13-27"},{"book":"luk","chapter":13,"verse":28,"text":"“There will be weeping and grinding of teeth when you see Abraham, Isaac, Jacob, and all the prophets in the kingdom of God but yourselves thrown outside.”","status":"source_text","id":"luk-13-28"},{"book":"luk","chapter":13,"verse":29,"text":"“And people will come from east and west, north and south, and recline at table in the kingdom of God.”","status":"source_text","id":"luk-13-29"},{"book":"luk","chapter":13,"verse":30,"text":"“And look, some who are last will be first, and some who are first will be last.”","status":"source_text","id":"luk-13-30"},{"book":"luk","chapter":13,"verse":31,"text":"At that very hour some Pharisees came and said to Him, “Go out and depart from here, because Herod wishes to kill You.”","status":"source_text","id":"luk-13-31"},{"book":"luk","chapter":13,"verse":32,"text":"And He said to them, “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”","status":"source_text","id":"luk-13-32"},{"book":"luk","chapter":13,"verse":33,"text":"“Nevertheless, I must continue on today and tomorrow and the next day, for it cannot be that a prophet should perish outside Jerusalem.”","status":"source_text","id":"luk-13-33"},{"book":"luk","chapter":13,"verse":34,"text":"“Jerusalem, Jerusalem, killing the prophets and stoning those sent to you. How often I wanted to gather your children as a hen gathers her brood under her wings! But you were unwilling.”","status":"source_text","id":"luk-13-34"},{"book":"luk","chapter":13,"verse":35,"text":"“Look, your house is left to you. But I tell you, you will certainly not see Me until you say, ‘Blessed is the One who comes in the name of the Lord.’”","status":"source_text","id":"luk-13-35"},{"book":"luk","chapter":14,"verse":1,"text":"And it happened, when He went into the house of one of the rulers of the Pharisees on a Sabbath to eat bread, that they were watching Him closely.","status":"source_text","id":"luk-14-1"},{"book":"luk","chapter":14,"verse":2,"text":"And there before Him was a man with dropsy.","status":"source_text","id":"luk-14-2"},{"book":"luk","chapter":14,"verse":3,"text":"And Jesus addressed the lawyers and Pharisees, asking, “Is it lawful to heal on the Sabbath or not?”","status":"source_text","id":"luk-14-3"},{"book":"luk","chapter":14,"verse":4,"text":"But they were silent. And taking hold of him, He healed him and sent him away.","status":"source_text","id":"luk-14-4"},{"book":"luk","chapter":14,"verse":5,"text":"And He said to them, “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”","status":"source_text","id":"luk-14-5"},{"book":"luk","chapter":14,"verse":6,"text":"And they could not answer these things.","status":"source_text","id":"luk-14-6"},{"book":"luk","chapter":14,"verse":7,"text":"He told a parable to those invited, noticing how they chose the places of honor. He said to them,","status":"source_text","id":"luk-14-7"},{"book":"luk","chapter":14,"verse":8,"text":"“When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him,”","status":"source_text","id":"luk-14-8"},{"book":"luk","chapter":14,"verse":9,"text":"“and the one who invited you and him comes and says to you, ‘Give this one your place,’ and then you begin with shame to occupy the lowest place.”","status":"source_text","id":"luk-14-9"},{"book":"luk","chapter":14,"verse":10,"text":"“But when you are invited, go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend, move up higher.’ Then you will have honor before all those reclining with you.”","status":"source_text","id":"luk-14-10"},{"book":"luk","chapter":14,"verse":11,"text":"“Everyone who exalts himself will be humbled, and the one who humbles himself will be exalted.”","status":"source_text","id":"luk-14-11"},{"book":"luk","chapter":14,"verse":12,"text":"He also said to the one who had invited Him, “When you give a lunch or dinner, do not invite your friends, brothers, relatives, or rich neighbors, lest they invite you in return and you be repaid.”","status":"source_text","id":"luk-14-12"},{"book":"luk","chapter":14,"verse":13,"text":"“When you give a feast, invite the poor, the disabled, the lame, and the blind.”","status":"source_text","id":"luk-14-13"},{"book":"luk","chapter":14,"verse":14,"text":"“Then you will be blessed, because they cannot repay you. You will be repaid at the resurrection of the righteous.”","status":"source_text","id":"luk-14-14"},{"book":"luk","chapter":14,"verse":15,"text":"One of those reclining with Him heard this and said, “Blessed is the one who eats bread in the kingdom of God!”","status":"source_text","id":"luk-14-15"},{"book":"luk","chapter":14,"verse":16,"text":"He replied, “A man was preparing a great dinner and invited many people.”","status":"source_text","id":"luk-14-16"},{"book":"luk","chapter":14,"verse":17,"text":"“And at the hour of the dinner he sent his servant to say to those invited, ‘Come, because it is now ready.’”","status":"source_text","id":"luk-14-17"},{"book":"luk","chapter":14,"verse":18,"text":"“And they all alike began to make excuses. The first said to him, ‘I bought a field, and I need to go out and see it; I ask you, excuse me.’”","status":"source_text","id":"luk-14-18"},{"book":"luk","chapter":14,"verse":19,"text":"“And another said, ‘I bought five yoke of oxen, and I am going to test them; I ask you, excuse me.’”","status":"source_text","id":"luk-14-19"},{"book":"luk","chapter":14,"verse":20,"text":"“And another said, ‘I married a wife, and because of this I cannot come.’”","status":"source_text","id":"luk-14-20"},{"book":"luk","chapter":14,"verse":21,"text":"“And the servant came and reported these things to his master. Then the master of the house became angry and said to his servant, ‘Go out quickly into the streets and lanes of the town, and bring in here the poor and disabled and blind and lame.’”","status":"source_text","id":"luk-14-21"},{"book":"luk","chapter":14,"verse":22,"text":"“And the servant said, ‘Master, what you commanded has been done, and there is still room.’”","status":"source_text","id":"luk-14-22"},{"book":"luk","chapter":14,"verse":23,"text":"“And the master said to the servant, ‘Go out to the roads and hedges, and compel them to come in, so that my house may be filled.’”","status":"source_text","id":"luk-14-23"},{"book":"luk","chapter":14,"verse":24,"text":"“‘For I tell you that none of those men who were invited will taste my dinner.’”","status":"source_text","id":"luk-14-24"},{"book":"luk","chapter":14,"verse":25,"text":"Large crowds were traveling with Him. He turned and said to them,","status":"source_text","id":"luk-14-25"},{"book":"luk","chapter":14,"verse":26,"text":"“If anyone comes to Me and does not hate his father, mother, wife, children, brothers, and sisters, and even his own life, he cannot be My disciple.”","status":"source_text","id":"luk-14-26"},{"book":"luk","chapter":14,"verse":27,"text":"“Whoever does not carry his own cross and follow Me cannot be My disciple.”","status":"source_text","id":"luk-14-27"},{"book":"luk","chapter":14,"verse":28,"text":"“Which of you, wanting to build a tower, does not first sit down and calculate the cost, to see whether he has enough to complete it?”","status":"source_text","id":"luk-14-28"},{"book":"luk","chapter":14,"verse":29,"text":"“If he lays a foundation but cannot finish, everyone watching will begin to mock him,”","status":"source_text","id":"luk-14-29"},{"book":"luk","chapter":14,"verse":30,"text":"“saying, ‘This man began to build and was not able to finish.’”","status":"source_text","id":"luk-14-30"},{"book":"luk","chapter":14,"verse":31,"text":"“Or what king, going to fight another king, will not first sit down and consider whether with ten thousand he can meet one coming against him with twenty thousand?”","status":"source_text","id":"luk-14-31"},{"book":"luk","chapter":14,"verse":32,"text":"“If not, while the other is still far off, he sends a delegation and asks for terms of peace.”","status":"source_text","id":"luk-14-32"},{"book":"luk","chapter":14,"verse":33,"text":"“So likewise, any one of you who does not give up all his possessions cannot be My disciple.”","status":"source_text","id":"luk-14-33"},{"book":"luk","chapter":14,"verse":34,"text":"“Salt is good. But if even salt loses its taste, with what will it be seasoned?”","status":"source_text","id":"luk-14-34"},{"book":"luk","chapter":14,"verse":35,"text":"“It is fit neither for soil nor for manure. People throw it out. Whoever has ears to hear, let him hear.”","status":"source_text","id":"luk-14-35"},{"book":"luk","chapter":15,"verse":1,"text":"All the tax collectors and sinners were coming near to hear Him.","status":"source_text","id":"luk-15-1"},{"book":"luk","chapter":15,"verse":2,"text":"And the Pharisees and scribes grumbled, saying, “This man welcomes sinners and eats with them.”","status":"source_text","id":"luk-15-2"},{"book":"luk","chapter":15,"verse":3,"text":"And He spoke this parable to them, saying,","status":"source_text","id":"luk-15-3"},{"book":"luk","chapter":15,"verse":4,"text":"“Which of you, having a hundred sheep and losing one, does not leave the ninety-nine in the wilderness and go after the lost one until he finds it?”","status":"source_text","id":"luk-15-4"},{"book":"luk","chapter":15,"verse":5,"text":"“And when he finds it, he joyfully puts it on his shoulders.”","status":"source_text","id":"luk-15-5"},{"book":"luk","chapter":15,"verse":6,"text":"“And coming to the house, he calls together his friends and neighbors, saying to them, ‘Rejoice with me, because I found my sheep that was lost.’”","status":"source_text","id":"luk-15-6"},{"book":"luk","chapter":15,"verse":7,"text":"“I tell you, there will be joy in heaven over one sinner who repents more than over ninety-nine righteous people who need no repentance.”","status":"source_text","id":"luk-15-7"},{"book":"luk","chapter":15,"verse":8,"text":"“Or what woman, having ten drachmas and losing one, does not light a lamp and sweep the house and search carefully until she finds it?”","status":"source_text","id":"luk-15-8"},{"book":"luk","chapter":15,"verse":9,"text":"“And finding it, she calls together her friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I lost.’”","status":"source_text","id":"luk-15-9"},{"book":"luk","chapter":15,"verse":10,"text":"“Likewise, I tell you, there is joy before the angels of God over one sinner who repents.”","status":"source_text","id":"luk-15-10"},{"book":"luk","chapter":15,"verse":11,"text":"He also said, “A man had two sons.”","status":"source_text","id":"luk-15-11"},{"book":"luk","chapter":15,"verse":12,"text":"“And the younger of them said to his father, ‘Father, give me the share of the estate that falls to me.’ And he divided his livelihood between them.”","status":"source_text","id":"luk-15-12"},{"book":"luk","chapter":15,"verse":13,"text":"“And not many days later, the younger son gathered everything and left for a distant country. There he squandered his property in reckless living.”","status":"source_text","id":"luk-15-13"},{"book":"luk","chapter":15,"verse":14,"text":"“After he spent everything, a severe famine arose in that country, and he began to be in need.”","status":"source_text","id":"luk-15-14"},{"book":"luk","chapter":15,"verse":15,"text":"“And he went and attached himself to a citizen of that country. The man sent him into his fields to feed pigs.”","status":"source_text","id":"luk-15-15"},{"book":"luk","chapter":15,"verse":16,"text":"“And he longed to fill his stomach with the pods the pigs were eating, but no one gave him anything.”","status":"source_text","id":"luk-15-16"},{"book":"luk","chapter":15,"verse":17,"text":"“But coming to himself, he said, ‘How many of my father’s hired workers have bread to spare, but I am perishing here with hunger!’”","status":"source_text","id":"luk-15-17"},{"book":"luk","chapter":15,"verse":18,"text":"“‘I will rise and go to my father and say to him, “Father, I sinned against heaven and before you;”’”","status":"source_text","id":"luk-15-18"},{"book":"luk","chapter":15,"verse":19,"text":"“‘“I am no longer worthy to be called your son; make me like one of your hired workers.”’”","status":"source_text","id":"luk-15-19"},{"book":"luk","chapter":15,"verse":20,"text":"“And he rose and went to his father. While he was still far away, his father saw him and was moved with compassion. He ran and embraced him, and kissed him warmly.”","status":"source_text","id":"luk-15-20"},{"book":"luk","chapter":15,"verse":21,"text":"“And the son said to him, ‘Father, I sinned against heaven and before you; I am no longer worthy to be called your son.’”","status":"source_text","id":"luk-15-21"},{"book":"luk","chapter":15,"verse":22,"text":"“But the father said to his servants, ‘Quickly bring out the best robe and put it on him, and give a ring for his hand and sandals for his feet,’”","status":"source_text","id":"luk-15-22"},{"book":"luk","chapter":15,"verse":23,"text":"“And ‘and bring the fattened calf and slaughter it, and let us eat and celebrate,’”","status":"source_text","id":"luk-15-23"},{"book":"luk","chapter":15,"verse":24,"text":"“‘because this son of mine was dead and came to life again; he was lost and was found.’ And they began to celebrate.”","status":"source_text","id":"luk-15-24"},{"book":"luk","chapter":15,"verse":25,"text":"“His older son was in the field. As he approached the house, he heard music and dancing.”","status":"source_text","id":"luk-15-25"},{"book":"luk","chapter":15,"verse":26,"text":"“And he called one of the servants and asked what these things meant.”","status":"source_text","id":"luk-15-26"},{"book":"luk","chapter":15,"verse":27,"text":"“And he said to him, ‘Your brother has come, and your father slaughtered the fattened calf, because he received him back sound and well.’”","status":"source_text","id":"luk-15-27"},{"book":"luk","chapter":15,"verse":28,"text":"“He became angry and refused to enter. His father came out and pleaded with him.”","status":"source_text","id":"luk-15-28"},{"book":"luk","chapter":15,"verse":29,"text":"“But he answered and said to his father, ‘Look, for so many years I serve you and never passed over a command of yours, and you never gave me a young goat so that I might celebrate with my friends,’”","status":"source_text","id":"luk-15-29"},{"book":"luk","chapter":15,"verse":30,"text":"“‘but when this son of yours came, who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.’”","status":"source_text","id":"luk-15-30"},{"book":"luk","chapter":15,"verse":31,"text":"“But he said to him, ‘Child, you are always with me, and all my things are yours.’”","status":"source_text","id":"luk-15-31"},{"book":"luk","chapter":15,"verse":32,"text":"“‘But we had to celebrate and rejoice, because this brother of yours was dead and came to life, and was lost and was found.’”","status":"source_text","id":"luk-15-32"},{"book":"luk","chapter":16,"verse":1,"text":"He also said to the disciples, “A rich man had a steward, who was accused to him of squandering his possessions.”","status":"source_text","id":"luk-16-1"},{"book":"luk","chapter":16,"verse":2,"text":"“And calling him, he said to him, ‘What is this I hear about you? Give the account of your stewardship, for you can no longer be steward.’”","status":"source_text","id":"luk-16-2"},{"book":"luk","chapter":16,"verse":3,"text":"“And the steward said within himself, ‘What shall I do, because my master is taking the stewardship away from me? I am not strong enough to dig; I am ashamed to beg.’”","status":"source_text","id":"luk-16-3"},{"book":"luk","chapter":16,"verse":4,"text":"“‘I know what I will do so that, when I am removed from the stewardship, they may receive me into their houses.’”","status":"source_text","id":"luk-16-4"},{"book":"luk","chapter":16,"verse":5,"text":"“And calling each one of his master’s debtors, he said to the first, ‘How much do you owe my master?’”","status":"source_text","id":"luk-16-5"},{"book":"luk","chapter":16,"verse":6,"text":"“And he said, ‘A hundred baths of oil.’ And he said to him, ‘Take your bill and sit down quickly and write fifty.’”","status":"source_text","id":"luk-16-6"},{"book":"luk","chapter":16,"verse":7,"text":"“Then he said to another, ‘And how much do you owe?’ And he said, ‘A hundred kors of wheat.’ He said to him, ‘Take your bill and write eighty.’”","status":"source_text","id":"luk-16-7"},{"book":"luk","chapter":16,"verse":8,"text":"“And the master praised the dishonest steward because he had acted shrewdly. For the children of this age are more shrewd with their own generation than the children of light.”","status":"source_text","id":"luk-16-8"},{"book":"luk","chapter":16,"verse":9,"text":"“And I tell you, make friends for yourselves by means of unrighteous wealth, so that when it fails they may welcome you into eternal dwellings.”","status":"source_text","id":"luk-16-9"},{"book":"luk","chapter":16,"verse":10,"text":"“One faithful in a very
