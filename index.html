 little is faithful also in much, and one dishonest in a very little is dishonest also in much.”","status":"source_text","id":"luk-16-10"},{"book":"luk","chapter":16,"verse":11,"text":"“If then you have not been faithful with unrighteous wealth, who will entrust you with what is true?”","status":"source_text","id":"luk-16-11"},{"book":"luk","chapter":16,"verse":12,"text":"“And if you have not been faithful with what belongs to another, who will give you what is your own?”","status":"source_text","id":"luk-16-12"},{"book":"luk","chapter":16,"verse":13,"text":"“No servant can serve two masters. Either he will hate the one and love the other, or he will be devoted to one and despise the other. You cannot serve God and wealth.”","status":"source_text","id":"luk-16-13"},{"book":"luk","chapter":16,"verse":14,"text":"The Pharisees, who loved money, heard all these things and ridiculed Him.","status":"source_text","id":"luk-16-14"},{"book":"luk","chapter":16,"verse":15,"text":"And he said to them, “You justify yourselves before people, but God knows your hearts. What is highly valued among people is detestable before God.”","status":"source_text","id":"luk-16-15"},{"book":"luk","chapter":16,"verse":16,"text":"“The Law and the Prophets were until John. Since then the kingdom of God is proclaimed as good news, and everyone is pressing into it.”","status":"source_text","id":"luk-16-16"},{"book":"luk","chapter":16,"verse":17,"text":"“Yet it is easier for heaven and earth to pass away than for one stroke of the Law to fall.”","status":"source_text","id":"luk-16-17"},{"book":"luk","chapter":16,"verse":18,"text":"“Everyone who divorces his wife and marries another commits adultery, and the one who marries a woman divorced from her husband commits adultery.”","status":"source_text","id":"luk-16-18"},{"book":"luk","chapter":16,"verse":19,"text":"“There was a rich man. He dressed in purple and fine linen and feasted splendidly every day.”","status":"source_text","id":"luk-16-19"},{"book":"luk","chapter":16,"verse":20,"text":"“A poor man named Lazarus lay at his gate, covered with sores.”","status":"source_text","id":"luk-16-20"},{"book":"luk","chapter":16,"verse":21,"text":"“And he longed to be filled with what fell from the rich man’s table. Even the dogs came and licked his sores.”","status":"source_text","id":"luk-16-21"},{"book":"luk","chapter":16,"verse":22,"text":"“The poor man died and was carried by the angels to Abraham’s bosom. The rich man also died and was buried.”","status":"source_text","id":"luk-16-22"},{"book":"luk","chapter":16,"verse":23,"text":"“And in Hades, being in torment, he lifted his eyes and saw Abraham far away and Lazarus in his bosom.”","status":"source_text","id":"luk-16-23"},{"book":"luk","chapter":16,"verse":24,"text":"“And he called out and said, ‘Father Abraham, have mercy on me and send Lazarus, so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’”","status":"source_text","id":"luk-16-24"},{"book":"luk","chapter":16,"verse":25,"text":"“But Abraham said, ‘Child, remember that you received your good things in your life, and Lazarus likewise the bad; but now he is comforted here, and you are in agony.’”","status":"source_text","id":"luk-16-25"},{"book":"luk","chapter":16,"verse":26,"text":"“‘And besides all these things, a great chasm has been fixed between us and you, so that those wishing to cross from here to you cannot, nor may they cross from there to us.’”","status":"source_text","id":"luk-16-26"},{"book":"luk","chapter":16,"verse":27,"text":"“And he said, ‘Then I ask you, father, to send him to my father’s house,’”","status":"source_text","id":"luk-16-27"},{"book":"luk","chapter":16,"verse":28,"text":"“‘for I have five brothers, so that he may solemnly warn them, so that they also may not come to this place of torment.’”","status":"source_text","id":"luk-16-28"},{"book":"luk","chapter":16,"verse":29,"text":"“But Abraham said, ‘They have Moses and the Prophets; let them hear them.’”","status":"source_text","id":"luk-16-29"},{"book":"luk","chapter":16,"verse":30,"text":"“But he said, ‘No, father Abraham, but if someone goes to them from the dead, they will repent.’”","status":"source_text","id":"luk-16-30"},{"book":"luk","chapter":16,"verse":31,"text":"“And he said to him, ‘If they do not hear Moses and the Prophets, neither will they be persuaded if someone rises from the dead.’”","status":"source_text","id":"luk-16-31"},{"book":"luk","chapter":17,"verse":1,"text":"He said to His disciples, “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”","status":"source_text","id":"luk-17-1"},{"book":"luk","chapter":17,"verse":2,"text":"“It would be better for him to have a millstone hung around his neck and be thrown into the sea than to cause one of these little ones to stumble.”","status":"source_text","id":"luk-17-2"},{"book":"luk","chapter":17,"verse":3,"text":"“Watch yourselves. If your brother sins, rebuke him, and if he repents, forgive him.”","status":"source_text","id":"luk-17-3"},{"book":"luk","chapter":17,"verse":4,"text":"“And if he sins against you seven times in the day and returns to you seven times, saying, ‘I repent,’ you shall forgive him.”","status":"source_text","id":"luk-17-4"},{"book":"luk","chapter":17,"verse":5,"text":"And the apostles said to the Lord, “Increase our faith.”","status":"source_text","id":"luk-17-5"},{"book":"luk","chapter":17,"verse":6,"text":"And the Lord said, “If you have faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”","status":"source_text","id":"luk-17-6"},{"book":"luk","chapter":17,"verse":7,"text":"“But which of you, having a servant plowing or tending sheep, will say to him when he comes in from the field, ‘Come at once and recline at table’?”","status":"source_text","id":"luk-17-7"},{"book":"luk","chapter":17,"verse":8,"text":"“Will he not rather say to him, ‘Prepare what I may eat, and gird yourself and serve me until I eat and drink, and after these things you may eat and drink’?”","status":"source_text","id":"luk-17-8"},{"book":"luk","chapter":17,"verse":9,"text":"“Does he thank the servant because he did what was commanded?”","status":"source_text","id":"luk-17-9"},{"book":"luk","chapter":17,"verse":10,"text":"“So you also, when you have done all the things commanded you, say, ‘We are unprofitable servants; we have done what we ought to do.’”","status":"source_text","id":"luk-17-10"},{"book":"luk","chapter":17,"verse":11,"text":"And on the way to Jerusalem, He was passing between Samaria and Galilee.","status":"source_text","id":"luk-17-11"},{"book":"luk","chapter":17,"verse":12,"text":"And as He entered a certain village, ten leprous men met Him, who stood at a distance.","status":"source_text","id":"luk-17-12"},{"book":"luk","chapter":17,"verse":13,"text":"And they lifted their voices, saying, “Jesus, Master, have mercy on us.”","status":"source_text","id":"luk-17-13"},{"book":"luk","chapter":17,"verse":14,"text":"And when He saw them, He said, “Go and show yourselves to the priests. As they went, they were cleansed.”","status":"source_text","id":"luk-17-14"},{"book":"luk","chapter":17,"verse":15,"text":"One of them, seeing that he was healed, returned and glorified God with a loud voice.","status":"source_text","id":"luk-17-15"},{"book":"luk","chapter":17,"verse":16,"text":"And he fell on his face at His feet, thanking Him; and he was a Samaritan.","status":"source_text","id":"luk-17-16"},{"book":"luk","chapter":17,"verse":17,"text":"“Jesus responded, Were not ten cleansed? Where are the nine?”","status":"source_text","id":"luk-17-17"},{"book":"luk","chapter":17,"verse":18,"text":"“Was no one found to return and give glory to God except this foreigner?”","status":"source_text","id":"luk-17-18"},{"book":"luk","chapter":17,"verse":19,"text":"And He said to him, “Rise and go; your faith has saved you.”","status":"source_text","id":"luk-17-19"},{"book":"luk","chapter":17,"verse":20,"text":"When the Pharisees asked when the kingdom of God would come, “He answered them, The kingdom of God does not come with observable signs.”","status":"source_text","id":"luk-17-20"},{"book":"luk","chapter":17,"verse":21,"text":"“Nor will they say, ‘Look, here,’ or ‘There,’ for look, the kingdom of God is among you.”","status":"source_text","id":"luk-17-21"},{"book":"luk","chapter":17,"verse":22,"text":"He said to the disciples, “Days will come when you long to see one of the days of the Son of Man, but you will not see it.”","status":"source_text","id":"luk-17-22"},{"book":"luk","chapter":17,"verse":23,"text":"“And they will say to you, ‘Look, there,’ or ‘Look, here.’ Do not go away or pursue them.”","status":"source_text","id":"luk-17-23"},{"book":"luk","chapter":17,"verse":24,"text":"“For just as lightning flashes and shines from one side of the sky to the other, so will the Son of Man be in His day.”","status":"source_text","id":"luk-17-24"},{"book":"luk","chapter":17,"verse":25,"text":"“But first He must suffer many things and be rejected by this generation.”","status":"source_text","id":"luk-17-25"},{"book":"luk","chapter":17,"verse":26,"text":"“And just as it happened in the days of Noah, so it will be in the days of the Son of Man.”","status":"source_text","id":"luk-17-26"},{"book":"luk","chapter":17,"verse":27,"text":"“People ate, drank, married, and were given in marriage, until the day Noah entered the ark. Then the flood came and destroyed them all.”","status":"source_text","id":"luk-17-27"},{"book":"luk","chapter":17,"verse":28,"text":"“Likewise, it was in the days of Lot. People ate, drank, bought, sold, planted, and built.”","status":"source_text","id":"luk-17-28"},{"book":"luk","chapter":17,"verse":29,"text":"“But on the day Lot went out of Sodom, fire and sulfur rained from heaven and destroyed them all.”","status":"source_text","id":"luk-17-29"},{"book":"luk","chapter":17,"verse":30,"text":"“It will be the same on the day the Son of Man is revealed.”","status":"source_text","id":"luk-17-30"},{"book":"luk","chapter":17,"verse":31,"text":"“On that day, one on the roof whose goods are inside the house must not come down to take them. Likewise one in the field must not turn back.”","status":"source_text","id":"luk-17-31"},{"book":"luk","chapter":17,"verse":32,"text":"“Remember Lot’s wife.”","status":"source_text","id":"luk-17-32"},{"book":"luk","chapter":17,"verse":33,"text":"“Whoever seeks to preserve his life will lose it, but whoever loses it will keep it alive.”","status":"source_text","id":"luk-17-33"},{"book":"luk","chapter":17,"verse":34,"text":"“I tell you, on that night two will be in one bed. One will be taken and the other left.”","status":"source_text","id":"luk-17-34"},{"book":"luk","chapter":17,"verse":35,"text":"“Two women will be grinding together. One will be taken and the other left.”","status":"source_text","id":"luk-17-35"},{"book":"luk","chapter":17,"verse":37,"text":"And they answered and said to Him, “Where, Lord?” And He said to them, “Where the body is, there also the eagles will be gathered.”","status":"source_text","id":"luk-17-37"},{"book":"luk","chapter":18,"verse":1,"text":"He told them a parable to show that they should always pray and not lose heart.","status":"source_text","id":"luk-18-1"},{"book":"luk","chapter":18,"verse":2,"text":"He said, “In a certain town there was a judge who did not fear God or respect people.”","status":"source_text","id":"luk-18-2"},{"book":"luk","chapter":18,"verse":3,"text":"“And there was a widow in that town, and she was coming to him, saying, ‘Give me justice against my adversary.’”","status":"source_text","id":"luk-18-3"},{"book":"luk","chapter":18,"verse":4,"text":"“And for a time he was unwilling, but afterward he said within himself, ‘Even though I do not fear God or respect man,’”","status":"source_text","id":"luk-18-4"},{"book":"luk","chapter":18,"verse":5,"text":"“‘yet because this widow causes me trouble, I will give her justice, so that she does not come continually and wear me out.’”","status":"source_text","id":"luk-18-5"},{"book":"luk","chapter":18,"verse":6,"text":"The Lord said, “Hear what the unrighteous judge says.”","status":"source_text","id":"luk-18-6"},{"book":"luk","chapter":18,"verse":7,"text":"“And will God not give justice to His chosen ones who cry out to Him day and night, and does He delay long over them?”","status":"source_text","id":"luk-18-7"},{"book":"luk","chapter":18,"verse":8,"text":"“I tell you that He will give them justice quickly. Nevertheless, when the Son of Man comes, will He find faith on the earth?”","status":"source_text","id":"luk-18-8"},{"book":"luk","chapter":18,"verse":9,"text":"To some who trusted that they were righteous and despised others, He told this parable.","status":"source_text","id":"luk-18-9"},{"book":"luk","chapter":18,"verse":10,"text":"“Two men went up to the temple to pray. One was a Pharisee and the other a tax collector.”","status":"source_text","id":"luk-18-10"},{"book":"luk","chapter":18,"verse":11,"text":"“The Pharisee stood and was praying these things to himself, ‘God, I thank You that I am not like the rest of men, robbers, unrighteous, adulterers, or even like this tax collector.’”","status":"source_text","id":"luk-18-11"},{"book":"luk","chapter":18,"verse":12,"text":"“‘I fast twice in the week; I tithe all that I acquire.’”","status":"source_text","id":"luk-18-12"},{"book":"luk","chapter":18,"verse":13,"text":"“But the tax collector, standing far off, would not even lift his eyes to heaven, but was beating his breast, saying, ‘God, be merciful to me, the sinner.’”","status":"source_text","id":"luk-18-13"},{"book":"luk","chapter":18,"verse":14,"text":"“I tell you, this man went home justified rather than the other. Everyone who exalts himself will be humbled, and the one who humbles himself will be exalted.”","status":"source_text","id":"luk-18-14"},{"book":"luk","chapter":18,"verse":15,"text":"People were bringing even infants to Him so He might touch them. When the disciples saw it, they rebuked them.","status":"source_text","id":"luk-18-15"},{"book":"luk","chapter":18,"verse":16,"text":"Jesus called the children and said, “Let the children come to Me and do not hinder them. For the kingdom of God belongs to such as these.”","status":"source_text","id":"luk-18-16"},{"book":"luk","chapter":18,"verse":17,"text":"“Truly I tell you, whoever does not receive the kingdom of God like a child will certainly not enter it.”","status":"source_text","id":"luk-18-17"},{"book":"luk","chapter":18,"verse":18,"text":"And a certain ruler asked Him, saying, “Good Teacher, what shall I do to inherit eternal life?”","status":"source_text","id":"luk-18-18"},{"book":"luk","chapter":18,"verse":19,"text":"Jesus said to Him, “Why do you call Me good? No one is good except God alone.”","status":"source_text","id":"luk-18-19"},{"book":"luk","chapter":18,"verse":20,"text":"“You know the commandments, ‘Do not commit adultery; do not murder; do not steal; do not bear false witness; honor your father and your mother.’”","status":"source_text","id":"luk-18-20"},{"book":"luk","chapter":18,"verse":21,"text":"And he said, “All these things I have kept from youth.”","status":"source_text","id":"luk-18-21"},{"book":"luk","chapter":18,"verse":22,"text":"And hearing this, Jesus said to Him, “You still lack one thing: sell all that you have and distribute to the poor, and you will have treasure in the heavens; and come, follow Me.”","status":"source_text","id":"luk-18-22"},{"book":"luk","chapter":18,"verse":23,"text":"But hearing these things, he became deeply grieved, for he was very rich.","status":"source_text","id":"luk-18-23"},{"book":"luk","chapter":18,"verse":24,"text":"And Jesus, seeing him, said, “How difficult it is for those who have riches to enter the kingdom of God!”","status":"source_text","id":"luk-18-24"},{"book":"luk","chapter":18,"verse":25,"text":"“It is easier for a camel to go through the eye of a needle than for a rich person to enter the kingdom of God.”","status":"source_text","id":"luk-18-25"},{"book":"luk","chapter":18,"verse":26,"text":"Those who heard said, “Then who can be saved?”","status":"source_text","id":"luk-18-26"},{"book":"luk","chapter":18,"verse":27,"text":"He said, “What is impossible with people is possible with God.”","status":"source_text","id":"luk-18-27"},{"book":"luk","chapter":18,"verse":28,"text":"Peter said, “Look, we left what was ours and followed You.”","status":"source_text","id":"luk-18-28"},{"book":"luk","chapter":18,"verse":29,"text":"He said to them, “Truly I tell you, no one who has left home, wife, brothers, parents, or children for the kingdom of God”","status":"source_text","id":"luk-18-29"},{"book":"luk","chapter":18,"verse":30,"text":"“Will fail to receive many times as much in this present time and in the age to come eternal life.”","status":"source_text","id":"luk-18-30"},{"book":"luk","chapter":18,"verse":31,"text":"Taking the Twelve aside, He said, “Look, we are going up to Jerusalem, and all that the prophets wrote about the Son of Man will be fulfilled.”","status":"source_text","id":"luk-18-31"},{"book":"luk","chapter":18,"verse":32,"text":"“For He will be handed over to the Gentiles and mocked, insulted, and spat on.”","status":"source_text","id":"luk-18-32"},{"book":"luk","chapter":18,"verse":33,"text":"“And after flogging Him, they will kill Him, and on the third day He will rise.”","status":"source_text","id":"luk-18-33"},{"book":"luk","chapter":18,"verse":34,"text":"And they understood none of these things. This saying was hidden from them, and they did not grasp what was said.","status":"source_text","id":"luk-18-34"},{"book":"luk","chapter":18,"verse":35,"text":"As Jesus approached Jericho, a blind man was sitting by the road begging.","status":"source_text","id":"luk-18-35"},{"book":"luk","chapter":18,"verse":36,"text":"Hearing a crowd going by, he asked what it meant.","status":"source_text","id":"luk-18-36"},{"book":"luk","chapter":18,"verse":37,"text":"They told him that Jesus of Nazareth was passing by.","status":"source_text","id":"luk-18-37"},{"book":"luk","chapter":18,"verse":38,"text":"And he called out, saying, “Jesus, Son of David, have mercy on me!”","status":"source_text","id":"luk-18-38"},{"book":"luk","chapter":18,"verse":39,"text":"And those going before were rebuking him so that he would be silent, but he cried out all the more, “Son of David, have mercy on me!”","status":"source_text","id":"luk-18-39"},{"book":"luk","chapter":18,"verse":40,"text":"And Jesus stood still and commanded him to be brought to Him; and when he drew near, He asked him,","status":"source_text","id":"luk-18-40"},{"book":"luk","chapter":18,"verse":41,"text":"“What do you wish Me to do for you?” And he said, “Lord, that I may regain my sight.”","status":"source_text","id":"luk-18-41"},{"book":"luk","chapter":18,"verse":42,"text":"And Jesus said to him, “Regain your sight; your faith has saved you.”","status":"source_text","id":"luk-18-42"},{"book":"luk","chapter":18,"verse":43,"text":"And immediately he regained his sight and was following Him, glorifying God; and all the people, seeing it, gave praise to God.","status":"source_text","id":"luk-18-43"},{"book":"luk","chapter":19,"verse":1,"text":"And Jesus entered Jericho and was passing through.","status":"source_text","id":"luk-19-1"},{"book":"luk","chapter":19,"verse":2,"text":"And there was a man named Zacchaeus. He was a chief tax collector and wealthy.","status":"source_text","id":"luk-19-2"},{"book":"luk","chapter":19,"verse":3,"text":"And he was trying to see who Jesus was, but he could not because of the crowd, for he was short.","status":"source_text","id":"luk-19-3"},{"book":"luk","chapter":19,"verse":4,"text":"And he ran ahead and climbed a sycamore tree to see Him, because He was about to pass that way.","status":"source_text","id":"luk-19-4"},{"book":"luk","chapter":19,"verse":5,"text":"And when Jesus reached the place, He looked up and said, “Zacchaeus, hurry down. For today I must stay at your house.”","status":"source_text","id":"luk-19-5"},{"book":"luk","chapter":19,"verse":6,"text":"And he hurried and came down and received Him joyfully.","status":"source_text","id":"luk-19-6"},{"book":"luk","chapter":19,"verse":7,"text":"“And all who saw it began to grumble, He has gone in to lodge with a sinful man.”","status":"source_text","id":"luk-19-7"},{"book":"luk","chapter":19,"verse":8,"text":"And Zacchaeus stood and said to the Lord, “Look, I give half of my possessions to the poor, Lord, and if I extorted anything from anyone, I repay fourfold.”","status":"source_text","id":"luk-19-8"},{"book":"luk","chapter":19,"verse":9,"text":"Jesus said to him, “Today salvation has come to this house, because he too is a son of Abraham.”","status":"source_text","id":"luk-19-9"},{"book":"luk","chapter":19,"verse":10,"text":"“For the Son of Man came to seek and save the lost.”","status":"source_text","id":"luk-19-10"},{"book":"luk","chapter":19,"verse":11,"text":"While they listened to these things, He went on to tell a parable, because He was near Jerusalem and they thought the kingdom of God would appear immediately.","status":"source_text","id":"luk-19-11"},{"book":"luk","chapter":19,"verse":12,"text":"He said, “A nobleman went to a distant country to receive a kingdom for himself and then return.”","status":"source_text","id":"luk-19-12"},{"book":"luk","chapter":19,"verse":13,"text":"“And calling ten servants of his, he gave them ten minas and said to them, ‘Do business until I come.’”","status":"source_text","id":"luk-19-13"},{"book":"luk","chapter":19,"verse":14,"text":"“But his citizens hated him and sent a delegation after him, saying, ‘We do not want this man to reign over us.’”","status":"source_text","id":"luk-19-14"},{"book":"luk","chapter":19,"verse":15,"text":"“And he returned after receiving the kingdom. He ordered the servants to whom he had given the money to be called. He wanted to know what they had gained in business.”","status":"source_text","id":"luk-19-15"},{"book":"luk","chapter":19,"verse":16,"text":"“And the first came, saying, ‘Master, your mina gained ten minas.’”","status":"source_text","id":"luk-19-16"},{"book":"luk","chapter":19,"verse":17,"text":"“And he said to him, ‘Well done, good servant; because you became faithful in a very little, have authority over ten towns.’”","status":"source_text","id":"luk-19-17"},{"book":"luk","chapter":19,"verse":18,"text":"“And the second came, saying, ‘Your mina, master, made five minas.’”","status":"source_text","id":"luk-19-18"},{"book":"luk","chapter":19,"verse":19,"text":"“And he said to this one also, ‘You also be over five towns.’”","status":"source_text","id":"luk-19-19"},{"book":"luk","chapter":19,"verse":20,"text":"“And the other came, saying, ‘Master, look, your mina, which I kept laid away in a cloth,’”","status":"source_text","id":"luk-19-20"},{"book":"luk","chapter":19,"verse":21,"text":"“‘for I was afraid of you, because you are a harsh man; you take up what you did not put down, and reap what you did not sow.’”","status":"source_text","id":"luk-19-21"},{"book":"luk","chapter":19,"verse":22,"text":"“He said to him, ‘From your mouth I will judge you, wicked servant. You knew that I am a harsh man, taking up what I did not put down and reaping what I did not sow?’”","status":"source_text","id":"luk-19-22"},{"book":"luk","chapter":19,"verse":23,"text":"“‘And why did you not put my money in a bank? And I, on coming, would have collected it with interest.’”","status":"source_text","id":"luk-19-23"},{"book":"luk","chapter":19,"verse":24,"text":"“And he said to those standing there, ‘Take the mina from him and give it to the one who has the ten minas.’”","status":"source_text","id":"luk-19-24"},{"book":"luk","chapter":19,"verse":25,"text":"“And they said to him, ‘Master, he has ten minas.’”","status":"source_text","id":"luk-19-25"},{"book":"luk","chapter":19,"verse":26,"text":"“‘I tell you that to everyone who has, it will be given, but from the one who does not have, even what he has will be taken away.’”","status":"source_text","id":"luk-19-26"},{"book":"luk","chapter":19,"verse":27,"text":"“‘But these enemies of mine who did not wish me to reign over them, bring here and slaughter them before me.’”","status":"source_text","id":"luk-19-27"},{"book":"luk","chapter":19,"verse":28,"text":"And after saying these things, He went ahead, going up to Jerusalem.","status":"source_text","id":"luk-19-28"},{"book":"luk","chapter":19,"verse":29,"text":"And it happened as He drew near to Bethphage and Bethany, at the mountain called the Mount of Olives, that He sent two of the disciples,","status":"source_text","id":"luk-19-29"},{"book":"luk","chapter":19,"verse":30,"text":"He said, “Go into the village opposite. As you enter, you will find a colt tied. No one has ever sat on it. Untie it and bring it here.”","status":"source_text","id":"luk-19-30"},{"book":"luk","chapter":19,"verse":31,"text":"“And if anyone asks you, ‘Why are you untying it?’ you shall say thus, ‘The Lord has need of it.’”","status":"source_text","id":"luk-19-31"},{"book":"luk","chapter":19,"verse":32,"text":"Those sent went and found it as He had told them.","status":"source_text","id":"luk-19-32"},{"book":"luk","chapter":19,"verse":33,"text":"And as they were untying the colt, its owners said to them, “Why are you untying the colt?”","status":"source_text","id":"luk-19-33"},{"book":"luk","chapter":19,"verse":34,"text":"And they said, “The Lord has need of it.”","status":"source_text","id":"luk-19-34"},{"book":"luk","chapter":19,"verse":35,"text":"And they brought it to Jesus. They threw their cloaks on the colt and set Jesus on it.","status":"source_text","id":"luk-19-35"},{"book":"luk","chapter":19,"verse":36,"text":"As He went along, people spread their cloaks on the road.","status":"source_text","id":"luk-19-36"},{"book":"luk","chapter":19,"verse":37,"text":"As He approached the descent of the Mount of Olives, the whole crowd of disciples began joyfully to praise God in a loud voice for all the mighty works they had seen.","status":"source_text","id":"luk-19-37"},{"book":"luk","chapter":19,"verse":38,"text":"They said, “Blessed is the king who comes in the name of the Lord! Peace in heaven and glory in the highest!”","status":"source_text","id":"luk-19-38"},{"book":"luk","chapter":19,"verse":39,"text":"Some Pharisees in the crowd said to Him, “Teacher, rebuke Your disciples.”","status":"source_text","id":"luk-19-39"},{"book":"luk","chapter":19,"verse":40,"text":"And He answered, “I tell you, if these become silent, the stones will cry out.”","status":"source_text","id":"luk-19-40"},{"book":"luk","chapter":19,"verse":41,"text":"And as He approached, He saw the city and wept over it.","status":"source_text","id":"luk-19-41"},{"book":"luk","chapter":19,"verse":42,"text":"“If only you had known, even today, what makes for peace! But now it is hidden from your eyes.”","status":"source_text","id":"luk-19-42"},{"book":"luk","chapter":19,"verse":43,"text":"“Days will come upon you when your enemies build an embankment against you and surround and press you from every side.”","status":"source_text","id":"luk-19-43"},{"book":"luk","chapter":19,"verse":44,"text":"“And they will dash you and your children within you to the ground and leave no stone upon another within you, because you did not know the time of your visitation.”","status":"source_text","id":"luk-19-44"},{"book":"luk","chapter":19,"verse":45,"text":"And He entered the temple and began driving out those selling there.","status":"source_text","id":"luk-19-45"},{"book":"luk","chapter":19,"verse":46,"text":"saying to them, “It is written, ‘And My house shall be a house of prayer,’ but you made it a den of robbers.”","status":"source_text","id":"luk-19-46"},{"book":"luk","chapter":19,"verse":47,"text":"And He taught daily in the temple. The chief priests and scribes sought to destroy Him, as did the leaders of the people.","status":"source_text","id":"luk-19-47"},{"book":"luk","chapter":19,"verse":48,"text":"But they could not find a way to do it, for all the people were hanging on His words.","status":"source_text","id":"luk-19-48"},{"book":"luk","chapter":20,"verse":1,"text":"And one day Jesus was teaching the people in the temple and proclaiming the good news. The chief priests and scribes came up with the elders.","status":"source_text","id":"luk-20-1"},{"book":"luk","chapter":20,"verse":2,"text":"And they said to Him, “Tell us by what authority You do these things. Who gave You this authority?”","status":"source_text","id":"luk-20-2"},{"book":"luk","chapter":20,"verse":3,"text":"He answered them, “I too will ask you a question. Tell Me,”","status":"source_text","id":"luk-20-3"},{"book":"luk","chapter":20,"verse":4,"text":"“Was John’s baptism from heaven or from people?”","status":"source_text","id":"luk-20-4"},{"book":"luk","chapter":20,"verse":5,"text":"And they reasoned together among themselves, saying, “If we say, ‘From heaven,’ He will say, ‘Why did you not believe him?’”","status":"source_text","id":"luk-20-5"},{"book":"luk","chapter":20,"verse":6,"text":"“But if we say, ‘From men,’ all the people will stone us, for they are convinced that John is a prophet.”","status":"source_text","id":"luk-20-6"},{"book":"luk","chapter":20,"verse":7,"text":"So they answered that they did not know where it was from.","status":"source_text","id":"luk-20-7"},{"book":"luk","chapter":20,"verse":8,"text":"And Jesus said to them, “Neither will I tell you by what authority I do these things.”","status":"source_text","id":"luk-20-8"},{"book":"luk","chapter":20,"verse":9,"text":"And He began to speak to the people this parable, “A man planted a vineyard and leased it to farmers and went abroad for a considerable time.”","status":"source_text","id":"luk-20-9"},{"book":"luk","chapter":20,"verse":10,"text":"“And at the proper time he sent a servant to the farmers to receive some of the fruit of the vineyard. But the farmers beat him and sent him away empty-handed.”","status":"source_text","id":"luk-20-10"},{"book":"luk","chapter":20,"verse":11,"text":"“And he sent another servant. They beat and dishonored him too, then sent him away empty-handed.”","status":"source_text","id":"luk-20-11"},{"book":"luk","chapter":20,"verse":12,"text":"“And he sent a third as well. They wounded this one and threw him out.”","status":"source_text","id":"luk-20-12"},{"book":"luk","chapter":20,"verse":13,"text":"“And the lord of the vineyard said, ‘What shall I do? I will send my beloved son; perhaps they will respect him.’”","status":"source_text","id":"luk-20-13"},{"book":"luk","chapter":20,"verse":14,"text":"“But seeing him, the farmers reasoned with one another, saying, ‘This is the heir; let us kill him, so that the inheritance may become ours.’”","status":"source_text","id":"luk-20-14"},{"book":"luk","chapter":20,"verse":15,"text":"“And they threw him outside the vineyard and killed him. What then will the owner of the vineyard do to them?”","status":"source_text","id":"luk-20-15"},{"book":"luk","chapter":20,"verse":16,"text":"“He will come and destroy these farmers and give the vineyard to others.” And hearing it, they said, “May it never be!”","status":"source_text","id":"luk-20-16"},{"book":"luk","chapter":20,"verse":17,"text":"But He looked at them and said, “What then is this that is written, ‘The stone that the builders rejected, this became the head of the corner’?”","status":"source_text","id":"luk-20-17"},{"book":"luk","chapter":20,"verse":18,"text":"“Everyone who falls on that stone will be broken, and anyone on whom it falls will be crushed to powder.”","status":"source_text","id":"luk-20-18"},{"book":"luk","chapter":20,"verse":19,"text":"And the scribes and chief priests sought to seize Him at that very hour, but they feared the people, for they knew He had spoken this parable against them.","status":"source_text","id":"luk-20-19"},{"book":"luk","chapter":20,"verse":20,"text":"And they watched Him and sent spies who pretended to be righteous. They sought to catch Him in something He said so they could hand Him over to the governor’s authority.","status":"source_text","id":"luk-20-20"},{"book":"luk","chapter":20,"verse":21,"text":"And they asked, “Teacher, we know You speak and teach rightly and show no partiality. You teach the way of God in truth.”","status":"source_text","id":"luk-20-21"},{"book":"luk","chapter":20,"verse":22,"text":"“Is it lawful for us to pay tribute to Caesar or not?”","status":"source_text","id":"luk-20-22"},{"book":"luk","chapter":20,"verse":23,"text":"He perceived their craftiness and said to them,","status":"source_text","id":"luk-20-23"},{"book":"luk","chapter":20,"verse":24,"text":"“Show Me a denarius. Whose image and inscription does it have?” And they said, “Caesar’s.”","status":"source_text","id":"luk-20-24"},{"book":"luk","chapter":20,"verse":25,"text":"And He said to them, “Then give back to Caesar the things of Caesar, and to God the things of God.”","status":"source_text","id":"luk-20-25"},{"book":"luk","chapter":20,"verse":26,"text":"And they could not catch Him in His words before the people. They marveled at His answer and fell silent.","status":"source_text","id":"luk-20-26"},{"book":"luk","chapter":20,"verse":27,"text":"Some Sadducees, who say there is no resurrection, came and asked Him.","status":"source_text","id":"luk-20-27"},{"book":"luk","chapter":20,"verse":28,"text":"saying, “Teacher, Moses wrote for us that if someone’s brother dies, having a wife, and he is childless, his brother should take the wife and raise up seed for his brother.”","status":"source_text","id":"luk-20-28"},{"book":"luk","chapter":20,"verse":29,"text":"“Now there were seven brothers. The first married a wife and died childless.”","status":"source_text","id":"luk-20-29"},{"book":"luk","chapter":20,"verse":30,"text":"“and the second,”","status":"source_text","id":"luk-20-30"},{"book":"luk","chapter":20,"verse":31,"text":"“and the third took her, and likewise also the seven left no children and died.”","status":"source_text","id":"luk-20-31"},{"book":"luk","chapter":20,"verse":32,"text":"“Finally the woman too died.”","status":"source_text","id":"luk-20-32"},{"book":"luk","chapter":20,"verse":33,"text":"“In the resurrection, whose wife will she be? For all seven had her as a wife.”","status":"source_text","id":"luk-20-33"},{"book":"luk","chapter":20,"verse":34,"text":"And Jesus said to them, “The sons of this age marry and are given in marriage,”","status":"source_text","id":"luk-20-34"},{"book":"luk","chapter":20,"verse":35,"text":"“but those considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage,”","status":"source_text","id":"luk-20-35"},{"book":"luk","chapter":20,"verse":36,"text":"“for neither can they die anymore, for they are equal to angels and are sons of God, being sons of the resurrection.”","status":"source_text","id":"luk-20-36"},{"book":"luk","chapter":20,"verse":37,"text":"“But that the dead are raised, even Moses disclosed at the bush, when he calls the Lord the God of Abraham and God of Isaac and God of Jacob.”","status":"source_text","id":"luk-20-37"},{"book":"luk","chapter":20,"verse":38,"text":"“Now He is not God of the dead but of the living, for all live to Him.”","status":"source_text","id":"luk-20-38"},{"book":"luk","chapter":20,"verse":39,"text":"Some scribes answered, “Teacher, You have spoken well.”","status":"source_text","id":"luk-20-39"},{"book":"luk","chapter":20,"verse":40,"text":"They no longer dared to ask Him anything.","status":"source_text","id":"luk-20-40"},{"book":"luk","chapter":20,"verse":41,"text":"He said to them, “How can they say that the Christ is David’s son?”","status":"source_text","id":"luk-20-41"},{"book":"luk","chapter":20,"verse":42,"text":"“For David himself says in the book of Psalms, ‘The Lord said to my Lord, “Sit at My right hand,”’”","status":"source_text","id":"luk-20-42"},{"book":"luk","chapter":20,"verse":43,"text":"“‘“until I make Your enemies a footstool for Your feet.”’”","status":"source_text","id":"luk-20-43"},{"book":"luk","chapter":20,"verse":44,"text":"“David therefore calls Him Lord, and how is He his son?”","status":"source_text","id":"luk-20-44"},{"book":"luk","chapter":20,"verse":45,"text":"While all the people were listening, He said to His disciples,","status":"source_text","id":"luk-20-45"},{"book":"luk","chapter":20,"verse":46,"text":"“Beware of the scribes. They like to walk around in long robes and love greetings in the marketplaces, the best seats in synagogues, and places of honor at dinners.”","status":"source_text","id":"luk-20-46"},{"book":"luk","chapter":20,"verse":47,"text":"“They devour widows’ houses and make long prayers as a pretense. They will receive a more severe judgment.”","status":"source_text","id":"luk-20-47"},{"book":"luk","chapter":21,"verse":1,"text":"Looking up, Jesus saw wealthy people putting their gifts into the temple treasury.","status":"source_text","id":"luk-21-1"},{"book":"luk","chapter":21,"verse":2,"text":"He also saw a poor widow putting in two small coins.","status":"source_text","id":"luk-21-2"},{"book":"luk","chapter":21,"verse":3,"text":"And He said, “Truly I tell you, this poor widow put in more than all the others.”","status":"source_text","id":"luk-21-3"},{"book":"luk","chapter":21,"verse":4,"text":"“All the others put gifts in from their abundance. But she put in, from her lack, all the livelihood she had.”","status":"source_text","id":"luk-21-4"},{"book":"luk","chapter":21,"verse":5,"text":"Some were speaking of the temple, how it was adorned with fine stones and offerings. He said,","status":"source_text","id":"luk-21-5"},{"book":"luk","chapter":21,"verse":6,"text":"“As for these things you see, days will come when not one stone will be left on another; all will be thrown down.”","status":"source_text","id":"luk-21-6"},{"book":"luk","chapter":21,"verse":7,"text":"They asked, “Teacher, when will these things happen? What will be the sign when they are about to occur?”","status":"source_text","id":"luk-21-7"},{"book":"luk","chapter":21,"verse":8,"text":"And He said, “Watch that you are not led astray; for many will come in My name, saying, ‘I am He,’ and, ‘The time has drawn near.’ Do not go after them.”","status":"source_text","id":"luk-21-8"},{"book":"luk","chapter":21,"verse":9,"text":"“When you hear of wars and disturbances, do not be terrified. These things must happen first, but the end will not come immediately.”","status":"source_text","id":"luk-21-9"},{"book":"luk","chapter":21,"verse":10,"text":"Then He said to them, “Nation will rise against nation and kingdom against kingdom.”","status":"source_text","id":"luk-21-10"},{"book":"luk","chapter":21,"verse":11,"text":"“There will be great earthquakes, famines, and plagues in various places. There will be terrifying events and great signs from heaven.”","status":"source_text","id":"luk-21-11"},{"book":"luk","chapter":21,"verse":12,"text":"“But before all these things they will seize and persecute you, handing you over to synagogues and prisons. You will be brought before kings and governors because of My name.”","status":"source_text","id":"luk-21-12"},{"book":"luk","chapter":21,"verse":13,"text":"“This will become an opportunity for your testimony.”","status":"source_text","id":"luk-21-13"},{"book":"luk","chapter":21,"verse":14,"text":"“So settle it in your hearts not to prepare your defense beforehand.”","status":"source_text","id":"luk-21-14"},{"book":"luk","chapter":21,"verse":15,"text":"“For I will give you a mouth and wisdom, which all those opposing you will not be able to resist or contradict.”","status":"source_text","id":"luk-21-15"},{"book":"luk","chapter":21,"verse":16,"text":"“Even parents, brothers, relatives, and friends will hand you over. They will put some of you to death.”","status":"source_text","id":"luk-21-16"},{"book":"luk","chapter":21,"verse":17,"text":"“And you will be hated by everyone because of My name.”","status":"source_text","id":"luk-21-17"},{"book":"luk","chapter":21,"verse":18,"text":"“Yet not a hair of your head will be lost.”","status":"source_text","id":"luk-21-18"},{"book":"luk","chapter":21,"verse":19,"text":"“By your endurance gain your lives.”","status":"source_text","id":"luk-21-19"},{"book":"luk","chapter":21,"verse":20,"text":"“When you see Jerusalem surrounded by armies, know that its desolation has drawn near.”","status":"source_text","id":"luk-21-20"},{"book":"luk","chapter":21,"verse":21,"text":"“Then let those in Judea flee to the mountains, those inside the city leave it, and those in the countryside not enter it.”","status":"source_text","id":"luk-21-21"},{"book":"luk","chapter":21,"verse":22,"text":"“because these are days of vengeance, for all the things written to be fulfilled.”","status":"source_text","id":"luk-21-22"},{"book":"luk","chapter":21,"verse":23,"text":"“Woe to pregnant women and those nursing babies in those days. There will be great distress on the land and wrath against this people.”","status":"source_text","id":"luk-21-23"},{"book":"luk","chapter":21,"verse":24,"text":"“And they will fall by the edge of the sword and be led captive into all the nations, and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.”","status":"source_text","id":"luk-21-24"},{"book":"luk","chapter":21,"verse":25,"text":"“And there will be signs in the sun, moon, and stars. On earth nations will be distressed and perplexed by the roaring and surging of the sea.”","status":"source_text","id":"luk-21-25"},{"book":"luk","chapter":21,"verse":26,"text":"“People will faint from fear and expectation of what is coming upon the inhabited world. For the powers of the heavens will be shaken.”","status":"source_text","id":"luk-21-26"},{"book":"luk","chapter":21,"verse":27,"text":"“Then they will see the Son of Man coming in a cloud with power and great glory.”","status":"source_text","id":"luk-21-27"},{"book":"luk","chapter":21,"verse":28,"text":"“When these things begin to happen, straighten up and lift your heads, because your redemption draws near.”","status":"source_text","id":"luk-21-28"},{"book":"luk","chapter":21,"verse":29,"text":"And He spoke a parable to them, “Look at the fig tree and all the trees.”","status":"source_text","id":"luk-21-29"},{"book":"luk","chapter":21,"verse":30,"text":"“When they put forth leaves, you see for yourselves that summer is near.”","status":"source_text","id":"luk-21-30"},{"book":"luk","chapter":21,"verse":31,"text":"“So also you, when you see these things happening, know that the kingdom of God is near.”","status":"source_text","id":"luk-21-31"},{"book":"luk","chapter":21,"verse":32,"text":"“Truly I tell you, this generation will not pass away until all these things take place.”","status":"source_text","id":"luk-21-32"},{"book":"luk","chapter":21,"verse":33,"text":"“Heaven and earth will pass away, but My words will certainly not pass away.”","status":"source_text","id":"luk-21-33"},{"book":"luk","chapter":21,"verse":34,"text":"“But watch yourselves, lest your hearts be weighed down with dissipation and drunkenness and cares of life, and that day come upon you suddenly,”","status":"source_text","id":"luk-21-34"},{"book":"luk","chapter":21,"verse":35,"text":"“like a trap; for it will come upon all those dwelling on the face of the whole earth.”","status":"source_text","id":"luk-21-35"},{"book":"luk","chapter":21,"verse":36,"text":"“Stay awake and pray at all times that you may have strength to escape all these things that will take place and to stand before the Son of Man.”","status":"source_text","id":"luk-21-36"},{"book":"luk","chapter":21,"verse":37,"text":"Now during the days He was teaching in the temple, but during the nights He went out and lodged on the mountain called the Mount of Olives.","status":"source_text","id":"luk-21-37"},{"book":"luk","chapter":21,"verse":38,"text":"And all the people came early in the morning to hear Him in the temple.","status":"source_text","id":"luk-21-38"},{"book":"luk","chapter":22,"verse":1,"text":"The Feast of Unleavened Bread, called Passover, was approaching.","status":"source_text","id":"luk-22-1"},{"book":"luk","chapter":22,"verse":2,"text":"And the chief priests and scribes were seeking a way to kill Him, for they feared the people.","status":"source_text","id":"luk-22-2"},{"book":"luk","chapter":22,"verse":3,"text":"Satan entered Judas, called Iscariot, who was one of the Twelve.","status":"source_text","id":"luk-22-3"},{"book":"luk","chapter":22,"verse":4,"text":"And he went away and spoke with the chief priests and captains about how he might hand Him over to them.","status":"source_text","id":"luk-22-4"},{"book":"luk","chapter":22,"verse":5,"text":"And they were pleased and agreed to give him money.","status":"source_text","id":"luk-22-5"},{"book":"luk","chapter":22,"verse":6,"text":"And he agreed, and was seeking an opportunity to hand Him over to them apart from the crowd.","status":"source_text","id":"luk-22-6"},{"book":"luk","chapter":22,"verse":7,"text":"The day of Unleavened Bread came, when the Passover lamb had to be sacrificed.","status":"source_text","id":"luk-22-7"},{"book":"luk","chapter":22,"verse":8,"text":"And Jesus sent Peter and John, saying, “Go and prepare the Passover for us to eat.”","status":"source_text","id":"luk-22-8"},{"book":"luk","chapter":22,"verse":9,"text":"They asked Him, “Where do You want us to prepare it?”","status":"source_text","id":"luk-22-9"},{"book":"luk","chapter":22,"verse":10,"text":"And He said to them, “Look, when you enter the town, a man carrying a jar of water will meet you; follow him into the house he enters.”","status":"source_text","id":"luk-22-10"},{"book":"luk","chapter":22,"verse":11,"text":"“And you shall say to the master of the house, ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with My disciples?”’”","status":"source_text","id":"luk-22-11"},{"book":"luk","chapter":22,"verse":12,"text":"“And he will show you a large furnished upper room; prepare there.”","status":"source_text","id":"luk-22-12"},{"book":"luk","chapter":22,"verse":13,"text":"They went and found it as He had told them and prepared the Passover.","status":"source_text","id":"luk-22-13"},{"book":"luk","chapter":22,"verse":14,"text":"And when the hour came, Jesus reclined at the table, and the apostles were with Him.","status":"source_text","id":"luk-22-14"},{"book":"luk","chapter":22,"verse":15,"text":"And He said to them, “I have earnestly desired to eat this Passover with you before I suffer.”","status":"source_text","id":"luk-22-15"},{"book":"luk","chapter":22,"verse":16,"text":"“For I tell you, I will not eat it again until it is fulfilled in the kingdom of God.”","status":"source_text","id":"luk-22-16"},{"book":"luk","chapter":22,"verse":17,"text":"And He took a cup, gave thanks, and said, “Take this and divide it among yourselves.”","status":"source_text","id":"luk-22-17"},{"book":"luk","chapter":22,"verse":18,"text":"“For I tell you, from now on I will not drink the fruit of the vine until the kingdom of God comes.”","status":"source_text","id":"luk-22-18"},{"book":"luk","chapter":22,"verse":19,"text":"And taking bread, He gave thanks and broke it, and gave it to them, saying, “This is My body, which is given for you; do this in remembrance of Me.”","status":"source_text","id":"luk-22-19"},{"book":"luk","chapter":22,"verse":20,"text":"And likewise the cup after supper, saying, “This cup is the new covenant in My blood, which is poured out for you.”","status":"source_text","id":"luk-22-20"},{"book":"luk","chapter":22,"verse":21,"text":"“But look, the hand of the one handing Me over is with Me on the table.”","status":"source_text","id":"luk-22-21"},{"book":"luk","chapter":22,"verse":22,"text":"“For the Son of Man goes according to what has been determined, but woe to that man through whom He is handed over.”","status":"source_text","id":"luk-22-22"},{"book":"luk","chapter":22,"verse":23,"text":"And they began to discuss among themselves which of them would do this.","status":"source_text","id":"luk-22-23"},{"book":"luk","chapter":22,"verse":24,"text":"A dispute also arose among them about which of them was considered greatest.","status":"source_text","id":"luk-22-24"},{"book":"luk","chapter":22,"verse":25,"text":"He said to them, “The kings of the nations rule over them, and those who wield authority are called benefactors.”","status":"source_text","id":"luk-22-25"},{"book":"luk","chapter":22,"verse":26,"text":"“But you must not be so. The greatest among you should become like the youngest, and the one who leads like the one who serves.”","status":"source_text","id":"luk-22-26"},{"book":"luk","chapter":22,"verse":27,"text":"“Who is greater, the one reclining at table or the one serving? Is it not the one reclining? Yet I am among you as one who serves.”","status":"source_text","id":"luk-22-27"},{"book":"luk","chapter":22,"verse":28,"text":"“You are the ones who have stayed with Me in My trials.”","status":"source_text","id":"luk-22-28"},{"book":"luk","chapter":22,"verse":29,"text":"“And I appoint to you, just as My Father appointed to Me, a kingdom,”","status":"source_text","id":"luk-22-29"},{"book":"luk","chapter":22,"verse":30,"text":"“so that you may eat and drink at My table in My kingdom; and you will sit on thrones, judging the Twelve tribes of Israel.”","status":"source_text","id":"luk-22-30"},{"book":"luk","chapter":22,"verse":31,"text":"“Simon, Simon, look. Satan has demanded to sift all of you like wheat.”","status":"source_text","id":"luk-22-31"},{"book":"luk","chapter":22,"verse":32,"text":"“But I have prayed for you that your faith may not fail. When you have turned back, strengthen your brothers.”","status":"source_text","id":"luk-22-32"},{"book":"luk","chapter":22,"verse":33,"text":"And he said to Him, “Lord, I am ready to go with You both to prison and to death.”","status":"source_text","id":"luk-22-33"},{"book":"luk","chapter":22,"verse":34,"text":"He said, “Peter, the rooster will not crow today before you deny three times that you know Me.”","status":"source_text","id":"luk-22-34"},{"book":"luk","chapter":22,"verse":35,"text":"And He said to them, “When I sent you without money bag and travel bag and sandals, did you lack anything?” And they said, “Nothing.”","status":"source_text","id":"luk-22-35"},{"book":"luk","chapter":22,"verse":36,"text":"And He said to them, “But now, let the one who has a money bag take it, and likewise a travel bag; and let the one who does not have a sword sell his cloak and buy one.”","status":"source_text","id":"luk-22-36"},{"book":"luk","chapter":22,"verse":37,"text":"“For I tell you that this which is written must be fulfilled in Me, ‘And He was counted with the lawless,’ for that which concerns Me has its fulfillment.”","status":"source_text","id":"luk-22-37"},{"book":"luk","chapter":22,"verse":38,"text":"And they said, “Lord, look, here are two swords.” And He said to them, “It is enough.”","status":"source_text","id":"luk-22-38"},{"book":"luk","chapter":22,"verse":39,"text":"And He went out and went as usual to the Mount of Olives. The disciples followed Him.","status":"source_text","id":"luk-22-39"},{"book":"luk","chapter":22,"verse":40,"text":"When He reached the place, He said to them, “Pray that you may not enter into testing.”","status":"source_text","id":"luk-22-40"},{"book":"luk","chapter":22,"verse":41,"text":"And He withdrew from them about a stone’s throw. He knelt down and prayed,","status":"source_text","id":"luk-22-41"},{"book":"luk","chapter":22,"verse":42,"text":"“Father, if You are willing, take this cup away from Me; nevertheless, not My will but Yours be done.”","status":"source_text","id":"luk-22-42"},{"book":"luk","chapter":22,"verse":43,"text":"And an angel from heaven appeared to Him, strengthening Him.","status":"source_text","id":"luk-22-43"},{"book":"luk","chapter":22,"verse":44,"text":"And being in anguish, He was praying more earnestly; and His sweat became like clots of blood falling to the ground.","status":"source_text","id":"luk-22-44"},{"book":"luk","chapter":22,"verse":45,"text":"And rising from prayer, He went to the disciples. He found them sleeping from sorrow.","status":"source_text","id":"luk-22-45"},{"book":"luk","chapter":22,"verse":46,"text":"And He said to them, “Why are you sleeping? Get up and pray, so that you do not enter into testing.”","status":"source_text","id":"luk-22-46"},{"book":"luk","chapter":22,"verse":47,"text":"While He was still speaking, look, a crowd, and the one called Judas, one of the Twelve, was going before them; and he drew near to Jesus to kiss Him.","status":"source_text","id":"luk-22-47"},{"book":"luk","chapter":22,"verse":48,"text":"Jesus said to Him, “Judas, are you betraying the Son of Man with a kiss?”","status":"source_text","id":"luk-22-48"},{"book":"luk","chapter":22,"verse":49,"text":"And those around Him, seeing what would happen, said, “Lord, shall we strike with the sword?”","status":"source_text","id":"luk-22-49"},{"book":"luk","chapter":22,"verse":50,"text":"And one of them struck the high priest’s servant and cut off his right ear.","status":"source_text","id":"luk-22-50"},{"book":"luk","chapter":22,"verse":51,"text":"But Jesus answered and said, “Allow even this.” And touching his ear, He healed him.","status":"source_text","id":"luk-22-51"},{"book":"luk","chapter":22,"verse":52,"text":"Jesus said to the chief priests, “Temple captains, and elders who came against Him, Have you come out with swords and clubs as against a robber?”","status":"source_text","id":"luk-22-52"},{"book":"luk","chapter":22,"verse":53,"text":"“While I was with you daily in the temple, you did not lay hands on Me. But this is your hour and the authority of darkness.”","status":"source_text","id":"luk-22-53"},{"book":"luk","chapter":22,"verse":54,"text":"They seized Jesus and led Him into the high priest’s house. Peter followed at a distance.","status":"source_text","id":"luk-22-54"},{"book":"luk","chapter":22,"verse":55,"text":"They lit a fire in the middle of the courtyard and sat together. Peter sat among them.","status":"source_text","id":"luk-22-55"},{"book":"luk","chapter":22,"verse":56,"text":"And a certain servant girl, seeing him sitting toward the light and looking intently at him, said, “This one also was with Him.”","status":"source_text","id":"luk-22-56"},{"book":"luk","chapter":22,"verse":57,"text":"But he denied it, saying, “Woman, I do not know Him.”","status":"source_text","id":"luk-22-57"},{"book":"luk","chapter":22,"verse":58,"text":"And after a little while another saw him and said, “You also are one of them.” But Peter said, “Man, I am not.”","status":"source_text","id":"luk-22-58"},{"book":"luk","chapter":22,"verse":59,"text":"And after about one hour, another was insisting, saying, “Certainly this one also was with Him, for he is also a Galilean.”","status":"source_text","id":"luk-22-59"},{"book":"luk","chapter":22,"verse":60,"text":"But Peter said, “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.","status":"source_text","id":"luk-22-60"},{"book":"luk","chapter":22,"verse":61,"text":"And the Lord turned and looked at Peter; and Peter remembered the word of the Lord, how He had said to him, “Before a rooster crows today, you will deny Me three times.”","status":"source_text","id":"luk-22-61"},{"book":"luk","chapter":22,"verse":62,"text":"And he went out and wept bitterly.","status":"source_text","id":"luk-22-62"},{"book":"luk","chapter":22,"verse":63,"text":"And the men holding Jesus mocked Him and beat Him.","status":"source_text","id":"luk-22-63"},{"book":"luk","chapter":22,"verse":64,"text":"And they blindfolded Him and asked, “Prophesy! Who struck You?”","status":"source_text","id":"luk-22-64"},{"book":"luk","chapter":22,"verse":65,"text":"And they spoke many other blasphemous things against Him.","status":"source_text","id":"luk-22-65"},{"book":"luk","chapter":22,"verse":66,"text":"And when day came, the council of the people, chief priests, and scribes assembled. They brought Jesus into their council.","status":"source_text","id":"luk-22-66"},{"book":"luk","chapter":22,"verse":67,"text":"saying, “If You are the Christ, tell us.” But He said to them, “If I tell You, You will certainly not believe,”","status":"source_text","id":"luk-22-67"},{"book":"luk","chapter":22,"verse":68,"text":"“If I ask, you will not answer.”","status":"source_text","id":"luk-22-68"},{"book":"luk","chapter":22,"verse":69,"text":"“But from now on the Son of Man will sit at the right hand of the power of God.”","status":"source_text","id":"luk-22-69"},{"book":"luk","chapter":22,"verse":70,"text":"And they all said, “Are You then the Son of God?” And He said to them, “You say that I am.”","status":"source_text","id":"luk-22-70"},{"book":"luk","chapter":22,"verse":71,"text":"And they said, “What further need do we have of testimony? For we ourselves heard it from His mouth.”","status":"source_text","id":"luk-22-71"},{"book":"luk","chapter":23,"verse":1,"text":"And the whole assembly rose and led Jesus to Pilate.","status":"source_text","id":"luk-23-1"},{"book":"luk","chapter":23,"verse":2,"text":"And they began to accuse Him, saying, “We found this Man misleading our nation and forbidding tribute to be given to Caesar, and saying that He Himself is Christ, a king.”","status":"source_text","id":"luk-23-2"},{"book":"luk","chapter":23,"verse":3,"text":"And Pilate asked Him, saying, “Are You the King of the Jews?” And He answered him and said, “You say so.”","status":"source_text","id":"luk-23-3"},{"book":"luk","chapter":23,"verse":4,"text":"Pilate said to the chief priests and crowds, “I find no basis for a charge against this man.”","status":"source_text","id":"luk-23-4"},{"book":"luk","chapter":23,"verse":5,"text":"But they were insisting, saying, “He stirs up the people, teaching throughout all Judea, and beginning from Galilee as far as here.”","status":"source_text","id":"luk-23-5"},{"book":"luk","chapter":23,"verse":6,"text":"When Pilate heard this, he asked whether the man was a Galilean.","status":"source_text","id":"luk-23-6"},{"book":"luk","chapter":23,"verse":7,"text":"And learning that He was under Herod’s authority, he sent Him to Herod, who himself was also in Jerusalem in those days.","status":"source_text","id":"luk-23-7"},{"book":"luk","chapter":23,"verse":8,"text":"And Herod, seeing Jesus, was very glad, for he had wished for a considerable time to see Him because he had heard about Him, and he hoped to see some sign done by Him.","status":"source_text","id":"luk-23-8"},{"book":"luk","chapter":23,"verse":9,"text":"And he questioned Him with many words, but He answered him nothing.","status":"source_text","id":"luk-23-9"},{"book":"luk","chapter":23,"verse":10,"text":"The chief priests and scribes stood there, accusing Him vehemently.","status":"source_text","id":"luk-23-10"},{"book":"luk","chapter":23,"verse":11,"text":"And Herod with his soldiers treated Him with contempt and mocked Him, and dressing Him in a splendid robe, sent Him back to Pilate.","status":"source_text","id":"luk-23-11"},{"book":"luk","chapter":23,"verse":12,"text":"That same day Herod and Pilate became friends, for before this they had been enemies.","status":"source_text","id":"luk-23-12"},{"book":"luk","chapter":23,"verse":13,"text":"Pilate called together the chief priests, rulers, and people.","status":"source_text","id":"luk-23-13"},{"book":"luk","chapter":23,"verse":14,"text":"and said to them, “You brought this Man to me as One turning the people away, and look, I examined Him before you and found in this Man no guilt concerning the charges you bring against Him.”","status":"source_text","id":"luk-23-14"},{"book":"luk","chapter":23,"verse":15,"text":"“But neither did Herod, for he sent Him back to us; and look, nothing worthy of death has been done by Him.”","status":"source_text","id":"luk-23-15"},{"book":"luk","chapter":23,"verse":16,"text":"“So I will punish Him and release Him.”","status":"source_text","id":"luk-23-16"},{"book":"luk","chapter":23,"verse":18,"text":"“But they all cried out together, Away with this man! Release Barabbas for us!”","status":"source_text","id":"luk-23-18"},{"book":"luk","chapter":23,"verse":19,"text":"Barabbas had been imprisoned for an uprising in the city and for murder.","status":"source_text","id":"luk-23-19"},{"book":"luk","chapter":23,"verse":20,"text":"Pilate addressed them again, wanting to release Jesus.","status":"source_text","id":"luk-23-20"},{"book":"luk","chapter":23,"verse":21,"text":"But they kept shouting, saying, “Crucify Him! Crucify Him!”","status":"source_text","id":"luk-23-21"},{"book":"luk","chapter":23,"verse":22,"text":"And he said to them a third time, “For what evil did this Man do? I found no guilt deserving death in Him; therefore I will punish Him and release Him.”","status":"source_text","id":"luk-23-22"},{"book":"luk","chapter":23,"verse":23,"text":"But they were pressing with loud voices, demanding that He be crucified, and their voices prevailed.","status":"source_text","id":"luk-23-23"},{"book":"luk","chapter":23,"verse":24,"text":"And Pilate decided to grant their demand.","status":"source_text","id":"luk-23-24"},{"book":"luk","chapter":23,"verse":25,"text":"He released the man imprisoned for insurrection and murder, whom they requested, and handed Jesus over to their will.","status":"source_text","id":"luk-23-25"},{"book":"luk","chapter":23,"verse":26,"text":"And as they led Jesus away, they seized Simon of Cyrene, coming from the country, and laid the cross on him to carry behind Jesus.","status":"source_text","id":"luk-23-26"},{"book":"luk","chapter":23,"verse":27,"text":"And a great multitude of the people was following Him, and women who were beating their breasts and lamenting Him.","status":"source_text","id":"luk-23-27"},{"book":"luk","chapter":23,"verse":28,"text":"Jesus turned to the women and said, “Daughters of Jerusalem, do not weep for Me. Weep for yourselves and for your children.”","status":"source_text","id":"luk-23-28"},{"book":"luk","chapter":23,"verse":29,"text":"“Look, days are coming when people will say that barren women and wombs that never bore and breasts that never nursed are blessed.”","status":"source_text","id":"luk-23-29"},{"book":"luk","chapter":23,"verse":30,"text":"“Then they will begin to say to the mountains, Fall on us, and to the hills, Cover us.”","status":"source_text","id":"luk-23-30"},{"book":"luk","chapter":23,"verse":31,"text":"“For if they do these things to green wood, what will happen to dry wood?”","status":"source_text","id":"luk-23-31"},{"book":"luk","chapter":23,"verse":32,"text":"Two others, criminals, were also led away with Him to be executed.","status":"source_text","id":"luk-23-32"},{"book":"luk","chapter":23,"verse":33,"text":"And they came to the place called Skull. There they crucified Jesus and the criminals, one on His right and the other on His left.","status":"source_text","id":"luk-23-33"},{"book":"luk","chapter":23,"verse":34,"text":"But Jesus was saying, “Father, forgive them, for they do not know what they are doing.” And dividing His garments, they cast lots.","status":"source_text","id":"luk-23-34"},{"book":"luk","chapter":23,"verse":35,"text":"And the people stood watching; but the rulers also scoffed, saying, “He saved others; let Him save Himself, if this is the Christ of God, the Chosen One.”","status":"source_text","id":"luk-23-35"},{"book":"luk","chapter":23,"verse":36,"text":"And the soldiers also mocked Him, coming up and offering Him sour wine,","status":"source_text","id":"luk-23-36"},{"book":"luk","chapter":23,"verse":37,"text":"And they said, “If You are the king of the Jews, save Yourself.”","status":"source_text","id":"luk-23-37"},{"book":"luk","chapter":23,"verse":38,"text":"And there was also an inscription over Him, “This is the King of the Jews.”","status":"source_text","id":"luk-23-38"},{"book":"luk","chapter":23,"verse":39,"text":"One of the criminals hanging there insulted Him, saying, “Are You not the Christ? Save Yourself and us.”","status":"source_text","id":"luk-23-39"},{"book":"luk","chapter":23,"verse":40,"text":"But the other answered and rebuked him, saying, “Do you not even fear God, since you are under the same judgment?”","status":"source_text","id":"luk-23-40"},{"book":"luk","chapter":23,"verse":41,"text":"“And we indeed justly, for we receive what our deeds deserve; but this Man did nothing wrong.”","status":"source_text","id":"luk-23-41"},{"book":"luk","chapter":23,"verse":42,"text":"And he said, “Jesus, remember me when You come into Your kingdom.”","status":"source_text","id":"luk-23-42"},{"book":"luk","chapter":23,"verse":43,"text":"And He said to him, “Truly I tell you, today you will be with Me in Paradise.”","status":"source_text","id":"luk-23-43"},{"book":"luk","chapter":23,"verse":44,"text":"And it was already about the sixth hour. Darkness came over the whole land until the ninth hour.","status":"source_text","id":"luk-23-44"},{"book":"luk","chapter":23,"verse":45,"text":"The sun's light failed, and the temple curtain was torn down the middle.","status":"source_text","id":"luk-23-45"},{"book":"luk","chapter":23,"verse":46,"text":"And Jesus cried out with a loud voice and said, “Father, into Your hands I entrust My spirit.” And having said this, He breathed His last.","status":"source_text","id":"luk-23-46"},{"book":"luk","chapter":23,"verse":47,"text":"The centurion saw what had happened and glorified God, saying, “Truly this man was righteous.”","status":"source_text","id":"luk-23-47"},{"book":"luk","chapter":23,"verse":48,"text":"And all the crowds who had gathered for this spectacle saw what had happened. They went away beating their breasts.","status":"source_text","id":"luk-23-48"},{"book":"luk","chapter":23,"verse":49,"text":"Those who knew Him stood at a distance. The women who had followed Him from Galilee also watched these things.","status":"source_text","id":"luk-23-49"},{"book":"luk","chapter":23,"verse":50,"text":"And there was a council member named Joseph. He was a good and righteous man.","status":"source_text","id":"luk-23-50"},{"book":"luk","chapter":23,"verse":51,"text":"He had not agreed to their plan and deed. He was from Arimathea, a town of the Jews, and was waiting for the kingdom of God.","status":"source_text","id":"luk-23-51"},{"book":"luk","chapter":23,"verse":52,"text":"He went to Pilate and asked for Jesus’ body.","status":"source_text","id":"luk-23-52"},{"book":"luk","chapter":23,"verse":53,"text":"And taking it down, he wrapped it in linen and laid Him in a tomb cut in rock, where no one had yet been laid.","status":"source_text","id":"luk-23-53"},{"book":"luk","chapter":23,"verse":54,"text":"And it was the day of Preparation, and the Sabbath was beginning.","status":"source_text","id":"luk-23-54"},{"book":"luk","chapter":23,"verse":55,"text":"The women who had come with Him from Galilee followed and saw the tomb and how His body was laid.","status":"source_text","id":"luk-23-55"},{"book":"luk","chapter":23,"verse":56,"text":"They returned and prepared spices and perfumes. On the Sabbath they rested according to the commandment.","status":"source_text","id":"luk-23-56"},{"book":"luk","chapter":24,"verse":1,"text":"On the first day of the week, very early at dawn, the women came to the tomb bringing the spices they had prepared.","status":"source_text","id":"luk-24-1"},{"book":"luk","chapter":24,"verse":2,"text":"They found the stone rolled away from the tomb.","status":"source_text","id":"luk-24-2"},{"book":"luk","chapter":24,"verse":3,"text":"They entered but did not find the body.","status":"source_text","id":"luk-24-3"},{"book":"luk","chapter":24,"verse":4,"text":"And while they were perplexed about this, two men stood by them in dazzling clothes.","status":"source_text","id":"luk-24-4"},{"book":"luk","chapter":24,"verse":5,"text":"And when they became afraid and bowed their faces to the ground, they said to them, “Why do you seek the living One among the dead?”","status":"source_text","id":"luk-24-5"},{"book":"luk","chapter":24,"verse":6,"text":"“He is not here, but was raised. Remember how He spoke to you while He was still in Galilee,”","status":"source_text","id":"luk-24-6"},{"book":"luk","chapter":24,"verse":7,"text":"“saying that the Son of Man must be handed over into the hands of sinful men and be crucified, and on the third day rise.”","status":"source_text","id":"luk-24-7"},{"book":"luk","chapter":24,"verse":8,"text":"And the women remembered His words.","status":"source_text","id":"luk-24-8"},{"book":"luk","chapter":24,"verse":9,"text":"And they returned from the tomb and told all these things to the Eleven and everyone else.","status":"source_text","id":"luk-24-9"},{"book":"luk","chapter":24,"verse":10,"text":"They were Mary Magdalene, Joanna, Mary the mother of James, and the other women with them. They told these things to the apostles.","status":"source_text","id":"luk-24-10"},{"book":"luk","chapter":24,"verse":11,"text":"But these words seemed to them like nonsense, and they did not believe the women.","status":"source_text","id":"luk-24-11"},{"book":"luk","chapter":24,"verse":12,"text":"But Peter rose and ran to the tomb, and stooping down, he sees the linen cloths alone; and he went away to his own place, marveling at what had happened.","status":"source_text","id":"luk-24-12"},{"book":"luk","chapter":24,"verse":13,"text":"And that same day two of them were going to a village about sixty stadia from Jerusalem. Its name was Emmaus.","status":"source_text","id":"luk-24-13"},{"book":"luk","chapter":24,"verse":14,"text":"And they were talking with one another about all that had happened.","status":"source_text","id":"luk-24-14"},{"book":"luk","chapter":24,"verse":15,"text":"And it happened, while they were talking and discussing, that Jesus Himself drew near and was walking with them.","status":"source_text","id":"luk-24-15"},{"book":"luk","chapter":24,"verse":16,"text":"Their eyes were kept from recognizing Him.","status":"source_text","id":"luk-24-16"},{"book":"luk","chapter":24,"verse":17,"text":"He asked them, “What are these words you are exchanging as you walk? They stopped, looking sad.”","status":"source_text","id":"luk-24-17"},{"book":"luk","chapter":24,"verse":18,"text":"And one named Cleopas answered and said to Him, “Are You the only visitor to Jerusalem who does not know the things that happened in it in these days?”","status":"source_text","id":"luk-24-18"},{"book":"luk","chapter":24,"verse":19,"text":"And He said to them, “What things?” And they said to Him, “The things concerning Jesus of Nazareth, who became a prophet mighty in deed and word before God and all the people,”","status":"source_text","id":"luk-24-19"},{"book":"luk","chapter":24,"verse":20,"text":"“Our chief priests and rulers handed Him over for a death sentence and crucified Him.”","status":"source_text","id":"luk-24-20"},{"book":"luk","chapter":24,"verse":21,"text":"“but we were hoping that He was the One about to redeem Israel. And indeed, besides all these things, this is the third day since these things happened.”","status":"source_text","id":"luk-24-21"},{"book":"luk","chapter":24,"verse":22,"text":"“Some women from our group amazed us. They went to the tomb early in the morning.”","status":"source_text","id":"luk-24-22"},{"book":"luk","chapter":24,"verse":23,"text":"“And they did not find His body and came back. They said they had seen a vision of angels who said He was alive.”","status":"source_text","id":"luk-24-23"},{"book":"luk","chapter":24,"verse":24,"text":"Some of those with us went to the tomb and found it as the women had said, “But did not see Him.”","status":"source_text","id":"luk-24-24"},{"book":"luk","chapter":24,"verse":25,"text":"And He said to them, “Foolish ones, slow of heart to believe all that the prophets spoke!”","status":"source_text","id":"luk-24-25"},{"book":"luk","chapter":24,"verse":26,"text":"“Was it not necessary for the Christ to suffer these things and enter into His glory?”","status":"source_text","id":"luk-24-26"},{"book":"luk","chapter":24,"verse":27,"text":"And beginning with Moses and all the prophets, He explained to them the things about Himself in all the Scriptures.","status":"source_text","id":"luk-24-27"},{"book":"luk","chapter":24,"verse":28,"text":"And they approached the village to which they were going. He acted as though He were going farther.","status":"source_text","id":"luk-24-28"},{"book":"luk","chapter":24,"verse":29,"text":"And they urged Him strongly, saying, “Stay with us, because it is toward evening and the day has already declined.” And He went in to stay with them.","status":"source_text","id":"luk-24-29"},{"book":"luk","chapter":24,"verse":30,"text":"And when He reclined at table with them, He took the bread and blessed it, broke it and gave it to them.","status":"source_text","id":"luk-24-30"},{"book":"luk","chapter":24,"verse":31,"text":"And their eyes were opened, and they recognized Him; and He became invisible to them.","status":"source_text","id":"luk-24-31"},{"book":"luk","chapter":24,"verse":32,"text":"And they said to one another, “Was not our heart burning within us while He was speaking to us on the road, while He was opening the Scriptures to us?”","status":"source_text","id":"luk-24-32"},{"book":"luk","chapter":24,"verse":33,"text":"And rising that very hour, they returned to Jerusalem and found the Eleven gathered, and those with them,","status":"source_text","id":"luk-24-33"},{"book":"luk","chapter":24,"verse":34,"text":"saying, “The Lord was truly raised and appeared to Simon.”","status":"source_text","id":"luk-24-34"},{"book":"luk","chapter":24,"verse":35,"text":"And the two told what had happened on the road and how He became known to them in the breaking of bread.","status":"source_text","id":"luk-24-35"},{"book":"luk","chapter":24,"verse":36,"text":"But while they were saying these things, He Himself stood in their midst.","status":"source_text","id":"luk-24-36"},{"book":"luk","chapter":24,"verse":37,"text":"They were startled and afraid, thinking they were seeing a spirit.","status":"source_text","id":"luk-24-37"},{"book":"luk","chapter":24,"verse":38,"text":"And He said to them, “Why are you troubled? Why do doubts arise in your hearts?”","status":"source_text","id":"luk-24-38"},{"book":"luk","chapter":24,"verse":39,"text":"“Look at My hands and feet; it is I Myself. Touch Me and see. A spirit does not have flesh and bones as you see I have.”","status":"source_text","id":"luk-24-39"},{"book":"luk","chapter":24,"verse":40,"text":"And after saying this, He showed them His hands and feet.","status":"source_text","id":"luk-24-40"},{"book":"luk","chapter":24,"verse":41,"text":"But while they still disbelieved for joy and were marveling, He said to them, “Do you have anything edible here?”","status":"source_text","id":"luk-24-41"},{"book":"luk","chapter":24,"verse":42,"text":"They gave Him a piece of broiled fish.","status":"source_text","id":"luk-24-42"},{"book":"luk","chapter":24,"verse":43,"text":"And He took it and ate before them.","status":"source_text","id":"luk-24-43"},{"book":"luk","chapter":24,"verse":44,"text":"And He said to them, “These are My words that I spoke to you while I was still with you, that all the things written about Me in the law of Moses and the prophets and Psalms must be fulfilled.”","status":"source_text","id":"luk-24-44"},{"book":"luk","chapter":24,"verse":45,"text":"Then He opened their mind to understand the Scriptures.","status":"source_text","id":"luk-24-45"},{"book":"luk","chapter":24,"verse":46,"text":"And He said to them, “Thus it is written, for the Christ to suffer and to rise from the dead on the third day,”","status":"source_text","id":"luk-24-46"},{"book":"luk","chapter":24,"verse":47,"text":"“and for repentance and forgiveness of sins to be proclaimed in His name to all the nations, beginning from Jerusalem.”","status":"source_text","id":"luk-24-47"},{"book":"luk","chapter":24,"verse":48,"text":"“You are witnesses of these things.”","status":"source_text","id":"luk-24-48"},{"book":"luk","chapter":24,"verse":49,"text":"“And look, I send My Father's promise upon you. Stay in the city until you are clothed with power from on high.”","status":"source_text","id":"luk-24-49"},{"book":"luk","chapter":24,"verse":50,"text":"And He led them out as far as Bethany, and lifting up His hands, He blessed them.","status":"source_text","id":"luk-24-50"},{"book":"luk","chapter":24,"verse":51,"text":"And while He was blessing them, He parted from them and was carried up into heaven.","status":"source_text","id":"luk-24-51"},{"book":"luk","chapter":24,"verse":52,"text":"And after worshiping Him, they returned to Jerusalem with great joy.","status":"source_text","id":"luk-24-52"},{"book":"luk","chapter":24,"verse":53,"text":"And they were continually in the temple blessing God.","status":"source_text","id":"luk-24-53"}],"source":"SBLGNT, Michael W. Holmes, ed.; Greek text retained from the project’s Luke 1–24 study file.","edition":"Our English Bible Luke 1–24 · 2026-10-05","omittedVerseNumbers":["17:36","23:17"]}]</script>
<script id="reader-ui">const DATA=JSON.parse(document.getElementById('bible-data').textContent);
const $=id=>document.getElementById(id);let bi=0,ch=1,serial=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('book').innerHTML=DATA.map((b,i)=>`<option value="${i}">${esc(b.name)}</option>`).join('');
function stop(){serial++;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent='';}
function verseOptions(){const rows=DATA[bi].verses.filter(v=>v.chapter===ch);$('verse').innerHTML='<option value="0">Verse</option>'+rows.map(v=>`<option value="${v.verse}">${v.verse}</option>`).join('');}
function chapters(){const b=DATA[bi];$('chapter').innerHTML=Array.from({length:b.chapters},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');$('chapter').value=String(ch);verseOptions();}
function render(writeHash=true){stop();const b=DATA[bi];$('book').value=String(bi);$('chapter').value=String(ch);verseOptions();$('bookTitle').textContent=b.name;$('chapterTitle').textContent='Chapter '+ch;let out='';for(const r of b.verses.filter(v=>v.chapter===ch)){if(b.key==='mrk'&&ch===16&&r.verse===9)out+='<p class="section-note">Longer ending · Mark 16:9–20</p>';out+=`<p class="v" id="${r.id}"><span class="num">${r.verse}</span><span class="txt">${esc(r.text)}</span></p>`;}$('verses').innerHTML=out;$('prevBottom').disabled=bi===0&&ch===1;$('nextBottom').disabled=bi===DATA.length-1&&ch===b.chapters;document.title=b.name+' '+ch+' · Our English Bible';if(writeHash)history.replaceState(null,'','#'+b.key+'-'+ch);}
function move(d){if(d<0&&bi===0&&ch===1)return;if(d>0&&bi===DATA.length-1&&ch===DATA[bi].chapters)return;ch+=d;if(ch<1){bi--;ch=DATA[bi].chapters;}else if(ch>DATA[bi].chapters){bi++;ch=1;}chapters();render();scrollTo(0,0);}
$('book').onchange=()=>{bi=Number($('book').value);ch=1;chapters();render();scrollTo(0,0)};$('chapter').onchange=()=>{ch=Number($('chapter').value);render();scrollTo(0,0)};$('verse').onchange=()=>{document.querySelectorAll('.target').forEach(n=>n.classList.remove('target'));const n=Number($('verse').value);if(!n)return;const p=$(DATA[bi].key+'-'+ch+'-'+n);if(p){p.classList.add('target');p.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+p.id);}};
$('prevBottom').onclick=()=>move(-1);$('nextBottom').onclick=()=>move(1);let size=23;function setSize(d){size=Math.min(32,Math.max(18,size+d));document.documentElement.style.setProperty('--size',size+'px')}$('smaller').onclick=()=>setSize(-1);$('larger').onclick=()=>setSize(1);
$('menuToggle').onclick=()=>{document.body.classList.toggle('menu-collapsed');$('menuToggle').textContent=document.body.classList.contains('menu-collapsed')?'▾ Open':'▴ Fold'};$('reading').onclick=()=>document.body.classList.add('reading-mode');$('exitReading').onclick=()=>document.body.classList.remove('reading-mode');
$('stop').onclick=stop;$('listen').onclick=()=>{stop();if(!('speechSynthesis' in window)){$('status').textContent='English speech is unavailable in this browser.';return;}const token=serial,rows=DATA[bi].verses.filter(v=>v.chapter===ch),go=(i=0)=>{if(token!==serial||i>=rows.length)return;const u=new SpeechSynthesisUtterance(rows[i].text);u.lang='en-US';u.rate=.9;u.onend=()=>go(i+1);u.onerror=e=>{if(token===serial&&!['canceled','interrupted'].includes(e.error))$('status').textContent='English listening stopped: '+e.error;};speechSynthesis.speak(u)};go()};
function hash(){const m=location.hash.match(/^#([a-z0-9]+)-(\d+)(?:-(\d+))?$/);if(!m)return false;const i=DATA.findIndex(b=>b.key===m[1]),c=Number(m[2]);if(i<0||c<1||c>DATA[i].chapters)return false;bi=i;ch=c;chapters();render(false);if(m[3]){$('verse').value=m[3];$('verse').onchange()}return true}window.addEventListener('hashchange',hash);if(!hash()){chapters();render()}window.addEventListener('beforeunload',stop);
</script></body></html>
