</style></head><body><header><p>GREEK-BASED TRANSLATION</p><h1>Our English Bible</h1><small>Matthew · Mark</small></header><nav class="toolbar"><div class="controls"><button id="menuToggle" class="menu-toggle">▴ Fold</button><label><span>Book</span><select id="book"></select></label><label><span>Chapter</span><select id="chapter"></select></label><select id="verse"></select><span class="spacer"></span><button id="reading" class="reading-toggle">Text only</button><button id="smaller" class="optional">A−</button><button id="larger" class="optional">A+</button><button id="listen" class="optional audio">▶ Listen</button><button id="stop" class="optional audio">■</button></div><div id="status" class="optional"></div></nav><main><h2 id="bookTitle"></h2><h3 id="chapterTitle"></h3><article class="verses" id="verses"></article><div id="bottom"><button id="prevBottom">← Previous chapter</button><button id="nextBottom">Next chapter →</button></div></main><button id="exitReading" class="exit-reading">Show menu</button><footer>Our English Bible · Greek-based Translation · Matthew + Mark · 2026-10-05</footer><script>const DATA=[{"key":"mat","name":"Matthew","nameKo":"마태복음","chapters":28,"counts":[25,23,17,25,48,34,29,34,38,42,30,50,58,36,39,28,27,35,30,34,46,46,39,51,46,75,66,20],"verses":[{"book":"mat","chapter":1,"verse":1,"text":"The book of the genealogy of Jesus Christ, son of David, son of Abraham.","status":"source_text","id":"mat-1-1"},{"book":"mat","chapter":1,"verse":2,"text":"Abraham fathered Isaac, Isaac fathered Jacob, and Jacob fathered Judah and his brothers.","status":"source_text","id":"mat-1-2"},{"book":"mat","chapter":1,"verse":3,"text":"Judah fathered Perez and Zerah by Tamar, Perez fathered Hezron, and Hezron fathered Aram.","status":"source_text","id":"mat-1-3"},{"book":"mat","chapter":1,"verse":4,"text":"Aram fathered Amminadab, Amminadab fathered Nahshon, and Nahshon fathered Salmon.","status":"source_text","id":"mat-1-4"},{"book":"mat","chapter":1,"verse":5,"text":"Salmon fathered Boaz by Rahab, Boaz fathered Obed by Ruth, and Obed fathered Jesse.","status":"source_text","id":"mat-1-5"},{"book":"mat","chapter":1,"verse":6,"text":"Jesse fathered David the king. David fathered Solomon by the wife of Uriah.","status":"source_text","id":"mat-1-6"},{"book":"mat","chapter":1,"verse":7,"text":"Solomon fathered Rehoboam, Rehoboam fathered Abijah, and Abijah fathered Asaph.","status":"source_text","id":"mat-1-7"},{"book":"mat","chapter":1,"verse":8,"text":"Asaph fathered Jehoshaphat, Jehoshaphat fathered Joram, and Joram fathered Uzziah.","status":"source_text","id":"mat-1-8"},{"book":"mat","chapter":1,"verse":9,"text":"Uzziah fathered Jotham, Jotham fathered Ahaz, and Ahaz fathered Hezekiah.","status":"source_text","id":"mat-1-9"},{"book":"mat","chapter":1,"verse":10,"text":"Hezekiah fathered Manasseh, Manasseh fathered Amos, and Amos fathered Josiah.","status":"source_text","id":"mat-1-10"},{"book":"mat","chapter":1,"verse":11,"text":"Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon.","status":"source_text","id":"mat-1-11"},{"book":"mat","chapter":1,"verse":12,"text":"After the deportation to Babylon, Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.","status":"source_text","id":"mat-1-12"},{"book":"mat","chapter":1,"verse":13,"text":"Zerubbabel fathered Abiud, Abiud fathered Eliakim, and Eliakim fathered Azor.","status":"source_text","id":"mat-1-13"},{"book":"mat","chapter":1,"verse":14,"text":"Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.","status":"source_text","id":"mat-1-14"},{"book":"mat","chapter":1,"verse":15,"text":"Eliud fathered Eleazar, Eleazar fathered Matthan, and Matthan fathered Jacob.","status":"source_text","id":"mat-1-15"},{"book":"mat","chapter":1,"verse":16,"text":"Jacob fathered Joseph, the husband of Mary, from whom Jesus was born, who is called Christ.","status":"source_text","id":"mat-1-16"},{"book":"mat","chapter":1,"verse":17,"text":"So all the generations from Abraham to David were fourteen generations, from David to the deportation to Babylon fourteen generations, and from the deportation to Babylon to the Christ fourteen generations.","status":"source_text","id":"mat-1-17"},{"book":"mat","chapter":1,"verse":18,"text":"Now the birth of Jesus Christ happened in this way. When His mother Mary had been betrothed to Joseph, before they came together she was found to be pregnant from the Holy Spirit.","status":"source_text","id":"mat-1-18"},{"book":"mat","chapter":1,"verse":19,"text":"Joseph her husband, being righteous and not wishing to expose her publicly, intended to divorce her quietly.","status":"source_text","id":"mat-1-19"},{"book":"mat","chapter":1,"verse":20,"text":"But while he was considering these things, look, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.","status":"source_text","id":"mat-1-20"},{"book":"mat","chapter":1,"verse":21,"text":"She will bear a son, and you shall call His name Jesus, for He will save His people from their sins.”","status":"source_text","id":"mat-1-21"},{"book":"mat","chapter":1,"verse":22,"text":"Now all this happened so that what was spoken by the Lord through the prophet might be fulfilled:","status":"source_text","id":"mat-1-22"},{"book":"mat","chapter":1,"verse":23,"text":"“Look, the virgin will conceive and bear a son, and they will call His name Immanuel,” which translated means, “God with us.”","status":"source_text","id":"mat-1-23"},{"book":"mat","chapter":1,"verse":24,"text":"Then Joseph, having awakened from sleep, did as the angel of the Lord commanded him and took his wife.","status":"source_text","id":"mat-1-24"},{"book":"mat","chapter":1,"verse":25,"text":"But he did not know her until she had borne a son, and he called His name Jesus.","status":"source_text","id":"mat-1-25"},{"book":"mat","chapter":2,"verse":1,"text":"Now after Jesus was born in Bethlehem of Judea in the days of Herod the king, look, magi from the east arrived in Jerusalem,","status":"source_text","id":"mat-2-1"},{"book":"mat","chapter":2,"verse":2,"text":"saying, “Where is the One who has been born King of the Jews? For we saw His star in the east and have come to worship Him.”","status":"source_text","id":"mat-2-2"},{"book":"mat","chapter":2,"verse":3,"text":"When Herod the king heard this, he was troubled, and all Jerusalem with him.","status":"source_text","id":"mat-2-3"},{"book":"mat","chapter":2,"verse":4,"text":"And gathering all the chief priests and scribes of the people, he inquired of them where the Christ was to be born.","status":"source_text","id":"mat-2-4"},{"book":"mat","chapter":2,"verse":5,"text":"They said to him, “In Bethlehem of Judea, for so it has been written through the prophet:","status":"source_text","id":"mat-2-5"},{"book":"mat","chapter":2,"verse":6,"text":"‘And you, Bethlehem, land of Judah, are by no means least among the rulers of Judah; for from you will come a Ruler who will shepherd My people Israel.’”","status":"source_text","id":"mat-2-6"},{"book":"mat","chapter":2,"verse":7,"text":"Then Herod secretly called the magi and determined from them precisely the time when the star appeared.","status":"source_text","id":"mat-2-7"},{"book":"mat","chapter":2,"verse":8,"text":"And sending them to Bethlehem, he said, “Go and search carefully for the child, and when you have found Him, report to me, so that I too may go and worship Him.”","status":"source_text","id":"mat-2-8"},{"book":"mat","chapter":2,"verse":9,"text":"After hearing the king, they went their way. And look, the star that they had seen in the east went before them until it came and stood over the place where the child was.","status":"source_text","id":"mat-2-9"},{"book":"mat","chapter":2,"verse":10,"text":"When they saw the star, they rejoiced with exceedingly great joy.","status":"source_text","id":"mat-2-10"},{"book":"mat","chapter":2,"verse":11,"text":"And entering the house, they saw the child with Mary His mother, and falling down they worshiped Him. Then opening their treasures, they offered Him gifts: gold, frankincense, and myrrh.","status":"source_text","id":"mat-2-11"},{"book":"mat","chapter":2,"verse":12,"text":"And having been warned by God in a dream not to return to Herod, they withdrew to their own country by another way.","status":"source_text","id":"mat-2-12"},{"book":"mat","chapter":2,"verse":13,"text":"After they had withdrawn, look, an angel of the Lord appeared to Joseph in a dream, saying, “Rise, take the child and His mother, flee to Egypt, and remain there until I tell you, for Herod is about to seek the child to destroy Him.”","status":"source_text","id":"mat-2-13"},{"book":"mat","chapter":2,"verse":14,"text":"So he rose and took the child and His mother by night and withdrew to Egypt,","status":"source_text","id":"mat-2-14"},{"book":"mat","chapter":2,"verse":15,"text":"and remained there until the death of Herod, so that what was spoken by the Lord through the prophet might be fulfilled: “Out of Egypt I called My Son.”","status":"source_text","id":"mat-2-15"},{"book":"mat","chapter":2,"verse":16,"text":"Then Herod, seeing that he had been deceived by the magi, became exceedingly enraged, and he sent and killed all the boys in Bethlehem and in all its surrounding region who were two years old and under, according to the time that he had precisely determined from the magi.","status":"source_text","id":"mat-2-16"},{"book":"mat","chapter":2,"verse":17,"text":"Then what was spoken through Jeremiah the prophet was fulfilled:","status":"source_text","id":"mat-2-17"},{"book":"mat","chapter":2,"verse":18,"text":"“A voice was heard in Ramah, weeping and great mourning: Rachel weeping for her children, and she refused to be comforted, because they are no more.”","status":"source_text","id":"mat-2-18"},{"book":"mat","chapter":2,"verse":19,"text":"But after Herod died, look, an angel of the Lord appeared in a dream to Joseph in Egypt,","status":"source_text","id":"mat-2-19"},{"book":"mat","chapter":2,"verse":20,"text":"saying, “Rise, take the child and His mother, and go to the land of Israel, for those who were seeking the child’s life are dead.”","status":"source_text","id":"mat-2-20"},{"book":"mat","chapter":2,"verse":21,"text":"So he rose, took the child and His mother, and entered the land of Israel.","status":"source_text","id":"mat-2-21"},{"book":"mat","chapter":2,"verse":22,"text":"But hearing that Archelaus was reigning over Judea in place of his father Herod, he was afraid to go there. And having been warned by God in a dream, he withdrew to the region of Galilee.","status":"source_text","id":"mat-2-22"},{"book":"mat","chapter":2,"verse":23,"text":"And he came and settled in a town called Nazareth, so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”","status":"source_text","id":"mat-2-23"},{"book":"mat","chapter":3,"verse":1,"text":"In those days John the Baptist came, proclaiming in the wilderness of Judea","status":"source_text","id":"mat-3-1"},{"book":"mat","chapter":3,"verse":2,"text":"and saying, “Repent, for the kingdom of the heavens has drawn near.”","status":"source_text","id":"mat-3-2"},{"book":"mat","chapter":3,"verse":3,"text":"For this is the one spoken of through Isaiah the prophet: “A voice of one crying in the wilderness, ‘Prepare the way of the Lord; make His paths straight.’”","status":"source_text","id":"mat-3-3"},{"book":"mat","chapter":3,"verse":4,"text":"Now this John wore clothing of camel’s hair and a leather belt around his waist, and his food was locusts and wild honey.","status":"source_text","id":"mat-3-4"},{"book":"mat","chapter":3,"verse":5,"text":"Then Jerusalem and all Judea and all the region around the Jordan were going out to him,","status":"source_text","id":"mat-3-5"},{"book":"mat","chapter":3,"verse":6,"text":"and they were being baptized by him in the Jordan River, confessing their sins.","status":"source_text","id":"mat-3-6"},{"book":"mat","chapter":3,"verse":7,"text":"But seeing many of the Pharisees and Sadducees coming for baptism, he said to them, “Offspring of vipers, who warned you to flee from the coming wrath?","status":"source_text","id":"mat-3-7"},{"book":"mat","chapter":3,"verse":8,"text":"Therefore produce fruit worthy of repentance.","status":"source_text","id":"mat-3-8"},{"book":"mat","chapter":3,"verse":9,"text":"And do not think to say among yourselves, ‘We have Abraham as our father.’ For I tell you that God is able from these stones to raise up children for Abraham.","status":"source_text","id":"mat-3-9"},{"book":"mat","chapter":3,"verse":10,"text":"Already the axe is laid at the root of the trees. Therefore every tree not producing good fruit is cut down and thrown into the fire.","status":"source_text","id":"mat-3-10"},{"book":"mat","chapter":3,"verse":11,"text":"I baptize you in water for repentance, but the One coming after me is mightier than I, whose sandals I am not worthy to carry. He will baptize you in the Holy Spirit and fire.","status":"source_text","id":"mat-3-11"},{"book":"mat","chapter":3,"verse":12,"text":"His winnowing fork is in His hand, and He will thoroughly cleanse His threshing floor and gather His wheat into the barn, but the chaff He will burn with unquenchable fire.”","status":"source_text","id":"mat-3-12"},{"book":"mat","chapter":3,"verse":13,"text":"Then Jesus came from Galilee to the Jordan, to John, to be baptized by him.","status":"source_text","id":"mat-3-13"},{"book":"mat","chapter":3,"verse":14,"text":"But John tried to prevent Him, saying, “I need to be baptized by You, and do You come to me?”","status":"source_text","id":"mat-3-14"},{"book":"mat","chapter":3,"verse":15,"text":"But Jesus answered and said to him, “Allow it now, for in this way it is fitting for us to fulfill all righteousness.” Then he allowed Him.","status":"source_text","id":"mat-3-15"},{"book":"mat","chapter":3,"verse":16,"text":"And after being baptized, Jesus immediately came up from the water. And look, the heavens were opened to Him, and He saw the Spirit of God descending like a dove and coming upon Him.","status":"source_text","id":"mat-3-16"},{"book":"mat","chapter":3,"verse":17,"text":"And look, a voice from the heavens said, “This is My beloved Son, in whom I am well pleased.”","status":"source_text","id":"mat-3-17"},{"book":"mat","chapter":4,"verse":1,"text":"Then Jesus was led up by the Spirit into the wilderness to be tempted by the devil.","status":"source_text","id":"mat-4-1"},{"book":"mat","chapter":4,"verse":2,"text":"And after fasting forty days and forty nights, He became hungry.","status":"source_text","id":"mat-4-2"},{"book":"mat","chapter":4,"verse":3,"text":"And the tempter came and said to Him, “If You are the Son of God, speak so that these stones may become loaves of bread.”","status":"source_text","id":"mat-4-3"},{"book":"mat","chapter":4,"verse":4,"text":"But He answered and said, “It is written: ‘Man shall not live by bread alone, but by every word that proceeds through the mouth of God.’”","status":"source_text","id":"mat-4-4"},{"book":"mat","chapter":4,"verse":5,"text":"Then the devil took Him into the holy city and set Him on the pinnacle of the temple","status":"source_text","id":"mat-4-5"},{"book":"mat","chapter":4,"verse":6,"text":"and said to Him, “If You are the Son of God, throw Yourself down, for it is written: ‘He will command His angels concerning You,’ and, ‘On their hands they will bear You up, lest You strike Your foot against a stone.’”","status":"source_text","id":"mat-4-6"},{"book":"mat","chapter":4,"verse":7,"text":"Jesus said to him, “Again it is written: ‘You shall not put the Lord your God to the test.’”","status":"source_text","id":"mat-4-7"},{"book":"mat","chapter":4,"verse":8,"text":"Again the devil took Him to a very high mountain and showed Him all the kingdoms of the world and their glory.","status":"source_text","id":"mat-4-8"},{"book":"mat","chapter":4,"verse":9,"text":"And he said to Him, “All these things I will give You if You fall down and worship me.”","status":"source_text","id":"mat-4-9"},{"book":"mat","chapter":4,"verse":10,"text":"Then Jesus said to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and Him alone you shall serve.’”","status":"source_text","id":"mat-4-10"},{"book":"mat","chapter":4,"verse":11,"text":"Then the devil left Him, and look, angels came and ministered to Him.","status":"source_text","id":"mat-4-11"},{"book":"mat","chapter":4,"verse":12,"text":"Now when Jesus heard that John had been handed over, He withdrew into Galilee.","status":"source_text","id":"mat-4-12"},{"book":"mat","chapter":4,"verse":13,"text":"And leaving Nazareth, He came and settled in Capernaum by the sea, in the regions of Zebulun and Naphtali,","status":"source_text","id":"mat-4-13"},{"book":"mat","chapter":4,"verse":14,"text":"so that what was spoken through Isaiah the prophet might be fulfilled:","status":"source_text","id":"mat-4-14"},{"book":"mat","chapter":4,"verse":15,"text":"“Land of Zebulun and land of Naphtali, way of the sea, beyond the Jordan, Galilee of the Gentiles—","status":"source_text","id":"mat-4-15"},{"book":"mat","chapter":4,"verse":16,"text":"the people sitting in darkness saw a great light, and for those sitting in the land and shadow of death, a light arose.”","status":"source_text","id":"mat-4-16"},{"book":"mat","chapter":4,"verse":17,"text":"From that time Jesus began to proclaim and to say, “Repent, for the kingdom of the heavens has drawn near.”","status":"source_text","id":"mat-4-17"},{"book":"mat","chapter":4,"verse":18,"text":"And walking by the Sea of Galilee, He saw two brothers, Simon called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.","status":"source_text","id":"mat-4-18"},{"book":"mat","chapter":4,"verse":19,"text":"And He said to them, “Come after Me, and I will make you fishers of people.”","status":"source_text","id":"mat-4-19"},{"book":"mat","chapter":4,"verse":20,"text":"And immediately they left the nets and followed Him.","status":"source_text","id":"mat-4-20"},{"book":"mat","chapter":4,"verse":21,"text":"And going on from there, He saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and He called them.","status":"source_text","id":"mat-4-21"},{"book":"mat","chapter":4,"verse":22,"text":"And immediately they left the boat and their father and followed Him.","status":"source_text","id":"mat-4-22"},{"book":"mat","chapter":4,"verse":23,"text":"And Jesus went throughout all Galilee, teaching in their synagogues, proclaiming the gospel of the kingdom, and healing every disease and every sickness among the people.","status":"source_text","id":"mat-4-23"},{"book":"mat","chapter":4,"verse":24,"text":"And the report about Him went out into all Syria. And they brought to Him all those who were ill, afflicted with various diseases and pains, those possessed by demons, those having seizures, and paralytics; and He healed them.","status":"source_text","id":"mat-4-24"},{"book":"mat","chapter":4,"verse":25,"text":"And great crowds followed Him from Galilee and Decapolis and Jerusalem and Judea and from beyond the Jordan.","status":"source_text","id":"mat-4-25"},{"book":"mat","chapter":5,"verse":1,"text":"And seeing the crowds, He went up on the mountain; and when He sat down, His disciples came to Him.","status":"source_text","id":"mat-5-1"},{"book":"mat","chapter":5,"verse":2,"text":"And opening His mouth, He taught them, saying:","status":"source_text","id":"mat-5-2"},{"book":"mat","chapter":5,"verse":3,"text":"“Blessed are the poor in spirit, for theirs is the kingdom of the heavens.","status":"source_text","id":"mat-5-3"},{"book":"mat","chapter":5,"verse":4,"text":"Blessed are those who mourn, for they will be comforted.","status":"source_text","id":"mat-5-4"},{"book":"mat","chapter":5,"verse":5,"text":"Blessed are the meek, for they will inherit the earth.","status":"source_text","id":"mat-5-5"},{"book":"mat","chapter":5,"verse":6,"text":"Blessed are those who hunger and thirst for righteousness, for they will be filled.","status":"source_text","id":"mat-5-6"},{"book":"mat","chapter":5,"verse":7,"text":"Blessed are the merciful, for they will receive mercy.","status":"source_text","id":"mat-5-7"},{"book":"mat","chapter":5,"verse":8,"text":"Blessed are the pure in heart, for they will see God.","status":"source_text","id":"mat-5-8"},{"book":"mat","chapter":5,"verse":9,"text":"Blessed are the peacemakers, for they will be called sons of God.","status":"source_text","id":"mat-5-9"},{"book":"mat","chapter":5,"verse":10,"text":"Blessed are those who have been persecuted for righteousness, for theirs is the kingdom of the heavens.","status":"source_text","id":"mat-5-10"},{"book":"mat","chapter":5,"verse":11,"text":"Blessed are you when people insult you and persecute you and falsely say every kind of evil against you because of Me.","status":"source_text","id":"mat-5-11"},{"book":"mat","chapter":5,"verse":12,"text":"Rejoice and be exceedingly glad, for your reward is great in the heavens; for in the same way they persecuted the prophets who were before you.","status":"source_text","id":"mat-5-12"},{"book":"mat","chapter":5,"verse":13,"text":"You are the salt of the earth. But if the salt becomes tasteless, with what will it be salted? It is no longer good for anything except to be thrown outside and trampled by people.","status":"source_text","id":"mat-5-13"},{"book":"mat","chapter":5,"verse":14,"text":"You are the light of the world. A city set on a mountain cannot be hidden.","status":"source_text","id":"mat-5-14"},{"book":"mat","chapter":5,"verse":15,"text":"Nor do people light a lamp and put it under a basket, but on the lampstand, and it shines for everyone in the house.","status":"source_text","id":"mat-5-15"},{"book":"mat","chapter":5,"verse":16,"text":"In the same way, let your light shine before people, so that they may see your good works and glorify your Father who is in the heavens.","status":"source_text","id":"mat-5-16"},{"book":"mat","chapter":5,"verse":17,"text":"Do not think that I came to abolish the Law or the Prophets. I did not come to abolish but to fulfill.","status":"source_text","id":"mat-5-17"},{"book":"mat","chapter":5,"verse":18,"text":"For truly I tell you, until heaven and earth pass away, not one iota or one stroke will pass from the Law until all things happen.","status":"source_text","id":"mat-5-18"},{"book":"mat","chapter":5,"verse":19,"text":"Therefore whoever loosens one of the least of these commandments and teaches people so will be called least in the kingdom of the heavens; but whoever does and teaches them will be called great in the kingdom of the heavens.","status":"source_text","id":"mat-5-19"},{"book":"mat","chapter":5,"verse":20,"text":"For I tell you that unless your righteousness exceeds that of the scribes and Pharisees, you will certainly not enter the kingdom of the heavens.","status":"source_text","id":"mat-5-20"},{"book":"mat","chapter":5,"verse":21,"text":"You heard that it was said to the ancients, ‘You shall not murder,’ and ‘Whoever murders will be liable to judgment.’","status":"source_text","id":"mat-5-21"},{"book":"mat","chapter":5,"verse":22,"text":"But I tell you that everyone who is angry with his brother will be liable to judgment; whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says, ‘Fool,’ will be liable to the Gehenna of fire.","status":"source_text","id":"mat-5-22"},{"book":"mat","chapter":5,"verse":23,"text":"Therefore if you are offering your gift at the altar and there remember that your brother has something against you,","status":"source_text","id":"mat-5-23"},{"book":"mat","chapter":5,"verse":24,"text":"leave your gift there before the altar, and first go and be reconciled to your brother; then come and offer your gift.","status":"source_text","id":"mat-5-24"},{"book":"mat","chapter":5,"verse":25,"text":"Come to terms quickly with your accuser while you are with him on the way, lest the accuser hand you over to the judge, and the judge to the guard, and you be thrown into prison.","status":"source_text","id":"mat-5-25"},{"book":"mat","chapter":5,"verse":26,"text":"Truly I tell you, you will certainly not come out from there until you have paid the last penny.","status":"source_text","id":"mat-5-26"},{"book":"mat","chapter":5,"verse":27,"text":"You heard that it was said, ‘You shall not commit adultery.’","status":"source_text","id":"mat-5-27"},{"book":"mat","chapter":5,"verse":28,"text":"But I tell you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart.","status":"source_text","id":"mat-5-28"},{"book":"mat","chapter":5,"verse":29,"text":"And if your right eye causes you to stumble, tear it out and throw it from you; for it is better for you that one of your members perish than that your whole body be thrown into Gehenna.","status":"source_text","id":"mat-5-29"},{"book":"mat","chapter":5,"verse":30,"text":"And if your right hand causes you to stumble, cut it off and throw it from you; for it is better for you that one of your members perish than that your whole body go into Gehenna.","status":"source_text","id":"mat-5-30"},{"book":"mat","chapter":5,"verse":31,"text":"It was also said, ‘Whoever divorces his wife, let him give her a certificate of divorce.’","status":"source_text","id":"mat-5-31"},{"book":"mat","chapter":5,"verse":32,"text":"But I tell you that everyone who divorces his wife, except on account of sexual immorality, makes her commit adultery; and whoever marries a divorced woman commits adultery.","status":"source_text","id":"mat-5-32"},{"book":"mat","chapter":5,"verse":33,"text":"Again, you heard that it was said to the ancients, ‘You shall not swear falsely, but shall fulfill your oaths to the Lord.’","status":"source_text","id":"mat-5-33"},{"book":"mat","chapter":5,"verse":34,"text":"But I tell you not to swear at all: neither by heaven, because it is the throne of God;","status":"source_text","id":"mat-5-34"},{"book":"mat","chapter":5,"verse":35,"text":"nor by the earth, because it is the footstool of His feet; nor by Jerusalem, because it is the city of the great King.","status":"source_text","id":"mat-5-35"},{"book":"mat","chapter":5,"verse":36,"text":"Nor shall you swear by your head, because you cannot make one hair white or black.","status":"source_text","id":"mat-5-36"},{"book":"mat","chapter":5,"verse":37,"text":"But let your word be ‘Yes, yes,’ ‘No, no.’ Anything beyond these is from evil [or: from the evil one].","status":"source_text","id":"mat-5-37"},{"book":"mat","chapter":5,"verse":38,"text":"You heard that it was said, ‘An eye for an eye and a tooth for a tooth.’","status":"source_text","id":"mat-5-38"},{"book":"mat","chapter":5,"verse":39,"text":"But I tell you not to retaliate against an evil person. Rather, whoever strikes you on your right cheek, turn the other to him also.","status":"source_text","id":"mat-5-39"},{"book":"mat","chapter":5,"verse":40,"text":"And to the one who wants to sue you and take your tunic, let him have your cloak also.","status":"source_text","id":"mat-5-40"},{"book":"mat","chapter":5,"verse":41,"text":"And whoever compels you to go one mile, go with him two.","status":"source_text","id":"mat-5-41"},{"book":"mat","chapter":5,"verse":42,"text":"Give to the one who asks you, and do not turn away from the one who wants to borrow from you.","status":"source_text","id":"mat-5-42"},{"book":"mat","chapter":5,"verse":43,"text":"You heard that it was said, ‘You shall love your neighbor and hate your enemy.’","status":"source_text","id":"mat-5-43"},{"book":"mat","chapter":5,"verse":44,"text":"But I tell you: love your enemies and pray for those who persecute you,","status":"source_text","id":"mat-5-44"},{"book":"mat","chapter":5,"verse":45,"text":"so that you may become sons of your Father who is in the heavens; for He makes His sun rise on evil and good people and sends rain on righteous and unrighteous people.","status":"source_text","id":"mat-5-45"},{"book":"mat","chapter":5,"verse":46,"text":"For if you love those who love you, what reward do you have? Do not even the tax collectors do the same?","status":"source_text","id":"mat-5-46"},{"book":"mat","chapter":5,"verse":47,"text":"And if you greet only your brothers, what extraordinary thing are you doing? Do not even the Gentiles do the same?","status":"source_text","id":"mat-5-47"},{"book":"mat","chapter":5,"verse":48,"text":"Therefore you shall be perfect [also: complete, mature, whole], as your heavenly Father is perfect.","status":"source_text","id":"mat-5-48"},{"book":"mat","chapter":6,"verse":1,"text":"Be careful not to practice your righteousness before people in order to be seen by them; otherwise you have no reward with your Father who is in the heavens.","status":"source_text","id":"mat-6-1"},{"book":"mat","chapter":6,"verse":2,"text":"Therefore when you give to the needy, do not sound a trumpet before you as the hypocrites do in the synagogues and streets so that they may be glorified by people. Truly I tell you, they have received their reward in full.","status":"source_text","id":"mat-6-2"},{"book":"mat","chapter":6,"verse":3,"text":"But when you give to the needy, do not let your left hand know what your right hand is doing,","status":"source_text","id":"mat-6-3"},{"book":"mat","chapter":6,"verse":4,"text":"so that your giving may be in secret; and your Father who sees in secret will repay you.","status":"source_text","id":"mat-6-4"},{"book":"mat","chapter":6,"verse":5,"text":"And when you pray, you shall not be like the hypocrites, for they love to stand and pray in the synagogues and at the street corners so that they may be seen by people. Truly I tell you, they have received their reward in full.","status":"source_text","id":"mat-6-5"},{"book":"mat","chapter":6,"verse":6,"text":"But when you pray, enter your inner room, shut your door, and pray to your Father who is in secret; and your Father who sees in secret will repay you.","status":"source_text","id":"mat-6-6"},{"book":"mat","chapter":6,"verse":7,"text":"And when you pray, do not babble repetitively like the Gentiles, for they think that in their many words they will be heard.","status":"source_text","id":"mat-6-7"},{"book":"mat","chapter":6,"verse":8,"text":"Therefore do not be like them, for your Father knows what you need before you ask Him.","status":"source_text","id":"mat-6-8"},{"book":"mat","chapter":6,"verse":9,"text":"Therefore pray in this way: ‘Our Father who is in the heavens, let Your name be sanctified.","status":"source_text","id":"mat-6-9"},{"book":"mat","chapter":6,"verse":10,"text":"Let Your kingdom come. Let Your will be done, as in heaven, so also on earth.","status":"source_text","id":"mat-6-10"},{"book":"mat","chapter":6,"verse":11,"text":"Give us today our necessary bread [also: bread for today; bread for the coming day],","status":"source_text","id":"mat-6-11"},{"book":"mat","chapter":6,"verse":12,"text":"and forgive us our debts, as we also have forgiven our debtors,","status":"source_text","id":"mat-6-12"},{"book":"mat","chapter":6,"verse":13,"text":"and do not bring us into temptation [also: testing], but deliver us from evil [or: the evil one].’","status":"source_text","id":"mat-6-13"},{"book":"mat","chapter":6,"verse":14,"text":"For if you forgive people their trespasses, your heavenly Father will also forgive you.","status":"source_text","id":"mat-6-14"},{"book":"mat","chapter":6,"verse":15,"text":"But if you do not forgive people, neither will your Father forgive your trespasses.","status":"source_text","id":"mat-6-15"},{"book":"mat","chapter":6,"verse":16,"text":"And when you fast, do not become gloomy like the hypocrites, for they disfigure their faces so that their fasting may be seen by people. Truly I tell you, they have received their reward in full.","status":"source_text","id":"mat-6-16"},{"book":"mat","chapter":6,"verse":17,"text":"But when you fast, anoint your head and wash your face,","status":"source_text","id":"mat-6-17"},{"book":"mat","chapter":6,"verse":18,"text":"so that your fasting may not be seen by people but by your Father who is in secret; and your Father who sees in secret will repay you.","status":"source_text","id":"mat-6-18"},{"book":"mat","chapter":6,"verse":19,"text":"Do not store up for yourselves treasures on earth, where moth and corrosion destroy and where thieves break in and steal.","status":"source_text","id":"mat-6-19"},{"book":"mat","chapter":6,"verse":20,"text":"But store up for yourselves treasures in heaven, where neither moth nor corrosion destroys and where thieves do not break in or steal.","status":"source_text","id":"mat-6-20"},{"book":"mat","chapter":6,"verse":21,"text":"For where your treasure is, there your heart will be also.","status":"source_text","id":"mat-6-21"},{"book":"mat","chapter":6,"verse":22,"text":"The lamp of the body is the eye. Therefore if your eye is clear [also: single, sincere, generous], your whole body will be full of light.","status":"source_text","id":"mat-6-22"},{"book":"mat","chapter":6,"verse":23,"text":"But if your eye is bad, your whole body will be dark. Therefore if the light in you is darkness, how great is the darkness!","status":"source_text","id":"mat-6-23"},{"book":"mat","chapter":6,"verse":24,"text":"No one can serve two masters, for either he will hate the one and love the other, or he will be devoted to one and despise the other. You cannot serve God and mammon.","status":"source_text","id":"mat-6-24"},{"book":"mat","chapter":6,"verse":25,"text":"Therefore I tell you, do not be anxious about your life, what you will eat or what you will drink, nor about your body, what you will wear. Is not life more than food and the body more than clothing?","status":"source_text","id":"mat-6-25"},{"book":"mat","chapter":6,"verse":26,"text":"Look at the birds of heaven: they neither sow nor reap nor gather into barns, and your heavenly Father feeds them. Are you not worth much more than they?","status":"source_text","id":"mat-6-26"},{"book":"mat","chapter":6,"verse":27,"text":"And which of you by being anxious can add one cubit to his lifespan [or: stature]?","status":"source_text","id":"mat-6-27"},{"book":"mat","chapter":6,"verse":28,"text":"And why are you anxious about clothing? Consider carefully how the lilies of the field grow: they neither labor nor spin.","status":"source_text","id":"mat-6-28"},{"book":"mat","chapter":6,"verse":29,"text":"Yet I tell you that not even Solomon in all his glory was clothed like one of these.","status":"source_text","id":"mat-6-29"},{"book":"mat","chapter":6,"verse":30,"text":"But if God so clothes the grass of the field, which is here today and tomorrow is thrown into an oven, will He not much more clothe you, you of little faith?","status":"source_text","id":"mat-6-30"},{"book":"mat","chapter":6,"verse":31,"text":"Therefore do not be anxious, saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’","status":"source_text","id":"mat-6-31"},{"book":"mat","chapter":6,"verse":32,"text":"For the Gentiles eagerly seek all these things, and your heavenly Father knows that you need them all.","status":"source_text","id":"mat-6-32"},{"book":"mat","chapter":6,"verse":33,"text":"But seek first His kingdom and His righteousness, and all these things will be added to you.","status":"source_text","id":"mat-6-33"},{"book":"mat","chapter":6,"verse":34,"text":"Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Sufficient for the day is its own trouble.","status":"source_text","id":"mat-6-34"},{"book":"mat","chapter":7,"verse":1,"text":"Do not judge, so that you may not be judged.","status":"source_text","id":"mat-7-1"},{"book":"mat","chapter":7,"verse":2,"text":"For with the judgment you judge, you will be judged; and with the measure you measure, it will be measured to you.","status":"source_text","id":"mat-7-2"},{"book":"mat","chapter":7,"verse":3,"text":"And why do you see the speck in your brother’s eye but do not notice the beam in your own eye?","status":"source_text","id":"mat-7-3"},{"book":"mat","chapter":7,"verse":4,"text":"Or how will you say to your brother, ‘Let me remove the speck from your eye,’ and look, the beam is in your eye?","status":"source_text","id":"mat-7-4"},{"book":"mat","chapter":7,"verse":5,"text":"Hypocrite! First remove the beam from your own eye, and then you will see clearly to remove the speck from your brother’s eye.","status":"source_text","id":"mat-7-5"},{"book":"mat","chapter":7,"verse":6,"text":"Do not give what is holy to dogs, nor throw your pearls before pigs, lest they trample them with their feet and turn and tear you apart.","status":"source_text","id":"mat-7-6"},{"book":"mat","chapter":7,"verse":7,"text":"Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.","status":"source_text","id":"mat-7-7"},{"book":"mat","chapter":7,"verse":8,"text":"For everyone who asks receives, and the one who seeks finds, and to the one who knocks it will be opened.","status":"source_text","id":"mat-7-8"},{"book":"mat","chapter":7,"verse":9,"text":"Or what person among you, if his son asks him for bread, will give him a stone?","status":"source_text","id":"mat-7-9"},{"book":"mat","chapter":7,"verse":10,"text":"Or if he asks for a fish, will give him a snake?","status":"source_text","id":"mat-7-10"},{"book":"mat","chapter":7,"verse":11,"text":"Therefore if you, being evil, know how to give good gifts to your children, how much more will your Father who is in the heavens give good things to those who ask Him!","status":"source_text","id":"mat-7-11"},{"book":"mat","chapter":7,"verse":12,"text":"Therefore, whatever you want people to do to you, do the same also to them; for this is the Law and the Prophets.","status":"source_text","id":"mat-7-12"},{"book":"mat","chapter":7,"verse":13,"text":"Enter through the narrow gate, for wide is the gate and broad is the way that leads to destruction, and many are those who enter through it.","status":"source_text","id":"mat-7-13"},{"book":"mat","chapter":7,"verse":14,"text":"For narrow is the gate and constricted is the way that leads to life, and few are those who find it.","status":"source_text","id":"mat-7-14"},{"book":"mat","chapter":7,"verse":15,"text":"Beware of false prophets, who come to you in sheep’s clothing but inwardly are ravenous wolves.","status":"source_text","id":"mat-7-15"},{"book":"mat","chapter":7,"verse":16,"text":"You will know them by their fruits. Do people gather grapes from thorns or figs from thistles?","status":"source_text","id":"mat-7-16"},{"book":"mat","chapter":7,"verse":17,"text":"In the same way, every good tree produces good fruit, but the bad tree produces bad fruit.","status":"source_text","id":"mat-7-17"},{"book":"mat","chapter":7,"verse":18,"text":"A good tree cannot produce bad fruit, nor can a bad tree produce good fruit.","status":"source_text","id":"mat-7-18"},{"book":"mat","chapter":7,"verse":19,"text":"Every tree not producing good fruit is cut down and thrown into the fire.","status":"source_text","id":"mat-7-19"},{"book":"mat","chapter":7,"verse":20,"text":"Therefore you will know them by their fruits.","status":"source_text","id":"mat-7-20"},{"book":"mat","chapter":7,"verse":21,"text":"Not everyone who says to Me, ‘Lord, Lord,’ will enter the kingdom of the heavens, but the one who does the will of My Father who is in the heavens.","status":"source_text","id":"mat-7-21"},{"book":"mat","chapter":7,"verse":22,"text":"Many will say to Me in that day, ‘Lord, Lord, did we not prophesy in Your name, and in Your name cast out demons, and in Your name do many works of power?’","status":"source_text","id":"mat-7-22"},{"book":"mat","chapter":7,"verse":23,"text":"And then I will declare to them, ‘I never knew you. Depart from Me, you workers of lawlessness.’","status":"source_text","id":"mat-7-23"},{"book":"mat","chapter":7,"verse":24,"text":"Therefore everyone who hears these words of Mine and does them will be like a wise man who built his house on the rock.","status":"source_text","id":"mat-7-24"},{"book":"mat","chapter":7,"verse":25,"text":"And the rain came down, the floods came, and the winds blew and beat against that house, and it did not fall, for it had been founded on the rock.","status":"source_text","id":"mat-7-25"},{"book":"mat","chapter":7,"verse":26,"text":"And everyone who hears these words of Mine and does not do them will be like a foolish man who built his house on the sand.","status":"source_text","id":"mat-7-26"},{"book":"mat","chapter":7,"verse":27,"text":"And the rain came down, the floods came, and the winds blew and struck that house, and it fell, and great was its fall.","status":"source_text","id":"mat-7-27"},{"book":"mat","chapter":7,"verse":28,"text":"And when Jesus finished these words, the crowds were astonished at His teaching,","status":"source_text","id":"mat-7-28"},{"book":"mat","chapter":7,"verse":29,"text":"for He was teaching them as one having authority, and not as their scribes.","status":"source_text","id":"mat-7-29"},{"book":"mat","chapter":8,"verse":1,"text":"When He came down from the mountain, large crowds followed Him.","status":"source_text","id":"mat-8-1"},{"book":"mat","chapter":8,"verse":2,"text":"And behold, a leper came to Him and bowed before Him, saying, “Lord, if You are willing, You are able to cleanse me.”","status":"source_text","id":"mat-8-2"},{"book":"mat","chapter":8,"verse":3,"text":"And stretching out His hand, He touched him, saying, “I am willing. Be cleansed.” And immediately his leprosy was cleansed.","status":"source_text","id":"mat-8-3"},{"book":"mat","chapter":8,"verse":4,"text":"And Jesus said to him, “See that you tell no one. But go, show yourself to the priest, and offer the gift that Moses commanded, as a testimony to them.”","status":"source_text","id":"mat-8-4"},{"book":"mat","chapter":8,"verse":5,"text":"When He entered Capernaum, a centurion came to Him, pleading with Him","status":"source_text","id":"mat-8-5"},{"book":"mat","chapter":8,"verse":6,"text":"and saying, “Lord, my servant is lying paralyzed in the house, suffering terribly.”","status":"source_text","id":"mat-8-6"},{"book":"mat","chapter":8,"verse":7,"text":"And He said to him, “I will come and heal him.”","status":"source_text","id":"mat-8-7"},{"book":"mat","chapter":8,"verse":8,"text":"But the centurion answered, “Lord, I am not worthy for You to come under my roof. But only speak a word, and my servant will be healed.","status":"source_text","id":"mat-8-8"},{"book":"mat","chapter":8,"verse":9,"text":"For I too am a man under authority, having soldiers under me. I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.”","status":"source_text","id":"mat-8-9"},{"book":"mat","chapter":8,"verse":10,"text":"When Jesus heard this, He marveled and said to those following Him, “Truly I say to you, with no one in Israel have I found such great faith.","status":"source_text","id":"mat-8-10"},{"book":"mat","chapter":8,"verse":11,"text":"And I say to you that many will come from east and west and recline at table with Abraham and Isaac and Jacob in the kingdom of the heavens,","status":"source_text","id":"mat-8-11"},{"book":"mat","chapter":8,"verse":12,"text":"but the sons of the kingdom will be cast into the outer darkness. There will be weeping and gnashing of teeth.”","status":"source_text","id":"mat-8-12"},{"book":"mat","chapter":8,"verse":13,"text":"Then Jesus said to the centurion, “Go; let it be done for you as you have believed.” And his servant was healed in that hour.","status":"source_text","id":"mat-8-13"},{"book":"mat","chapter":8,"verse":14,"text":"When Jesus came into Peter’s house, He saw his mother-in-law lying sick with a fever.","status":"source_text","id":"mat-8-14"},{"book":"mat","chapter":8,"verse":15,"text":"He touched her hand, and the fever left her; and she arose and served Him.","status":"source_text","id":"mat-8-15"},{"book":"mat","chapter":8,"verse":16,"text":"When evening came, they brought to Him many who were demon-possessed. He cast out the spirits with a word and healed all who were sick,","status":"source_text","id":"mat-8-16"},{"book":"mat","chapter":8,"verse":17,"text":"so that what was spoken through Isaiah the prophet might be fulfilled: “He Himself took our weaknesses and bore our diseases.”","status":"source_text","id":"mat-8-17"},{"book":"mat","chapter":8,"verse":18,"text":"When Jesus saw a crowd around Him, He gave orders to go to the other side.","status":"source_text","id":"mat-8-18"},{"book":"mat","chapter":8,"verse":19,"text":"And a scribe came and said to Him, “Teacher, I will follow You wherever You go.”","status":"source_text","id":"mat-8-19"},{"book":"mat","chapter":8,"verse":20,"text":"Jesus said to him, “The foxes have dens and the birds of heaven have nests, but the Son of Man has nowhere to lay His head.”","status":"source_text","id":"mat-8-20"},{"book":"mat","chapter":8,"verse":21,"text":"Another of the disciples said to Him, “Lord, permit me first to go and bury my father.”","status":"source_text","id":"mat-8-21"},{"book":"mat","chapter":8,"verse":22,"text":"But Jesus said to him, “Follow Me, and let the dead bury their own dead.”","status":"source_text","id":"mat-8-22"},{"book":"mat","chapter":8,"verse":23,"text":"And when He got into the boat, His disciples followed Him.","status":"source_text","id":"mat-8-23"},{"book":"mat","chapter":8,"verse":24,"text":"And behold, a great storm arose on the sea, so that the boat was being covered by the waves; but He was sleeping.","status":"source_text","id":"mat-8-24"},{"book":"mat","chapter":8,"verse":25,"text":"They came and awakened Him, saying, “Lord, save us! We are perishing!”","status":"source_text","id":"mat-8-25"},{"book":"mat","chapter":8,"verse":26,"text":"And He said to them, “Why are you afraid, you of little faith?” Then He arose and rebuked the winds and the sea, and there was a great calm.","status":"source_text","id":"mat-8-26"},{"book":"mat","chapter":8,"verse":27,"text":"And the men marveled, saying, “What kind of man is this, that even the winds and the sea obey Him?”","status":"source_text","id":"mat-8-27"},{"book":"mat","chapter":8,"verse":28,"text":"When He came to the other side, into the region of the Gadarenes, two demon-possessed men coming out of the tombs met Him. They were extremely violent, so that no one was able to pass by that way.","status":"source_text","id":"mat-8-28"},{"book":"mat","chapter":8,"verse":29,"text":"And behold, they cried out, saying, “What do we have to do with You, Son of God? Have You come here to torment us before the appointed time?”","status":"source_text","id":"mat-8-29"},{"book":"mat","chapter":8,"verse":30,"text":"Now a large herd of pigs was feeding at some distance from them.","status":"source_text","id":"mat-8-30"},{"book":"mat","chapter":8,"verse":31,"text":"And the demons pleaded with Him, saying, “If You cast us out, send us into the herd of pigs.”","status":"source_text","id":"mat-8-31"},{"book":"mat","chapter":8,"verse":32,"text":"And He said to them, “Go.” So they came out and went into the pigs. And behold, the whole herd rushed down the steep slope into the sea and died in the waters.","status":"source_text","id":"mat-8-32"},{"book":"mat","chapter":8,"verse":33,"text":"Those tending them fled, went into the city, and reported everything, including what had happened to the demon-possessed men.","status":"source_text","id":"mat-8-33"},{"book":"mat","chapter":8,"verse":34,"text":"And behold, the whole city came out to meet Jesus. When they saw Him, they pleaded with Him to depart from their region.","status":"source_text","id":"mat-8-34"},{"book":"mat","chapter":9,"verse":1,"text":"And getting into a boat, He crossed over and came to His own city.","status":"source_text","id":"mat-9-1"},{"book":"mat","chapter":9,"verse":2,"text":"And behold, they brought to Him a paralyzed man lying on a bed. Seeing their faith, Jesus said to the paralyzed man, “Take courage, child; your sins are forgiven.”","status":"source_text","id":"mat-9-2"},{"book":"mat","chapter":9,"verse":3,"text":"And behold, some of the scribes said among themselves, “This man blasphemes.”","status":"source_text","id":"mat-9-3"},{"book":"mat","chapter":9,"verse":4,"text":"Knowing their thoughts, Jesus said, “Why do you think evil things in your hearts?","status":"source_text","id":"mat-9-4"},{"book":"mat","chapter":9,"verse":5,"text":"For which is easier, to say, ‘Your sins are forgiven,’ or to say, ‘Rise and walk’?","status":"source_text","id":"mat-9-5"},{"book":"mat","chapter":9,"verse":6,"text":"But so that you may know that the Son of Man has authority on earth to forgive sins”—then He said to the paralyzed man—“Rise, take up your bed, and go to your house.”","status":"source_text","id":"mat-9-6"},{"book":"mat","chapter":9,"verse":7,"text":"And he rose and went to his house.","status":"source_text","id":"mat-9-7"},{"book":"mat","chapter":9,"verse":8,"text":"When the crowds saw this, they were afraid and glorified God, who had given such authority to human beings.","status":"source_text","id":"mat-9-8"},{"book":"mat","chapter":9,"verse":9,"text":"As Jesus passed on from there, He saw a man called Matthew sitting at the tax booth, and He said to him, “Follow Me.” And he rose and followed Him.","status":"source_text","id":"mat-9-9"},{"book":"mat","chapter":9,"verse":10,"text":"And as Jesus reclined at table in the house, behold, many tax collectors and sinners came and reclined with Jesus and His disciples.","status":"source_text","id":"mat-9-10"},{"book":"mat","chapter":9,"verse":11,"text":"When the Pharisees saw this, they said to His disciples, “Why does your Teacher eat with tax collectors and sinners?”","status":"source_text","id":"mat-9-11"},{"book":"mat","chapter":9,"verse":12,"text":"But when He heard it, He said, “Those who are healthy have no need of a physician, but those who are sick do.","status":"source_text","id":"mat-9-12"},{"book":"mat","chapter":9,"verse":13,"text":"Go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous, but sinners.”","status":"source_text","id":"mat-9-13"},{"book":"mat","chapter":9,"verse":14,"text":"Then the disciples of John came to Him, saying, “Why do we and the Pharisees fast, but Your disciples do not fast?”","status":"source_text","id":"mat-9-14"},{"book":"mat","chapter":9,"verse":15,"text":"And Jesus said to them, “Can the wedding guests mourn while the bridegroom is with them? But days will come when the bridegroom is taken away from them, and then they will fast.","status":"source_text","id":"mat-9-15"},{"book":"mat","chapter":9,"verse":16,"text":"No one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment and a worse tear results.","status":"source_text","id":"mat-9-16"},{"book":"mat","chapter":9,"verse":17,"text":"Nor do they put new wine into old wineskins. Otherwise the wineskins burst, the wine is poured out, and the wineskins are ruined. But they put new wine into fresh wineskins, and both are preserved.”","status":"source_text","id":"mat-9-17"},{"book":"mat","chapter":9,"verse":18,"text":"While He was saying these things to them, behold, a ruler came and bowed before Him, saying, “My daughter has just died. But come and lay Your hand on her, and she will live.”","status":"source_text","id":"mat-9-18"},{"book":"mat","chapter":9,"verse":19,"text":"And Jesus rose and followed him, and so did His disciples.","status":"source_text","id":"mat-9-19"},{"book":"mat","chapter":9,"verse":20,"text":"And behold, a woman suffering from a flow of blood for twelve years came up behind Him and touched the fringe of His garment.","status":"source_text","id":"mat-9-20"},{"book":"mat","chapter":9,"verse":21,"text":"For she was saying to herself, “If only I touch His garment, I will be saved.”","status":"source_text","id":"mat-9-21"},{"book":"mat","chapter":9,"verse":22,"text":"But Jesus turned, saw her, and said, “Take courage, daughter; your faith has saved you.” And the woman was healed from that hour.","status":"source_text","id":"mat-9-22"},{"book":"mat","chapter":9,"verse":23,"text":"When Jesus came into the ruler’s house and saw the flute players and the crowd making a commotion,","status":"source_text","id":"mat-9-23"},{"book":"mat","chapter":9,"verse":24,"text":"He said, “Go away, for the girl has not died but is sleeping.” And they laughed at Him.","status":"source_text","id":"mat-9-24"},{"book":"mat","chapter":9,"verse":25,"text":"But when the crowd had been put outside, He went in and took her by the hand, and the girl arose.","status":"source_text","id":"mat-9-25"},{"book":"mat","chapter":9,"verse":26,"text":"And the report of this went out into that whole region.","status":"source_text","id":"mat-9-26"},{"book":"mat","chapter":9,"verse":27,"text":"As Jesus passed on from there, two blind men followed Him, crying out, “Have mercy on us, Son of David!”","status":"source_text","id":"mat-9-27"},{"book":"mat","chapter":9,"verse":28,"text":"When He entered the house, the blind men came to Him. And Jesus said to them, “Do you believe that I am able to do this?” They said to Him, “Yes, Lord.”","status":"source_text","id":"mat-9-28"},{"book":"mat","chapter":9,"verse":29,"text":"Then He touched their eyes, saying, “Let it be done to you according to your faith.”","status":"source_text","id":"mat-9-29"},{"book":"mat","chapter":9,"verse":30,"text":"And their eyes were opened. Jesus sternly warned them, saying, “See that no one knows it.”","status":"source_text","id":"mat-9-30"},{"book":"mat","chapter":9,"verse":31,"text":"But they went out and spread the report about Him throughout that whole region.","status":"source_text","id":"mat-9-31"},{"book":"mat","chapter":9,"verse":32,"text":"As they were going out, behold, they brought to Him a demon-possessed man who could not speak.","status":"source_text","id":"mat-9-32"},{"book":"mat","chapter":9,"verse":33,"text":"And when the demon had been cast out, the mute man spoke. The crowds marveled, saying, “Never has anything like this appeared in Israel.”","status":"source_text","id":"mat-9-33"},{"book":"mat","chapter":9,"verse":34,"text":"But the Pharisees said, “By the ruler of the demons He casts out the demons.”","status":"source_text","id":"mat-9-34"},{"book":"mat","chapter":9,"verse":35,"text":"And Jesus went throughout all the cities and villages, teaching in their synagogues, proclaiming the gospel of the kingdom, and healing every disease and every sickness.","status":"source_text","id":"mat-9-35"},{"book":"mat","chapter":9,"verse":36,"text":"Seeing the crowds, He was moved with compassion for them, because they were harassed and cast down, like sheep without a shepherd.","status":"source_text","id":"mat-9-36"},{"book":"mat","chapter":9,"verse":37,"text":"Then He said to His disciples, “The harvest is plentiful, but the workers are few.","status":"source_text","id":"mat-9-37"},{"book":"mat","chapter":9,"verse":38,"text":"Therefore ask the Lord of the harvest to send out workers into His harvest.”","status":"source_text","id":"mat-9-38"},{"book":"mat","chapter":10,"verse":1,"text":"Calling His twelve disciples to Him, He gave them authority over unclean spirits, to cast them out and to heal every disease and every sickness.","status":"source_text","id":"mat-10-1"},{"book":"mat","chapter":10,"verse":2,"text":"Now the names of the twelve apostles are these: first Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother;","status":"source_text","id":"mat-10-2"},{"book":"mat","chapter":10,"verse":3,"text":"Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Thaddaeus;","status":"source_text","id":"mat-10-3"},{"book":"mat","chapter":10,"verse":4,"text":"Simon the Cananaean, and Judas Iscariot, who also handed Him over.","status":"source_text","id":"mat-10-4"},{"book":"mat","chapter":10,"verse":5,"text":"These twelve Jesus sent out, instructing them, saying, “Do not go into a way of the Gentiles, and do not enter a city of the Samaritans.","status":"source_text","id":"mat-10-5"},{"book":"mat","chapter":10,"verse":6,"text":"But go rather to the lost sheep of the house of Israel.","status":"source_text","id":"mat-10-6"},{"book":"mat","chapter":10,"verse":7,"text":"And as you go, proclaim, saying, ‘The kingdom of the heavens has drawn near.’","status":"source_text","id":"mat-10-7"},{"book":"mat","chapter":10,"verse":8,"text":"Heal the sick, raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.","status":"source_text","id":"mat-10-8"},{"book":"mat","chapter":10,"verse":9,"text":"Do not acquire gold or silver or copper for your belts,","status":"source_text","id":"mat-10-9"},{"book":"mat","chapter":10,"verse":10,"text":"no bag for the journey, nor two tunics, nor sandals, nor a staff; for the worker is worthy of his food.","status":"source_text","id":"mat-10-10"},{"book":"mat","chapter":10,"verse":11,"text":"Whatever city or village you enter, find out who in it is worthy, and stay there until you leave.","status":"source_text","id":"mat-10-11"},{"book":"mat","chapter":10,"verse":12,"text":"As you enter the house, greet it.","status":"source_text","id":"mat-10-12"},{"book":"mat","chapter":10,"verse":13,"text":"And if the house is worthy, let your peace come upon it; but if it is not worthy, let your peace return to you.","status":"source_text","id":"mat-10-13"},{"book":"mat","chapter":10,"verse":14,"text":"And whoever does not receive you or listen to your words, as you go out of that house or city, shake the dust off your feet.","status":"source_text","id":"mat-10-14"},{"book":"mat","chapter":10,"verse":15,"text":"Truly I say to you, it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that city.","status":"source_text","id":"mat-10-15"},{"book":"mat","chapter":10,"verse":16,"text":"Behold, I send you out as sheep in the midst of wolves. Therefore be wise as serpents and innocent as doves.","status":"source_text","id":"mat-10-16"},{"book":"mat","chapter":10,"verse":17,"text":"But beware of people, for they will hand you over to councils and flog you in their synagogues.","status":"source_text","id":"mat-10-17"},{"book":"mat","chapter":10,"verse":18,"text":"And you will be brought before governors and kings because of Me, as a testimony to them and to the Gentiles.","status":"source_text","id":"mat-10-18"},{"book":"mat","chapter":10,"verse":19,"text":"But when they hand you over, do not be anxious about how or what you should speak, for what you should speak will be given to you in that hour.","status":"source_text","id":"mat-10-19"},{"book":"mat","chapter":10,"verse":20,"text":"For it is not you who speak, but the Spirit of your Father speaking in you.","status":"source_text","id":"mat-10-20"},{"book":"mat","chapter":10,"verse":21,"text":"Brother will hand over brother to death, and a father his child; and children will rise up against parents and put them to death.","status":"source_text","id":"mat-10-21"},{"book":"mat","chapter":10,"verse":22,"text":"And you will be hated by all because of My name. But the one who endures to the end will be saved.","status":"source_text","id":"mat-10-22"},{"book":"mat","chapter":10,"verse":23,"text":"When they persecute you in this city, flee to another. For truly I say to you, you will certainly not finish going through the cities of Israel until the Son of Man comes.","status":"source_text","id":"mat-10-23"},{"book":"mat","chapter":10,"verse":24,"text":"A disciple is not above the teacher, nor a servant above his master.","status":"source_text","id":"mat-10-24"},{"book":"mat","chapter":10,"verse":25,"text":"It is enough for the disciple to become like his teacher and the servant like his master. If they have called the master of the house Beelzebul, how much more those of his household!","status":"source_text","id":"mat-10-25"},{"book":"mat","chapter":10,"verse":26,"text":"Therefore do not fear them, for nothing is covered that will not be revealed, and nothing hidden that will not be made known.","status":"source_text","id":"mat-10-26"},{"book":"mat","chapter":10,"verse":27,"text":"What I say to you in the darkness, speak in the light; and what you hear in the ear, proclaim on the housetops.","status":"source_text","id":"mat-10-27"},{"book":"mat","chapter":10,"verse":28,"text":"And do not fear those who kill the body but are unable to kill the soul. Rather fear the One who is able to destroy both soul and body in Gehenna.","status":"source_text","id":"mat-10-28"},{"book":"mat","chapter":10,"verse":29,"text":"Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father.","status":"source_text","id":"mat-10-29"},{"book":"mat","chapter":10,"verse":30,"text":"But even the hairs of your head are all numbered.","status":"source_text","id":"mat-10-30"},{"book":"mat","chapter":10,"verse":31,"text":"Therefore do not fear; you are worth more than many sparrows.","status":"source_text","id":"mat-10-31"},{"book":"mat","chapter":10,"verse":32,"text":"Therefore everyone who acknowledges Me before people, I also will acknowledge before My Father who is in the heavens.","status":"source_text","id":"mat-10-32"},{"book":"mat","chapter":10,"verse":33,"text":"But whoever denies Me before people, I also will deny before My Father who is in the heavens.","status":"source_text","id":"mat-10-33"},{"book":"mat","chapter":10,"verse":34,"text":"Do not think that I came to bring peace upon the earth. I did not come to bring peace, but a sword.","status":"source_text","id":"mat-10-34"},{"book":"mat","chapter":10,"verse":35,"text":"For I came to set a man against his father, a daughter against her mother, and a daughter-in-law against her mother-in-law;","status":"source_text","id":"mat-10-35"},{"book":"mat","chapter":10,"verse":36,"text":"and a person’s enemies will be those of his own household.","status":"source_text","id":"mat-10-36"},{"book":"mat","chapter":10,"verse":37,"text":"The one who loves father or mother more than Me is not worthy of Me, and the one who loves son or daughter more than Me is not worthy of Me.","status":"source_text","id":"mat-10-37"},{"book":"mat","chapter":10,"verse":38,"text":"And the one who does not take his cross and follow after Me is not worthy of Me.","status":"source_text","id":"mat-10-38"},{"book":"mat","chapter":10,"verse":39,"text":"The one who finds his life will lose it, and the one who loses his life because of Me will find it.","status":"source_text","id":"mat-10-39"},{"book":"mat","chapter":10,"verse":40,"text":"The one who receives you receives Me, and the one who receives Me receives the One who sent Me.","status":"source_text","id":"mat-10-40"},{"book":"mat","chapter":10,"verse":41,"text":"The one who receives a prophet in the name of a prophet will receive a prophet’s reward, and the one who receives a righteous person in the name of a righteous person will receive a righteous person’s reward.","status":"source_text","id":"mat-10-41"},{"book":"mat","chapter":10,"verse":42,"text":"And whoever gives one of these little ones even a cup of cold water to drink in the name of a disciple, truly I say to you, he will certainly not lose his reward.”","status":"source_text","id":"mat-10-42"},{"book":"mat","chapter":11,"verse":1,"text":"When Jesus had finished instructing His twelve disciples, He departed from there to teach and proclaim in their cities.","status":"source_text","id":"mat-11-1"},{"book":"mat","chapter":11,"verse":2,"text":"Now when John heard in prison about the works of the Christ, he sent word through his disciples","status":"source_text","id":"mat-11-2"},{"book":"mat","chapter":11,"verse":3,"text":"and said to Him, “Are You the One who is coming, or should we wait for another?”","status":"source_text","id":"mat-11-3"},{"book":"mat","chapter":11,"verse":4,"text":"Jesus answered them, “Go and report to John what you hear and see:","status":"source_text","id":"mat-11-4"},{"book":"mat","chapter":11,"verse":5,"text":"the blind see, the lame walk, lepers are cleansed, the deaf hear, the dead are raised, and the poor have good news proclaimed to them.","status":"source_text","id":"mat-11-5"},{"book":"mat","chapter":11,"verse":6,"text":"And blessed is anyone who does not stumble because of Me.”","status":"source_text","id":"mat-11-6"},{"book":"mat","chapter":11,"verse":7,"text":"As they were leaving, Jesus began to speak to the crowds concerning John: “What did you go out into the wilderness to see? A reed shaken by the wind?","status":"source_text","id":"mat-11-7"},{"book":"mat","chapter":11,"verse":8,"text":"But what did you go out to see? A man dressed in soft clothing? Behold, those who wear soft clothing are in kings’ houses.","status":"source_text","id":"mat-11-8"},{"book":"mat","chapter":11,"verse":9,"text":"But what did you go out to see? A prophet? Yes, I tell you, and more than a prophet.","status":"source_text","id":"mat-11-9"},{"book":"mat","chapter":11,"verse":10,"text":"This is the one about whom it is written, ‘Behold, I send My messenger before Your face, who will prepare Your way before You.’","status":"source_text","id":"mat-11-10"},{"book":"mat","chapter":11,"verse":11,"text":"Truly I say to you, among those born of women no one greater than John the Baptist has arisen; yet the one who is smaller in the kingdom of the heavens is greater than he.","status":"source_text","id":"mat-11-11"},{"book":"mat","chapter":11,"verse":12,"text":"From the days of John the Baptist until now, the kingdom of the heavens advances forcefully [or: suffers violence], and forceful people seize it [or: violent people take it by force].","status":"source_text","id":"mat-11-12"},{"book":"mat","chapter":11,"verse":13,"text":"For all the prophets and the Law prophesied until John.","status":"source_text","id":"mat-11-13"},{"book":"mat","chapter":11,"verse":14,"text":"And if you are willing to receive it, he is Elijah who is to come.","status":"source_text","id":"mat-11-14"},{"book":"mat","chapter":11,"verse":15,"text":"The one who has ears, let him hear.","status":"source_text","id":"mat-11-15"},{"book":"mat","chapter":11,"verse":16,"text":"But to what shall I compare this generation? It is like children sitting in the marketplaces who call to the others","status":"source_text","id":"mat-11-16"},{"book":"mat","chapter":11,"verse":17,"text":"and say, ‘We played the flute for you, and you did not dance; we mourned, and you did not beat your breasts.’","status":"source_text","id":"mat-11-17"},{"book":"mat","chapter":11,"verse":18,"text":"For John came neither eating nor drinking, and they say, ‘He has a demon.’","status":"source_text","id":"mat-11-18"},{"book":"mat","chapter":11,"verse":19,"text":"The Son of Man came eating and drinking, and they say, ‘Behold, a glutton and a wine drinker, a friend of tax collectors and sinners!’ Yet wisdom is shown to be right by her works.”","status":"source_text","id":"mat-11-19"},{"book":"mat","chapter":11,"verse":20,"text":"Then He began to reproach the cities in which most of His mighty works had been done, because they did not repent.","status":"source_text","id":"mat-11-20"},{"book":"mat","chapter":11,"verse":21,"text":"“Woe to you, Chorazin! Woe to you, Bethsaida! For if the mighty works done in you had been done in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.","status":"source_text","id":"mat-11-21"},{"book":"mat","chapter":11,"verse":22,"text":"But I tell you, it will be more bearable for Tyre and Sidon on the day of judgment than for you.","status":"source_text","id":"mat-11-22"},{"book":"mat","chapter":11,"verse":23,"text":"And you, Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had been done in Sodom, it would have remained until today.","status":"source_text","id":"mat-11-23"},{"book":"mat","chapter":11,"verse":24,"text":"But I tell you that it will be more bearable for the land of Sodom on the day of judgment than for you.”","status":"source_text","id":"mat-11-24"},{"book":"mat","chapter":11,"verse":25,"text":"At that time Jesus answered and said, “I praise You, Father, Lord of heaven and earth, because You hid these things from the wise and understanding and revealed them to little children.","status":"source_text","id":"mat-11-25"},{"book":"mat","chapter":11,"verse":26,"text":"Yes, Father, for this was pleasing before You.","status":"source_text","id":"mat-11-26"},{"book":"mat","chapter":11,"verse":27,"text":"All things have been handed over to Me by My Father. No one fully knows the Son except the Father, nor does anyone fully know the Father except the Son and anyone to whom the Son chooses to reveal Him.","status":"source_text","id":"mat-11-27"},{"book":"mat","chapter":11,"verse":28,"text":"Come to Me, all who labor and are burdened, and I will give you rest.","status":"source_text","id":"mat-11-28"},{"book":"mat","chapter":11,"verse":29,"text":"Take My yoke upon you and learn from Me, for I am gentle and humble in heart, and you will find rest for your souls.","status":"source_text","id":"mat-11-29"},{"book":"mat","chapter":11,"verse":30,"text":"For My yoke is easy [also: kind, well-fitting], and My burden is light.”","status":"source_text","id":"mat-11-30"},{"book":"mat","chapter":12,"verse":1,"text":"At that time Jesus went through the grainfields on the Sabbath. His disciples became hungry and began to pluck heads of grain and eat.","status":"source_text","id":"mat-12-1"},{"book":"mat","chapter":12,"verse":2,"text":"When the Pharisees saw it, they said to Him, “Behold, Your disciples are doing what is not lawful to do on the Sabbath.”","status":"source_text","id":"mat-12-2"},{"book":"mat","chapter":12,"verse":3,"text":"But He said to them, “Have you not read what David did when he and those with him were hungry?","status":"source_text","id":"mat-12-3"},{"book":"mat","chapter":12,"verse":4,"text":"He entered the house of God and ate the bread of the Presence, which it was not lawful for him or those with him to eat, but only for the priests.","status":"source_text","id":"mat-12-4"},{"book":"mat","chapter":12,"verse":5,"text":"Or have you not read in the Law that on the Sabbath the priests in the temple profane the Sabbath and are guiltless?","status":"source_text","id":"mat-12-5"},{"book":"mat","chapter":12,"verse":6,"text":"But I tell you that something greater than the temple is here.","status":"source_text","id":"mat-12-6"},{"book":"mat","chapter":12,"verse":7,"text":"If you had known what this means, ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.","status":"source_text","id":"mat-12-7"},{"book":"mat","chapter":12,"verse":8,"text":"For the Son of Man is Lord of the Sabbath.”","status":"source_text","id":"mat-12-8"},{"book":"mat","chapter":12,"verse":9,"text":"Departing from there, He went into their synagogue.","status":"source_text","id":"mat-12-9"},{"book":"mat","chapter":12,"verse":10,"text":"And behold, there was a man with a withered hand. They asked Him, “Is it lawful to heal on the Sabbath?” so that they might accuse Him.","status":"source_text","id":"mat-12-10"},{"book":"mat","chapter":12,"verse":11,"text":"He said to them, “What man among you, having one sheep, if it falls into a pit on the Sabbath, will not take hold of it and lift it out?","status":"source_text","id":"mat-12-11"},{"book":"mat","chapter":12,"verse":12,"text":"How much more valuable, then, is a human being than a sheep! Therefore it is lawful to do good on the Sabbath.”","status":"source_text","id":"mat-12-12"},{"book":"mat","chapter":12,"verse":13,"text":"Then He said to the man, “Stretch out your hand.” He stretched it out, and it was restored, healthy like the other.","status":"source_text","id":"mat-12-13"},{"book":"mat","chapter":12,"verse":14,"text":"But the Pharisees went out and took counsel against Him as to how they might destroy Him.","status":"source_text","id":"mat-12-14"},{"book":"mat","chapter":12,"verse":15,"text":"Jesus, knowing this, withdrew from there. Many followed Him, and He healed them all","status":"source_text","id":"mat-12-15"},{"book":"mat","chapter":12,"verse":16,"text":"and warned them not to make Him known.","status":"source_text","id":"mat-12-16"},{"book":"mat","chapter":12,"verse":17,"text":"This was so that what was spoken through Isaiah the prophet might be fulfilled:","status":"source_text","id":"mat-12-17"},{"book":"mat","chapter":12,"verse":18,"text":"“Behold My servant whom I chose, My beloved in whom My soul delights. I will put My Spirit upon Him, and He will proclaim justice to the Gentiles.","status":"source_text","id":"mat-12-18"},{"book":"mat","chapter":12,"verse":19,"text":"He will not quarrel or cry out, nor will anyone hear His voice in the streets.","status":"source_text","id":"mat-12-19"},{"book":"mat","chapter":12,"verse":20,"text":"A bruised reed He will not break, and a smoldering wick He will not extinguish, until He brings justice to victory.","status":"source_text","id":"mat-12-20"},{"book":"mat","chapter":12,"verse":21,"text":"And in His name the Gentiles will hope.”","status":"source_text","id":"mat-12-21"},{"book":"mat","chapter":12,"verse":22,"text":"Then a demon-possessed man who was blind and mute was brought to Him, and He healed him, so that the mute man spoke and saw.","status":"source_text","id":"mat-12-22"},{"book":"mat","chapter":12,"verse":23,"text":"All the crowds were amazed and said, “Can this be the Son of David?”","status":"source_text","id":"mat-12-23"},{"book":"mat","chapter":12,"verse":24,"text":"But when the Pharisees heard it, they said, “This man does not cast out demons except by Beelzebul, ruler of the demons.”","status":"source_text","id":"mat-12-24"},{"book":"mat","chapter":12,"verse":25,"text":"Knowing their thoughts, He said to them, “Every kingdom divided against itself is laid waste, and every city or house divided against itself will not stand.","status":"source_text","id":"mat-12-25"},{"book":"mat","chapter":12,"verse":26,"text":"And if Satan casts out Satan, he is divided against himself. How then will his kingdom stand?","status":"source_text","id":"mat-12-26"},{"book":"mat","chapter":12,"verse":27,"text":"And if I cast out demons by Beelzebul, by whom do your sons cast them out? Therefore they will be your judges.","status":"source_text","id":"mat-12-27"},{"book":"mat","chapter":12,"verse":28,"text":"But if I cast out demons by the Spirit of God, then the kingdom of God has come upon you.","status":"source_text","id":"mat-12-28"},{"book":"mat","chapter":12,"verse":29,"text":"Or how can someone enter the strong man’s house and plunder his possessions unless he first binds the strong man? Then he will plunder his house.","status":"source_text","id":"mat-12-29"},{"book":"mat","chapter":12,"verse":30,"text":"The one who is not with Me is against Me, and the one who does not gather with Me scatters.","status":"source_text","id":"mat-12-30"},{"book":"mat","chapter":12,"verse":31,"text":"Therefore I tell you, every sin and blasphemy will be forgiven people, but blasphemy against the Spirit will not be forgiven.","status":"source_text","id":"mat-12-31"},{"book":"mat","chapter":12,"verse":32,"text":"And whoever speaks a word against the Son of Man will be forgiven; but whoever speaks against the Holy Spirit will not be forgiven, either in this age or in the age to come.","status":"source_text","id":"mat-12-32"},{"book":"mat","chapter":12,"verse":33,"text":"Either make the tree good and its fruit good, or make the tree bad and its fruit bad, for the tree is known by its fruit.","status":"source_text","id":"mat-12-33"},{"book":"mat","chapter":12,"verse":34,"text":"Offspring of vipers! How can you, being evil, speak good things? For out of the abundance of the heart the mouth speaks.","status":"source_text","id":"mat-12-34"},{"book":"mat","chapter":12,"verse":35,"text":"The good person brings good things out of the good treasure, and the evil person brings evil things out of the evil treasure.","status":"source_text","id":"mat-12-35"},{"book":"mat","chapter":12,"verse":36,"text":"But I tell you that for every useless word people speak, they will give an account on the day of judgment.","status":"source_text","id":"mat-12-36"},{"book":"mat","chapter":12,"verse":37,"text":"For by your words you will be justified, and by your words you will be condemned.”","status":"source_text","id":"mat-12-37"},{"book":"mat","chapter":12,"verse":38,"text":"Then some of the scribes and Pharisees answered Him, saying, “Teacher, we want to see a sign from You.”","status":"source_text","id":"mat-12-38"},{"book":"mat","chapter":12,"verse":39,"text":"But He answered them, “An evil and adulterous generation seeks a sign, and no sign will be given to it except the sign of Jonah the prophet.","status":"source_text","id":"mat-12-39"},{"book":"mat","chapter":12,"verse":40,"text":"For just as Jonah was in the belly of the great fish three days and three nights, so the Son of Man will be in the heart of the earth three days and three nights.","status":"source_text","id":"mat-12-40"},{"book":"mat","chapter":12,"verse":41,"text":"The men of Nineveh will rise up at the judgment with this generation and condemn it, because they repented at the proclamation of Jonah; and behold, something greater than Jonah is here.","status":"source_text","id":"mat-12-41"},{"book":"mat","chapter":12,"verse":42,"text":"The queen of the South will rise up at the judgment with this generation and condemn it, because she came from the ends of the earth to hear the wisdom of Solomon; and behold, something greater than Solomon is here.","status":"source_text","id":"mat-12-42"},{"book":"mat","chapter":12,"verse":43,"text":"When the unclean spirit goes out from a person, it passes through waterless places seeking rest and does not find it.","status":"source_text","id":"mat-12-43"},{"book":"mat","chapter":12,"verse":44,"text":"Then it says, ‘I will return to my house from which I came.’ And when it comes, it finds it empty, swept, and put in order.","status":"source_text","id":"mat-12-44"},{"book":"mat","chapter":12,"verse":45,"text":"Then it goes and takes with it seven other spirits more evil than itself, and they enter and dwell there; and the last state of that person becomes worse than the first. So also will it be with this evil generation.”","status":"source_text","id":"mat-12-45"},{"book":"mat","chapter":12,"verse":46,"text":"While He was still speaking to the crowds, behold, His mother and brothers stood outside, seeking to speak to Him.","status":"source_text","id":"mat-12-46"},{"book":"mat","chapter":12,"verse":47,"text":"[Some manuscripts include: Someone said to Him, “Behold, Your mother and Your brothers are standing outside, seeking to speak to You.”]","status":"source_text","id":"mat-12-47"},{"book":"mat","chapter":12,"verse":48,"text":"But He answered the one speaking to Him, “Who is My mother, and who are My brothers?”","status":"source_text","id":"mat-12-48"},{"book":"mat","chapter":12,"verse":49,"text":"And stretching out His hand toward His disciples, He said, “Behold My mother and My brothers!","status":"source_text","id":"mat-12-49"},{"book":"mat","chapter":12,"verse":50,"text":"For whoever does the will of My Father who is in the heavens, that person is My brother and sister and mother.”","status":"source_text","id":"mat-12-50"},{"book":"mat","chapter":13,"verse":
