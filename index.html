rce_text","id":"mrk-14-59"},{"book":"mrk","chapter":14,"verse":60,"text":"The high priest stood up in the middle and asked Jesus, “Have you no answer? What is this testimony against you?”","status":"source_text","id":"mrk-14-60"},{"book":"mrk","chapter":14,"verse":61,"text":"Jesus remained silent and answered nothing. The high priest asked again, “Are you the Messiah, the Son of the Blessed One?”","status":"source_text","id":"mrk-14-61"},{"book":"mrk","chapter":14,"verse":62,"text":"Jesus said, “I am. You will see the Son of Man sitting at the right hand of Power and coming with the clouds of heaven.”","status":"source_text","id":"mrk-14-62"},{"book":"mrk","chapter":14,"verse":63,"text":"The high priest tore his clothes and said, “Why do we need any more witnesses?”","status":"source_text","id":"mrk-14-63"},{"book":"mrk","chapter":14,"verse":64,"text":"“You have heard the blasphemy. What do you think?” They all condemned Jesus as deserving death.","status":"source_text","id":"mrk-14-64"},{"book":"mrk","chapter":14,"verse":65,"text":"Some spat on him, covered his face, struck him with their fists, and said, “Prophesy!” The guards also slapped him.","status":"source_text","id":"mrk-14-65"},{"book":"mrk","chapter":14,"verse":66,"text":"While Peter was below in the courtyard, one of the high priest’s servant girls came by.","status":"source_text","id":"mrk-14-66"},{"book":"mrk","chapter":14,"verse":67,"text":"Seeing Peter warming himself, she looked closely and said, “You too were with Jesus of Nazareth.”","status":"source_text","id":"mrk-14-67"},{"book":"mrk","chapter":14,"verse":68,"text":"Peter denied it: “I neither know nor understand what you are talking about.” He went out into the entrance court.","status":"source_text","id":"mrk-14-68"},{"book":"mrk","chapter":14,"verse":69,"text":"The servant girl saw him and again told the bystanders, “This man is one of them.”","status":"source_text","id":"mrk-14-69"},{"book":"mrk","chapter":14,"verse":70,"text":"He denied it again. A little later, the bystanders said, “Surely you are one of them, for you are a Galilean.”","status":"source_text","id":"mrk-14-70"},{"book":"mrk","chapter":14,"verse":71,"text":"Peter began to call down a curse and swear, “I do not know this man you speak of!”","status":"source_text","id":"mrk-14-71"},{"book":"mrk","chapter":14,"verse":72,"text":"Immediately the rooster crowed a second time. Peter remembered Jesus’ words, “Before the rooster crows twice, you will deny me three times,” and broke down and wept.","status":"source_text","id":"mrk-14-72"},{"book":"mrk","chapter":15,"verse":1,"text":"Early in the morning the chief priests consulted with the elders, scribes, and whole council, bound Jesus, and handed him over to Pilate.","status":"source_text","id":"mrk-15-1"},{"book":"mrk","chapter":15,"verse":2,"text":"Pilate asked, “Are you the king of the Jews?” Jesus answered, “You say so.”","status":"source_text","id":"mrk-15-2"},{"book":"mrk","chapter":15,"verse":3,"text":"The chief priests accused Jesus of many things.","status":"source_text","id":"mrk-15-3"},{"book":"mrk","chapter":15,"verse":4,"text":"Pilate asked again, “Have you no answer? See how many charges they bring against you.”","status":"source_text","id":"mrk-15-4"},{"book":"mrk","chapter":15,"verse":5,"text":"But Jesus made no further reply, and Pilate was amazed.","status":"source_text","id":"mrk-15-5"},{"book":"mrk","chapter":15,"verse":6,"text":"At the festival Pilate would release for them one prisoner whom they requested.","status":"source_text","id":"mrk-15-6"},{"book":"mrk","chapter":15,"verse":7,"text":"A man named Barabbas was imprisoned with rebels who had committed murder during an uprising.","status":"source_text","id":"mrk-15-7"},{"book":"mrk","chapter":15,"verse":8,"text":"The crowd came up and asked Pilate to do for them what he usually did.","status":"source_text","id":"mrk-15-8"},{"book":"mrk","chapter":15,"verse":9,"text":"Pilate asked, “Do you want me to release the king of the Jews for you?”","status":"source_text","id":"mrk-15-9"},{"book":"mrk","chapter":15,"verse":10,"text":"For Pilate knew that the chief priests had handed Jesus over out of envy.","status":"source_text","id":"mrk-15-10"},{"book":"mrk","chapter":15,"verse":11,"text":"But the chief priests stirred up the crowd to have Pilate release Barabbas instead.","status":"source_text","id":"mrk-15-11"},{"book":"mrk","chapter":15,"verse":12,"text":"Pilate asked again, “Then what shall I do with the one you call the king of the Jews?”","status":"source_text","id":"mrk-15-12"},{"book":"mrk","chapter":15,"verse":13,"text":"They shouted again, “Crucify him!”","status":"source_text","id":"mrk-15-13"},{"book":"mrk","chapter":15,"verse":14,"text":"Pilate asked, “What evil has he done?” But they shouted all the louder, “Crucify him!”","status":"source_text","id":"mrk-15-14"},{"book":"mrk","chapter":15,"verse":15,"text":"Wishing to satisfy the crowd, Pilate released Barabbas, had Jesus flogged, and handed him over to be crucified.","status":"source_text","id":"mrk-15-15"},{"book":"mrk","chapter":15,"verse":16,"text":"The soldiers led Jesus into the courtyard of the governor’s residence and called together the whole cohort.","status":"source_text","id":"mrk-15-16"},{"book":"mrk","chapter":15,"verse":17,"text":"They clothed him in purple and set a crown woven from thorns on him.","status":"source_text","id":"mrk-15-17"},{"book":"mrk","chapter":15,"verse":18,"text":"They began to salute him, “Hail, king of the Jews!”","status":"source_text","id":"mrk-15-18"},{"book":"mrk","chapter":15,"verse":19,"text":"They struck his head with a reed, spat on him, and knelt in mock homage.","status":"source_text","id":"mrk-15-19"},{"book":"mrk","chapter":15,"verse":20,"text":"After mocking him, they removed the purple robe, put his own clothes back on him, and led him out to crucify him.","status":"source_text","id":"mrk-15-20"},{"book":"mrk","chapter":15,"verse":21,"text":"They compelled a passerby coming from the country, Simon of Cyrene, the father of Alexander and Rufus, to carry Jesus’ cross.","status":"source_text","id":"mrk-15-21"},{"book":"mrk","chapter":15,"verse":22,"text":"They brought Jesus to Golgotha, which means “Place of the Skull.”","status":"source_text","id":"mrk-15-22"},{"book":"mrk","chapter":15,"verse":23,"text":"They offered him wine mixed with myrrh, but he did not take it.","status":"source_text","id":"mrk-15-23"},{"book":"mrk","chapter":15,"verse":24,"text":"They crucified him and divided his clothes, casting lots to decide what each would take.","status":"source_text","id":"mrk-15-24"},{"book":"mrk","chapter":15,"verse":25,"text":"It was the third hour, about nine in the morning, when they crucified him.","status":"source_text","id":"mrk-15-25"},{"book":"mrk","chapter":15,"verse":26,"text":"The written charge against him read, “The king of the Jews.”","status":"source_text","id":"mrk-15-26"},{"book":"mrk","chapter":15,"verse":27,"text":"With him they crucified two bandits, one at his right and one at his left.","status":"source_text","id":"mrk-15-27"},{"book":"mrk","chapter":15,"verse":28,"text":"—","status":"absent_from_critical_text","id":"mrk-15-28"},{"book":"mrk","chapter":15,"verse":29,"text":"Passersby shook their heads and insulted him: “Aha! You who would destroy the temple and rebuild it in three days,”","status":"source_text","id":"mrk-15-29"},{"book":"mrk","chapter":15,"verse":30,"text":"“save yourself and come down from the cross!”","status":"source_text","id":"mrk-15-30"},{"book":"mrk","chapter":15,"verse":31,"text":"The chief priests and scribes mocked him among themselves: “He saved others, but cannot save himself.”","status":"source_text","id":"mrk-15-31"},{"book":"mrk","chapter":15,"verse":32,"text":"“Let the Messiah, the king of Israel, come down now from the cross, so that we may see and believe.” Those crucified with him also insulted him.","status":"source_text","id":"mrk-15-32"},{"book":"mrk","chapter":15,"verse":33,"text":"From noon until three in the afternoon darkness covered the whole land.","status":"source_text","id":"mrk-15-33"},{"book":"mrk","chapter":15,"verse":34,"text":"At three o’clock Jesus cried loudly, “Eloi, Eloi, lema sabachthani?” which means, “My God, my God, why have you forsaken me?”","status":"source_text","id":"mrk-15-34"},{"book":"mrk","chapter":15,"verse":35,"text":"Some standing there heard it and said, “Look, he is calling Elijah.”","status":"source_text","id":"mrk-15-35"},{"book":"mrk","chapter":15,"verse":36,"text":"Someone ran, soaked a sponge with sour wine, placed it on a reed, and offered him a drink, saying, “Wait; let us see if Elijah comes to take him down.”","status":"source_text","id":"mrk-15-36"},{"book":"mrk","chapter":15,"verse":37,"text":"Jesus gave a loud cry and breathed his last.","status":"source_text","id":"mrk-15-37"},{"book":"mrk","chapter":15,"verse":38,"text":"The temple curtain was torn in two from top to bottom.","status":"source_text","id":"mrk-15-38"},{"book":"mrk","chapter":15,"verse":39,"text":"The centurion standing opposite saw how Jesus died and said, “Truly this man was God’s Son.”","status":"source_text","id":"mrk-15-39"},{"book":"mrk","chapter":15,"verse":40,"text":"Women were watching from a distance, including Mary Magdalene, Mary the mother of James the younger and Joses, and Salome.","status":"source_text","id":"mrk-15-40"},{"book":"mrk","chapter":15,"verse":41,"text":"These women had followed and served him in Galilee; many other women had come up with him to Jerusalem.","status":"source_text","id":"mrk-15-41"},{"book":"mrk","chapter":15,"verse":42,"text":"Evening had come, and it was Preparation Day, the day before the Sabbath.","status":"source_text","id":"mrk-15-42"},{"book":"mrk","chapter":15,"verse":43,"text":"Joseph of Arimathea, a respected council member who awaited God’s kingdom, boldly went to Pilate and asked for Jesus’ body.","status":"source_text","id":"mrk-15-43"},{"book":"mrk","chapter":15,"verse":44,"text":"Pilate was surprised that Jesus was already dead and summoned the centurion to ask whether he had been dead long.","status":"source_text","id":"mrk-15-44"},{"book":"mrk","chapter":15,"verse":45,"text":"After hearing the centurion’s report, Pilate granted the body to Joseph.","status":"source_text","id":"mrk-15-45"},{"book":"mrk","chapter":15,"verse":46,"text":"Joseph bought linen, took Jesus down, wrapped him in it, placed him in a rock-cut tomb, and rolled a stone against its entrance.","status":"source_text","id":"mrk-15-46"},{"book":"mrk","chapter":15,"verse":47,"text":"Mary Magdalene and Mary the mother of Joses saw where he was laid.","status":"source_text","id":"mrk-15-47"},{"book":"mrk","chapter":16,"verse":1,"text":"When the Sabbath was over, Mary Magdalene, Mary the mother of James, and Salome bought spices to anoint Jesus.","status":"source_text","id":"mrk-16-1"},{"book":"mrk","chapter":16,"verse":2,"text":"Very early on the first day of the week, around sunrise, they went to the tomb.","status":"source_text","id":"mrk-16-2"},{"book":"mrk","chapter":16,"verse":3,"text":"They said to one another, “Who will roll away the stone from the tomb’s entrance for us?”","status":"source_text","id":"mrk-16-3"},{"book":"mrk","chapter":16,"verse":4,"text":"Looking up, they saw that the stone, though very large, had already been rolled away.","status":"source_text","id":"mrk-16-4"},{"book":"mrk","chapter":16,"verse":5,"text":"Entering the tomb, they saw a young man in a white robe sitting on the right, and they were alarmed.","status":"source_text","id":"mrk-16-5"},{"book":"mrk","chapter":16,"verse":6,"text":"He said, “Do not be alarmed. You seek Jesus of Nazareth, the crucified one. He has been raised; he is not here. Look at the place where they laid him.”","status":"source_text","id":"mrk-16-6"},{"book":"mrk","chapter":16,"verse":7,"text":"“Go, tell his disciples and Peter, ‘He is going ahead of you to Galilee. There you will see him, just as he told you.’”","status":"source_text","id":"mrk-16-7"},{"book":"mrk","chapter":16,"verse":8,"text":"The women fled from the tomb, trembling and bewildered. They said nothing to anyone, for they were afraid.","status":"source_text","id":"mrk-16-8"},{"book":"mrk","chapter":16,"verse":9,"text":"[After rising early on the first day of the week, Jesus appeared first to Mary Magdalene, from whom he had cast out seven demons.","status":"longer_ending","id":"mrk-16-9"},{"book":"mrk","chapter":16,"verse":10,"text":"She went and told those who had been with him while they mourned and wept.","status":"longer_ending","id":"mrk-16-10"},{"book":"mrk","chapter":16,"verse":11,"text":"When they heard that he was alive and that she had seen him, they did not believe it.","status":"longer_ending","id":"mrk-16-11"},{"book":"mrk","chapter":16,"verse":12,"text":"After this he appeared in a different form to two of them as they walked into the countryside.","status":"longer_ending","id":"mrk-16-12"},{"book":"mrk","chapter":16,"verse":13,"text":"They went back and told the others, but the others did not believe them either.","status":"longer_ending","id":"mrk-16-13"},{"book":"mrk","chapter":16,"verse":14,"text":"Finally Jesus appeared to the Eleven as they reclined at table and rebuked their unbelief and stubbornness, because they had not believed those who had seen him raised.","status":"longer_ending","id":"mrk-16-14"},{"book":"mrk","chapter":16,"verse":15,"text":"He said, “Go into all the world and proclaim the gospel to every creature.”","status":"longer_ending","id":"mrk-16-15"},{"book":"mrk","chapter":16,"verse":16,"text":"“Whoever believes and is baptized will be saved, but whoever does not believe will be condemned.”","status":"longer_ending","id":"mrk-16-16"},{"book":"mrk","chapter":16,"verse":17,"text":"“These signs will accompany believers: in my name they will cast out demons and speak in new tongues.”","status":"longer_ending","id":"mrk-16-17"},{"book":"mrk","chapter":16,"verse":18,"text":"“They will pick up snakes, and if they drink anything deadly it will not harm them; they will lay hands on the sick, and they will recover.”","status":"longer_ending","id":"mrk-16-18"},{"book":"mrk","chapter":16,"verse":19,"text":"After speaking to them, the Lord Jesus was taken up into heaven and sat at God’s right hand.","status":"longer_ending","id":"mrk-16-19"},{"book":"mrk","chapter":16,"verse":20,"text":"They went out and proclaimed everywhere, while the Lord worked with them and confirmed the message by the signs that accompanied it.]","status":"longer_ending","id":"mrk-16-20"}]}];
const $=id=>document.getElementById(id);let bi=0,ch=1,serial=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('book').innerHTML=DATA.map((b,i)=>`<option value="${i}">${esc(b.name)}</option>`).join('');
function stop(){serial++;if(window.speechSynthesis)speechSynthesis.cancel();$('status').textContent='';}
function verseOptions(){const n=DATA[bi].counts[ch-1];$('verse').innerHTML='<option value="0">Verse</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');}
function chapters(){const b=DATA[bi];$('chapter').innerHTML=Array.from({length:b.chapters},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');$('chapter').value=String(ch);verseOptions();}
function render(writeHash=true){stop();const b=DATA[bi];$('book').value=String(bi);$('chapter').value=String(ch);verseOptions();$('bookTitle').textContent=b.name;$('chapterTitle').textContent='Chapter '+ch;let out='';for(const r of b.verses.filter(v=>v.chapter===ch)){if(b.key==='mrk'&&ch===16&&r.verse===9)out+='<p class="section-note">Longer ending · Mark 16:9–20</p>';out+=`<p class="v" id="${r.id}"><span class="num">${r.verse}</span><span class="txt">${esc(r.text)}</span></p>`;}$('verses').innerHTML=out;$('prevBottom').disabled=bi===0&&ch===1;$('nextBottom').disabled=bi===DATA.length-1&&ch===b.chapters;document.title=b.name+' '+ch+' · Our English Bible';if(writeHash)history.replaceState(null,'','#'+b.key+'-'+ch);}
function move(d){ch+=d;if(ch<1){bi--;ch=DATA[bi].chapters;}else if(ch>DATA[bi].chapters){bi++;ch=1;}chapters();render();scrollTo(0,0);}
$('book').onchange=()=>{bi=Number($('book').value);ch=1;chapters();render();scrollTo(0,0)};$('chapter').onchange=()=>{ch=Number($('chapter').value);render();scrollTo(0,0)};$('verse').onchange=()=>{document.querySelectorAll('.target').forEach(n=>n.classList.remove('target'));const n=Number($('verse').value);if(!n)return;const p=$(DATA[bi].key+'-'+ch+'-'+n);if(p){p.classList.add('target');p.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+p.id);}};
$('prevBottom').onclick=()=>move(-1);$('nextBottom').onclick=()=>move(1);let size=23;function setSize(d){size=Math.min(32,Math.max(18,size+d));document.documentElement.style.setProperty('--size',size+'px')}$('smaller').onclick=()=>setSize(-1);$('larger').onclick=()=>setSize(1);
$('menuToggle').onclick=()=>{document.body.classList.toggle('menu-collapsed');$('menuToggle').textContent=document.body.classList.contains('menu-collapsed')?'▾ Open':'▴ Fold'};$('reading').onclick=()=>document.body.classList.add('reading-mode');$('exitReading').onclick=()=>document.body.classList.remove('reading-mode');
$('stop').onclick=stop;$('listen').onclick=()=>{stop();if(!speechSynthesis)return;const token=serial,rows=DATA[bi].verses.filter(v=>v.chapter===ch),go=(i=0)=>{if(token!==serial||i>=rows.length)return;const u=new SpeechSynthesisUtterance(rows[i].text);u.lang='en-US';u.rate=.9;u.onend=()=>go(i+1);speechSynthesis.speak(u)};go()};
function hash(){const m=location.hash.match(/^#([a-z0-9]+)-(\d+)(?:-(\d+))?$/);if(!m)return false;const i=DATA.findIndex(b=>b.key===m[1]),c=Number(m[2]);if(i<0||c<1||c>DATA[i].chapters)return false;bi=i;ch=c;chapters();render(false);if(m[3]){$('verse').value=m[3];$('verse').onchange()}return true}window.addEventListener('hashchange',hash);if(!hash()){chapters();render()}window.addEventListener('beforeunload',stop);
</script></body></html>
