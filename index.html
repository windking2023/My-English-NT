-14-57"},{"book":"mrk","chapter":14,"verse":58,"text":"“We heard him say, ‘I will destroy this temple made with hands, and in three days build another not made with hands.’”","status":"source_text","id":"mrk-14-58"},{"book":"mrk","chapter":14,"verse":59,"text":"Yet even their testimony did not agree.","status":"source_text","id":"mrk-14-59"},{"book":"mrk","chapter":14,"verse":60,"text":"The high priest stood up in the middle and asked Jesus, “Have you no answer? What is this testimony against you?”","status":"source_text","id":"mrk-14-60"},{"book":"mrk","chapter":14,"verse":61,"text":"Jesus remained silent and answered nothing. The high priest asked again, “Are you the Messiah, the Son of the Blessed One?”","status":"source_text","id":"mrk-14-61"},{"book":"mrk","chapter":14,"verse":62,"text":"Jesus said, “I am. You will see the Son of Man sitting at the right hand of Power and coming with the clouds of heaven.”","status":"source_text","id":"mrk-14-62"},{"book":"mrk","chapter":14,"verse":63,"text":"The high priest tore his clothes and said, “Why do we need any more witnesses?”","status":"source_text","id":"mrk-14-63"},{"book":"mrk","chapter":14,"verse":64,"text":"“You have heard the blasphemy. What do you think?” They all condemned Jesus as deserving death.","status":"source_text","id":"mrk-14-64"},{"book":"mrk","chapter":14,"verse":65,"text":"Some spat on him, covered his face, struck him with their fists, and said, “Prophesy!” The guards also slapped him.","status":"source_text","id":"mrk-14-65"},{"book":"mrk","chapter":14,"verse":66,"text":"While Peter was below in the courtyard, one of the high priest’s servant girls came by.","status":"source_text","id":"mrk-14-66"},{"book":"mrk","chapter":14,"verse":67,"text":"Seeing Peter warming himself, she looked closely and said, “You too were with Jesus of Nazareth.”","status":"source_text","id":"mrk-14-67"},{"book":"mrk","chapter":14,"verse":68,"text":"Peter denied it: “I neither know nor understand what you are talking about.” He went out into the entrance court.","status":"source_text","id":"mrk-14-68"},{"book":"mrk","chapter":14,"verse":69,"text":"The servant girl saw him and again told the bystanders, “This man is one of them.”","status":"source_text","id":"mrk-14-69"},{"book":"mrk","chapter":14,"verse":70,"text":"He denied it again. A little later, the bystanders said, “Surely you are one of them, for you are a Galilean.”","status":"source_text","id":"mrk-14-70"},{"book":"mrk","chapter":14,"verse":71,"text":"Peter began to call down a curse and swear, “I do not know this man you speak of!”","status":"source_text","id":"mrk-14-71"},{"book":"mrk","chapter":14,"verse":72,"text":"Immediately the rooster crowed a second time. Peter remembered Jesus’ words, “Before the rooster crows twice, you will deny me three times,” and broke down and wept.","status":"source_text","id":"mrk-14-72"},{"book":"mrk","chapter":15,"verse":1,"text":"Early in the morning the chief priests consulted with the elders, scribes, and whole council, bound Jesus, and handed him over to Pilate.","status":"source_text","id":"mrk-15-1"},{"book":"mrk","chapter":15,"verse":2,"text":"Pilate asked, “Are you the king of the Jews?” Jesus answered, “You say so.”","status":"source_text","id":"mrk-15-2"},{"book":"mrk","chapter":15,"verse":3,"text":"The chief priests accused Jesus of many things.","status":"source_text","id":"mrk-15-3"},{"book":"mrk","chapter":15,"verse":4,"text":"Pilate asked again, “Have you no answer? See how many charges they bring against you.”","status":"source_text","id":"mrk-15-4"},{"book":"mrk","chapter":15,"verse":5,"text":"But Jesus made no further reply, and Pilate was amazed.","status":"source_text","id":"mrk-15-5"},{"book":"mrk","chapter":15,"verse":6,"text":"At the festival Pilate would release for them one prisoner whom they requested.","status":"source_text","id":"mrk-15-6"},{"book":"mrk","chapter":15,"verse":7,"text":"A man named Barabbas was imprisoned with rebels who had committed murder during an uprising.","status":"source_text","id":"mrk-15-7"},{"book":"mrk","chapter":15,"verse":8,"text":"The crowd came up and asked Pilate to do for them what he usually did.","status":"source_text","id":"mrk-15-8"},{"book":"mrk","chapter":15,"verse":9,"text":"Pilate asked, “Do you want me to release the king of the Jews for you?”","status":"source_text","id":"mrk-15-9"},{"book":"mrk","chapter":15,"verse":10,"text":"For Pilate knew that the chief priests had handed Jesus over out of envy.","status":"source_text","id":"mrk-15-10"},{"book":"mrk","chapter":15,"verse":11,"text":"But the chief priests stirred up the crowd to have Pilate release Barabbas instead.","status":"source_text","id":"mrk-15-11"},{"book":"mrk","chapter":15,"verse":12,"text":"Pilate asked again, “Then what shall I do with the one you call the king of the Jews?”","status":"source_text","id":"mrk-15-12"},{"book":"mrk","chapter":15,"verse":13,"text":"They shouted again, “Crucify him!”","status":"source_text","id":"mrk-15-13"},{"book":"mrk","chapter":15,"verse":14,"text":"Pilate asked, “What evil has he done?” But they shouted all the louder, “Crucify him!”","status":"source_text","id":"mrk-15-14"},{"book":"mrk","chapter":15,"verse":15,"text":"Wishing to satisfy the crowd, Pilate released Barabbas, had Jesus flogged, and handed him over to be crucified.","status":"source_text","id":"mrk-15-15"},{"book":"mrk","chapter":15,"verse":16,"text":"The soldiers led Jesus into the courtyard of the governor’s residence and called together the whole cohort.","status":"source_text","id":"mrk-15-16"},{"book":"mrk","chapter":15,"verse":17,"text":"They clothed him in purple and set a crown woven from thorns on him.","status":"source_text","id":"mrk-15-17"},{"book":"mrk","chapter":15,"verse":18,"text":"They began to salute him, “Hail, king of the Jews!”","status":"source_text","id":"mrk-15-18"},{"book":"mrk","chapter":15,"verse":19,"text":"They struck his head with a reed, spat on him, and knelt in mock homage.","status":"source_text","id":"mrk-15-19"},{"book":"mrk","chapter":15,"verse":20,"text":"After mocking him, they removed the purple robe, put his own clothes back on him, and led him out to crucify him.","status":"source_text","id":"mrk-15-20"},{"book":"mrk","chapter":15,"verse":21,"text":"They compelled a passerby coming from the country, Simon of Cyrene, the father of Alexander and Rufus, to carry Jesus’ cross.","status":"source_text","id":"mrk-15-21"},{"book":"mrk","chapter":15,"verse":22,"text":"They brought Jesus to Golgotha, which means “Place of the Skull.”","status":"source_text","id":"mrk-15-22"},{"book":"mrk","chapter":15,"verse":23,"text":"They offered him wine mixed with myrrh, but he did not take it.","status":"source_text","id":"mrk-15-23"},{"book":"mrk","chapter":15,"verse":24,"text":"They crucified him and divided his clothes, casting lots to decide what each would take.","status":"source_text","id":"mrk-15-24"},{"book":"mrk","chapter":15,"verse":25,"text":"It was the third hour, about nine in the morning, when they crucified him.","status":"source_text","id":"mrk-15-25"},{"book":"mrk","chapter":15,"verse":26,"text":"The written charge against him read, “The king of the Jews.”","status":"source_text","id":"mrk-15-26"},{"book":"mrk","chapter":15,"verse":27,"text":"With him they crucified two bandits, one at his right and one at his left.","status":"source_text","id":"mrk-15-27"},{"book":"mrk","chapter":15,"verse":28,"text":"—","status":"absent_from_critical_text","id":"mrk-15-28"},{"book":"mrk","chapter":15,"verse":29,"text":"Passersby shook their heads and insulted him: “Aha! You who would destroy the temple and rebuild it in three days,”","status":"source_text","id":"mrk-15-29"},{"book":"mrk","chapter":15,"verse":30,"text":"“save yourself and come down from the cross!”","status":"source_text","id":"mrk-15-30"},{"book":"mrk","chapter":15,"verse":31,"text":"The chief priests and scribes mocked him among themselves: “He saved others, but cannot save himself.”","status":"source_text","id":"mrk-15-31"},{"book":"mrk","chapter":15,"verse":32,"text":"“Let the Messiah, the king of Israel, come down now from the cross, so that we may see and believe.” Those crucified with him also insulted him.","status":"source_text","id":"mrk-15-32"},{"book":"mrk","chapter":15,"verse":33,"text":"From noon until three in the afternoon darkness covered the whole land.","status":"source_text","id":"mrk-15-33"},{"book":"mrk","chapter":15,"verse":34,"text":"At three o’clock Jesus cried loudly, “Eloi, Eloi, lema sabachthani?” which means, “My God, my God, why have you forsaken me?”","status":"source_text","id":"mrk-15-34"},{"book":"mrk","chapter":15,"verse":35,"text":"Some standing there heard it and said, “Look, he is calling Elijah.”","status":"source_text","id":"mrk-15-35"},{"book":"mrk","chapter":15,"verse":36,"text":"Someone ran, soaked a sponge with sour wine, placed it on a reed, and offered him a drink, saying, “Wait; let us see if Elijah comes to take him down.”","status":"source_text","id":"mrk-15-36"},{"book":"mrk","chapter":15,"verse":37,"text":"Jesus gave a loud cry and breathed his last.","status":"source_text","id":"mrk-15-37"},{"book":"mrk","chapter":15,"verse":38,"text":"The temple curtain was torn in two from top to bottom.","status":"source_text","id":"mrk-15-38"},{"book":"mrk","chapter":15,"verse":39,"text":"The centurion standing opposite saw how Jesus died and said, “Truly this man was God’s Son.”","status":"source_text","id":"mrk-15-39"},{"book":"mrk","chapter":15,"verse":40,"text":"Women were watching from a distance, including Mary Magdalene, Mary the mother of James the younger and Joses, and Salome.","status":"source_text","id":"mrk-15-40"},{"book":"mrk","chapter":15,"verse":41,"text":"These women had followed and served him in Galilee; many other women had come up with him to Jerusalem.","status":"source_text","id":"mrk-15-41"},{"book":"mrk","chapter":15,"verse":42,"text":"Evening had come, and it was Preparation Day, the day before the Sabbath.","status":"source_text","id":"mrk-15-42"},{"book":"mrk","chapter":15,"verse":43,"text":"Joseph of Arimathea, a respected council member who awaited God’s kingdom, boldly went to Pilate and asked for Jesus’ body.","status":"source_text","id":"mrk-15-43"},{"book":"mrk","chapter":15,"verse":44,"text":"Pilate was surprised that Jesus was already dead and summoned the centurion to ask whether he had been dead long.","status":"source_text","id":"mrk-15-44"},{"book":"mrk","chapter":15,"verse":45,"text":"After hearing the centurion’s report, Pilate granted the body to Joseph.","status":"source_text","id":"mrk-15-45"},{"book":"mrk","chapter":15,"verse":46,"text":"Joseph bought linen, took Jesus down, wrapped him in it, placed him in a rock-cut tomb, and rolled a stone against its entrance.","status":"source_text","id":"mrk-15-46"},{"book":"mrk","chapter":15,"verse":47,"text":"Mary Magdalene and Mary the mother of Joses saw where he was laid.","status":"source_text","id":"mrk-15-47"},{"book":"mrk","chapter":16,"verse":1,"text":"When the Sabbath was over, Mary Magdalene, Mary the mother of James, and Salome bought spices to anoint Jesus.","status":"source_text","id":"mrk-16-1"},{"book":"mrk","chapter":16,"verse":2,"text":"Very early on the first day of the week, around sunrise, they went to the tomb.","status":"source_text","id":"mrk-16-2"},{"book":"mrk","chapter":16,"verse":3,"text":"They said to one another, “Who will roll away the stone from the tomb’s entrance for us?”","status":"source_text","id":"mrk-16-3"},{"book":"mrk","chapter":16,"verse":4,"text":"Looking up, they saw that the stone, though very large, had already been rolled away.","status":"source_text","id":"mrk-16-4"},{"book":"mrk","chapter":16,"verse":5,"text":"Entering the tomb, they saw a young man in a white robe sitting on the right, and they were alarmed.","status":"source_text","id":"mrk-16-5"},{"book":"mrk","chapter":16,"verse":6,"text":"He said, “Do not be alarmed. You seek Jesus of Nazareth, the crucified one. He has been raised; he is not here. Look at the place where they laid him.”","status":"source_text","id":"mrk-16-6"},{"book":"mrk","chapter":16,"verse":7,"text":"“Go, tell his disciples and Peter, ‘He is going ahead of you to Galilee. There you will see him, just as he told you.’”","status":"source_text","id":"mrk-16-7"},{"book":"mrk","chapter":16,"verse":8,"text":"The women fled from the tomb, trembling and bewildered. They said nothing to anyone, for they were afraid.","status":"source_text","id":"mrk-16-8"},{"book":"mrk","chapter":16,"verse":9,"text":"[After rising early on the first day of the week, Jesus appeared first to Mary Magdalene, from whom he had cast out seven demons.","status":"longer_ending","id":"mrk-16-9"},{"book":"mrk","chapter":16,"verse":10,"text":"She went and told those who had been with him while they mourned and wept.","status":"longer_ending","id":"mrk-16-10"},{"book":"mrk","chapter":16,"verse":11,"text":"When they heard that he was alive and that she had seen him, they did not believe it.","status":"longer_ending","id":"mrk-16-11"},{"book":"mrk","chapter":16,"verse":12,"text":"After this he appeared in a different form to two of them as they walked into the countryside.","status":"longer_ending","id":"mrk-16-12"},{"book":"mrk","chapter":16,"verse":13,"text":"They went back and told the others, but the others did not believe them either.","status":"longer_ending","id":"mrk-16-13"},{"book":"mrk","chapter":16,"verse":14,"text":"Finally Jesus appeared to the Eleven as they reclined at table and rebuked their unbelief and stubbornness, because they had not believed those who had seen him raised.","status":"longer_ending","id":"mrk-16-14"},{"book":"mrk","chapter":16,"verse":15,"text":"He said, “Go into all the world and proclaim the gospel to every creature.”","status":"longer_ending","id":"mrk-16-15"},{"book":"mrk","chapter":16,"verse":16,"text":"“Whoever believes and is baptized will be saved, but whoever does not believe will be condemned.”","status":"longer_ending","id":"mrk-16-16"},{"book":"mrk","chapter":16,"verse":17,"text":"“These signs will accompany believers: in my name they will cast out demons and speak in new tongues.”","status":"longer_ending","id":"mrk-16-17"},{"book":"mrk","chapter":16,"verse":18,"text":"“They will pick up snakes, and if they drink anything deadly it will not harm them; they will lay hands on the sick, and they will recover.”","status":"longer_ending","id":"mrk-16-18"},{"book":"mrk","chapter":16,"verse":19,"text":"After speaking to them, the Lord Jesus was taken up into heaven and sat at God’s right hand.","status":"longer_ending","id":"mrk-16-19"},{"book":"mrk","chapter":16,"verse":20,"text":"They went out and proclaimed everywhere, while the Lord worked with them and confirmed the message by the signs that accompanied it.]","status":"longer_ending","id":"mrk-16-20"}]},{"key":"luk","name":"Luke","nameKo":"누가복음","chapters":24,"counts":[80,52,38,44,39,49,50,56,62,42,54,59,35,35,32,31,37,43,48,47,38,71,56,53],"verses":[{"book":"luk","chapter":1,"verse":1,"text":"Since many have undertaken to compile an account of the events that have been fulfilled among us,","status":"source_text","id":"luk-1-1"},{"book":"luk","chapter":1,"verse":2,"text":"just as those who from the beginning were eyewitnesses and servants of the word handed them down to us,","status":"source_text","id":"luk-1-2"},{"book":"luk","chapter":1,"verse":3,"text":"it seemed good to me also, having followed all things carefully from the beginning, to write them to you in order, most excellent Theophilus,","status":"source_text","id":"luk-1-3"},{"book":"luk","chapter":1,"verse":4,"text":"so that you may know the certainty of the matters in which you have been instructed.","status":"source_text","id":"luk-1-4"},{"book":"luk","chapter":1,"verse":5,"text":"In the days of Herod, king of Judea, there was a priest named Zechariah, of the division of Abijah; and he had a wife from the daughters of Aaron, and her name was Elizabeth.","status":"source_text","id":"luk-1-5"},{"book":"luk","chapter":1,"verse":6,"text":"And they were both righteous before God, walking blamelessly in all the commandments and ordinances of the Lord.","status":"source_text","id":"luk-1-6"},{"book":"luk","chapter":1,"verse":7,"text":"And they had no child, because Elizabeth was barren, and both were advanced in their days.","status":"source_text","id":"luk-1-7"},{"book":"luk","chapter":1,"verse":8,"text":"Now it happened, while he was serving as priest before God in the order of his division,","status":"source_text","id":"luk-1-8"},{"book":"luk","chapter":1,"verse":9,"text":"according to priestly custom, he was chosen by lot to enter the Lord’s sanctuary and burn incense.","status":"source_text","id":"luk-1-9"},{"book":"luk","chapter":1,"verse":10,"text":"And the whole assembly of the people was praying outside at the hour of incense.","status":"source_text","id":"luk-1-10"},{"book":"luk","chapter":1,"verse":11,"text":"An angel of the Lord appeared to him, standing at the right side of the altar of incense.","status":"source_text","id":"luk-1-11"},{"book":"luk","chapter":1,"verse":12,"text":"And Zechariah was troubled when he saw him, and fear fell upon him.","status":"source_text","id":"luk-1-12"},{"book":"luk","chapter":1,"verse":13,"text":"But the angel said to him, “Do not be afraid, Zechariah, because your petition has been heard, and your wife Elizabeth will bear you a son, and you shall call his name John.”","status":"source_text","id":"luk-1-13"},{"book":"luk","chapter":1,"verse":14,"text":"“And you will have joy and gladness, and many will rejoice at his birth.”","status":"source_text","id":"luk-1-14"},{"book":"luk","chapter":1,"verse":15,"text":"“For he will be great before the Lord, and he shall certainly drink no wine or strong drink, and he will be filled with the Holy Spirit even from his mother’s womb.”","status":"source_text","id":"luk-1-15"},{"book":"luk","chapter":1,"verse":16,"text":"“And he will turn many of the children of Israel back to the Lord their God.”","status":"source_text","id":"luk-1-16"},{"book":"luk","chapter":1,"verse":17,"text":"“And he himself will go before Him in the spirit and power of Elijah, to turn the hearts of fathers to children and the disobedient to the understanding of the righteous, to make ready for the Lord a prepared people.”","status":"source_text","id":"luk-1-17"},{"book":"luk","chapter":1,"verse":18,"text":"And Zechariah said to the angel, “By what shall I know this? For I am an old man, and my wife is advanced in her days.”","status":"source_text","id":"luk-1-18"},{"book":"luk","chapter":1,"verse":19,"text":"And the angel replied, “I am Gabriel, who stands before God. I was sent to speak to you and bring you this good news.”","status":"source_text","id":"luk-1-19"},{"book":"luk","chapter":1,"verse":20,"text":"“And look, you will be silent and unable to speak until the day these things happen. This is because you did not believe my words, which will be fulfilled at their proper time.”","status":"source_text","id":"luk-1-20"},{"book":"luk","chapter":1,"verse":21,"text":"And the people were waiting for Zechariah and wondering why he remained so long in the sanctuary.","status":"source_text","id":"luk-1-21"},{"book":"luk","chapter":1,"verse":22,"text":"He came out unable to speak to them. They realized he had seen a vision in the sanctuary. He kept making signs to them and remained unable to speak.","status":"source_text","id":"luk-1-22"},{"book":"luk","chapter":1,"verse":23,"text":"And when the days of his priestly service were finished, he returned home.","status":"source_text","id":"luk-1-23"},{"book":"luk","chapter":1,"verse":24,"text":"Afterward his wife Elizabeth conceived and kept herself secluded for five months, saying,","status":"source_text","id":"luk-1-24"},{"book":"luk","chapter":1,"verse":25,"text":"“Thus the Lord has done for me in the days when He looked upon me to take away my reproach among people.”","status":"source_text","id":"luk-1-25"},{"book":"luk","chapter":1,"verse":26,"text":"Now in the sixth month the angel Gabriel was sent from God to a town in Galilee named Nazareth,","status":"source_text","id":"luk-1-26"},{"book":"luk","chapter":1,"verse":27,"text":"to a virgin betrothed to a man named Joseph, of the house of David; and the virgin’s name was Mary.","status":"source_text","id":"luk-1-27"},{"book":"luk","chapter":1,"verse":28,"text":"And the angel came to her and said, “Rejoice, favored one. The Lord is with you.”","status":"source_text","id":"luk-1-28"},{"book":"luk","chapter":1,"verse":29,"text":"But she was greatly troubled at the saying and was considering what sort of greeting this might be.","status":"source_text","id":"luk-1-29"},{"book":"luk","chapter":1,"verse":30,"text":"And the angel said, “Do not be afraid, Mary, for you have found favor with God.”","status":"source_text","id":"luk-1-30"},{"book":"luk","chapter":1,"verse":31,"text":"“And look, you will conceive in your womb and bear a son, and you shall call His name Jesus.”","status":"source_text","id":"luk-1-31"},{"book":"luk","chapter":1,"verse":32,"text":"“He will be great and will be called Son of the Most High, and the Lord God will give Him the throne of His father David.”","status":"source_text","id":"luk-1-32"},{"book":"luk","chapter":1,"verse":33,"text":"“And He will reign over the house of Jacob forever, and of His kingdom there will be no end.”","status":"source_text","id":"luk-1-33"},{"book":"luk","chapter":1,"verse":34,"text":"But Mary said to the angel, “How will this be, since I do not know a man?”","status":"source_text","id":"luk-1-34"},{"book":"luk","chapter":1,"verse":35,"text":"And the angel answered and said to her, “The Holy Spirit will come upon you, and the power of the Most High will overshadow you; therefore also the One being born will be called holy, Son of God.”","status":"source_text","id":"luk-1-35"},{"book":"luk","chapter":1,"verse":36,"text":"“And look, your relative Elizabeth too has conceived a son in old age. She who was called barren is now in her sixth month.”","status":"source_text","id":"luk-1-36"},{"book":"luk","chapter":1,"verse":37,"text":"“For no word from God will fail.”","status":"source_text","id":"luk-1-37"},{"book":"luk","chapter":1,"verse":38,"text":"And Mary said, “Look, the bondservant of the Lord; may it happen to me according to your word.” And the angel departed from her.","status":"source_text","id":"luk-1-38"},{"book":"luk","chapter":1,"verse":39,"text":"At that time Mary set out quickly for a town in the hill country of Judea.","status":"source_text","id":"luk-1-39"},{"book":"luk","chapter":1,"verse":40,"text":"And she entered Zechariah’s house and greeted Elizabeth.","status":"source_text","id":"luk-1-40"},{"book":"luk","chapter":1,"verse":41,"text":"And when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit.","status":"source_text","id":"luk-1-41"},{"book":"luk","chapter":1,"verse":42,"text":"And she cried out with a loud cry and said, “Blessed are you among women, and blessed is the fruit of your womb!”","status":"source_text","id":"luk-1-42"},{"book":"luk","chapter":1,"verse":43,"text":"“And how is it that the mother of my Lord comes to me?”","status":"source_text","id":"luk-1-43"},{"book":"luk","chapter":1,"verse":44,"text":"“Look, as soon as your greeting reached my ears, the baby in my womb leaped for joy.”","status":"source_text","id":"luk-1-44"},{"book":"luk","chapter":1,"verse":45,"text":"“And blessed is she who believed that there would be a fulfillment of the things spoken to her from the Lord.”","status":"source_text","id":"luk-1-45"},{"book":"luk","chapter":1,"verse":46,"text":"And Mary said, “My soul magnifies the Lord,”","status":"source_text","id":"luk-1-46"},{"book":"luk","chapter":1,"verse":47,"text":"“And my spirit rejoiced in God my Savior,”","status":"source_text","id":"luk-1-47"},{"book":"luk","chapter":1,"verse":48,"text":"“because He looked upon the lowliness of His bondservant. For look, from now on all generations will call me blessed,”","status":"source_text","id":"luk-1-48"},{"book":"luk","chapter":1,"verse":49,"text":"“because the Mighty One has done great things for me, and holy is His name.”","status":"source_text","id":"luk-1-49"},{"book":"luk","chapter":1,"verse":50,"text":"“And His mercy is from generation to generation to those who fear Him.”","status":"source_text","id":"luk-1-50"},{"book":"luk","chapter":1,"verse":51,"text":"“He has done a mighty deed with His arm; He has scattered the proud in the thought of their hearts.”","status":"source_text","id":"luk-1-51"},{"book":"luk","chapter":1,"verse":52,"text":"“He has brought rulers down from their thrones and lifted up the lowly.”","status":"source_text","id":"luk-1-52"},{"book":"luk","chapter":1,"verse":53,"text":"“He has filled the hungry with good things and sent the rich away empty.”","status":"source_text","id":"luk-1-53"},{"book":"luk","chapter":1,"verse":54,"text":"“He has helped Israel His servant, remembering mercy,”","status":"source_text","id":"luk-1-54"},{"book":"luk","chapter":1,"verse":55,"text":"“just as He spoke to our fathers, to Abraham and to his seed forever.”","status":"source_text","id":"luk-1-55"},{"book":"luk","chapter":1,"verse":56,"text":"Mary stayed with Elizabeth about three months and then returned home.","status":"source_text","id":"luk-1-56"},{"book":"luk","chapter":1,"verse":57,"text":"When Elizabeth’s time to give birth came, she bore a son.","status":"source_text","id":"luk-1-57"},{"book":"luk","chapter":1,"verse":58,"text":"And her neighbors and relatives heard that the Lord had shown her great mercy, and they rejoiced with her.","status":"source_text","id":"luk-1-58"},{"book":"luk","chapter":1,"verse":59,"text":"And on the eighth day they came to circumcise the child, and intended to call him Zechariah after his father.","status":"source_text","id":"luk-1-59"},{"book":"luk","chapter":1,"verse":60,"text":"But his mother answered, “No; he shall be called John.”","status":"source_text","id":"luk-1-60"},{"book":"luk","chapter":1,"verse":61,"text":"And they said to her, “No one among your relatives has that name.”","status":"source_text","id":"luk-1-61"},{"book":"luk","chapter":1,"verse":62,"text":"They made signs to his father, asking what he wanted the child to be called.","status":"source_text","id":"luk-1-62"},{"book":"luk","chapter":1,"verse":63,"text":"And he asked for a writing tablet and wrote, saying, “His name is John.” And they all marveled.","status":"source_text","id":"luk-1-63"},{"book":"luk","chapter":1,"verse":64,"text":"At once his mouth was opened and his tongue freed, and he began speaking and praising God.","status":"source_text","id":"luk-1-64"},{"book":"luk","chapter":1,"verse":65,"text":"And fear came upon all their neighbors, and all these matters were being discussed throughout the hill country of Judea.","status":"source_text","id":"luk-1-65"},{"book":"luk","chapter":1,"verse":66,"text":"And everyone who heard these things stored them in their hearts, asking, “What will this child become?” For the Lord’s hand was with him.","status":"source_text","id":"luk-1-66"},{"book":"luk","chapter":1,"verse":67,"text":"And his father Zechariah was filled with the Holy Spirit and prophesied,","status":"source_text","id":"luk-1-67"},{"book":"luk","chapter":1,"verse":68,"text":"“Blessed be the Lord, the God of Israel, because He has visited and accomplished redemption for His people,”","status":"source_text","id":"luk-1-68"},{"book":"luk","chapter":1,"verse":69,"text":"“and has raised up a horn of salvation for us in the house of David His servant,”","status":"source_text","id":"luk-1-69"},{"book":"luk","chapter":1,"verse":70,"text":"“just as He spoke through the mouth of His holy prophets from of old,”","status":"source_text","id":"luk-1-70"},{"book":"luk","chapter":1,"verse":71,"text":"“salvation from our enemies and from the hand of all who hate us,”","status":"source_text","id":"luk-1-71"},{"book":"luk","chapter":1,"verse":72,"text":"“to show mercy to our fathers and to remember His holy covenant,”","status":"source_text","id":"luk-1-72"},{"book":"luk","chapter":1,"verse":73,"text":"“the oath that He swore to Abraham our father, to grant us,”","status":"source_text","id":"luk-1-73"},{"book":"luk","chapter":1,"verse":74,"text":"“having been rescued from the hand of enemies, to serve Him without fear,”","status":"source_text","id":"luk-1-74"},{"book":"luk","chapter":1,"verse":75,"text":"“in holiness and righteousness before Him all our days.”","status":"source_text","id":"luk-1-75"},{"book":"luk","chapter":1,"verse":76,"text":"“And you, child, will be called a prophet of the Most High, for you will go before the Lord to prepare His ways,”","status":"source_text","id":"luk-1-76"},{"book":"luk","chapter":1,"verse":77,"text":"“to give knowledge of salvation to His people in the forgiveness of their sins,”","status":"source_text","id":"luk-1-77"},{"book":"luk","chapter":1,"verse":78,"text":"“because of the tender mercy of our God, by which the dawn from on high will visit us,”","status":"source_text","id":"luk-1-78"},{"book":"luk","chapter":1,"verse":79,"text":"“to shine upon those sitting in darkness and the shadow of death, to direct our feet into the way of peace.”","status":"source_text","id":"luk-1-79"},{"book":"luk","chapter":1,"verse":80,"text":"The child grew and became strong in spirit; he lived in the wilderness until the day he appeared before Israel.","status":"source_text","id":"luk-1-80"},{"book":"luk","chapter":2,"verse":1,"text":"Now it happened in those days that a decree went out from Caesar Augustus for all the inhabited world to be registered.","status":"source_text","id":"luk-2-1"},{"book":"luk","chapter":2,"verse":2,"text":"This was the first registration when Quirinius governed Syria.","status":"source_text","id":"luk-2-2"},{"book":"luk","chapter":2,"verse":3,"text":"And all were going to be registered, each to his own town.","status":"source_text","id":"luk-2-3"},{"book":"luk","chapter":2,"verse":4,"text":"Joseph too went up from Nazareth in Galilee to Judea, to David’s town called Bethlehem, because he belonged to David’s house and family.","status":"source_text","id":"luk-2-4"},{"book":"luk","chapter":2,"verse":5,"text":"He went to register with Mary, his betrothed, who was pregnant.","status":"source_text","id":"luk-2-5"},{"book":"luk","chapter":2,"verse":6,"text":"While they were there, the time came for her to give birth.","status":"source_text","id":"luk-2-6"},{"book":"luk","chapter":2,"verse":7,"text":"And she bore her firstborn Son, and wrapped Him in cloths and laid Him in a manger, because there was no place for them in the guest room.","status":"source_text","id":"luk-2-7"},{"book":"luk","chapter":2,"verse":8,"text":"And in that region shepherds stayed out in the fields, keeping watch over their flock by night.","status":"source_text","id":"luk-2-8"},{"book":"luk","chapter":2,"verse":9,"text":"And an angel of the Lord stood before them and the Lord’s glory shone around them, and they were terrified.","status":"source_text","id":"luk-2-9"},{"book":"luk","chapter":2,"verse":10,"text":"And the angel said to them, “Do not be afraid, for look, I bring you good news of great joy, which will be for all the people,”","status":"source_text","id":"luk-2-10"},{"book":"luk","chapter":2,"verse":11,"text":"“because today a Savior was born for you, who is Christ the Lord, in the town of David.”","status":"source_text","id":"luk-2-11"},{"book":"luk","chapter":2,"verse":12,"text":"“And this is the sign for you: you will find a baby wrapped in cloths and lying in a manger.”","status":"source_text","id":"luk-2-12"},{"book":"luk","chapter":2,"verse":13,"text":"And suddenly there was with the angel a multitude of the heavenly host, praising God and saying,","status":"source_text","id":"luk-2-13"},{"book":"luk","chapter":2,"verse":14,"text":"“Glory to God in the highest, and on earth peace among people of His good pleasure!”","status":"source_text","id":"luk-2-14"},{"book":"luk","chapter":2,"verse":15,"text":"And when the angels left them and went into heaven, the shepherds said to one another, “Let us go to Bethlehem and see what has happened, which the Lord has made known to us.”","status":"source_text","id":"luk-2-15"},{"book":"luk","chapter":2,"verse":16,"text":"And they hurried away and found Mary and Joseph, and the baby lying in the manger.","status":"source_text","id":"luk-2-16"},{"book":"luk","chapter":2,"verse":17,"text":"When they saw Him, they made known what had been told them about this child.","status":"source_text","id":"luk-2-17"},{"book":"luk","chapter":2,"verse":18,"text":"And all who heard it were amazed at what the shepherds told them.","status":"source_text","id":"luk-2-18"},{"book":"luk","chapter":2,"verse":19,"text":"Mary, however, treasured all these words and pondered them in her heart.","status":"source_text","id":"luk-2-19"},{"book":"luk","chapter":2,"verse":20,"text":"And the shepherds returned, glorifying and praising God for all they had heard and seen, just as it had been told them.","status":"source_text","id":"luk-2-20"},{"book":"luk","chapter":2,"verse":21,"text":"And when eight days were completed for His circumcision, His name was called Jesus, the name given by the angel before He was conceived in the womb.","status":"source_text","id":"luk-2-21"},{"book":"luk","chapter":2,"verse":22,"text":"And when the days of their purification according to the law of Moses were completed, they brought Him up to Jerusalem to present Him to the Lord,","status":"source_text","id":"luk-2-22"},{"book":"luk","chapter":2,"verse":23,"text":"As the law of the Lord says, “Every male who opens the womb shall be called holy to the Lord.”","status":"source_text","id":"luk-2-23"},{"book":"luk","chapter":2,"verse":24,"text":"and to offer a sacrifice according to what is said in the law of the Lord, “A pair of turtledoves or two young pigeons.”","status":"source_text","id":"luk-2-24"},{"book":"luk","chapter":2,"verse":25,"text":"Now there was a man in Jerusalem named Simeon. This man was righteous and devout, awaiting Israel’s consolation, and the Holy Spirit was upon him.","status":"source_text","id":"luk-2-25"},{"book":"luk","chapter":2,"verse":26,"text":"And it had been revealed to him by the Holy Spirit that he would not see death before he saw the Christ of the Lord.","status":"source_text","id":"luk-2-26"},{"book":"luk","chapter":2,"verse":27,"text":"And he came in the Spirit into the temple; and when the parents brought in the child Jesus to do for Him according to the custom of the law,","status":"source_text","id":"luk-2-27"},{"book":"luk","chapter":2,"verse":28,"text":"And he himself received Him into his arms and blessed God and said,","status":"source_text","id":"luk-2-28"},{"book":"luk","chapter":2,"verse":29,"text":"“Now You are releasing Your bondservant, Master, according to Your word, in peace,”","status":"source_text","id":"luk-2-29"},{"book":"luk","chapter":2,"verse":30,"text":"“because my eyes have seen Your salvation,”","status":"source_text","id":"luk-2-30"},{"book":"luk","chapter":2,"verse":31,"text":"“which You have prepared before the face of all peoples,”","status":"source_text","id":"luk-2-31"},{"book":"luk","chapter":2,"verse":32,"text":"“a light for revelation to the nations and the glory of Your people Israel.”","status":"source_text","id":"luk-2-32"},{"book":"luk","chapter":2,"verse":33,"text":"And His father and mother were marveling at the things being spoken about Him.","status":"source_text","id":"luk-2-33"},{"book":"luk","chapter":2,"verse":34,"text":"And Simeon blessed them and said to Mary His mother, “Look, this One is appointed for the falling and rising of many in Israel, and for a sign that is opposed,”","status":"source_text","id":"luk-2-34"},{"book":"luk","chapter":2,"verse":35,"text":"“and a sword will pierce through your own soul also, so that thoughts from many hearts may be revealed.”","status":"source_text","id":"luk-2-35"},{"book":"luk","chapter":2,"verse":36,"text":"And there was a prophetess, Anna, daughter of Phanuel, of the tribe of Asher. She was advanced in many days, having lived with a husband seven years from her virginity,","status":"source_text","id":"luk-2-36"},{"book":"luk","chapter":2,"verse":37,"text":"and she was a widow until eighty-four years of age. She did not depart from the temple, serving with fastings and petitions night and day.","status":"source_text","id":"luk-2-37"},{"book":"luk","chapter":2,"verse":38,"text":"And coming up at that moment, she gave thanks to God and spoke about the child to all who awaited Jerusalem’s redemption.","status":"source_text","id":"luk-2-38"},{"book":"luk","chapter":2,"verse":39,"text":"And when they had completed all things according to the law of the Lord, they returned to Galilee, to their own town, Nazareth.","status":"source_text","id":"luk-2-39"},{"book":"luk","chapter":2,"verse":40,"text":"The child grew and became strong, filled with wisdom, and God’s favor was upon Him.","status":"source_text","id":"luk-2-40"},{"book":"luk","chapter":2,"verse":41,"text":"And His parents went to Jerusalem every year for the Passover festival.","status":"source_text","id":"luk-2-41"},{"book":"luk","chapter":2,"verse":42,"text":"And when He was twelve years old, they went up according to the festival custom.","status":"source_text","id":"luk-2-42"},{"book":"luk","chapter":2,"verse":43,"text":"And when the festival days ended and they started home, the boy Jesus stayed in Jerusalem, but His parents did not know it.","status":"source_text","id":"luk-2-43"},{"book":"luk","chapter":2,"verse":44,"text":"Thinking He was with the traveling group, they went a day’s journey, then searched for Him among their relatives and acquaintances.","status":"source_text","id":"luk-2-44"},{"book":"luk","chapter":2,"verse":45,"text":"And when they did not find Him, they returned to Jerusalem to look for Him.","status":"source_text","id":"luk-2-45"},{"book":"luk","chapter":2,"verse":46,"text":"And after three days they found Him in the temple, sitting among the teachers, listening to them and asking them questions.","status":"source_text","id":"luk-2-46"},{"book":"luk","chapter":2,"verse":47,"text":"Everyone who heard Him was amazed at His understanding and His answers.","status":"source_text","id":"luk-2-47"},{"book":"luk","chapter":2,"verse":48,"text":"And seeing Him, they were astonished, and His mother said to Him, “Child, why did You do this to us? Look, Your father and I were seeking You in distress.”","status":"source_text","id":"luk-2-48"},{"book":"luk","chapter":2,"verse":49,"text":"And He said to them, “Why were you looking for Me? Did you not know that I must be about My Father’s affairs?”","status":"source_text","id":"luk-2-49"},{"book":"luk","chapter":2,"verse":50,"text":"But they did not understand what He said to them.","status":"source_text","id":"luk-2-50"},{"book":"luk","chapter":2,"verse":51,"text":"And Jesus went down with them to Nazareth and remained obedient to them. His mother treasured all these things in her heart.","status":"source_text","id":"luk-2-51"},{"book":"luk","chapter":2,"verse":52,"text":"And Jesus advanced in wisdom and stature, and in favor with God and people.","status":"source_text","id":"luk-2-52"},{"book":"luk","chapter":3,"verse":1,"text":"Now in the fifteenth year of the reign of Tiberius Caesar, when Pontius Pilate was governor of Judea, and Herod tetrarch of Galilee, and his brother Philip tetrarch of the region of Iturea and Trachonitis, and Lysanias tetrarch of Abilene,","status":"source_text","id":"luk-3-1"},{"book":"luk","chapter":3,"verse":2,"text":"in the high priesthood of Annas and Caiaphas, the word of God came to John, son of Zechariah, in the wilderness.","status":"source_text","id":"luk-3-2"},{"book":"luk","chapter":3,"verse":3,"text":"And John went through all the region around the Jordan, proclaiming a baptism of repentance for forgiveness of sins.","status":"source_text","id":"luk-3-3"},{"book":"luk","chapter":3,"verse":4,"text":"As it is written in the book of the words of Isaiah the prophet, “A voice of one crying in the wilderness: Prepare the way of the Lord; make His paths straight.”","status":"source_text","id":"luk-3-4"},{"book":"luk","chapter":3,"verse":5,"text":"“Every valley will be filled and every mountain and hill made low; winding places will become straight and rough roads smooth.”","status":"source_text","id":"luk-3-5"},{"book":"luk","chapter":3,"verse":6,"text":"“And all flesh will see the salvation of God.”","status":"source_text","id":"luk-3-6"},{"book":"luk","chapter":3,"verse":7,"text":"John said to the crowds coming to be baptized, “Brood of vipers! Who warned you to flee the coming wrath?”","status":"source_text","id":"luk-3-7"},{"book":"luk","chapter":3,"verse":8,"text":"“Bear fruit worthy of repentance. Do not begin to say to yourselves, ‘Abraham is our father.’ I tell you that God can raise children for Abraham from these stones.”","status":"source_text","id":"luk-3-8"},{"book":"luk","chapter":3,"verse":9,"text":"“The axe already lies at the roots of the trees. Every tree that fails to bear good fruit is cut down and thrown into the fire.”","status":"source_text","id":"luk-3-9"},{"book":"luk","chapter":3,"verse":10,"text":"And the crowds asked him, “Then what should we do?”","status":"source_text","id":"luk-3-10"},{"book":"luk","chapter":3,"verse":11,"text":"John answered, “Whoever has two tunics should share with someone who has none, and whoever has food should do likewise.”","status":"source_text","id":"luk-3-11"},{"book":"luk","chapter":3,"verse":12,"text":"Tax collectors also came to be baptized and asked, “Teacher, what should we do?”","status":"source_text","id":"luk-3-12"},{"book":"luk","chapter":3,"verse":13,"text":"He told them, “Collect no more than the amount appointed for you.”","status":"source_text","id":"luk-3-13"},{"book":"luk","chapter":3,"verse":14,"text":"Soldiers too asked him, “What should we do?” He told them, “Do not extort from anyone by threats or false accusation, and be content with your pay.”","status":"source_text","id":"luk-3-14"},{"book":"luk","chapter":3,"verse":15,"text":"As the people waited expectantly, all wondered in their hearts about John, whether he might be the Christ.","status":"source_text","id":"luk-3-15"},{"book":"luk","chapter":3,"verse":16,"text":"John answered them all, saying, “I indeed baptize you with water, but One stronger than I is coming, whose sandal strap I am not worthy to untie. He will baptize you with the Holy Spirit and fire.”","status":"source_text","id":"luk-3-16"},{"book":"luk","chapter":3,"verse":17,"text":"“His winnowing fork is in His hand, to clear His threshing floor and gather the wheat into His barn, but the chaff He will burn with unquenchable fire.”","status":"source_text","id":"luk-3-17"},{"book":"luk","chapter":3,"verse":18,"text":"With many other appeals John proclaimed the good news to the people.","status":"source_text","id":"luk-3-18"},{"book":"luk","chapter":3,"verse":19,"text":"But when John reproved Herod the tetrarch over his brother’s wife Herodias and all the other evils Herod had done,","status":"source_text","id":"luk-3-19"},{"book":"luk","chapter":3,"verse":20,"text":"Herod added this to them all: he shut John up in prison.","status":"source_text","id":"luk-3-20"},{"book":"luk","chapter":3,"verse":21,"text":"When all the people were being baptized, Jesus too was baptized. As He prayed, heaven opened,","status":"source_text","id":"luk-3-21"},{"book":"luk","chapter":3,"verse":22,"text":"and the Holy Spirit descended upon Him in bodily form like a dove, and a voice came from heaven, “You are My beloved Son; in You I am well pleased.”","status":"source_text","id":"luk-3-22"},{"book":"luk","chapter":3,"verse":23,"text":"And Jesus Himself, when He began, was about thirty years old, being the son, as was supposed, of Joseph, of Heli,","status":"source_text","id":"luk-3-23"},{"book":"luk","chapter":3,"verse":24,"text":"of Matthat, of Levi, of Melchi, of Jannai, of Joseph,","status":"source_text","id":"luk-3-24"},{"book":"luk","chapter":3,"verse":25,"text":"of Mattathias, of Amos, of Nahum, of Esli, of Naggai,","status":"source_text","id":"luk-3-25"},{"book":"luk","chapter":3,"verse":26,"text":"of Maath, of Mattathias, of Semein, of Josech, of Joda,","status":"source_text","id":"luk-3-26"},{"book":"luk","chapter":3,"verse":27,"text":"of Joanan, of Rhesa, of Zerubbabel, of Shealtiel, of Neri,","status":"source_text","id":"luk-3-27"},{"book":"luk","chapter":3,"verse":28,"text":"of Melchi, of Addi, of Cosam, of Elmadam, of Er,","status":"source_text","id":"luk-3-28"},{"book":"luk","chapter":3,"verse":29,"text":"of Jesus, of Eliezer, of Jorim, of Matthat, of Levi,","status":"source_text","id":"luk-3-29"},{"book":"luk","chapter":3,"verse":30,"text":"of Simeon, of Judah, of Joseph, of Jonam, of Eliakim,","status":"source_text","id":"luk-3-30"},{"book":"luk","chapter":3,"verse":31,"text":"of Melea, of Menna, of Mattatha, of Nathan, of David,","status":"source_text","id":"luk-3-31"},{"book":"luk","chapter":3,"verse":32,"text":"of Jesse, of Jobel, of Boaz, of Sala, of Nahshon,","status":"source_text","id":"luk-3-32"},{"book":"luk","chapter":3,"verse":33,"text":"of Amminadab, of Admin, of Arni, of Hezron, of Perez, of Judah,","status":"source_text","id":"luk-3-33"},{"book":"luk","chapter":3,"verse":34,"text":"of Jacob, of Isaac, of Abraham, of Terah, of Nahor,","status":"source_text","id":"luk-3-34"},{"book":"luk","chapter":3,"verse":35,"text":"of Serug, of Reu, of Peleg, of Eber, of Sala,","status":"source_text","id":"luk-3-35"},{"book":"luk","chapter":3,"verse":36,"text":"of Cainan, of Arphaxad, of Shem, of Noah, of Lamech,","status":"source_text","id":"luk-3-36"},{"book":"luk","chapter":3,"verse":37,"text":"of Methuselah, of Enoch, of Jared, of Mahalalel, of Cainan,","status":"source_text","id":"luk-3-37"},{"book":"luk","chapter":3,"verse":38,"text":"of Enos, of Seth, of Adam, of God.","status":"source_text","id":"luk-3-38"},{"book":"luk","chapter":4,"verse":1,"text":"Full of the Holy Spirit, Jesus returned from the Jordan and was led by the Spirit in the wilderness.","status":"source_text","id":"luk-4-1"},{"book":"luk","chapter":4,"verse":2,"text":"For forty days He was tested by the devil. He ate nothing during those days, and when they ended He was hungry.","status":"source_text","id":"luk-4-2"},{"book":"luk","chapter":4,"verse":3,"text":"The devil said, “If You are the Son of God, tell this stone to become bread.”","status":"source_text","id":"luk-4-3"},{"book":"luk","chapter":4,"verse":4,"text":"And Jesus answered him, “It is written, ‘Man shall not live on bread alone.’”","status":"source_text","id":"luk-4-4"},{"book":"luk","chapter":4,"verse":5,"text":"And the devil took Him up and showed Him all the kingdoms of the world in an instant.","status":"source_text","id":"luk-4-5"},{"book":"luk","chapter":4,"verse":6,"text":"And the devil said to Him, “I will give You all this authority and the glory of those kingdoms, for it has been handed over to me, and I give it to whomever I wish.”","status":"source_text","id":"luk-4-6"},{"book":"luk","chapter":4,"verse":7,"text":"“So if You bow down before me, it will all be Yours.”","status":"source_text","id":"luk-4-7"},{"book":"luk","chapter":4,"verse":8,"text":"And Jesus answered and said to him, “It is written, ‘You shall worship the Lord your God, and Him alone you shall serve.’”","status":"source_text","id":"luk-4-8"},{"book":"luk","chapter":4,"verse":9,"text":"The devil brought Him to Jerusalem and set Him on the temple’s high point. Then He said, “If You are the Son of God, throw Yourself down from here.”","status":"source_text","id":"luk-4-9"},{"book":"luk","chapter":4,"verse":10,"text":"“For it is written, ‘He will command His angels concerning You, to guard You,’”","status":"source_text","id":"luk-4-10"},{"book":"luk","chapter":4,"verse":11,"text":"“and, ‘On their hands they will carry You, lest You strike Your foot against a stone.’”","status":"source_text","id":"luk-4-11"},{"book":"luk","chapter":4,"verse":12,"text":"And Jesus answered and said to him, “It is said, ‘You shall not put the Lord your God to the test.’”","status":"source_text","id":"luk-4-12"},{"book":"luk","chapter":4,"verse":13,"text":"And having finished every temptation, the devil left Jesus until an opportune time.","status":"source_text","id":"luk-4-13"},{"book":"luk","chapter":4,"verse":14,"text":"And Jesus returned to Galilee in the power of the Spirit, and news about Him spread through the entire surrounding region.","status":"source_text","id":"luk-4-14"},{"book":"luk","chapter":4,"verse":15,"text":"And He taught in their synagogues and was praised by everyone.","status":"source_text","id":"luk-4-15"},{"book":"luk","chapter":4,"verse":16,"text":"And Jesus came to Nazareth, where He had been brought up. As was His custom, He entered the synagogue on the Sabbath and stood to read.","status":"source_text","id":"luk-4-16"},{"book":"luk","chapter":4,"verse":17,"text":"And the scroll of the prophet Isaiah was handed to Him; He unrolled it and found the place where it was written:","status":"source_text","id":"luk-4-17"},{"book":"luk","chapter":4,"verse":18,"text":"“The Spirit of the Lord is upon Me, because He anointed Me to bring good news to the poor; He has sent Me to proclaim release to captives and recovery of sight to the blind, to send the oppressed away in release,”","status":"source_text","id":"luk-4-18"},{"book":"luk","chapter":4,"verse":19,"text":"“to proclaim the acceptable year of the Lord.”","status":"source_text","id":"luk-4-19"},{"book":"luk","chapter":4,"verse":20,"text":"And He rolled up the scroll, gave it back to the attendant, and sat down. Everyone in the synagogue fixed their eyes on Him.","status":"source_text","id":"luk-4-20"},{"book":"luk","chapter":4,"verse":21,"text":"He began to tell them, “Today this scripture has been fulfilled in your hearing.”","status":"source_text","id":"luk-4-21"},{"book":"luk","chapter":4,"verse":22,"text":"And everyone spoke well of Him and marveled at the gracious words from His mouth. They asked, “Is this not Joseph’s son?”","status":"source_text","id":"luk-4-22"},{"book":"luk","chapter":4,"verse":23,"text":"And He said to them, “You will surely say this proverb to Me, ‘Physician, heal yourself. Whatever we heard happened in Capernaum, do here also in Your hometown.’”","status":"source_text","id":"luk-4-23"},{"book":"luk","chapter":4,"verse":24,"text":"He added, “Truly I tell you, no prophet is welcomed in his hometown.”","status":"source_text","id":"luk-4-24"},{"book":"luk","chapter":4,"verse":25,"text":"“Truly I tell you, in Elijah’s days there were many widows in Israel. The sky was shut for three years and six months, and a severe famine came over all the land.”","status":"source_text","id":"luk-4-25"},{"book":"luk","chapter":4,"verse":26,"text":"“Yet Elijah was sent to none of them, but to a widow in Zarephath of Sidon.”","status":"source_text","id":"luk-4-26"},{"book":"luk","chapter":4,"verse":27,"text":"“And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.”","status":"source_text","id":"luk-4-27"},{"book":"luk","chapter":4,"verse":28,"text":"And everyone in the synagogue was filled with anger when they heard this.","status":"source_text","id":"luk-4-28"},{"book":"luk","chapter":4,"verse":29,"text":"And they rose and drove Jesus out of town. They led Him to the edge of the hill on which their town was built to throw Him down.","status":"source_text","id":"luk-4-29"},{"book":"luk","chapter":4,"verse":30,"text":"But Jesus passed through their midst and went on His way.","status":"source_text","id":"luk-4-30"},{"book":"luk","chapter":4,"verse":31,"text":"And Jesus went down to Capernaum, a town in Galilee, and taught the people on the Sabbath.","status":"source_text","id":"luk-4-31"},{"book":"luk","chapter":4,"verse":32,"text":"And they were astonished at His teaching because His word carried authority.","status":"source_text","id":"luk-4-32"},{"book":"luk","chapter":4,"verse":33,"text":"And in the synagogue was a man with the spirit of an unclean demon, and he shouted loudly:","status":"source_text","id":"luk-4-33"},{"book":"luk","chapter":4,"verse":34,"text":"“Ah! Jesus of Nazareth, what have You to do with us? Have You come to destroy us? I know who You are: the Holy One of God!”","status":"source_text","id":"luk-4-34"},{"book":"luk","chapter":4,"verse":35,"text":"And Jesus rebuked the spirit, saying, “Be silent and come out of him!” The demon threw the man down in the midst and came out, without hurting him at all.","status":"source_text","id":"luk-4-35"},{"book":"luk","chapter":4,"verse":36,"text":"And everyone was amazed and said to one another, “What kind of word is this? With authority and power He commands the unclean spirits, and they come out!”","status":"source_text","id":"luk-4-36"},{"book":"luk","chapter":4,"verse":37,"text":"And news about Jesus spread throughout the surrounding region.","status":"source_text","id":"luk-4-37"},{"book":"luk","chapter":4,"verse":38,"text":"Jesus left the synagogue and entered Simon’s house. Simon’s mother-in-law was suffering from a high fever, and they appealed to Jesus on her behalf.","status":"source_text","id":"luk-4-38"},{"book":"luk","chapter":4,"verse":39,"text":"And Jesus stood over her and rebuked the fever. Then it left her. She rose at once and served them.","status":"source_text","id":"luk-4-39"},{"book":"luk","chapter":4,"verse":40,"text":"At sunset people brought to Jesus those suffering from various diseases. He laid hands on each of them and healed them.","status":"source_text","id":"luk-4-40"},{"book":"luk","chapter":4,"verse":41,"text":"Demons also came out of many, shouting, “You are the Son of God!” He rebuked them and would not let them speak, because they knew He was the Christ.","status":"source_text","id":"luk-4-41"},{"book":"luk","chapter":4,"verse":42,"text":"At daybreak Jesus went out to a deserted place. The crowds sought Him, came to Him, and tried to keep Him from leaving them.","status":"source_text","id":"luk-4-42"},{"book":"luk","chapter":4,"verse":43,"text":"Jesus said, “I must bring the good news of the kingdom of God to the other towns too. That is why I was sent.”","status":"source_text","id":"luk-4-43"},{"book":"luk","chapter":4,"verse":44,"text":"And He continued proclaiming in the synagogues of Judea.","status":"source_text","id":"luk-4-44"},{"book":"luk","chapter":5,"verse":1,"text":"While the crowd pressed around Jesus to hear the word of God, He stood beside Lake Gennesaret.","status":"source_text","id":"luk-5-1"},{"book":"luk","chapter":5,"verse":2,"text":"And He saw two boats at the shore; the fishermen had stepped out and were washing their nets.","status":"source_text","id":"luk-5-2"},{"book":"luk","chapter":5,"verse":3,"text":"And He entered one of the boats, which was Simon’s, and asked him to put out a little from the land; and sitting down, He was teaching the crowds from the boat.","status":"source_text","id":"luk-5-3"},{"book":"luk","chapter":5,"verse":4,"text":"When He had finished speaking, He told Simon, “Put out into deep water and lower your nets for a catch.”","status":"source_text","id":"luk-5-4"},{"book":"luk","chapter":5,"verse":5,"text":"And Simon answered, “Master, we worked all night and caught nothing. Yet at your word I will lower the nets.”","status":"source_text","id":"luk-5-5"},{"book":"luk","chapter":5,"verse":6,"text":"And when they did so, they caught an immense number of fish, and the nets began to tear.","status":"source_text","id":"luk-5-6"},{"book":"luk","chapter":5,"verse":7,"text":"And they signaled their partners in the other boat to come and help. The partners came and filled both boats so full that they began to sink.","status":"source_text","id":"luk-5-7"},{"book":"luk","chapter":5,"verse":8,"text":"Seeing this, Simon Peter fell at Jesus’ knees and said, “Leave me, Lord, for I am a sinful man.”","status":"source_text","id":"luk-5-8"},{"book":"luk","chapter":5,"verse":9,"text":"For he and all those with him were astonished at the catch of fish they had made.","status":"source_text","id":"luk-5-9"},{"book":"luk","chapter":5,"verse":10,"text":"So were Simon’s partners, James and John, sons of Zebedee. Jesus said to Simon, “Do not be afraid. From now on you will be catching people alive.”","status":"source_text","id":"luk-5-10"},{"book":"luk","chapter":5,"verse":11,"text":"And they brought the boats to shore, left everything behind, and followed Jesus.","status":"source_text","id":"luk-5-11"},{"book":"luk","chapter":5,"verse":12,"text":"And it happened while He was in one of the towns, look, a man full of leprosy; and seeing Jesus, he fell on his face and begged Him, saying, “Lord, if You are willing, You can make me clean.”","status":"source_text","id":"luk-5-12"},{"book":"luk","chapter":5,"verse":13,"text":"And stretching out His hand, He touched him, saying, “I am willing; be cleansed.” And immediately the leprosy departed from him.","status":"source_text","id":"luk-5-13"},{"book":"luk","chapter":5,"verse":14,"text":"And Jesus commanded him to tell no one. “But go and show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”","status":"source_text","id":"luk-5-14"},{"book":"luk","chapter":5,"verse":15,"text":"Yet news about Him spread more widely, and large crowds gathered to listen and be healed of their illnesses.","status":"source_text","id":"luk-5-15"},{"book":"luk","chapter":5,"verse":16,"text":"Jesus would withdraw to deserted places and pray.","status":"source_text","id":"luk-5-16"},{"book":"luk","chapter":5,"verse":17,"text":"And it happened on one of those days that He was teaching, and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for Him to heal.","status":"source_text","id":"luk-5-17"},{"book":"luk","chapter":5,"verse":18,"text":"And look, some men were carrying a paralyzed man on a mat. They tried to bring him inside and lay him before Jesus.","status":"source_text","id":"luk-5-18"},{"book":"luk","chapter":5,"verse":19,"text":"And they could not find a way to bring him in because of the crowd. They climbed onto the roof and through the tiles lowered him on his mat into the middle of the gathering before Jesus.","status":"source_text","id":"luk-5-19"},{"book":"luk","chapter":5,"verse":20,"text":"And seeing their faith, He said, “Man, your sins are forgiven you.”","status":"source_text","id":"luk-5-20"},{"book":"luk","chapter":5,"verse":21,"text":"And the scribes and Pharisees began to reason, “Who is this man speaking blasphemy? Who can forgive sins except God alone?”","status":"source_text","id":"luk-5-21"},{"book":"luk","chapter":5,"verse":22,"text":"Jesus knew their reasoning and replied, “What are you discussing in your hearts?”","status":"source_text","id":"luk-5-22"},{"book":"luk","chapter":5,"verse":23,"text":"“Which is easier to say: ‘Your sins are forgiven,’ or ‘Get up and walk’?”","status":"source_text","id":"luk-5-23"},{"book":"luk","chapter":5,"verse":24,"text":"“But so that you may know that the Son of Man has authority on earth to forgive sins”—He said to the paralyzed man—“I say to you, rise, take up your mat, and go to your house.”","status":"source_text","id":"luk-5-24"},{"book":"luk","chapter":5,"verse":25,"text":"And at once he stood before them, picked up what he had lain on, and went home praising God.","status":"source_text","id":"luk-5-25"},{"book":"luk","chapter":5,"verse":26,"text":"And amazement seized them all. They praised God, were filled with fear, and said, “We have seen extraordinary things today!”","status":"source_text","id":"luk-5-26"},{"book":"luk","chapter":5,"verse":27,"text":"And after these things He went out and saw a tax collector named Levi sitting at the tax booth, and said to him, “Follow Me.”","status":"source_text","id":"luk-5-27"},{"book":"luk","chapter":5,"verse":28,"text":"And Levi left everything, stood up, and followed Him.","status":"source_text","id":"luk-5-28"},{"book":"luk","chapter":5,"verse":29,"text":"And Levi gave a great banquet for Jesus in his home. Many tax collectors and others reclined at table with them.","status":"source_text","id":"luk-5-29"},{"book":"luk","chapter":5,"verse":30,"text":"And the Pharisees and their scribes complained to His disciples, “Why do you eat and drink with tax collectors and sinners?”","status":"source_text","id":"luk-5-30"},{"book":"luk","chapter":5,"verse":31,"text":"And Jesus answered, “Healthy people do not need a doctor, but sick people do.”","status":"source_text","id":"luk-5-31"},{"book":"luk","chapter":5,"verse":32,"text":"“I have not come to call the righteous, but sinners to repentance.”","status":"source_text","id":"luk-5-32"},{"book":"luk","chapter":5,"verse":33,"text":"They said to Jesus, “John’s disciples often fast and pray. The Pharisees’ disciples do likewise. But yours eat and drink.”","status":"source_text","id":"luk-5-33"},{"book":"luk","chapter":5,"verse":34,"text":"And Jesus said to them, “Can you make the sons of the bridal chamber fast while the bridegroom is with them?”","status":"source_text","id":"luk-5-34"},{"book":"luk","chapter":5,"verse":35,"text":"“But days will come. When the bridegroom is taken away from them, they will fast in those days.”","status":"source_text","id":"luk-5-35"},{"book":"luk","chapter":5,"verse":36,"text":"He also told them a parable: “No one tears a patch from a new garment and puts it on an old one. Otherwise, he will tear the new garment, and the patch from the new will not match the old.”","status":"source_text","id":"luk-5-36"},{"book":"luk","chapter":5,"verse":37,"text":"“And no one pours new wine into old wineskins. Otherwise the new wine will burst the skins, the wine will spill, and the skins will be ruined.”","status":"source_text","id":"luk-5-37"},{"book":"luk","chapter":5,"verse":38,"text":"“New wine must go into new wineskins.”","status":"source_text","id":"luk-5-38"},{"book":"luk","chapter":5,"verse":39,"text":"“And no one who has drunk old wine wants the new. For he says, ‘The old is good.’”","status":"source_text","id":"luk-5-39"},{"book":"luk","chapter":6,"verse":1,"text":"On a Sabbath Jesus was passing through grainfields, and His disciples picked heads of grain, rubbed them in their hands, and ate them.","status":"source_text","id":"luk-6-1"},{"book":"luk","chapter":6,"verse":2,"text":"Some Pharisees said, “Why are you doing what is not permitted on the Sabbath?”","status":"source_text","id":"luk-6-2"},{"book":"luk","chapter":6,"verse":3,"text":"And Jesus answered them, “Have you not read what David did when he and those with him were hungry?”","status":"source_text","id":"luk-6-3"},{"book":"luk","chapter":6,"verse":4,"text":"“How he entered the house of God and took and ate the bread of the Presence and gave it to those with him, which no one is permitted to eat except the priests alone?”","status":"source_text","id":"luk-6-4"},{"book":"luk","chapter":6,"verse":5,"text":"And He said to them, “The Son of Man is Lord of the Sabbath.”","status":"source_text","id":"luk-6-5"},{"book":"luk","chapter":6,"verse":6,"text":"On another Sabbath He entered the synagogue and taught. A man was there whose right hand was withered.","status":"source_text","id":"luk-6-6"},{"book":"luk","chapter":6,"verse":7,"text":"The scribes and Pharisees watched Him to see whether He would heal on the Sabbath, so that they might find grounds to accuse Him.","status":"source_text","id":"luk-6-7"},{"book":"luk","chapter":6,"verse":8,"text":"Jesus knew their thoughts. He said to the man with the withered hand, “Get up and stand in the middle.” He rose and stood there.","status":"source_text","id":"luk-6-8"},{"book":"luk","chapter":6,"verse":9,"text":"Jesus said to them, “I ask you: is it lawful on the Sabbath to do good or to do harm, to save a life or to destroy it?”","status":"source_text","id":"luk-6-9"},{"book":"luk","chapter":6,"verse":10,"text":"And looking around at them all, He said to him, “Stretch out your hand.” And he did so, and his hand was restored.","status":"source_text","id":"luk-6-10"},{"book":"luk","chapter":6,"verse":11,"text":"They were filled with fury and discussed with one another what they might do to Jesus.","status":"source_text","id":"luk-6-11"},{"book":"luk","chapter":6,"verse":12,"text":"In those days Jesus went out to the mountain to pray and spent the night in prayer to God.","status":"source_text","id":"luk-6-12"},{"book":"luk","chapter":6,"verse":13,"text":"And when day came, He called His disciples and chose twelve from among them, whom He also named apostles.","status":"source_text","id":"luk-6-13"},{"book":"luk","chapter":6,"verse":14,"text":"They were Simon, whom He also named Peter, Andrew his brother, James, John, Philip, and Bartholomew;","status":"source_text","id":"luk-6-14"},{"book":"luk","chapter":6,"verse":15,"text":"And matthew, Thomas, James son of Alphaeus, and Simon called the Zealot;","status":"source_text","id":"luk-6-15"},{"book":"luk","chapter":6,"verse":16,"text":"And judas son of James, and Judas Iscariot, who became a betrayer.","status":"source_text","id":"luk-6-16"},{"book":"luk","chapter":6,"verse":17,"text":"And He came down with them and stood on a level place. A large crowd of His disciples was there, with a great multitude from all Judea and Jerusalem, and from the coast of Tyre and Sidon.","status":"source_text","id":"luk-6-17"},{"book":"luk","chapter":6,"verse":18,"text":"They had come to hear Him and to be healed of their diseases. Those troubled by unclean spirits were also healed.","status":"source_text","id":"luk-6-18"},{"book":"luk","chapter":6,"verse":19,"text":"And the whole crowd tried to touch Him, for power was coming from Him and healing them all.","status":"source_text","id":"luk-6-19"},{"book":"luk","chapter":6,"verse":20,"text":"And looking at His disciples, Jesus said, “Blessed are you who are poor, for yours is the kingdom of God.”","status":"source_text","id":"luk-6-20"},{"book":"luk","chapter":6,"verse":21,"text":"“Blessed are you who are hungry now, for you will be filled. Blessed are you who weep now, for you will laugh.”","status":"source_text","id":"luk-6-21"},{"book":"luk","chapter":6,"verse":22,"text":"“Blessed are you when people hate you, exclude and insult you, and reject your name as evil, because of the Son of Man.”","status":"source_text","id":"luk-6-22"},{"book":"luk","chapter":6,"verse":23,"text":"“Rejoice on that day and leap for joy. Look, your reward is great in heaven, for their ancestors did the same to the prophets.”","status":"source_text","id":"luk-6-23"},{"book":"luk","chapter":6,"verse":24,"text":"“But woe to you who are rich, for you have received your consolation already.”","status":"source_text","id":"luk-6-24"},{"book":"luk","chapter":6,"verse":25,"text":"“Woe to you who are full now, for you will be hungry. Woe to you who laugh now, for you will grieve and weep.”","status":"source_text","id":"luk-6-25"},{"book":"luk","chapter":6,"verse":26,"text":"“Woe to you when everyone speaks well of you, for their ancestors did the same to the false prophets.”","status":"source_text","id":"luk-6-26"},{"book":"luk","chapter":6,"verse":27,"text":"“But I say to you who are listening: love your enemies and do good to those who hate you.”","status":"source_text","id":"luk-6-27"},{"book":"luk","chapter":6,"verse":28,"text":"“Bless those who curse you, and pray for those who mistreat you.”","status":"source_text","id":"luk-6-28"},{"book":"luk","chapter":6,"verse":29,"text":"“To the one who strikes you on one cheek, offer the other also; and from the one who takes your cloak, do not withhold your tunic.”","status":"source_text","id":"luk-6-29"},{"book":"luk","chapter":6,"verse":30,"text":"“Give to everyone who asks you, and do not demand your goods back from the one who takes them.”","status":"source_text","id":"luk-6-30"},{"book":"luk","chapter":6,"verse":31,"text":"“And as you want people to do to you, do the same to them.”","status":"source_text","id":"luk-6-31"},{"book":"luk","chapter":6,"verse":32,"text":"“And if you love those who love you, what credit is that to you? Even sinners love those who love them.”","status":"source_text","id":"luk-6-32"},{"book":"luk","chapter":6,"verse":33,"text":"“And if you do good to those who do good to you, what credit is that to you? Even sinners do the same.”","status":"source_text","id":"luk-6-33"},{"book":"luk","chapter":6,"verse":34,"text":"“And if you lend to those from whom you expect to receive, what credit is that to you? Even sinners lend to sinners to receive as much in return.”","status":"source_text","id":"luk-6-34"},{"book":"luk","chapter":6,"verse":35,"text":"“But love your enemies, and do good and lend, expecting nothing back; and your reward will be great, and you will be sons of the Most High, because He is kind to the ungrateful and evil.”","status":"source_text","id":"luk-6-35"},{"book":"luk","chapter":6,"verse":36,"text":"“Be merciful, just as your Father is merciful.”","status":"source_text","id":"luk-6-36"},{"book":"luk","chapter":6,"verse":37,"text":"“And do not judge, and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Release, and you will be released.”","status":"source_text","id":"luk-6-37"},{"book":"luk","chapter":6,"verse":38,"text":"“Give, and it will be given to you; a good measure, pressed down, shaken together, overflowing, they will give into your lap. For with the measure you measure, it will be measured back to you.”","status":"source_text","id":"luk-6-38"},{"book":"luk","chapter":6,"verse":39,"text":"And He also spoke a parable to them, “Can a blind man guide a blind man? Will they not both fall into a pit?”","status":"source_text","id":"luk-6-39"},{"book":"luk","chapter":6,"verse":40,"text":"A disciple is not above the teacher, but everyone fully trained will be like the teacher.","status":"source_text","id":"luk-6-40"},{"book":"luk","chapter":6,"verse":41,"text":"“Why do you see the speck in your brother’s eye, but fail to notice the beam in your own eye?”","status":"source_text","id":"luk-6-41"},{"book":"luk","chapter":6,"verse":42,"text":"“How can you say to your brother, ‘Brother, let me take the speck out of your eye,’ when you do not see the beam in your own? Hypocrite, first remove the beam from your own eye; then you will see clearly to remove the speck from your brother’s eye.”","status":"source_text","id":"luk-6-42"},{"book":"luk","chapter":6,"verse":43,"text":"“No good tree bears bad fruit, and no bad tree bears good fruit.”","status":"source_text","id":"luk-6-43"},{"book":"luk","chapter":6,"verse":44,"text":"“Each tree is known by its own fruit. People do not gather figs from thorns or grapes from brambles.”","status":"source_text","id":"luk-6-44"},{"book":"luk","chapter":6,"verse":45,"text":"“The good man brings forth good from the good treasure of his heart, and the evil man brings forth evil from his evil treasure; for his mouth speaks from the abundance of the heart.”","status":"source_text","id":"luk-6-45"},{"book":"luk","chapter":6,"verse":46,"text":"“Why do you call Me ‘Lord, Lord,’ and not do what I say?”","status":"source_text","id":"luk-6-46"},{"book":"luk","chapter":6,"verse":47,"text":"“As for everyone who comes to Me, hears My words, and does them, I will show you whom that person is like.”","status":"source_text","id":"luk-6-47"},{"book":"luk","chapter":6,"verse":48,"text":"“That person is like someone building a house who dug deep and laid the foundation on rock. When a flood came, the river struck that house, but could not shake it, because it was well built.”","status":"source_text","id":"luk-6-48"},{"book":"luk","chapter":6,"verse":49,"text":"“But the one who hears and does not act is like someone who built a house on the ground without a foundation. When the river struck, it collapsed at once, and its ruin was great.”","status":"source_text","id":"luk-6-49"},{"book":"luk","chapter":7,"verse":1,"text":"After Jesus had finished all His sayings in the hearing of the people, He entered Capernaum.","status":"source_text","id":"luk-7-1"},{"book":"luk","chapter":7,"verse":2,"text":"A centurion had a servant dear to him who was ill and near death.","status":"source_text","id":"luk-7-2"},{"book":"luk","chapter":7,"verse":3,"text":"And hearing about Jesus, he sent elders of the Jews to Him, asking Him to come and save his servant.","status":"source_text","id":"luk-7-3"},{"book":"luk","chapter":7,"verse":4,"text":"And coming to Jesus, they pleaded earnestly with Him, saying, “He is worthy for You to grant this to him,”","status":"source_text","id":"luk-7-4"},{"book":"luk","chapter":7,"verse":5,"text":"“for he loves our nation, and he himself built the synagogue for us.”","status":"source_text","id":"luk-7-5"},{"book":"luk","chapter":7,"verse":6,"text":"Jesus went with them. When He was not far from the house, the centurion sent friends to say to Him, “Lord, do not trouble Yourself, for I am not worthy to have You enter my home.”","status":"source_text","id":"luk-7-6"},{"book":"luk","chapter":7,"verse":7,"text":"“That is why I did not consider myself worthy to come to You. Only say the word, and my servant will be healed.”","status":"source_text","id":"luk-7-7"},{"book":"luk","chapter":7,"verse":8,"text":"“For I also am a man placed under authority, having soldiers under me, and I say to this one, ‘Go,’ and he goes, and to another, ‘Come,’ and he comes, and to my servant, ‘Do this,’ and he does it.”","status":"source_text","id":"luk-7-8"},{"book":"luk","chapter":7,"verse":9,"text":"And hearing these things, Jesus marveled at him, and turning to the crowd following Him, He said, “I tell you, not even in Israel have I found such faith.”","status":"source_text","id":"luk-7-9"},{"book":"luk","chapter":7,"verse":10,"text":"And when those who had been sent returned home, they found the servant well.","status":"source_text","id":"luk-7-10"},{"book":"luk","chapter":7,"verse":11,"text":"Soon afterward Jesus went to a town called Nain, and His disciples and a large crowd went with Him.","status":"source_text","id":"luk-7-11"},{"book":"luk","chapter":7,"verse":12,"text":"And as He drew near to the gate of the town, look, a dead man was being carried out, the only son of his mother, and she was a widow; and a considerable crowd from the town was with her.","status":"source_text","id":"luk-7-12"},{"book":"luk","chapter":7,"verse":13,"text":"And when the Lord saw her, He had compassion on her and said, “Do not weep.”","status":"source_text","id":"luk-7-13"},{"book":"luk","chapter":7,"verse":14,"text":"And Jesus approached and touched the bier. The bearers stopped. He said, “Young man, I tell you, arise.”","status":"source_text","id":"luk-7-14"},{"book":"luk","chapter":7,"verse":15,"text":"And the dead man sat up and began to speak, and He gave him to his mother.","status":"source_text","id":"luk-7-15"},{"book":"luk","chapter":7,"verse":16,"text":"And fear seized them all, and they glorified God, saying, “A great prophet has arisen among us,” and, “God has visited His people.”","status":"source_text","id":"luk-7-16"},{"book":"luk","chapter":7,"verse":17,"text":"And this report about Jesus spread throughout Judea and the surrounding region.","status":"source_text","id":"luk-7-17"},{"book":"luk","chapter":7,"verse":18,"text":"And John’s disciples told him about all these things. John called two of his disciples.","status":"source_text","id":"luk-7-18"},{"book":"luk","chapter":7,"verse":19,"text":"He sent them to the Lord with the question, “Are You the one who is to come, or should we expect someone else?”","status":"source_text","id":"luk-7-19"},{"book":"luk","chapter":7,"verse":20,"text":"The men came to Jesus and said, “John the Baptist sent us to ask: ‘Are You the one who is to come, or should we expect someone else?’”","status":"source_text","id":"luk-7-20"},{"book":"luk","chapter":7,"verse":21,"text":"At that very time Jesus healed many of diseases, afflictions, and evil spirits, and granted sight to many who were blind.","status":"source_text","id":"luk-7-21"},{"book":"luk","chapter":7,"verse":22,"text":"And He answered and said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed and the deaf hear, the dead are raised, the poor are brought good news.”","status":"source_text","id":"luk-7-22"},{"book":"luk","chapter":7,"verse":23,"text":"“And blessed is anyone who does not stumble because of Me.”","status":"source_text","id":"luk-7-23"},{"book":"luk","chapter":7,"verse":24,"text":"And when the messengers of John departed, He began to say to the crowds about John, “What did you go out into the wilderness to see? A reed shaken by wind?”","status":"source_text","id":"luk-7-24"},{"book":"luk","chapter":7,"verse":25,"text":"“What then did you go out to see? Someone dressed in fine clothes? Look, those who wear splendid clothes and live in luxury are in royal palaces.”","status":"source_text","id":"luk-7-25"},{"book":"luk","chapter":7,"verse":26,"text":"“What then did you go out to see? A prophet? Yes, I tell you, and more than a prophet.”","status":"source_text","id":"luk-7-26"},{"book":"luk","chapter":7,"verse":27,"text":"“This is the one about whom it is written, ‘Look, I send My messenger before Your face, who will prepare Your way before You.’”","status":"source_text","id":"luk-7-27"},{"book":"luk","chapter":7,"verse":28,"text":"“I tell you, among those born of women no one is greater than John; yet the least in the kingdom of God is greater than he.”","status":"source_text","id":"luk-7-28"},{"book":"luk","chapter":7,"verse":29,"text":"And all the people who heard this, including the tax collectors, acknowledged God’s justice, since they had received John’s baptism.","status":"source_text","id":"luk-7-29"},{"book":"luk","chapter":7,"verse":30,"text":"But the Pharisees and teachers of the law, having refused John’s baptism, rejected God’s purpose for themselves.","status":"source_text","id":"luk-7-30"},{"book":"luk","chapter":7,"verse":31,"text":"“To what shall I compare the people of this generation? What are they like?”","status":"source_text","id":"luk-7-31"},{"book":"luk","chapter":7,"verse":32,"text":"“They are like children sitting in a marketplace and calling to one another, who say, ‘We played the flute for you, and you did not dance; we sang a lament, and you did not weep.’”","status":"source_text","id":"luk-7-32"},{"book":"luk","chapter":7,"verse":33,"text":"“For John the Baptist has come neither eating bread nor drinking wine, and you say, ‘He has a demon.’”","status":"source_text","id":"luk-7-33"},{"book":"luk","chapter":7,"verse":34,"text":"“The Son of Man came eating and drinking, and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners.’”","status":"source_text","id":"luk-7-34"},{"book":"luk","chapter":7,"verse":35,"text":"“Yet wisdom is vindicated by all her children.”","status":"source_text","id":"luk-7-35"},{"book":"luk","chapter":7,"verse":36,"text":"A Pharisee invited Jesus to eat with him. Jesus entered the Pharisee’s house and reclined at the table.","status":"source_text","id":"luk-7-36"},{"book":"luk","chapter":7,"verse":37,"text":"Now a woman in that town was known as a sinner. Learning that Jesus was eating in the Pharisee’s house, she brought an alabaster jar of perfume.","status":"source_text","id":"luk-7-37"},{"book":"luk","chapter":7,"verse":38,"text":"And standing behind Him at His feet, she wept.
