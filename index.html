restrain him even with a chain.","status":"source_text","id":"mrk-5-3"},{"book":"mrk","chapter":5,"verse":4,"text":"Though bound repeatedly with shackles and chains, he tore apart the chains and broke the shackles. No one was strong enough to subdue him.","status":"source_text","id":"mrk-5-4"},{"book":"mrk","chapter":5,"verse":5,"text":"Night and day among the tombs and in the hills he cried out and cut himself with stones.","status":"source_text","id":"mrk-5-5"},{"book":"mrk","chapter":5,"verse":6,"text":"Seeing Jesus from a distance, he ran and fell down before him.","status":"source_text","id":"mrk-5-6"},{"book":"mrk","chapter":5,"verse":7,"text":"He shouted, Jesus, Son of the Most High God, what do you want with me? I adjure you by God: do not torment me!","status":"source_text","id":"mrk-5-7"},{"book":"mrk","chapter":5,"verse":8,"text":"For Jesus had said to it, Unclean spirit, come out of this man.","status":"source_text","id":"mrk-5-8"},{"book":"mrk","chapter":5,"verse":9,"text":"Jesus asked, What is your name? He answered, My name is Legion, for we are many.","status":"source_text","id":"mrk-5-9"},{"book":"mrk","chapter":5,"verse":10,"text":"He begged Jesus repeatedly not to send them out of that region.","status":"source_text","id":"mrk-5-10"},{"book":"mrk","chapter":5,"verse":11,"text":"A large herd of pigs was feeding nearby on the hillside.","status":"source_text","id":"mrk-5-11"},{"book":"mrk","chapter":5,"verse":12,"text":"The unclean spirits begged him, Send us among the pigs so that we may enter them.","status":"source_text","id":"mrk-5-12"},{"book":"mrk","chapter":5,"verse":13,"text":"He permitted it, and the spirits left the man and entered the pigs. The herd of about two thousand rushed down the steep slope into the sea and drowned.","status":"source_text","id":"mrk-5-13"},{"book":"mrk","chapter":5,"verse":14,"text":"The herders ran away and reported it in the town and surrounding villages, and people came to see what had happened.","status":"source_text","id":"mrk-5-14"},{"book":"mrk","chapter":5,"verse":15,"text":"They came to Jesus and found the man once possessed by Legion sitting there clothed and in his right mind; they were afraid.","status":"source_text","id":"mrk-5-15"},{"book":"mrk","chapter":5,"verse":16,"text":"The witnesses recounted what had happened to the man and to the pigs.","status":"source_text","id":"mrk-5-16"},{"book":"mrk","chapter":5,"verse":17,"text":"Then the people began pleading with Jesus to leave their region.","status":"source_text","id":"mrk-5-17"},{"book":"mrk","chapter":5,"verse":18,"text":"As Jesus boarded the boat, the man who had been possessed begged to go with him.","status":"source_text","id":"mrk-5-18"},{"book":"mrk","chapter":5,"verse":19,"text":"Jesus did not allow it, but told him to go home and tell his family what great things the Lord had done for him and how merciful he had been.","status":"source_text","id":"mrk-5-19"},{"book":"mrk","chapter":5,"verse":20,"text":"The man went and proclaimed throughout the Decapolis what Jesus had done for him, and everyone was amazed.","status":"source_text","id":"mrk-5-20"},{"book":"mrk","chapter":5,"verse":21,"text":"When Jesus crossed back by boat, a large crowd gathered around him as he stood beside the sea.","status":"source_text","id":"mrk-5-21"},{"book":"mrk","chapter":5,"verse":22,"text":"One of the synagogue leaders, Jairus, came and fell at his feet.","status":"source_text","id":"mrk-5-22"},{"book":"mrk","chapter":5,"verse":23,"text":"He pleaded earnestly, My little daughter is dying. Come and lay your hands on her so that she may recover and live.","status":"source_text","id":"mrk-5-23"},{"book":"mrk","chapter":5,"verse":24,"text":"Jesus went with him, and a great crowd followed, pressing in on him.","status":"source_text","id":"mrk-5-24"},{"book":"mrk","chapter":5,"verse":25,"text":"There was a woman who had suffered bleeding for twelve years.","status":"source_text","id":"mrk-5-25"},{"book":"mrk","chapter":5,"verse":26,"text":"She had suffered much under many physicians and spent all she owned, yet instead of improving she grew worse.","status":"source_text","id":"mrk-5-26"},{"book":"mrk","chapter":5,"verse":27,"text":"Having heard about Jesus, she came up behind him in the crowd and touched his cloak.","status":"source_text","id":"mrk-5-27"},{"book":"mrk","chapter":5,"verse":28,"text":"For she thought, If I touch even his clothes, I will be healed.","status":"source_text","id":"mrk-5-28"},{"book":"mrk","chapter":5,"verse":29,"text":"Her bleeding stopped at once, and she sensed in her body that she had been healed.","status":"source_text","id":"mrk-5-29"},{"book":"mrk","chapter":5,"verse":30,"text":"Jesus immediately felt power go out from him, turned within the crowd and asked, Who touched my clothes?","status":"source_text","id":"mrk-5-30"},{"book":"mrk","chapter":5,"verse":31,"text":"His disciples replied, You can see the crowd pressing against you, yet you ask who touched you?","status":"source_text","id":"mrk-5-31"},{"book":"mrk","chapter":5,"verse":32,"text":"Jesus looked around to see who had done it.","status":"source_text","id":"mrk-5-32"},{"book":"mrk","chapter":5,"verse":33,"text":"Knowing what had happened to her, the woman came trembling with fear, fell before him and told him the whole truth.","status":"source_text","id":"mrk-5-33"},{"book":"mrk","chapter":5,"verse":34,"text":"Jesus said, Daughter, your faith has made you well. Go in peace and be free from your suffering.","status":"source_text","id":"mrk-5-34"},{"book":"mrk","chapter":5,"verse":35,"text":"While he was still speaking, people arrived from the synagogue leader's house: Your daughter has died. Why trouble the teacher further?","status":"source_text","id":"mrk-5-35"},{"book":"mrk","chapter":5,"verse":36,"text":"Jesus heard the report and said to the leader, Do not be afraid; only believe.","status":"source_text","id":"mrk-5-36"},{"book":"mrk","chapter":5,"verse":37,"text":"He allowed no one to follow except Peter, James and his brother John.","status":"source_text","id":"mrk-5-37"},{"book":"mrk","chapter":5,"verse":38,"text":"They arrived at the house and saw people weeping and wailing loudly.","status":"source_text","id":"mrk-5-38"},{"book":"mrk","chapter":5,"verse":39,"text":"He went in and asked, Why this commotion and weeping? The child is not dead but asleep.","status":"source_text","id":"mrk-5-39"},{"book":"mrk","chapter":5,"verse":40,"text":"They laughed at him. He put them outside and took the child's parents and his companions into the room where she lay.","status":"source_text","id":"mrk-5-40"},{"book":"mrk","chapter":5,"verse":41,"text":"Taking her hand, he said, Talitha koum, meaning, Little girl, I tell you, arise.","status":"source_text","id":"mrk-5-41"},{"book":"mrk","chapter":5,"verse":42,"text":"The girl, who was twelve, immediately stood up and walked around. Everyone was overwhelmed with amazement.","status":"source_text","id":"mrk-5-42"},{"book":"mrk","chapter":5,"verse":43,"text":"He gave strict orders that nobody should learn of this, and told them to give her something to eat.","status":"source_text","id":"mrk-5-43"},{"book":"mrk","chapter":6,"verse":1,"text":"Jesus left there for his hometown, and his disciples followed him.","status":"source_text","id":"mrk-6-1"},{"book":"mrk","chapter":6,"verse":2,"text":"On the Sabbath he taught in the synagogue, and many were astonished, asking where he had acquired such wisdom and powers.","status":"source_text","id":"mrk-6-2"},{"book":"mrk","chapter":6,"verse":3,"text":"Is this not the carpenter, Mary's son and brother of James, Joses, Judas and Simon? Are his sisters not here among us? They took offense at him.","status":"source_text","id":"mrk-6-3"},{"book":"mrk","chapter":6,"verse":4,"text":"Jesus said, A prophet lacks honor only in his hometown, among his kin and in his own household.","status":"source_text","id":"mrk-6-4"},{"book":"mrk","chapter":6,"verse":5,"text":"He could perform no mighty work there, except that he laid hands on a few sick people and healed them.","status":"source_text","id":"mrk-6-5"},{"book":"mrk","chapter":6,"verse":6,"text":"He was amazed at their unbelief, and went through the neighboring villages teaching.","status":"source_text","id":"mrk-6-6"},{"book":"mrk","chapter":6,"verse":7,"text":"He called the Twelve, began sending them out in pairs and gave them authority over unclean spirits.","status":"source_text","id":"mrk-6-7"},{"book":"mrk","chapter":6,"verse":8,"text":"He instructed them to take only a staff for the journey, with no bread, bag or money.","status":"source_text","id":"mrk-6-8"},{"book":"mrk","chapter":6,"verse":9,"text":"They could wear sandals but were not to take a second tunic.","status":"source_text","id":"mrk-6-9"},{"book":"mrk","chapter":6,"verse":10,"text":"He told them to remain in the house that received them until they left that place.","status":"source_text","id":"mrk-6-10"},{"book":"mrk","chapter":6,"verse":11,"text":"If any place refused to receive or hear them, they were to leave and shake the dust from their feet as testimony to its people.","status":"source_text","id":"mrk-6-11"},{"book":"mrk","chapter":6,"verse":12,"text":"They went out and proclaimed that people should repent.","status":"source_text","id":"mrk-6-12"},{"book":"mrk","chapter":6,"verse":13,"text":"They drove out many demons and anointed many sick people with oil, healing them.","status":"source_text","id":"mrk-6-13"},{"book":"mrk","chapter":6,"verse":14,"text":"King Herod heard of Jesus, whose name had become known, and said that John the Baptist had risen from the dead and this explained the powers working in him.","status":"source_text","id":"mrk-6-14"},{"book":"mrk","chapter":6,"verse":15,"text":"Others called him Elijah; still others said he was a prophet like one of the prophets of old.","status":"source_text","id":"mrk-6-15"},{"book":"mrk","chapter":6,"verse":16,"text":"But Herod said, John, whom I beheaded, has been raised.","status":"source_text","id":"mrk-6-16"},{"book":"mrk","chapter":6,"verse":17,"text":"Herod had arrested and imprisoned John on account of Herodias, his brother Philip's wife whom he had married.","status":"source_text","id":"mrk-6-17"},{"book":"mrk","chapter":6,"verse":18,"text":"For John had told Herod, It is not lawful for you to have your brother's wife.","status":"source_text","id":"mrk-6-18"},{"book":"mrk","chapter":6,"verse":19,"text":"Herodias bore a grudge against John and wanted to kill him, but could not.","status":"source_text","id":"mrk-6-19"},{"book":"mrk","chapter":6,"verse":20,"text":"Herod feared John, recognizing him as righteous and holy, and protected him. Hearing him left Herod perplexed, yet he listened gladly.","status":"source_text","id":"mrk-6-20"},{"book":"mrk","chapter":6,"verse":21,"text":"An opportunity came on Herod's birthday, when he held a banquet for his officials, military leaders and Galilean dignitaries.","status":"source_text","id":"mrk-6-21"},{"book":"mrk","chapter":6,"verse":22,"text":"Herodias's daughter danced and pleased Herod and the guests. The king told her to ask for whatever she wanted and he would give it.","status":"source_text","id":"mrk-6-22"},{"book":"mrk","chapter":6,"verse":23,"text":"He swore repeatedly that he would grant even half his kingdom if she asked.","status":"source_text","id":"mrk-6-23"},{"book":"mrk","chapter":6,"verse":24,"text":"She went out and asked her mother what she should request. Her mother said, The head of John the Baptist.","status":"source_text","id":"mrk-6-24"},{"book":"mrk","chapter":6,"verse":25,"text":"She hurried back to the king and asked for John's head on a platter at once.","status":"source_text","id":"mrk-6-25"},{"book":"mrk","chapter":6,"verse":26,"text":"The king was deeply distressed, but because of his oath and his guests he would not refuse her.","status":"source_text","id":"mrk-6-26"},{"book":"mrk","chapter":6,"verse":27,"text":"He immediately sent a guard with orders to bring the head. The man went and beheaded John in prison.","status":"source_text","id":"mrk-6-27"},{"book":"mrk","chapter":6,"verse":28,"text":"He brought the head on a platter and handed it to the girl, who passed it to her mother.","status":"source_text","id":"mrk-6-28"},{"book":"mrk","chapter":6,"verse":29,"text":"When John's disciples heard, they came, took his body and placed it in a tomb.","status":"source_text","id":"mrk-6-29"},{"book":"mrk","chapter":6,"verse":30,"text":"The apostles gathered around Jesus and reported everything they had done and taught.","status":"source_text","id":"mrk-6-30"},{"book":"mrk","chapter":6,"verse":31,"text":"With so many coming and going that they lacked time to eat, Jesus said, Come away to a quiet place by yourselves and rest for a while.","status":"source_text","id":"mrk-6-31"},{"book":"mrk","chapter":6,"verse":32,"text":"They went away in a boat to a deserted place by themselves.","status":"source_text","id":"mrk-6-32"},{"book":"mrk","chapter":6,"verse":33,"text":"Many saw them leaving and recognized them; people ran there on foot from the towns and arrived ahead of them.","status":"source_text","id":"mrk-6-33"},{"book":"mrk","chapter":6,"verse":34,"text":"Stepping ashore, Jesus saw a large crowd and felt compassion because they were like sheep without a shepherd; he began teaching them many things.","status":"source_text","id":"mrk-6-34"},{"book":"mrk","chapter":6,"verse":35,"text":"As the hour grew late, his disciples said, This is a deserted place, and it is already late.","status":"source_text","id":"mrk-6-35"},{"book":"mrk","chapter":6,"verse":36,"text":"Send them away to buy food in the surrounding farms and villages.","status":"source_text","id":"mrk-6-36"},{"book":"mrk","chapter":6,"verse":37,"text":"Jesus answered, Give them something to eat yourselves. They replied, Are we to buy two hundred denarii worth of bread to feed them?","status":"source_text","id":"mrk-6-37"},{"book":"mrk","chapter":6,"verse":38,"text":"He asked how many loaves they had and told them to check. They found five loaves and two fish.","status":"source_text","id":"mrk-6-38"},{"book":"mrk","chapter":6,"verse":39,"text":"He instructed the people to sit in groups on the green grass.","status":"source_text","id":"mrk-6-39"},{"book":"mrk","chapter":6,"verse":40,"text":"They sat down in groups of hundreds and fifties.","status":"source_text","id":"mrk-6-40"},{"book":"mrk","chapter":6,"verse":41,"text":"Taking the five loaves and two fish, Jesus looked to heaven, blessed and broke the loaves, then gave them to his disciples to distribute. He divided the fish among everyone as well.","status":"source_text","id":"mrk-6-41"},{"book":"mrk","chapter":6,"verse":42,"text":"They all ate and were satisfied.","status":"source_text","id":"mrk-6-42"},{"book":"mrk","chapter":6,"verse":43,"text":"They collected twelve baskets full of leftover bread and fish.","status":"source_text","id":"mrk-6-43"},{"book":"mrk","chapter":6,"verse":44,"text":"Five thousand men had eaten the loaves.","status":"source_text","id":"mrk-6-44"},{"book":"mrk","chapter":6,"verse":45,"text":"Jesus immediately made his disciples board the boat and go ahead toward Bethsaida while he dismissed the crowd.","status":"source_text","id":"mrk-6-45"},{"book":"mrk","chapter":6,"verse":46,"text":"After saying farewell, he went up the mountain to pray.","status":"source_text","id":"mrk-6-46"},{"book":"mrk","chapter":6,"verse":47,"text":"By evening the boat was in the middle of the sea and he was alone on land.","status":"source_text","id":"mrk-6-47"},{"book":"mrk","chapter":6,"verse":48,"text":"Seeing them struggling to row against the wind, he came to them late in the night, walking on the sea. He seemed about to pass them by.","status":"source_text","id":"mrk-6-48"},{"book":"mrk","chapter":6,"verse":49,"text":"When they saw him walking on the sea they thought he was a ghost and cried out.","status":"source_text","id":"mrk-6-49"},{"book":"mrk","chapter":6,"verse":50,"text":"They all saw him and were terrified, but he spoke at once: Take courage. It is I. Do not be afraid.","status":"source_text","id":"mrk-6-50"},{"book":"mrk","chapter":6,"verse":51,"text":"He climbed into the boat with them and the wind died down. They were utterly astonished.","status":"source_text","id":"mrk-6-51"},{"book":"mrk","chapter":6,"verse":52,"text":"For they had failed to understand the matter of the loaves; their hearts had become hardened.","status":"source_text","id":"mrk-6-52"},{"book":"mrk","chapter":6,"verse":53,"text":"They crossed over to Gennesaret and moored the boat.","status":"source_text","id":"mrk-6-53"},{"book":"mrk","chapter":6,"verse":54,"text":"As soon as they stepped out, people recognized Jesus.","status":"source_text","id":"mrk-6-54"},{"book":"mrk","chapter":6,"verse":55,"text":"They ran through the region and carried the sick on mats wherever they heard he was.","status":"source_text","id":"mrk-6-55"},{"book":"mrk","chapter":6,"verse":56,"text":"Wherever he entered, villages or towns, people set the sick in marketplaces and begged to touch even the edge of his cloak. All who touched it were healed.","status":"source_text","id":"mrk-6-56"},{"book":"mrk","chapter":7,"verse":1,"text":"Pharisees and some scribes from Jerusalem gathered around Jesus.","status":"source_text","id":"mrk-7-1"},{"book":"mrk","chapter":7,"verse":2,"text":"They saw some disciples eating bread with unwashed hands, regarded as ritually unclean.","status":"source_text","id":"mrk-7-2"},{"book":"mrk","chapter":7,"verse":3,"text":"The Pharisees and other Jews followed the elders' traditions of washing hands before eating.","status":"source_text","id":"mrk-7-3"},{"book":"mrk","chapter":7,"verse":4,"text":"After returning from the market they washed before eating; they kept many other customs, including washing cups, pitchers and copper vessels.","status":"source_text","id":"mrk-7-4"},{"book":"mrk","chapter":7,"verse":5,"text":"The Pharisees and scribes asked why his disciples did not follow the elders' tradition but ate with unwashed hands.","status":"source_text","id":"mrk-7-5"},{"book":"mrk","chapter":7,"verse":6,"text":"Jesus said Isaiah rightly spoke of their hypocrisy: This people honors me with their lips, but their hearts are far from me.","status":"source_text","id":"mrk-7-6"},{"book":"mrk","chapter":7,"verse":7,"text":"Their worship of me is empty when they teach human rules as doctrines.","status":"source_text","id":"mrk-7-7"},{"book":"mrk","chapter":7,"verse":8,"text":"You set aside God's command and hold to human tradition.","status":"source_text","id":"mrk-7-8"},{"book":"mrk","chapter":7,"verse":9,"text":"He added, You have a clever way of rejecting God's command to preserve your own tradition.","status":"source_text","id":"mrk-7-9"},{"book":"mrk","chapter":7,"verse":10,"text":"Moses said, Honor your father and mother, and, Whoever curses father or mother must die.","status":"source_text","id":"mrk-7-10"},{"book":"mrk","chapter":7,"verse":11,"text":"But you say someone may declare what could have helped a parent Korban, meaning a gift devoted to God.","status":"source_text","id":"mrk-7-11"},{"book":"mrk","chapter":7,"verse":12,"text":"Then you no longer allow that person to do anything for father or mother.","status":"source_text","id":"mrk-7-12"},{"book":"mrk","chapter":7,"verse":13,"text":"So you nullify God's word by your handed-down tradition, and you do many similar things.","status":"source_text","id":"mrk-7-13"},{"book":"mrk","chapter":7,"verse":14,"text":"Calling the crowd again, Jesus said, Listen to me, all of you, and understand.","status":"source_text","id":"mrk-7-14"},{"book":"mrk","chapter":7,"verse":15,"text":"Nothing that enters a person from outside can defile them; what comes out of a person is what defiles them.","status":"source_text","id":"mrk-7-15"},{"book":"mrk","chapter":7,"verse":16,"text":"—","status":"absent_from_critical_text","id":"mrk-7-16"},{"book":"mrk","chapter":7,"verse":17,"text":"When Jesus left the crowd and entered a house, his disciples asked about the parable.","status":"source_text","id":"mrk-7-17"},{"book":"mrk","chapter":7,"verse":18,"text":"He asked, Do you still fail to understand? Do you not see that nothing entering a person from outside can defile them?","status":"source_text","id":"mrk-7-18"},{"book":"mrk","chapter":7,"verse":19,"text":"It does not enter the heart but the stomach and then passes out. In saying this he declared all foods clean.","status":"source_text","id":"mrk-7-19"},{"book":"mrk","chapter":7,"verse":20,"text":"He continued, What comes out of a person is what defiles them.","status":"source_text","id":"mrk-7-20"},{"book":"mrk","chapter":7,"verse":21,"text":"For from within, from the human heart, come evil thoughts, sexual immorality, theft and murder,","status":"source_text","id":"mrk-7-21"},{"book":"mrk","chapter":7,"verse":22,"text":"adultery, greed, malice, deceit, indecency, envy, slander, pride and foolishness.","status":"source_text","id":"mrk-7-22"},{"book":"mrk","chapter":7,"verse":23,"text":"All these evils come from within and defile a person.","status":"source_text","id":"mrk-7-23"},{"book":"mrk","chapter":7,"verse":24,"text":"Jesus went from there to the region of Tyre. He entered a house and wanted no one to know, but he could not remain hidden.","status":"source_text","id":"mrk-7-24"},{"book":"mrk","chapter":7,"verse":25,"text":"A woman whose little daughter had an unclean spirit heard about him, came at once and fell at his feet.","status":"source_text","id":"mrk-7-25"},{"book":"mrk","chapter":7,"verse":26,"text":"She was a Greek woman of Syrophoenician origin, and she begged him to drive the demon out of her daughter.","status":"source_text","id":"mrk-7-26"},{"book":"mrk","chapter":7,"verse":27,"text":"Jesus said, Let the children eat first. It is not right to take their bread and throw it to the little dogs.","status":"source_text","id":"mrk-7-27"},{"book":"mrk","chapter":7,"verse":28,"text":"She replied, Lord, yes, but even the little dogs under the table eat the children's crumbs.","status":"source_text","id":"mrk-7-28"},{"book":"mrk","chapter":7,"verse":29,"text":"Jesus said, Because you have answered this way, go home; the demon has left your daughter.","status":"source_text","id":"mrk-7-29"},{"book":"mrk","chapter":7,"verse":30,"text":"She returned home and found the child on the bed and the demon gone.","status":"source_text","id":"mrk-7-30"},{"book":"mrk","chapter":7,"verse":31,"text":"Jesus left Tyre, passed through Sidon and the Decapolis, and came to the Sea of Galilee.","status":"source_text","id":"mrk-7-31"},{"book":"mrk","chapter":7,"verse":32,"text":"People brought a man who could not hear and had difficulty speaking, and begged Jesus to lay a hand on him.","status":"source_text","id":"mrk-7-32"},{"book":"mrk","chapter":7,"verse":33,"text":"Jesus took him away from the crowd, put his fingers into the man's ears and touched his tongue with saliva.","status":"source_text","id":"mrk-7-33"},{"book":"mrk","chapter":7,"verse":34,"text":"Looking up to heaven and sighing deeply, he said, Ephphatha, which means, Be opened.","status":"source_text","id":"mrk-7-34"},{"book":"mrk","chapter":7,"verse":35,"text":"His ears opened, the bond on his tongue was released, and he began to speak clearly.","status":"source_text","id":"mrk-7-35"},{"book":"mrk","chapter":7,"verse":36,"text":"Jesus told them to tell no one, but the more he urged them, the more widely they spread the news.","status":"source_text","id":"mrk-7-36"},{"book":"mrk","chapter":7,"verse":37,"text":"The people were utterly amazed: He has done all things well; he even makes those who cannot hear hear and those unable to speak speak.","status":"source_text","id":"mrk-7-37"},{"book":"mrk","chapter":8,"verse":1,"text":"Around that time another large crowd had nothing to eat, so Jesus called his disciples and said,","status":"source_text","id":"mrk-8-1"},{"book":"mrk","chapter":8,"verse":2,"text":"I feel compassion for these people. They have been with me three days and have nothing to eat.","status":"source_text","id":"mrk-8-2"},{"book":"mrk","chapter":8,"verse":3,"text":"If I send them home hungry they will faint on the way; some have come from far away.","status":"source_text","id":"mrk-8-3"},{"book":"mrk","chapter":8,"verse":4,"text":"The disciples asked where anyone could find enough bread to feed them in such a remote place.","status":"source_text","id":"mrk-8-4"},{"book":"mrk","chapter":8,"verse":5,"text":"He asked how many loaves they had, and they answered, Seven.","status":"source_text","id":"mrk-8-5"},{"book":"mrk","chapter":8,"verse":6,"text":"Jesus told the crowd to sit on the ground. He took the seven loaves, gave thanks, broke them and gave them to the disciples to distribute.","status":"source_text","id":"mrk-8-6"},{"book":"mrk","chapter":8,"verse":7,"text":"They also had a few small fish. He blessed these too and told them to distribute them.","status":"source_text","id":"mrk-8-7"},{"book":"mrk","chapter":8,"verse":8,"text":"Everyone ate and was satisfied, and they collected seven baskets of leftovers.","status":"source_text","id":"mrk-8-8"},{"book":"mrk","chapter":8,"verse":9,"text":"There were about four thousand people, and he sent them away.","status":"source_text","id":"mrk-8-9"},{"book":"mrk","chapter":8,"verse":10,"text":"He immediately boarded a boat with his disciples and went to the district of Dalmanutha.","status":"source_text","id":"mrk-8-10"},{"book":"mrk","chapter":8,"verse":11,"text":"Pharisees came and argued with him, demanding a sign from heaven to test him.","status":"source_text","id":"mrk-8-11"},{"book":"mrk","chapter":8,"verse":12,"text":"Sighing deeply, Jesus said, Why does this generation demand a sign? Truly I tell you, no sign will be given to it.","status":"source_text","id":"mrk-8-12"},{"book":"mrk","chapter":8,"verse":13,"text":"He left them, boarded the boat again and crossed to the other side.","status":"source_text","id":"mrk-8-13"},{"book":"mrk","chapter":8,"verse":14,"text":"The disciples had forgotten to bring bread and had only one loaf in the boat.","status":"source_text","id":"mrk-8-14"},{"book":"mrk","chapter":8,"verse":15,"text":"Jesus warned them sharply to beware of the yeast of the Pharisees and the yeast of Herod.","status":"source_text","id":"mrk-8-15"},{"book":"mrk","chapter":8,"verse":16,"text":"They discussed among themselves whether he said this because they had no bread.","status":"source_text","id":"mrk-8-16"},{"book":"mrk","chapter":8,"verse":17,"text":"Jesus realized it and asked, Why discuss your lack of bread? Do you still not perceive or understand? Are your hearts hardened?","status":"source_text","id":"mrk-8-17"},{"book":"mrk","chapter":8,"verse":18,"text":"Having eyes, do you not see? Having ears, do you not hear? Do you not remember?","status":"source_text","id":"mrk-8-18"},{"book":"mrk","chapter":8,"verse":19,"text":"When I broke five loaves for five thousand, how many baskets of leftovers did you collect? They answered, Twelve.","status":"source_text","id":"mrk-8-19"},{"book":"mrk","chapter":8,"verse":20,"text":"And when seven loaves fed four thousand, how many baskets? They answered, Seven.","status":"source_text","id":"mrk-8-20"},{"book":"mrk","chapter":8,"verse":21,"text":"Then he asked, Do you still not understand?","status":"source_text","id":"mrk-8-21"},{"book":"mrk","chapter":8,"verse":22,"text":"They came to Bethsaida, where people brought a blind man and asked Jesus to touch him.","status":"source_text","id":"mrk-8-22"},{"book":"mrk","chapter":8,"verse":23,"text":"Jesus took his hand and led him outside the village. After putting saliva on his eyes and laying hands on him, he asked what he saw.","status":"source_text","id":"mrk-8-23"},{"book":"mrk","chapter":8,"verse":24,"text":"He looked up and said, I see people, but they look like trees walking.","status":"source_text","id":"mrk-8-24"},{"book":"mrk","chapter":8,"verse":25,"text":"Jesus laid hands on his eyes again. His sight was restored and he saw everything clearly.","status":"source_text","id":"mrk-8-25"},{"book":"mrk","chapter":8,"verse":26,"text":"Jesus sent him home with instructions not to enter the village.","status":"source_text","id":"mrk-8-26"},{"book":"mrk","chapter":8,"verse":27,"text":"Jesus and his disciples went toward villages near Caesarea Philippi. On the way he asked, Who do people say I am?","status":"source_text","id":"mrk-8-27"},{"book":"mrk","chapter":8,"verse":28,"text":"They replied, Some say John the Baptist, others Elijah, and still others one of the prophets.","status":"source_text","id":"mrk-8-28"},{"book":"mrk","chapter":8,"verse":29,"text":"He asked, But who do you say I am? Peter answered, You are the Christ.","status":"source_text","id":"mrk-8-29"},{"book":"mrk","chapter":8,"verse":30,"text":"Jesus sternly ordered them to tell no one about him.","status":"source_text","id":"mrk-8-30"},{"book":"mrk","chapter":8,"verse":31,"text":"He began teaching that the Son of Man must suffer greatly, be rejected by elders, chief priests and scribes, be killed and rise after three days.","status":"source_text","id":"mrk-8-31"},{"book":"mrk","chapter":8,"verse":32,"text":"He spoke plainly about it, but Peter took him aside and began to rebuke him.","status":"source_text","id":"mrk-8-32"},{"book":"mrk","chapter":8,"verse":33,"text":"Jesus turned, looked at his disciples and rebuked Peter: Get behind me, Satan. You have human concerns in mind rather than God's.","status":"source_text","id":"mrk-8-33"},{"book":"mrk","chapter":8,"verse":34,"text":"Calling the crowd and disciples, he said, Whoever wants to follow me must deny themselves, take up their cross and follow me.","status":"source_text","id":"mrk-8-34"},{"book":"mrk","chapter":8,"verse":35,"text":"Whoever tries to save their life will lose it; whoever loses their life for my sake and for the gospel will save it.","status":"source_text","id":"mrk-8-35"},{"book":"mrk","chapter":8,"verse":36,"text":"What good is it to gain the whole world while losing your own life?","status":"source_text","id":"mrk-8-36"},{"book":"mrk","chapter":8,"verse":37,"text":"What can a person give in exchange for their life?","status":"source_text","id":"mrk-8-37"},{"book":"mrk","chapter":8,"verse":38,"text":"Whoever is ashamed of me and my words in this unfaithful and sinful generation, the Son of Man will be ashamed of that person when he comes in his Father's glory with the holy angels.","status":"source_text","id":"mrk-8-38"},{"book":"mrk","chapter":9,"verse":1,"text":"Jesus said, Truly I tell you, some standing here will not die before they see God's kingdom come in power.","status":"source_text","id":"mrk-9-1"},{"book":"mrk","chapter":9,"verse":2,"text":"Six days later Jesus took Peter, James and John alone up a high mountain, and his appearance changed before them.","status":"source_text","id":"mrk-9-2"},{"book":"mrk","chapter":9,"verse":3,"text":"His clothes became dazzling white, whiter than any earthly cleaner could make them.","status":"source_text","id":"mrk-9-3"},{"book":"mrk","chapter":9,"verse":4,"text":"Elijah appeared to them with Moses, and they were speaking with Jesus.","status":"source_text","id":"mrk-9-4"},{"book":"mrk","chapter":9,"verse":5,"text":"Peter said, Teacher, it is good for us to be here. Let us build three shelters: one for you, one for Moses and one for Elijah.","status":"source_text","id":"mrk-9-5"},{"book":"mrk","chapter":9,"verse":6,"text":"He did not know what to say, for they were terrified.","status":"source_text","id":"mrk-9-6"},{"book":"mrk","chapter":9,"verse":7,"text":"A cloud overshadowed them, and a voice came from the cloud: This is my beloved Son. Listen to him.","status":"source_text","id":"mrk-9-7"},{"book":"mrk","chapter":9,"verse":8,"text":"Suddenly, as they looked around, they saw no one with them but Jesus.","status":"source_text","id":"mrk-9-8"},{"book":"mrk","chapter":9,"verse":9,"text":"On the way down he ordered them to tell nobody what they had seen until the Son of Man had risen from the dead.","status":"source_text","id":"mrk-9-9"},{"book":"mrk","chapter":9,"verse":10,"text":"They kept the matter to themselves, discussing what rising from the dead might mean.","status":"source_text","id":"mrk-9-10"},{"book":"mrk","chapter":9,"verse":11,"text":"They asked, Why do the scribes say Elijah must come first?","status":"source_text","id":"mrk-9-11"},{"book":"mrk","chapter":9,"verse":12,"text":"Jesus replied that Elijah does come first to restore all things, yet Scripture also says the Son of Man must suffer greatly and be treated with contempt.","status":"source_text","id":"mrk-9-12"},{"book":"mrk","chapter":9,"verse":13,"text":"Yet I tell you Elijah has come, and they did to him whatever they pleased, just as Scripture says.","status":"source_text","id":"mrk-9-13"},{"book":"mrk","chapter":9,"verse":14,"text":"Returning to the other disciples, they found a large crowd and scribes arguing with them.","status":"source_text","id":"mrk-9-14"},{"book":"mrk","chapter":9,"verse":15,"text":"The whole crowd was immediately astonished to see Jesus and ran to greet him.","status":"source_text","id":"mrk-9-15"},{"book":"mrk","chapter":9,"verse":16,"text":"Jesus asked them what they were arguing about.","status":"source_text","id":"mrk-9-16"},{"book":"mrk","chapter":9,"verse":17,"text":"A man from the crowd answered, Teacher, I brought you my son, who has a spirit that makes him unable to speak.","status":"source_text","id":"mrk-9-17"},{"book":"mrk","chapter":9,"verse":18,"text":"Whenever it seizes him, it throws him down; he foams at the mouth, grinds his teeth and stiffens. I asked your disciples to drive it out, but they could not.","status":"source_text","id":"mrk-9-18"},{"book":"mrk","chapter":9,"verse":19,"text":"Jesus replied, Faithless generation, how long must I remain with you and bear with you? Bring the boy to me.","status":"source_text","id":"mrk-9-19"},{"book":"mrk","chapter":9,"verse":20,"text":"They brought him; as soon as the spirit saw Jesus, it convulsed the boy, who fell and rolled on the ground foaming.","status":"source_text","id":"mrk-9-20"},{"book":"mrk","chapter":9,"verse":21,"text":"Jesus asked the father how long it had happened. He answered, Since childhood.","status":"source_text","id":"mrk-9-21"},{"book":"mrk","chapter":9,"verse":22,"text":"It has often thrown him into fire or water to destroy him. If you can do anything, have compassion and help us.","status":"source_text","id":"mrk-9-22"},{"book":"mrk","chapter":9,"verse":23,"text":"Jesus said, If you can? All things are possible for the one who believes.","status":"source_text","id":"mrk-9-23"},{"book":"mrk","chapter":9,"verse":24,"text":"Immediately the father cried out, I believe! Help my unbelief!","status":"source_text","id":"mrk-9-24"},{"book":"mrk","chapter":9,"verse":25,"text":"Seeing the crowd rush together, Jesus rebuked the deaf and mute spirit, commanding it to leave the boy and never enter again.","status":"source_text","id":"mrk-9-25"},{"book":"mrk","chapter":9,"verse":26,"text":"The spirit cried out, convulsed him violently and left. The boy lay like a corpse, and many thought he was dead.","status":"source_text","id":"mrk-9-26"},{"book":"mrk","chapter":9,"verse":27,"text":"But Jesus took him by the hand and raised him, and he stood up.","status":"source_text","id":"mrk-9-27"},{"book":"mrk","chapter":9,"verse":28,"text":"Once indoors the disciples asked privately why they had been unable to drive it out.","status":"source_text","id":"mrk-9-28"},{"book":"mrk","chapter":9,"verse":29,"text":"He said, This kind cannot come out by anything except prayer.","status":"source_text","id":"mrk-9-29"},{"book":"mrk","chapter":9,"verse":30,"text":"They left that place and passed through Galilee, but Jesus did not want anyone to know.","status":"source_text","id":"mrk-9-30"},{"book":"mrk","chapter":9,"verse":31,"text":"For he was teaching his disciples that the Son of Man would be handed over, killed and rise three days after his death.","status":"source_text","id":"mrk-9-31"},{"book":"mrk","chapter":9,"verse":32,"text":"They did not understand his saying and were afraid to ask.","status":"source_text","id":"mrk-9-32"},{"book":"mrk","chapter":9,"verse":33,"text":"When they reached a house in Capernaum, Jesus asked what they had discussed along the road.","status":"source_text","id":"mrk-9-33"},{"book":"mrk","chapter":9,"verse":34,"text":"They were silent, for on the road they had argued about who was greatest.","status":"source_text","id":"mrk-9-34"},{"book":"mrk","chapter":9,"verse":35,"text":"Jesus sat down and called the Twelve: Anyone who wants to be first must be last of all and servant of all.","status":"source_text","id":"mrk-9-35"},{"book":"mrk","chapter":9,"verse":36,"text":"He placed a child in their midst, took the child in his arms and said,","status":"source_text","id":"mrk-9-36"},{"book":"mrk","chapter":9,"verse":37,"text":"Whoever welcomes one such child in my name welcomes me; whoever welcomes me welcomes the one who sent me.","status":"source_text","id":"mrk-9-37"},{"book":"mrk","chapter":9,"verse":38,"text":"John said, Teacher, we saw someone casting out demons in your name and tried to stop him because he was not following us.","status":"source_text","id":"mrk-9-38"},{"book":"mrk","chapter":9,"verse":39,"text":"Jesus said, Do not stop him. No one who does a mighty work in my name can immediately speak evil of me.","status":"source_text","id":"mrk-9-39"},{"book":"mrk","chapter":9,"verse":40,"text":"Whoever is not against us is for us.","status":"source_text","id":"mrk-9-40"},{"book":"mrk","chapter":9,"verse":41,"text":"Whoever gives you a cup of water because you belong to Christ will certainly not lose their reward.","status":"source_text","id":"mrk-9-41"},{"book":"mrk","chapter":9,"verse":42,"text":"Whoever causes one of these little ones who believe in me to stumble would be better off with a heavy millstone tied to the neck and cast into the sea.","status":"source_text","id":"mrk-9-42"},{"book":"mrk","chapter":9,"verse":43,"text":"If your hand causes you to sin, cut it off. It is better to enter life maimed than go with two hands into Gehenna, into the fire that cannot be put out.","status":"source_text","id":"mrk-9-43"},{"book":"mrk","chapter":9,"verse":44,"text":"—","status":"absent_from_critical_text","id":"mrk-9-44"},{"book":"mrk","chapter":9,"verse":45,"text":"If your foot causes you to sin, cut it off. It is better to enter life lame than be thrown with two feet into Gehenna.","status":"source_text","id":"mrk-9-45"},{"book":"mrk","chapter":9,"verse":46,"text":"—","status":"absent_from_critical_text","id":"mrk-9-46"},{"book":"mrk","chapter":9,"verse":47,"text":"If your eye causes you to sin, remove it. It is better to enter God's kingdom with one eye than be cast into Gehenna with two.","status":"source_text","id":"mrk-9-47"},{"book":"mrk","chapter":9,"verse":48,"text":"There the worm does not die and the fire is not quenched.","status":"source_text","id":"mrk-9-48"},{"book":"mrk","chapter":9,"verse":49,"text":"For everyone will be salted with fire.","status":"source_text","id":"mrk-9-49"},{"book":"mrk","chapter":9,"verse":50,"text":"Salt is good, but if it loses its saltiness, how will you restore it? Keep salt among yourselves and live in peace with one another.","status":"source_text","id":"mrk-9-50"},{"book":"mrk","chapter":10,"verse":1,"text":"Jesus left and came to Judea and beyond the Jordan. Crowds gathered again, and as was his practice he taught them.","status":"source_text","id":"mrk-10-1"},{"book":"mrk","chapter":10,"verse":2,"text":"Pharisees came to test him, asking whether a husband was permitted to divorce his wife.","status":"source_text","id":"mrk-10-2"},{"book":"mrk","chapter":10,"verse":3,"text":"Jesus replied, What did Moses command you?","status":"source_text","id":"mrk-10-3"},{"book":"mrk","chapter":10,"verse":4,"text":"They answered that Moses allowed a man to write a certificate of divorce and send her away.","status":"source_text","id":"mrk-10-4"},{"book":"mrk","chapter":10,"verse":5,"text":"Jesus told them Moses had written that provision because of their hard hearts.","status":"source_text","id":"mrk-10-5"},{"book":"mrk","chapter":10,"verse":6,"text":"But from the beginning of creation, God made them male and female.","status":"source_text","id":"mrk-10-6"},{"book":"mrk","chapter":10,"verse":7,"text":"For this reason a person leaves father and mother and is joined to a spouse,","status":"source_text","id":"mrk-10-7"},{"book":"mrk","chapter":10,"verse":8,"text":"and the two become one flesh. So they are no longer two but one flesh.","status":"source_text","id":"mrk-10-8"},{"book":"mrk","chapter":10,"verse":9,"text":"Therefore let no one separate what God has joined together.","status":"source_text","id":"mrk-10-9"},{"book":"mrk","chapter":10,"verse":10,"text":"Back in the house, his disciples asked him about this again.","status":"source_text","id":"mrk-10-10"},{"book":"mrk","chapter":10,"verse":11,"text":"He said that a man who divorces his wife and marries another commits adultery against her.","status":"source_text","id":"mrk-10-11"},{"book":"mrk","chapter":10,"verse":12,"text":"And if a woman divorces her husband and marries another, she commits adultery.","status":"source_text","id":"mrk-10-12"},{"book":"mrk","chapter":10,"verse":13,"text":"People brought children to Jesus for him to touch, but the disciples rebuked them.","status":"source_text","id":"mrk-10-13"},{"book":"mrk","chapter":10,"verse":14,"text":"Jesus saw this and was indignant: Let the children come to me; do not prevent them, for God's kingdom belongs to such as these.","status":"source_text","id":"mrk-10-14"},{"book":"mrk","chapter":10,"verse":15,"text":"Truly I tell you, whoever does not receive God's kingdom like a child will never enter it.","status":"source_text","id":"mrk-10-15"},{"book":"mrk","chapter":10,"verse":16,"text":"He embraced the children, laid hands on them and blessed them.","status":"source_text","id":"mrk-10-16"},{"book":"mrk","chapter":10,"verse":17,"text":"As Jesus set out, a man ran up, knelt and asked, Good teacher, what must I do to inherit eternal life?","status":"source_text","id":"mrk-10-17"},{"book":"mrk","chapter":10,"verse":18,"text":"Jesus answered, Why call me good? No one is good except God alone.","status":"source_text","id":"mrk-10-18"},{"book":"mrk","chapter":10,"verse":19,"text":"You know the commandments: Do not murder, commit adultery, steal, bear false witness or defraud; honor your father and mother.","status":"source_text","id":"mrk-10-19"},{"book":"mrk","chapter":10,"verse":20,"text":"He said, Teacher, I have kept all these since my youth.","status":"source_text","id":"mrk-10-20"},{"book":"mrk","chapter":10,"verse":21,"text":"Jesus looked at him with love: One thing you lack. Sell what you own and give to the poor, and you will have treasure in heaven; then come and follow me.","status":"source_text","id":"mrk-10-21"},{"book":"mrk","chapter":10,"verse":22,"text":"The man grew downcast and left grieving, because he possessed much wealth.","status":"source_text","id":"mrk-10-22"},{"book":"mrk","chapter":10,"verse":23,"text":"Jesus looked around and told his disciples how difficult it is for the wealthy to enter God's kingdom.","status":"source_text","id":"mrk-10-23"},{"book":"mrk","chapter":10,"verse":24,"text":"The disciples were astonished, but he said again, Children, how hard it is to enter God's kingdom.","status":"source_text","id":"mrk-10-24"},{"book":"mrk","chapter":10,"verse":25,"text":"It is easier for a camel to go through a needle's eye than for a rich person to enter God's kingdom.","status":"source_text","id":"mrk-10-25"},{"book":"mrk","chapter":10,"verse":26,"text":"Even more astonished, they asked one another, Then who can be saved?","status":"source_text","id":"mrk-10-26"},{"book":"mrk","chapter":10,"verse":27,"text":"Jesus looked at them and said, It is impossible for people, but not for God; all things are possible for God.","status":"source_text","id":"mrk-10-27"},{"book":"mrk","chapter":10,"verse":28,"text":"Peter said, Look, we left everything to follow you.","status":"source_text","id":"mrk-10-28"},{"book":"mrk","chapter":10,"verse":29,"text":"Jesus replied, Anyone who has left a house, brothers, sisters, mother, father, children or fields for me and the gospel","status":"source_text","id":"mrk-10-29"},{"book":"mrk","chapter":10,"verse":30,"text":"will receive a hundred times as much in this age—homes, family and fields, along with persecution—and eternal life in the age to come.","status":"source_text","id":"mrk-10-30"},{"book":"mrk","chapter":10,"verse":31,"text":"But many who are first will be last, and the last will be first.","status":"source_text","id":"mrk-10-31"},{"book":"mrk","chapter":10,"verse":32,"text":"On the road up to Jerusalem Jesus walked ahead. The disciples were amazed, others following were afraid, and he again told the Twelve what was about to happen.","status":"source_text","id":"mrk-10-32"},{"book":"mrk","chapter":10,"verse":33,"text":"We are going up to Jerusalem. The Son of Man will be handed over to chief priests and scribes, condemned to death and delivered to the Gentiles.","status":"source_text","id":"mrk-10-33"},{"book":"mrk","chapter":10,"verse":34,"text":"They will mock, spit on, flog and kill him; after three days he will rise.","status":"source_text","id":"mrk-10-34"},{"book":"mrk","chapter":10,"verse":35,"text":"James and John, Zebedee's sons, came to Jesus and asked him to grant them a request.","status":"source_text","id":"mrk-10-35"},{"book":"mrk","chapter":10,"verse":36,"text":"He asked, What do you want me to do for you?","status":"source_text","id":"mrk-10-36"},{"book":"mrk","chapter":10,"verse":37,"text":"They asked to sit one at his right and the other at his left in his glory.","status":"source_text","id":"mrk-10-37"},{"book":"mrk","chapter":10,"verse":38,"text":"Jesus replied, You do not know what you are asking. Can you drink my cup or undergo the baptism I undergo?","status":"source_text","id":"mrk-10-38"},{"book":"mrk","chapter":10,"verse":39,"text":"They said they could. Jesus told them they would indeed drink his cup and share his baptism.","status":"source_text","id":"mrk-10-39"},{"book":"mrk","chapter":10,"verse":40,"text":"But seats at my right and left are not mine to assign; they belong to those for whom they have been prepared.","status":"source_text","id":"mrk-10-40"},{"book":"mrk","chapter":10,"verse":41,"text":"When the other ten heard, they became angry with James and John.","status":"source_text","id":"mrk-10-41"},{"book":"mrk","chapter":10,"verse":42,"text":"Jesus called them together: You know that those regarded as rulers among the nations dominate their people, and the great exercise power over them.","status":"source_text","id":"mrk-10-42"},{"book":"mrk","chapter":10,"verse":43,"text":"But it must not be so among you. Whoever wants to become great among you must be your servant.","status":"source_text","id":"mrk-10-43"},{"book":"mrk","chapter":10,"verse":44,"text":"Whoever wants to be first among you must be slave of all.","status":"source_text","id":"mrk-10-44"},{"book":"mrk","chapter":10,"verse":45,"text":"For even the Son of Man came not to be served but to serve, and to give his life as a ransom for many.","status":"source_text","id":"mrk-10-45"},{"book":"mrk","chapter":10,"verse":46,"text":"They came to Jericho. As Jesus left with his disciples and a large crowd, Bartimaeus, blind son of Timaeus, sat begging by the road.","status":"source_text","id":"mrk-10-46"},{"book":"mrk","chapter":10,"verse":47,"text":"When he heard it was Jesus of Nazareth, he shouted, Jesus, son of David, have mercy on me!","status":"source_text","id":"mrk-10-47"},{"book":"mrk","chapter":10,"verse":48,"text":"Many told him to be quiet, but he shouted all the louder, Son of David, have mercy on me!","status":"source_text","id":"mrk-10-48"},{"book":"mrk","chapter":10,"verse":49,"text":"Jesus stopped and said, Call him. They told the blind man, Take courage, get up. He is calling you.","status":"source_text","id":"mrk-10-49"},{"book":"mrk","chapter":10,"verse":50,"text":"He threw off his cloak, jumped up and came to Jesus.","status":"source_text","id":"mrk-10-50"},{"book":"mrk","chapter":10,"verse":51,"text":"Jesus asked what he wanted. He replied, Teacher, I want to see again.","status":"source_text","id":"mrk-10-51"},{"book":"mrk","chapter":10,"verse":52,"text":"Jesus said, Go; your faith has made you well. Immediately he regained sight and followed Jesus along the road.","status":"source_text","id":"mrk-10-52"},{"book":"mrk","chapter":11,"verse":1,"text":"As they approached Jerusalem near Bethphage and Bethany on the Mount of Olives, Jesus sent two disciples.","status":"source_text","id":"mrk-11-1"},{"book":"mrk","chapter":11,"verse":2,"text":"Go to the village ahead; you will find a tied colt that nobody has ridden. Untie it and bring it here.","status":"source_text","id":"mrk-11-2"},{"book":"mrk","chapter":11,"verse":3,"text":"If someone asks why, tell them the Lord needs it and will send it back promptly.","status":"source_text","id":"mrk-11-3"},{"book":"mrk","chapter":11,"verse":4,"text":"They found the colt tied outside near a doorway in the street and untied it.","status":"source_text","id":"mrk-11-4"},{"book":"mrk","chapter":11,"verse":5,"text":"Some people standing there asked why they were untying the colt.","status":"source_text","id":"mrk-11-5"},{"book":"mrk","chapter":11,"verse":6,"text":"They answered as Jesus had instructed, and the people let them take it.","status":"source_text","id":"mrk-11-6"},{"book":"mrk","chapter":11,"verse":7,"text":"They brought the colt to Jesus, laid cloaks over it and he sat upon it.","status":"source_text","id":"mrk-11-7"},{"book":"mrk","chapter":11,"verse":8,"text":"Many spread their cloaks along the road, while others spread branches cut from the fields.","status":"source_text","id":"mrk-11-8"},{"book":"mrk","chapter":11,"verse":9,"text":"Those before and behind cried, Hosanna! Blessed is the one who comes in the Lord's name!","status":"source_text","id":"mrk-11-9"},{"book":"mrk","chapter":11,"verse":10,"text":"Blessed is the coming kingdom of our father David! Hosanna in the highest!","status":"source_text","id":"mrk-11-10"},{"book":"mrk","chapter":11,"verse":11,"text":"Jesus entered Jerusalem and looked around the temple. As evening had come, he went out to Bethany with the Twelve.","status":"source_text","id":"mrk-11-11"},{"book":"mrk","chapter":11,"verse":12,"text":"The next day, as they left Bethany, he became hungry.","status":"source_text","id":"mrk-11-12"},{"book":"mrk","chapter":11,"verse":13,"text":"Seeing a leafy fig tree at a distance, he went to see if it had fruit but found only leaves; it was not the season for figs.","status":"source_text","id":"mrk-11-13"},{"book":"mrk","chapter":11,"verse":14,"text":"Jesus said to the tree, May no one ever eat fruit from you again. His disciples heard him.","status":"source_text","id":"mrk-11-14"},{"book":"mrk","chapter":11,"verse":15,"text":"When they reached Jerusalem, Jesus entered the temple and drove out the buyers and sellers, overturning the money changers' tables and dove sellers' seats.","status":"source_text","id":"mrk-11-15"},{"book":"mrk","chapter":11,"verse":16,"text":"He would not allow anyone to carry goods through the temple courts.","status":"source_text","id":"mrk-11-16"},{"book":"mrk","chapter":11,"verse":17,"text":"He taught, Is it not written that my house will be called a house of prayer for all nations? But you have turned it into a robbers' den.","status":"source_text","id":"mrk-11-17"},{"book":"mrk","chapter":11,"verse":18,"text":"The chief priests and scribes heard and sought a way to destroy him; they feared him because the crowd was amazed at his teaching.","status":"source_text","id":"mrk-11-18"},{"book":"mrk","chapter":11,"verse":19,"text":"When evening came, they went outside the city.","status":"source_text","id":"mrk-11-19"},{"book":"mrk","chapter":11,"verse":20,"text":"Passing by in the morning, they saw the fig tree withered from its roots.","status":"source_text","id":"mrk-11-20"},{"book":"mrk","chapter":11,"verse":21,"text":"Peter remembered and said, Teacher, look! The fig tree you cursed has withered.","status":"source_text","id":"mrk-11-21"},{"book":"mrk","chapter":11,"verse":22,"text":"Jesus answered, Have faith in God.","status":"source_text","id":"mrk-11-22"},{"book":"mrk","chapter":11,"verse":23,"text":"Truly I tell you, whoever tells this mountain to rise and fall into the sea and does not doubt but believes it will happen will have it done.","status":"source_text","id":"mrk-11-23"},{"book":"mrk","chapter":11,"verse":24,"text":"So I tell you, whatever you ask for in prayer, believe you have received it, and it will be yours.","status":"source_text","id":"mrk-11-24"},{"book":"mrk","chapter":11,"verse":25,"text":"And when you stand praying, forgive anyone against whom you hold a grievance, so your Father in heaven may forgive your offenses.","status":"source_text","id":"mrk-11-25"},{"book":"mrk","chapter":11,"verse":26,"text":"—","status":"absent_from_critical_text","id":"mrk-11-26"},{"book":"mrk","chapter":11,"verse":27,"text":"They returned to Jerusalem. As Jesus walked in the temple, chief priests, scribes and elders approached.","status":"source_text","id":"mrk-11-27"},{"book":"mrk","chapter":11,"verse":28,"text":"They asked, By what authority do you do these things, and who gave you this authority?","status":"source_text","id":"mrk-11-28"},{"book":"mrk","chapter":11,"verse":29,"text":"Jesus said, I will ask you one question. Answer me and I will tell you by what authority I act.","status":"source_text","id":"mrk-11-29"},{"book":"mrk","chapter":11,"verse":30,"text":"Was John's baptism from heaven or from human beings? Answer me.","status":"source_text","id":"mrk-11-30"},{"book":"mrk","chapter":11,"verse":31,"text":"They reasoned that if they said, From heaven, he would ask why they had not believed John.","status":"source_text","id":"mrk-11-31"},{"book":"mrk","chapter":11,"verse":32,"text":"But they feared the people if they answered, From human beings, since all regarded John as a true prophet.","status":"source_text","id":"mrk-11-32"},{"book":"mrk","chapter":11,"verse":33,"text":"They answered that they did not know. Jesus replied, Neither will I tell you by what authority I do these things.","status":"source_text","id":"mrk-11-33"},{"book":"mrk","chapter":12,"verse":1,"text":"Jesus spoke in parables: A man planted a vineyard, fenced it, dug a winepress and built a tower, then leased it to tenants and went away.","status":"source_text","id":"mrk-12-1"},{"book":"mrk","chapter":12,"verse":2,"text":"At harvest time he sent a servant to collect his share of the fruit from the tenants.","status":"source_text","id":"mrk-12-2"},{"book":"mrk","chapter":12,"verse":3,"text":"They seized the servant, beat him and sent him away empty handed.","status":"source_text","id":"mrk-12-3"},{"book":"mrk","chapter":12,"verse":4,"text":"He sent another servant; they wounded his head and dishonored him.","status":"source_text","id":"mrk-12-4"},{"book":"mrk","chapter":12,"verse":5,"text":"He sent another, whom they killed, and many more servants; some they beat and others they killed.","status":"source_text","id":"mrk-12-5"},{"book":"mrk","chapter":12,"verse":6,"text":"The owner had one person left, a beloved son. He sent him last, thinking they would respect his son.","status":"source_text","id":"mrk-12-6"},{"book":"mrk","chapter":12,"verse":7,"text":"But the tenants said to each other, This is the heir. Let us kill him and take his inheritance.","status":"source_text","id":"mrk-12-7"},{"book":"mrk","chapter":12,"verse":8,"text":"They seized him, killed him and threw him out of the vineyard.","status":"source_text","id":"mrk-12-8"},{"book":"mrk","chapter":12,"verse":9,"text":"What will the owner do? He will come, destroy those tenants and give the vineyard to others.","status":"source_text","id":"mrk-12-9"},{"book":"mrk","chapter":12,"verse":10,"text":"Have you not read in Scripture: The stone rejected by the builders has become the cornerstone?","status":"source_text","id":"mrk-12-10"},{"book":"mrk","chapter":12,"verse":11,"text":"The Lord has done this, and it is wonderful in our eyes.","status":"source_text","id":"mrk-12-11"},{"book":"mrk","chapter":12,"verse":12,"text":"They understood the parable was about them and sought to seize Jesus, but feared the crowd and left him.","status":"source_text","id":"mrk-12-12"},{"book":"mrk","chapter":12,"verse":13,"text":"They sent some Pharisees and Herodians to trap Jesus in his words.","status":"source_text","id":"mrk-12-13"},{"book":"mrk","chapter":12,"verse":14,"text":"They flattered him as truthful and impartial in teaching God's way, then asked whether paying tax to Caesar was lawful.","status":"source_text","id":"mrk-12-14"},{"book":"mrk","chapter":12,"verse":15,"text":"Should we pay or not? Jesus perceived their hypocrisy and said, Why test me? Bring me a denarius to examine.","status":"source_text","id":"mrk-12-15"},{"book":"mrk","chapter":12,"verse":16,"text":"They brought one. He asked whose image and inscription were on it, and they answered, Caesar's.","status":"source_text","id":"mrk-12-16"},{"book":"mrk","chapter":12,"verse":17,"text":"Jesus said, Return to Caesar what belongs to Caesar and to God what belongs to God. They were amazed.","status":"source_text","id":"mrk-12-17"},{"book":"mrk","chapter":12,"verse":18,"text":"Sadducees, who say there is no resurrection, came and asked him,","status":"source_text","id":"mrk-12-18"},{"book":"mrk","chapter":12,"verse":19,"text":"Teacher, Moses wrote that if a brother dies childless leaving a wife, his brother should marry the widow and raise descendants for him.","status":"source_text","id":"mrk-12-19"},{"book":"mrk","chapter":12,"verse":20,"text":"There were seven brothers. The oldest married and died leaving no children.","status":"source_text","id":"mrk-12-20"},{"book":"mrk","chapter":12,"verse":21,"text":"The second married her and died without children; the third did likewise.","status":"source_text","id":"mrk-12-21"},{"book":"mrk","chapter":12,"verse":22,"text":"None of the seven left children, and finally the woman died.","status":"source_text","id":"mrk-12-22"},{"book":"mrk","chapter":12,"verse":23,"text":"At the resurrection, whose wife will she be, since all seven were married to her?","status":"source_text","id":"mrk-12-23"},{"book":"mrk","chapter":12,"verse":24,"text":"Jesus said they were mistaken because they understood neither Scripture nor God's power.","status":"source_text","id":"mrk-12-24"},{"book":"mrk","chapter":12,"verse":25,"text":"When people rise from the dead, they do not marry but are like the angels in heaven.","status":"source_text","id":"mrk-12-25"},{"book":"mrk","chapter":12,"verse":26,"text":"As for the dead rising, have you not read in Moses' account of the bush that God said, I am the God of Abraham, Isaac and Jacob?","status":"source_text","id":"mrk-12-26"},{"book":"mrk","chapter":12,"verse":27,"text":"He is God of the living, not of the dead. You are greatly mistaken.","status":"source_text","id":"mrk-12-27"},{"book":"mrk","chapter":12,"verse":28,"text":"A scribe who heard the discussion and appreciated Jesus' reply asked which commandment was foremost.","status":"source_text","id":"mrk-12-28"},{"book":"mrk","chapter":12,"verse":29,"text":"Jesus replied, First is this: Hear, Israel. The Lord our God is one Lord.","status":"source_text","id":"mrk-12-29"},{"book":"mrk","chapter":12,"verse":30,"text":"Love the Lord your God with all your heart, soul, mind and strength.","status":"source_text","id":"mrk-12-30"},{"book":"mrk","chapter":12,"verse":31,"text":"Second, love your neighbor as yourself. No commandment is greater than these.","status":"source_text","id":"mrk-12-31"},{"book":"mrk","chapter":12,"verse":32,"text":"The scribe replied, Teacher, you are right: God is one, and there is no other besides him.","status":"source_text","id":"mrk-12-32"},{"book":"mrk","chapter":12,"verse":33,"text":"To love him with all your heart, understanding and strength and to love your neighbor as yourself is worth more than all burnt offerings and sacrifices.","status":"source_text","id":"mrk-12-33"},{"book":"mrk","chapter":12,"verse":34,"text":"Jesus saw he had answered wisely and said, You are not far from God's kingdom. After that no one dared ask further questions.","status":"source_text","id":"mrk-12-34"},{"book":"mrk","chapter":12,"verse":35,"text":"While teaching in the temple, Jesus asked why the scribes call the Christ a son of David.","status":"source_text","id":"mrk-12-35"},{"book":"mrk","chapter":12,"verse":36,"text":"David himself, speaking by the Holy Spirit, said: The Lord said to my Lord, Sit at my right until I put your enemies under your feet.","status":"source_text","id":"mrk-12-36"},{"book":"mrk","chapter":12,"verse":37,"text":"David calls him Lord; how can he be merely his descendant? The large crowd listened gladly.","status":"source_text","id":"mrk-12-37"},{"book":"mrk","chapter":12,"verse":38,"text":"In his teaching he warned against scribes who love to walk in long robes and receive greetings in marketplaces,","status":"source_text","id":"mrk-12-38"},{"book":"mrk","chapter":12,"verse":39,"text":"who desire the best seats in synagogues and places of honor at banquets.","status":"source_text","id":"mrk-12-39"},{"book":"mrk","chapter":12,"verse":40,"text":"They devour widows' houses and pray at length to be seen. They will receive a more severe judgment.","status":"source_text","id":"mrk-12-40"},{"book":"mrk","chapter":12,"verse":41,"text":"Jesus sat facing the temple treasury and watched people give. Many wealthy people contributed large sums.","status":"source_text","id":"mrk-12-41"},{"book":"mrk","chapter":12,"verse":42,"text":"A poor widow came and put in two tiny copper coins, worth only a small amount.","status":"source_text","id":"mrk-12-42"},{"book":"mrk","chapter":12,"verse":43,"text":"Jesus called his disciples and said, Truly this poor widow has given more than everyone else who contributed.","status":"source_text","id":"mrk-12-43"},{"book":"mrk","chapter":12,"verse":44,"text":"For they gave from their abundance, but out of her poverty she gave everything she had to live on.","status":"source_text","id":"mrk-12-44"},{"book":"mrk","chapter":13,"verse":1,"text":"As Jesus left the temple, a disciple exclaimed, Teacher, look at those stones and buildings!","status":"source_text","id":"mrk-13-1"},{"book":"mrk","chapter":13,"verse":2,"text":"Jesus replied, Do you see these great buildings? Not one stone here will be left upon another; all will be demolished.","status":"source_text","id":"mrk-13-2"},{"book":"mrk","chapter":13,"verse":3,"text":"As he sat on the Mount of Olives facing the temple, Peter, James, John and Andrew asked him privately,","status":"source_text","id":"mrk-13-3"},{"book":"mrk","chapter":13,"verse":4,"text":"When will this happen, and what sign will show that all these things are about to be accomplished?","status":"source_text","id":"mrk-13-4"},{"book":"mrk","chapter":13,"verse":5,"text":"Jesus began, Be careful that no one deceives you.","status":"source_text","id":"mrk-13-5"},{"book":"mrk","chapter":13,"verse":6,"text":"Many will come in my name claiming to be the one, and will deceive many.","status":"source_text","id":"mrk-13-6"},{"book":"mrk","chapter":13,"verse":7,"text":"When you hear of wars and rumors of wars, do not panic. These things must happen, but the end is not yet.","status":"source_text","id":"mrk-13-7"},{"book":"mrk","chapter":13,"verse":8,"text":"Nation will rise against nation, kingdom against kingdom; earthquakes and famines will occur. These are the beginning of birth pains.","status":"source_text","id":"mrk-13-8"},{"book":"mrk","chapter":13,"verse":9,"text":"Watch yourselves. People will hand you over to councils and beat you in synagogues; for my sake you will stand before governors and kings as witnesses.","status":"source_text","id":"mrk-13-9"},{"book":"mrk","chapter":13,"verse":10,"text":"The gospel must first be proclaimed among all nations.","status":"source_text","id":"mrk-13-10"},{"book":"mrk","chapter":13,"verse":11,"text":"When they arrest and deliver you up, do not worry ahead of time what to say. Speak what is given then, for it is the Holy Spirit speaking, not you.","status":"source_text","id":"mrk-13-11"},{"book":"mrk","chapter":13,"verse":12,"text":"A brother will betray a brother to death, a father his child, and children will rise against parents and have them killed.","status":"source_text","id":"mrk-13-12"},{"book":"mrk","chapter":13,"verse":13,"text":"You will be hated by all because of my name, but whoever endures to the end will be saved.","status":"source_text","id":"mrk-13-13"},{"book":"mrk","chapter":13,"verse":14,"text":"When you see the desolating abomination standing where it should not—let the reader understand—those in Judea should flee to the mountains.","status":"source_text","id":"mrk-13-14"},{"book":"mrk","chapter":13,"verse":15,"text":"Anyone on the roof must not go down or enter the house to take anything.","status":"source_text","id":"mrk-13-15"},{"book":"mrk","chapter":13,"verse":16,"text":"Anyone in the field must not turn back to get a cloak.","status":"source_text","id":"mrk-13-16"},{"book":"mrk","chapter":13,"verse":17,"text":"How hard those days will be for pregnant women and nursing mothers!","status":"source_text","id":"mrk-13-17"},{"book":"mrk","chapter":13,"verse":18,"text":"Pray that it does not happen in winter.","status":"source_text","id":"mrk-13-18"},{"book":"mrk","chapter":13,"verse":19,"text":"Those days will bring suffering unlike anything since God created the world, never to be equaled afterward.","status":"source_text","id":"mrk-13-19"},{"book":"mrk","chapter":13,"verse":20,"text":"If the Lord had not shortened those days no one would survive, but for the sake of those he chose he shortened them.","status":"source_text","id":"mrk-13-20"},{"book":"mrk","chapter":13,"verse":21,"text":"If someone then says, Look, here is the Christ, or, There he is, do not believe it.","status":"source_text","id":"mrk-13-21"},{"book":"mrk","chapter":13,"verse":22,"text":"False christs and false prophets will arise, offering signs and wonders to deceive even the chosen if possible.","status":"source_text","id":"mrk-13-22"},{"book":"mrk","chapter":13,"verse":23,"text":"Be on guard; I have told you all these things ahead of time.","status":"source_text","id":"mrk-13-23"},{"book":"mrk","chapter":13,"verse":24,"text":"After that suffering, the sun will darken and the moon will cease to shine.","status":"source_text","id":"mrk-13-24"},{"book":"mrk","chapter":13,"verse":25,"text":"Stars will fall from heaven, and the powers of the heavens will be shaken.","status":"source_text","id":"mrk-13-25"},{"book":"mrk","chapter":13,"verse":26,"text":"Then people will see the Son of Man coming in clouds with great power and glory.","status":"source_text","id":"mrk-13-26"},{"book":"mrk","chapter":13,"verse":27,"text":"He will send the angels to gather his chosen ones from every direction, from earth's ends to heaven's ends.","status":"source_text","id":"mrk-13-27"},{"book":"mrk","chapter":13,"verse":28,"text":"Learn from the fig tree: when its branches soften and leaves appear, you know summer is near.","status":"source_text","id":"mrk-13-28"},{"book":"mrk","chapter":13,"verse":29,"text":"Likewise, when you see these things happening, know that he is near, at the door.","status":"source_text","id":"mrk-13-29"},{"book":"mrk","chapter":13,"verse":30,"text":"Truly I tell you, this generation will not pass away before all these things happen.","status":"source_text","id":"mrk-13-30"},{"book":"mrk","chapter":13,"verse":31,"text":"Heaven and earth will pass away, but my words will never pass away.","status":"source_text","id":"mrk-13-31"},{"book":"mrk","chapter":13,"verse":32,"text":"As for that day or hour, no one knows—not the angels in heaven, nor the Son, but only the Father.","status":"source_text","id":"mrk-13-32"},{"book":"mrk","chapter":13,"verse":33,"text":"Be on guard and stay awake, for you do not know when the time will come.","status":"source_text","id":"mrk-13-33"},{"book":"mrk","chapter":13,"verse":34,"text":"It is like a man leaving home on a journey who entrusts his house to servants, assigns each a task and tells the doorkeeper to stay awake.","status":"source_text","id":"mrk-13-34"},{"book":"mrk","chapter":13,"verse":35,"text":"Therefore stay awake, for you do not know whether the master returns at evening, midnight, cockcrow or dawn.","status":"source_text","id":"mrk-13-35"},{"book":"mrk","chapter":13,"verse":36,"text":"Do not let him arrive suddenly and find you asleep.","status":"source_text","id":"mrk-13-36"},{"book":"mrk","chapter":13,"verse":37,"text":"What I say to you I say to everyone: Stay awake!","status":"source_text","id":"mrk-13-37"},{"book":"mrk","chapter":14,"verse":1,"text":"Two days before Passover and the Festival of Unleavened Bread, the chief priests and scribes sought a way to seize Jesus by stealth and kill him.","status":"source_text","id":"mrk-14-1"},{"book":"mrk","chapter":14,"verse":2,"text":"They said, “Not during the festival, or the people may riot.”","status":"source_text","id":"mrk-14-2"},{"book":"mrk","chapter":14,"verse":3,"text":"While Jesus reclined at table in Bethany, at the house of Simon the leper, a woman broke an alabaster jar of costly pure nard and poured it on his head.","status":"source_text","id":"mrk-14-3"},{"book":"mrk","chapter":14,"verse":4,"text":"Some became indignant and said to one another, “Why this waste of perfume?”","status":"source_text","id":"mrk-14-4"},{"book":"mrk","chapter":14,"verse":5,"text":"“It could have been sold for more than three hundred denarii and given to the poor.” They rebuked her sharply.","status":"source_text","id":"mrk-14-5"},{"book":"mrk","chapter":14,"verse":6,"text":"Jesus said, “Leave her alone. Why trouble her? She has done a beautiful thing for me.”","status":"source_text","id":"mrk-14-6"},{"book":"mrk","chapter":14,"verse":7,"text":"“You always have the poor with you and can do good to them whenever you wish, but you will not always have me.”","status":"source_text","id":"mrk-14-7"},{"book":"mrk","chapter":14,"verse":8,"text":"“She has done what she could: she anointed my body beforehand for burial.”","status":"source_text","id":"mrk-14-8"},{"book":"mrk","chapter":14,"verse":9,"text":"“Truly I tell you, wherever the gospel is proclaimed in the whole world, what she has done will also be told in memory of her.”","status":"source_text","id":"mrk-14-9"},{"book":"mrk","chapter":14,"verse":10,"text":"Judas Iscariot, one of the Twelve, went to the chief priests to hand Jesus over to them.","status":"source_text","id":"mrk-14-10"},{"book":"mrk","chapter":14,"verse":11,"text":"They were pleased and promised to give him money. Judas looked for a suitable opportunity to hand him over.","status":"source_text","id":"mrk-14-11"},{"book":"mrk","chapter":14,"verse":12,"text":"On the first day of Unleavened Bread, when the Passover lamb was sacrificed, the disciples asked, “Where shall we prepare for you to eat the Passover?”","status":"source_text","id":"mrk-14-12"},{"book":"mrk","chapter":14,"verse":13,"text":"Jesus sent two disciples, saying, “Go into the city. A man carrying a jar of water will meet you; follow him.”","status":"source_text","id":"mrk-14-13"},{"book":"mrk","chapter":14,"verse":14,"text":"“Where he enters, tell the owner, ‘The Teacher asks: Where is my guest room where I may eat the Passover with my disciples?’”","status":"source_text","id":"mrk-14-14"},{"book":"mrk","chapter":14,"verse":15,"text":"“He will show you a large upstairs room, furnished and ready. Prepare for us there.”","status":"source_text","id":"mrk-14-15"},{"book":"mrk","chapter":14,"verse":16,"text":"The disciples went into the city and found everything as Jesus had told them, and they prepared the Passover.","status":"source_text","id":"mrk-14-16"},{"book":"mrk","chapter":14,"verse":17,"text":"When evening came, Jesus arrived with the Twelve.","status":"source_text","id":"mrk-14-17"},{"book":"mrk","chapter":14,"verse":18,"text":"As they reclined and ate, Jesus said, “Truly I tell you, one of you who eats with me will hand me over.”","status":"source_text","id":"mrk-14-18"},{"book":"mrk","chapter":14,"verse":19,"text":"They became distressed and asked him one after another, “Surely not I?”","status":"source_text","id":"mrk-14-19"},{"book":"mrk","chapter":14,"verse":20,"text":"Jesus said, “It is one of the Twelve, one who dips bread into the bowl with me.”","status":"source_text","id":"mrk-14-20"},{"book":"mrk","chapter":14,"verse":21,"text":"“The Son of Man goes as it is written of him, but woe to the one who hands him over! It would be better for that person not to have been born.”","status":"source_text","id":"mrk-14-21"},{"book":"mrk","chapter":14,"verse":22,"text":"While they were eating, Jesus took bread, blessed and broke it, gave it to them, and said, “Take it; this is my body.”","status":"source_text","id":"mrk-14-22"},{"book":"mrk","chapter":14,"verse":23,"text":"He took a cup, gave thanks, and gave it to them, and they all drank from it.","status":"source_text","id":"mrk-14-23"},{"book":"mrk","chapter":14,"verse":24,"text":"Jesus said, “This is my blood of the covenant, poured out for many.”","status":"source_text","id":"mrk-14-24"},{"book":"mrk","chapter":14,"verse":25,"text":"“Truly I tell you, I will not drink the fruit of the vine again until the day I drink it new in the kingdom of God.”","status":"source_text","id":"mrk-14-25"},{"book":"mrk","chapter":14,"verse":26,"text":"After singing a hymn, they went out to the Mount of Olives.","status":"source_text","id":"mrk-14-26"},{"book":"mrk","chapter":14,"verse":27,"text":"Jesus said, “You will all fall away, for it is written, ‘I will strike the shepherd, and the sheep will be scattered.’”","status":"source_text","id":"mrk-14-27"},{"book":"mrk","chapter":14,"verse":28,"text":"“But after I am raised, I will go ahead of you to Galilee.”","status":"source_text","id":"mrk-14-28"},{"book":"mrk","chapter":14,"verse":29,"text":"Peter said, “Even if everyone falls away, I will not.”","status":"source_text","id":"mrk-14-29"},{"book":"mrk","chapter":14,"verse":30,"text":"Jesus said, “Truly I tell you, this very night, before the rooster crows twice, you will deny me three times.”","status":"source_text","id":"mrk-14-30"},{"book":"mrk","chapter":14,"verse":31,"text":"Peter insisted, “Even if I must die with you, I will never deny you.” The others all said the same.","status":"source_text","id":"mrk-14-31"},{"book":"mrk","chapter":14,"verse":32,"text":"They came to a place called Gethsemane. Jesus told his disciples, “Sit here while I pray.”","status":"source_text","id":"mrk-14-32"},{"book":"mrk","chapter":14,"verse":33,"text":"He took Peter, James, and John with him and began to be deeply troubled and distressed.","status":"source_text","id":"mrk-14-33"},{"book":"mrk","chapter":14,"verse":34,"text":"He said, “My soul is sorrowful to the point of death. Stay here and keep watch.”","status":"source_text","id":"mrk-14-34"},{"book":"mrk","chapter":14,"verse":35,"text":"Going a little farther, he fell to the ground and prayed that, if possible, the hour might pass from him.","status":"source_text","id":"mrk-14-35"},{"book":"mrk","chapter":14,"verse":36,"text":"“Abba, Father, all things are possible for you. Take this cup from me. Yet let it be not what I want but what you want.”","status":"source_text","id":"mrk-14-36"},{"book":"mrk","chapter":14,"verse":37,"text":"Returning, he found them sleeping and said to Peter, “Simon, are you asleep? Could you not keep watch for one hour?”","status":"source_text","id":"mrk-14-37"},{"book":"mrk","chapter":14,"verse":38,"text":"“Keep watch and pray so that you do not enter into temptation. The spirit is willing, but the flesh is weak.”","status":"source_text","id":"mrk-14-38"},{"book":"mrk","chapter":14,"verse":39,"text":"He went away again and prayed the same words.","status":"source_text","id":"mrk-14-39"},{"book":"mrk","chapter":14,"verse":40,"text":"He returned and found them asleep again, for their eyes were heavy, and they did not know what to answer him.","status":"source_text","id":"mrk-14-40"},{"book":"mrk","chapter":14,"verse":41,"text":"He came a third time and said, “Are you still sleeping and resting? Enough! The hour has come. See, the Son of Man is handed over into the hands of sinners.”","status":"source_text","id":"mrk-14-41"},{"book":"mrk","chapter":14,"verse":42,"text":"“Get up; let us go. See, the one who hands me over is near.”","status":"source_text","id":"mrk-14-42"},{"book":"mrk","chapter":14,"verse":43,"text":"While Jesus was still speaking, Judas, one of the Twelve, arrived with a crowd carrying swords and clubs, sent by the chief priests, scribes, and elders.","status":"source_text","id":"mrk-14-43"},{"book":"mrk","chapter":14,"verse":44,"text":"The betrayer had given them a signal: “The one I kiss is the man; seize him and lead him away securely.”","status":"source_text","id":"mrk-14-44"},{"book":"mrk","chapter":14,"verse":45,"text":"Judas went straight to Jesus, said, “Rabbi!” and kissed him.","status":"source_text","id":"mrk-14-45"},{"book":"mrk","chapter":14,"verse":46,"text":"Then the men laid hands on Jesus and arrested him.","status":"source_text","id":"mrk-14-46"},{"book":"mrk","chapter":14,"verse":47,"text":"One of those standing nearby drew his sword, struck the high priest’s servant, and cut off his ear.","status":"source_text","id":"mrk-14-47"},{"book":"mrk","chapter":14,"verse":48,"text":"Jesus said to them, “Have you come with swords and clubs to arrest me as though I were a bandit?”","status":"source_text","id":"mrk-14-48"},{"book":"mrk","chapter":14,"verse":49,"text":"“Day after day I was with you teaching in the temple, and you did not arrest me. But the Scriptures must be fulfilled.”","status":"source_text","id":"mrk-14-49"},{"book":"mrk","chapter":14,"verse":50,"text":"Then they all abandoned him and fled.","status":"source_text","id":"mrk-14-50"},{"book":"mrk","chapter":14,"verse":51,"text":"A young man followed him wearing only a linen cloth over his naked body, and they seized him.","status":"source_text","id":"mrk-14-51"},{"book":"mrk","chapter":14,"verse":52,"text":"He left the linen cloth behind and fled naked.","status":"source_text","id":"mrk-14-52"},{"book":"mrk","chapter":14,"verse":53,"text":"They led Jesus to the high priest, where all the chief priests, elders, and scribes gathered.","status":"source_text","id":"mrk-14-53"},{"book":"mrk","chapter":14,"verse":54,"text":"Peter followed at a distance into the high priest’s courtyard and sat with the guards, warming himself by the fire.","status":"source_text","id":"mrk-14-54"},{"book":"mrk","chapter":14,"verse":55,"text":"The chief priests and the whole council sought testimony against Jesus to put him to death, but found none.","status":"source_text","id":"mrk-14-55"},{"book":"mrk","chapter":14,"verse":56,"text":"Many gave false testimony against him, but their statements did not agree.","status":"source_text","id":"mrk-14-56"},{"book":"mrk","chapter":14,"verse":57,"text":"Some stood up and testified falsely against him.","status":"source_text","id":"mrk-14-57"},{"book":"mrk","chapter":14,"verse":58,"text":"“We heard him say, ‘I will destroy this temple made with hands, and in three days build another not made with hands.’”","status":"source_text","id":"mrk-14-58"},{"book":"mrk","chapter":14,"verse":59,"text":"Yet even their testimony did not agree.","status":"sou
