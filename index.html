 full of greed and self-indulgence.","status":"source_text","id":"mat-23-25"},{"book":"mat","chapter":23,"verse":26,"text":"Blind Pharisee! First clean the inside of the cup, so that its outside may also become clean.","status":"source_text","id":"mat-23-26"},{"book":"mat","chapter":23,"verse":27,"text":"Woe to you, scribes and Pharisees, hypocrites! You are like whitewashed tombs, which outwardly appear beautiful but inwardly are full of dead people’s bones and all uncleanness.","status":"source_text","id":"mat-23-27"},{"book":"mat","chapter":23,"verse":28,"text":"So also you outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.","status":"source_text","id":"mat-23-28"},{"book":"mat","chapter":23,"verse":29,"text":"Woe to you, scribes and Pharisees, hypocrites! You build the tombs of the prophets and decorate the graves of the righteous,","status":"source_text","id":"mat-23-29"},{"book":"mat","chapter":23,"verse":30,"text":"and you say, ‘If we had lived in the days of our fathers, we would not have shared with them in shedding the blood of the prophets.’","status":"source_text","id":"mat-23-30"},{"book":"mat","chapter":23,"verse":31,"text":"Thus you testify against yourselves that you are sons of those who murdered the prophets.","status":"source_text","id":"mat-23-31"},{"book":"mat","chapter":23,"verse":32,"text":"You too, then, fill up the measure of your fathers!","status":"source_text","id":"mat-23-32"},{"book":"mat","chapter":23,"verse":33,"text":"Serpents, offspring of vipers! How will you escape the judgment of Gehenna?","status":"source_text","id":"mat-23-33"},{"book":"mat","chapter":23,"verse":34,"text":"Therefore behold, I send you prophets and wise men and scribes. Some of them you will kill and crucify, and some you will flog in your synagogues and persecute from city to city,","status":"source_text","id":"mat-23-34"},{"book":"mat","chapter":23,"verse":35,"text":"so that upon you may come all the righteous blood shed on the earth, from the blood of righteous Abel to the blood of Zechariah son of Barachiah, whom you murdered between the temple and the altar.","status":"source_text","id":"mat-23-35"},{"book":"mat","chapter":23,"verse":36,"text":"Truly I say to you, all these things will come upon this generation.","status":"source_text","id":"mat-23-36"},{"book":"mat","chapter":23,"verse":37,"text":"Jerusalem, Jerusalem, who kills the prophets and stones those sent to her! How often I wanted to gather your children together, as a hen gathers her chicks under her wings, and you were unwilling!","status":"source_text","id":"mat-23-37"},{"book":"mat","chapter":23,"verse":38,"text":"Behold, your house is left to you desolate.","status":"source_text","id":"mat-23-38"},{"book":"mat","chapter":23,"verse":39,"text":"For I tell you, from now on you will certainly not see Me until you say, ‘Blessed is the One who comes in the name of the Lord.’”","status":"source_text","id":"mat-23-39"},{"book":"mat","chapter":24,"verse":1,"text":"Jesus went out from the temple and was going away when His disciples came to point out the temple buildings to Him.","status":"source_text","id":"mat-24-1"},{"book":"mat","chapter":24,"verse":2,"text":"But He answered them, “Do you see all these things? Truly I say to you, not one stone here will be left upon another; all will be thrown down.”","status":"source_text","id":"mat-24-2"},{"book":"mat","chapter":24,"verse":3,"text":"As He was sitting on the Mount of Olives, the disciples came to Him privately, saying, “Tell us, when will these things happen, and what will be the sign of Your coming and of the completion of the age?”","status":"source_text","id":"mat-24-3"},{"book":"mat","chapter":24,"verse":4,"text":"Jesus answered them, “See that no one leads you astray.","status":"source_text","id":"mat-24-4"},{"book":"mat","chapter":24,"verse":5,"text":"For many will come in My name, saying, ‘I am the Christ,’ and they will lead many astray.","status":"source_text","id":"mat-24-5"},{"book":"mat","chapter":24,"verse":6,"text":"You will hear of wars and rumors of wars. See that you are not alarmed, for these things must happen, but the end is not yet.","status":"source_text","id":"mat-24-6"},{"book":"mat","chapter":24,"verse":7,"text":"For nation will rise against nation, and kingdom against kingdom, and there will be famines and earthquakes in various places.","status":"source_text","id":"mat-24-7"},{"book":"mat","chapter":24,"verse":8,"text":"All these things are the beginning of birth pains.","status":"source_text","id":"mat-24-8"},{"book":"mat","chapter":24,"verse":9,"text":"Then they will hand you over to tribulation and kill you, and you will be hated by all nations because of My name.","status":"source_text","id":"mat-24-9"},{"book":"mat","chapter":24,"verse":10,"text":"Then many will stumble, and they will betray one another and hate one another.","status":"source_text","id":"mat-24-10"},{"book":"mat","chapter":24,"verse":11,"text":"Many false prophets will arise and lead many astray.","status":"source_text","id":"mat-24-11"},{"book":"mat","chapter":24,"verse":12,"text":"Because lawlessness will increase, the love of many will grow cold.","status":"source_text","id":"mat-24-12"},{"book":"mat","chapter":24,"verse":13,"text":"But the one who endures to the end will be saved.","status":"source_text","id":"mat-24-13"},{"book":"mat","chapter":24,"verse":14,"text":"And this gospel of the kingdom will be proclaimed in the whole inhabited world as a testimony to all nations, and then the end will come.","status":"source_text","id":"mat-24-14"},{"book":"mat","chapter":24,"verse":15,"text":"Therefore when you see the abomination of desolation spoken of through Daniel the prophet standing in the holy place—let the reader understand—","status":"source_text","id":"mat-24-15"},{"book":"mat","chapter":24,"verse":16,"text":"then let those in Judea flee to the mountains.","status":"source_text","id":"mat-24-16"},{"book":"mat","chapter":24,"verse":17,"text":"Let the one on the housetop not go down to take anything out of his house.","status":"source_text","id":"mat-24-17"},{"book":"mat","chapter":24,"verse":18,"text":"And let the one in the field not turn back to take his cloak.","status":"source_text","id":"mat-24-18"},{"book":"mat","chapter":24,"verse":19,"text":"But woe to those who are pregnant and to those nursing infants in those days!","status":"source_text","id":"mat-24-19"},{"book":"mat","chapter":24,"verse":20,"text":"Pray that your flight may not happen in winter or on a Sabbath.","status":"source_text","id":"mat-24-20"},{"book":"mat","chapter":24,"verse":21,"text":"For then there will be great tribulation, such as has not occurred from the beginning of the world until now, nor ever will.","status":"source_text","id":"mat-24-21"},{"book":"mat","chapter":24,"verse":22,"text":"And if those days had not been shortened, no flesh would be saved; but for the sake of the chosen, those days will be shortened.","status":"source_text","id":"mat-24-22"},{"book":"mat","chapter":24,"verse":23,"text":"Then if anyone says to you, ‘Behold, here is the Christ,’ or ‘There He is,’ do not believe it.","status":"source_text","id":"mat-24-23"},{"book":"mat","chapter":24,"verse":24,"text":"For false christs and false prophets will arise and give great signs and wonders, so as to lead astray, if possible, even the chosen.","status":"source_text","id":"mat-24-24"},{"book":"mat","chapter":24,"verse":25,"text":"Behold, I have told you beforehand.","status":"source_text","id":"mat-24-25"},{"book":"mat","chapter":24,"verse":26,"text":"So if they say to you, ‘Behold, He is in the wilderness,’ do not go out; or, ‘Behold, He is in the inner rooms,’ do not believe it.","status":"source_text","id":"mat-24-26"},{"book":"mat","chapter":24,"verse":27,"text":"For just as lightning comes from the east and shines as far as the west, so will be the coming of the Son of Man.","status":"source_text","id":"mat-24-27"},{"book":"mat","chapter":24,"verse":28,"text":"Wherever the corpse is, there the vultures will gather.","status":"source_text","id":"mat-24-28"},{"book":"mat","chapter":24,"verse":29,"text":"Immediately after the tribulation of those days, the sun will be darkened, the moon will not give its light, the stars will fall from heaven, and the powers of the heavens will be shaken.","status":"source_text","id":"mat-24-29"},{"book":"mat","chapter":24,"verse":30,"text":"Then the sign of the Son of Man will appear in heaven, and all the tribes of the earth will mourn. They will see the Son of Man coming on the clouds of heaven with power and great glory.","status":"source_text","id":"mat-24-30"},{"book":"mat","chapter":24,"verse":31,"text":"And He will send out His angels with a great trumpet sound, and they will gather His chosen from the four winds, from one end of the heavens to the other.","status":"source_text","id":"mat-24-31"},{"book":"mat","chapter":24,"verse":32,"text":"Learn the parable from the fig tree: when its branch has already become tender and puts out its leaves, you know that summer is near.","status":"source_text","id":"mat-24-32"},{"book":"mat","chapter":24,"verse":33,"text":"So also you, when you see all these things, know that He is near, at the doors.","status":"source_text","id":"mat-24-33"},{"book":"mat","chapter":24,"verse":34,"text":"Truly I say to you, this generation will certainly not pass away until all these things happen.","status":"source_text","id":"mat-24-34"},{"book":"mat","chapter":24,"verse":35,"text":"Heaven and earth will pass away, but My words will certainly not pass away.","status":"source_text","id":"mat-24-35"},{"book":"mat","chapter":24,"verse":36,"text":"But concerning that day and hour no one knows—not even the angels of the heavens, nor the Son, but the Father alone.","status":"source_text","id":"mat-24-36"},{"book":"mat","chapter":24,"verse":37,"text":"For just as the days of Noah were, so will be the coming of the Son of Man.","status":"source_text","id":"mat-24-37"},{"book":"mat","chapter":24,"verse":38,"text":"For in those days before the flood, they were eating and drinking, marrying and giving in marriage, until the day Noah entered the ark,","status":"source_text","id":"mat-24-38"},{"book":"mat","chapter":24,"verse":39,"text":"and they did not know until the flood came and swept them all away. So also will be the coming of the Son of Man.","status":"source_text","id":"mat-24-39"},{"book":"mat","chapter":24,"verse":40,"text":"Then two will be in the field; one is taken and one is left.","status":"source_text","id":"mat-24-40"},{"book":"mat","chapter":24,"verse":41,"text":"Two women will be grinding at the mill; one is taken and one is left.","status":"source_text","id":"mat-24-41"},{"book":"mat","chapter":24,"verse":42,"text":"Therefore stay awake, because you do not know on what day your Lord is coming.","status":"source_text","id":"mat-24-42"},{"book":"mat","chapter":24,"verse":43,"text":"But know this: if the master of the house had known in which watch of the night the thief was coming, he would have stayed awake and not allowed his house to be broken into.","status":"source_text","id":"mat-24-43"},{"book":"mat","chapter":24,"verse":44,"text":"Therefore you also must be ready, because the Son of Man is coming at an hour you do not expect.","status":"source_text","id":"mat-24-44"},{"book":"mat","chapter":24,"verse":45,"text":"Who then is the faithful and wise servant whom his master put over his household to give them food at the proper time?","status":"source_text","id":"mat-24-45"},{"book":"mat","chapter":24,"verse":46,"text":"Blessed is that servant whom his master finds doing so when he comes.","status":"source_text","id":"mat-24-46"},{"book":"mat","chapter":24,"verse":47,"text":"Truly I say to you, he will put him over all his possessions.","status":"source_text","id":"mat-24-47"},{"book":"mat","chapter":24,"verse":48,"text":"But if that evil servant says in his heart, ‘My master is delaying,’","status":"source_text","id":"mat-24-48"},{"book":"mat","chapter":24,"verse":49,"text":"and begins to beat his fellow servants and eats and drinks with drunkards,","status":"source_text","id":"mat-24-49"},{"book":"mat","chapter":24,"verse":50,"text":"the master of that servant will come on a day he does not expect and at an hour he does not know,","status":"source_text","id":"mat-24-50"},{"book":"mat","chapter":24,"verse":51,"text":"and will cut him in two and assign him a place with the hypocrites. There will be weeping and grinding of teeth.","status":"source_text","id":"mat-24-51"},{"book":"mat","chapter":25,"verse":1,"text":"Then the kingdom of the heavens will be like ten virgins who took their lamps and went out to meet the bridegroom.","status":"source_text","id":"mat-25-1"},{"book":"mat","chapter":25,"verse":2,"text":"Five of them were foolish and five were wise.","status":"source_text","id":"mat-25-2"},{"book":"mat","chapter":25,"verse":3,"text":"For when the foolish took their lamps, they took no oil with them.","status":"source_text","id":"mat-25-3"},{"book":"mat","chapter":25,"verse":4,"text":"But the wise took oil in containers along with their lamps.","status":"source_text","id":"mat-25-4"},{"book":"mat","chapter":25,"verse":5,"text":"As the bridegroom was delayed, they all became drowsy and fell asleep.","status":"source_text","id":"mat-25-5"},{"book":"mat","chapter":25,"verse":6,"text":"But at midnight there was a shout: ‘Behold, the bridegroom! Come out to meet him!’","status":"source_text","id":"mat-25-6"},{"book":"mat","chapter":25,"verse":7,"text":"Then all those virgins rose and trimmed their lamps.","status":"source_text","id":"mat-25-7"},{"book":"mat","chapter":25,"verse":8,"text":"The foolish said to the wise, ‘Give us some of your oil, because our lamps are going out.’","status":"source_text","id":"mat-25-8"},{"book":"mat","chapter":25,"verse":9,"text":"But the wise answered, ‘There may not be enough for us and for you. Go instead to those who sell and buy some for yourselves.’","status":"source_text","id":"mat-25-9"},{"book":"mat","chapter":25,"verse":10,"text":"While they were going away to buy it, the bridegroom came. Those who were ready went in with him to the wedding feast, and the door was shut.","status":"source_text","id":"mat-25-10"},{"book":"mat","chapter":25,"verse":11,"text":"Later the other virgins also came, saying, ‘Lord, lord, open to us!’","status":"source_text","id":"mat-25-11"},{"book":"mat","chapter":25,"verse":12,"text":"But he answered, ‘Truly I say to you, I do not know you.’","status":"source_text","id":"mat-25-12"},{"book":"mat","chapter":25,"verse":13,"text":"Therefore stay awake, because you know neither the day nor the hour.","status":"source_text","id":"mat-25-13"},{"book":"mat","chapter":25,"verse":14,"text":"For it is also like a man going on a journey who called his own servants and entrusted his possessions to them.","status":"source_text","id":"mat-25-14"},{"book":"mat","chapter":25,"verse":15,"text":"To one he gave five talents, to another two, and to another one, each according to his own ability; then he went away.","status":"source_text","id":"mat-25-15"},{"book":"mat","chapter":25,"verse":16,"text":"The one who received five talents went at once and traded with them and gained five more.","status":"source_text","id":"mat-25-16"},{"book":"mat","chapter":25,"verse":17,"text":"In the same way, the one with two gained two more.","status":"source_text","id":"mat-25-17"},{"book":"mat","chapter":25,"verse":18,"text":"But the one who received one went away, dug in the ground, and hid his master’s money.","status":"source_text","id":"mat-25-18"},{"book":"mat","chapter":25,"verse":19,"text":"After a long time the master of those servants came and settled accounts with them.","status":"source_text","id":"mat-25-19"},{"book":"mat","chapter":25,"verse":20,"text":"The one who had received five talents came and brought five more, saying, ‘Master, you entrusted five talents to me. Behold, I gained five talents more.’","status":"source_text","id":"mat-25-20"},{"book":"mat","chapter":25,"verse":21,"text":"His master said to him, ‘Well done, good and faithful servant! You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’","status":"source_text","id":"mat-25-21"},{"book":"mat","chapter":25,"verse":22,"text":"The one who had received two talents also came and said, ‘Master, you entrusted two talents to me. Behold, I gained two talents more.’","status":"source_text","id":"mat-25-22"},{"book":"mat","chapter":25,"verse":23,"text":"His master said to him, ‘Well done, good and faithful servant! You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’","status":"source_text","id":"mat-25-23"},{"book":"mat","chapter":25,"verse":24,"text":"Then the one who had received one talent also came and said, ‘Master, I knew you to be a hard man, reaping where you did not sow and gathering where you scattered no seed.","status":"source_text","id":"mat-25-24"},{"book":"mat","chapter":25,"verse":25,"text":"So I was afraid, and I went and hid your talent in the ground. Behold, you have what is yours.’","status":"source_text","id":"mat-25-25"},{"book":"mat","chapter":25,"verse":26,"text":"But his master answered him, ‘Evil and lazy servant! You knew that I reap where I did not sow and gather where I scattered no seed?","status":"source_text","id":"mat-25-26"},{"book":"mat","chapter":25,"verse":27,"text":"Then you ought to have deposited my money with the bankers, and at my coming I would have received what was mine with interest.","status":"source_text","id":"mat-25-27"},{"book":"mat","chapter":25,"verse":28,"text":"Therefore take the talent from him and give it to the one who has the ten talents.","status":"source_text","id":"mat-25-28"},{"book":"mat","chapter":25,"verse":29,"text":"For to everyone who has, more will be given, and he will have abundance; but from the one who does not have, even what he has will be taken away.","status":"source_text","id":"mat-25-29"},{"book":"mat","chapter":25,"verse":30,"text":"And throw the useless servant into the outer darkness. There will be weeping and grinding of teeth.’","status":"source_text","id":"mat-25-30"},{"book":"mat","chapter":25,"verse":31,"text":"When the Son of Man comes in His glory, and all the angels with Him, then He will sit on the throne of His glory.","status":"source_text","id":"mat-25-31"},{"book":"mat","chapter":25,"verse":32,"text":"All the nations will be gathered before Him, and He will separate them from one another as a shepherd separates the sheep from the goats.","status":"source_text","id":"mat-25-32"},{"book":"mat","chapter":25,"verse":33,"text":"He will place the sheep at His right hand, but the goats at the left.","status":"source_text","id":"mat-25-33"},{"book":"mat","chapter":25,"verse":34,"text":"Then the King will say to those at His right, ‘Come, you who are blessed by My Father; inherit the kingdom prepared for you from the foundation of the world.","status":"source_text","id":"mat-25-34"},{"book":"mat","chapter":25,"verse":35,"text":"For I was hungry and you gave Me something to eat; I was thirsty and you gave Me something to drink; I was a stranger and you welcomed Me;","status":"source_text","id":"mat-25-35"},{"book":"mat","chapter":25,"verse":36,"text":"I was naked and you clothed Me; I was sick and you cared for Me; I was in prison and you came to Me.’","status":"source_text","id":"mat-25-36"},{"book":"mat","chapter":25,"verse":37,"text":"Then the righteous will answer Him, saying, ‘Lord, when did we see You hungry and feed You, or thirsty and give You something to drink?","status":"source_text","id":"mat-25-37"},{"book":"mat","chapter":25,"verse":38,"text":"When did we see You a stranger and welcome You, or naked and clothe You?","status":"source_text","id":"mat-25-38"},{"book":"mat","chapter":25,"verse":39,"text":"When did we see You sick or in prison and come to You?’","status":"source_text","id":"mat-25-39"},{"book":"mat","chapter":25,"verse":40,"text":"And the King will answer them, ‘Truly I say to you, as much as you did it to one of the least of these My brothers, you did it to Me.’","status":"source_text","id":"mat-25-40"},{"book":"mat","chapter":25,"verse":41,"text":"Then He will also say to those at His left, ‘Depart from Me, you who are cursed, into the eternal fire prepared for the devil and his angels.","status":"source_text","id":"mat-25-41"},{"book":"mat","chapter":25,"verse":42,"text":"For I was hungry and you gave Me nothing to eat; I was thirsty and you gave Me nothing to drink;","status":"source_text","id":"mat-25-42"},{"book":"mat","chapter":25,"verse":43,"text":"I was a stranger and you did not welcome Me; naked and you did not clothe Me; sick and in prison and you did not care for Me.’","status":"source_text","id":"mat-25-43"},{"book":"mat","chapter":25,"verse":44,"text":"Then they too will answer, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison and did not serve You?’","status":"source_text","id":"mat-25-44"},{"book":"mat","chapter":25,"verse":45,"text":"Then He will answer them, ‘Truly I say to you, as much as you did not do it to one of the least of these, you did not do it to Me.’","status":"source_text","id":"mat-25-45"},{"book":"mat","chapter":25,"verse":46,"text":"And these will go away into eternal punishment, but the righteous into eternal life.”","status":"source_text","id":"mat-25-46"},{"book":"mat","chapter":26,"verse":1,"text":"When Jesus had finished all these sayings, He said to His disciples,","status":"source_text","id":"mat-26-1"},{"book":"mat","chapter":26,"verse":2,"text":"“You know that after two days the Passover comes, and the Son of Man will be handed over to be crucified.”","status":"source_text","id":"mat-26-2"},{"book":"mat","chapter":26,"verse":3,"text":"Then the chief priests and the elders of the people gathered in the courtyard of the high priest, whose name was Caiaphas,","status":"source_text","id":"mat-26-3"},{"book":"mat","chapter":26,"verse":4,"text":"and they plotted together to seize Jesus by deceit and kill Him.","status":"source_text","id":"mat-26-4"},{"book":"mat","chapter":26,"verse":5,"text":"But they said, “Not during the feast, so that there may not be an uproar among the people.”","status":"source_text","id":"mat-26-5"},{"book":"mat","chapter":26,"verse":6,"text":"Now when Jesus was in Bethany in the house of Simon the leper,","status":"source_text","id":"mat-26-6"},{"book":"mat","chapter":26,"verse":7,"text":"a woman came to Him with an alabaster jar of very costly perfume, and she poured it on His head as He reclined at table.","status":"source_text","id":"mat-26-7"},{"book":"mat","chapter":26,"verse":8,"text":"When the disciples saw it, they were indignant and said, “Why this waste?","status":"source_text","id":"mat-26-8"},{"book":"mat","chapter":26,"verse":9,"text":"For this could have been sold for a high price and given to the poor.”","status":"source_text","id":"mat-26-9"},{"book":"mat","chapter":26,"verse":10,"text":"But Jesus, knowing this, said to them, “Why do you trouble the woman? She has done a beautiful work to Me.","status":"source_text","id":"mat-26-10"},{"book":"mat","chapter":26,"verse":11,"text":"For you always have the poor with you, but you do not always have Me.","status":"source_text","id":"mat-26-11"},{"book":"mat","chapter":26,"verse":12,"text":"For when she poured this perfume on My body, she did it to prepare Me for burial.","status":"source_text","id":"mat-26-12"},{"book":"mat","chapter":26,"verse":13,"text":"Truly I say to you, wherever this gospel is proclaimed in the whole world, what she has done will also be spoken of in memory of her.”","status":"source_text","id":"mat-26-13"},{"book":"mat","chapter":26,"verse":14,"text":"Then one of the Twelve, the one called Judas Iscariot, went to the chief priests","status":"source_text","id":"mat-26-14"},{"book":"mat","chapter":26,"verse":15,"text":"and said, “What are you willing to give me if I hand Him over to you?” And they weighed out thirty pieces of silver for him.","status":"source_text","id":"mat-26-15"},{"book":"mat","chapter":26,"verse":16,"text":"From then on he sought an opportunity to hand Him over.","status":"source_text","id":"mat-26-16"},{"book":"mat","chapter":26,"verse":17,"text":"On the first day of Unleavened Bread, the disciples came to Jesus and said, “Where do You want us to prepare for You to eat the Passover?”","status":"source_text","id":"mat-26-17"},{"book":"mat","chapter":26,"verse":18,"text":"He said, “Go into the city to a certain man and say to him, ‘The Teacher says: My time is near; I will keep the Passover at your house with My disciples.’”","status":"source_text","id":"mat-26-18"},{"book":"mat","chapter":26,"verse":19,"text":"The disciples did as Jesus directed them and prepared the Passover.","status":"source_text","id":"mat-26-19"},{"book":"mat","chapter":26,"verse":20,"text":"When evening came, He reclined at table with the twelve disciples.","status":"source_text","id":"mat-26-20"},{"book":"mat","chapter":26,"verse":21,"text":"And as they were eating, He said, “Truly I say to you, one of you will hand Me over.”","status":"source_text","id":"mat-26-21"},{"book":"mat","chapter":26,"verse":22,"text":"Deeply grieved, each of them began to say to Him, “Surely not I, Lord?”","status":"source_text","id":"mat-26-22"},{"book":"mat","chapter":26,"verse":23,"text":"He answered, “The one who dipped his hand with Me in the bowl will hand Me over.","status":"source_text","id":"mat-26-23"},{"book":"mat","chapter":26,"verse":24,"text":"The Son of Man goes just as it is written about Him, but woe to that man through whom the Son of Man is handed over! It would have been better for that man if he had not been born.”","status":"source_text","id":"mat-26-24"},{"book":"mat","chapter":26,"verse":25,"text":"Judas, who was handing Him over, answered, “Surely not I, Rabbi?” He said to him, “You have said it.”","status":"source_text","id":"mat-26-25"},{"book":"mat","chapter":26,"verse":26,"text":"As they were eating, Jesus took bread, and after blessing it He broke it and gave it to the disciples, saying, “Take, eat; this is My body.”","status":"source_text","id":"mat-26-26"},{"book":"mat","chapter":26,"verse":27,"text":"And taking a cup and giving thanks, He gave it to them, saying, “Drink from it, all of you,","status":"source_text","id":"mat-26-27"},{"book":"mat","chapter":26,"verse":28,"text":"for this is My blood of the covenant, which is poured out for many for forgiveness of sins.","status":"source_text","id":"mat-26-28"},{"book":"mat","chapter":26,"verse":29,"text":"But I tell you, from now on I will certainly not drink of this fruit of the vine until that day when I drink it new with you in My Father’s kingdom.”","status":"source_text","id":"mat-26-29"},{"book":"mat","chapter":26,"verse":30,"text":"After singing a hymn, they went out to the Mount of Olives.","status":"source_text","id":"mat-26-30"},{"book":"mat","chapter":26,"verse":31,"text":"Then Jesus said to them, “All of you will stumble because of Me this night, for it is written, ‘I will strike the shepherd, and the sheep of the flock will be scattered.’","status":"source_text","id":"mat-26-31"},{"book":"mat","chapter":26,"verse":32,"text":"But after I am raised, I will go ahead of you into Galilee.”","status":"source_text","id":"mat-26-32"},{"book":"mat","chapter":26,"verse":33,"text":"Peter answered Him, “Even if everyone stumbles because of You, I will never stumble.”","status":"source_text","id":"mat-26-33"},{"book":"mat","chapter":26,"verse":34,"text":"Jesus said to him, “Truly I say to you, this very night, before a rooster crows, you will deny Me three times.”","status":"source_text","id":"mat-26-34"},{"book":"mat","chapter":26,"verse":35,"text":"Peter said to Him, “Even if I must die with You, I will certainly not deny You.” All the disciples said the same.","status":"source_text","id":"mat-26-35"},{"book":"mat","chapter":26,"verse":36,"text":"Then Jesus came with them to a place called Gethsemane, and He said to the disciples, “Sit here while I go over there and pray.”","status":"source_text","id":"mat-26-36"},{"book":"mat","chapter":26,"verse":37,"text":"Taking Peter and the two sons of Zebedee with Him, He began to be grieved and deeply distressed.","status":"source_text","id":"mat-26-37"},{"book":"mat","chapter":26,"verse":38,"text":"Then He said to them, “My soul is deeply grieved, to the point of death. Remain here and stay awake with Me.”","status":"source_text","id":"mat-26-38"},{"book":"mat","chapter":26,"verse":39,"text":"Going a little farther, He fell on His face and prayed, saying, “My Father, if it is possible, let this cup pass from Me; nevertheless, not as I want, but as You want.”","status":"source_text","id":"mat-26-39"},{"book":"mat","chapter":26,"verse":40,"text":"He came to the disciples and found them sleeping, and He said to Peter, “So, were you not able to stay awake with Me for one hour?","status":"source_text","id":"mat-26-40"},{"book":"mat","chapter":26,"verse":41,"text":"Stay awake and pray so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.”","status":"source_text","id":"mat-26-41"},{"book":"mat","chapter":26,"verse":42,"text":"Again, for a second time, He went away and prayed, saying, “My Father, if this cannot pass unless I drink it, let Your will be done.”","status":"source_text","id":"mat-26-42"},{"book":"mat","chapter":26,"verse":43,"text":"He came again and found them sleeping, for their eyes were heavy.","status":"source_text","id":"mat-26-43"},{"book":"mat","chapter":26,"verse":44,"text":"Leaving them, He went away again and prayed for a third time, saying the same words again.","status":"source_text","id":"mat-26-44"},{"book":"mat","chapter":26,"verse":45,"text":"Then He came to the disciples and said to them, “Are you still sleeping and resting? Behold, the hour has drawn near, and the Son of Man is being handed over into the hands of sinners.","status":"source_text","id":"mat-26-45"},{"book":"mat","chapter":26,"verse":46,"text":"Rise, let us go. Behold, the one who hands Me over has drawn near.”","status":"source_text","id":"mat-26-46"},{"book":"mat","chapter":26,"verse":47,"text":"While He was still speaking, behold, Judas, one of the Twelve, came, and with him a large crowd with swords and clubs from the chief priests and elders of the people.","status":"source_text","id":"mat-26-47"},{"book":"mat","chapter":26,"verse":48,"text":"Now the one handing Him over had given them a sign, saying, “The one I kiss is He; seize Him.”","status":"source_text","id":"mat-26-48"},{"book":"mat","chapter":26,"verse":49,"text":"Immediately he came to Jesus and said, “Greetings, Rabbi!” and kissed Him.","status":"source_text","id":"mat-26-49"},{"book":"mat","chapter":26,"verse":50,"text":"Jesus said to him, “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized Him.","status":"source_text","id":"mat-26-50"},{"book":"mat","chapter":26,"verse":51,"text":"And behold, one of those with Jesus stretched out his hand, drew his sword, struck the servant of the high priest, and cut off his ear.","status":"source_text","id":"mat-26-51"},{"book":"mat","chapter":26,"verse":52,"text":"Then Jesus said to him, “Put your sword back in its place, for all who take the sword will perish by the sword.","status":"source_text","id":"mat-26-52"},{"book":"mat","chapter":26,"verse":53,"text":"Or do you think that I cannot appeal to My Father, and He will at once provide Me with more than twelve legions of angels?","status":"source_text","id":"mat-26-53"},{"book":"mat","chapter":26,"verse":54,"text":"How then would the Scriptures be fulfilled, that it must happen this way?”","status":"source_text","id":"mat-26-54"},{"book":"mat","chapter":26,"verse":55,"text":"At that time Jesus said to the crowds, “Have you come out with swords and clubs as against a robber to arrest Me? Day after day I sat in the temple teaching, and you did not seize Me.","status":"source_text","id":"mat-26-55"},{"book":"mat","chapter":26,"verse":56,"text":"But all this has happened so that the Scriptures of the prophets might be fulfilled.” Then all the disciples left Him and fled.","status":"source_text","id":"mat-26-56"},{"book":"mat","chapter":26,"verse":57,"text":"Those who had seized Jesus led Him away to Caiaphas the high priest, where the scribes and elders had gathered.","status":"source_text","id":"mat-26-57"},{"book":"mat","chapter":26,"verse":58,"text":"Peter was following Him at a distance, as far as the courtyard of the high priest. He entered and sat with the guards to see the outcome.","status":"source_text","id":"mat-26-58"},{"book":"mat","chapter":26,"verse":59,"text":"Now the chief priests and the whole council were seeking false testimony against Jesus so that they might put Him to death,","status":"source_text","id":"mat-26-59"},{"book":"mat","chapter":26,"verse":60,"text":"but they found none, though many false witnesses came forward. Finally two came forward","status":"source_text","id":"mat-26-60"},{"book":"mat","chapter":26,"verse":61,"text":"and said, “This man said, ‘I am able to destroy the temple of God and rebuild it in three days.’”","status":"source_text","id":"mat-26-61"},{"book":"mat","chapter":26,"verse":62,"text":"The high priest stood and said to Him, “Do You answer nothing? What are these men testifying against You?”","status":"source_text","id":"mat-26-62"},{"book":"mat","chapter":26,"verse":63,"text":"But Jesus remained silent. And the high priest said to Him, “I put You under oath by the living God: tell us whether You are the Christ, the Son of God.”","status":"source_text","id":"mat-26-63"},{"book":"mat","chapter":26,"verse":64,"text":"Jesus said to him, “You have said it. But I tell you, from now on you will see the Son of Man sitting at the right hand of Power and coming on the clouds of heaven.”","status":"source_text","id":"mat-26-64"},{"book":"mat","chapter":26,"verse":65,"text":"Then the high priest tore his garments, saying, “He has blasphemed! What further need do we have of witnesses? Behold, now you have heard the blasphemy.","status":"source_text","id":"mat-26-65"},{"book":"mat","chapter":26,"verse":66,"text":"What do you think?” They answered, “He deserves death.”","status":"source_text","id":"mat-26-66"},{"book":"mat","chapter":26,"verse":67,"text":"Then they spat in His face and struck Him with their fists, and others slapped Him,","status":"source_text","id":"mat-26-67"},{"book":"mat","chapter":26,"verse":68,"text":"saying, “Prophesy to us, Christ! Who is the one who struck You?”","status":"source_text","id":"mat-26-68"},{"book":"mat","chapter":26,"verse":69,"text":"Now Peter was sitting outside in the courtyard, and a servant girl came to him and said, “You also were with Jesus the Galilean.”","status":"source_text","id":"mat-26-69"},{"book":"mat","chapter":26,"verse":70,"text":"But he denied it before everyone, saying, “I do not know what you are talking about.”","status":"source_text","id":"mat-26-70"},{"book":"mat","chapter":26,"verse":71,"text":"When he went out to the gateway, another servant girl saw him and said to those there, “This man was with Jesus the Nazarene.”","status":"source_text","id":"mat-26-71"},{"book":"mat","chapter":26,"verse":72,"text":"Again he denied it with an oath: “I do not know the man.”","status":"source_text","id":"mat-26-72"},{"book":"mat","chapter":26,"verse":73,"text":"After a little while, those standing there came and said to Peter, “Surely you too are one of them, for your speech makes you evident.”","status":"source_text","id":"mat-26-73"},{"book":"mat","chapter":26,"verse":74,"text":"Then he began to curse and swear, “I do not know the man!” And immediately a rooster crowed.","status":"source_text","id":"mat-26-74"},{"book":"mat","chapter":26,"verse":75,"text":"And Peter remembered the word Jesus had spoken: “Before a rooster crows, you will deny Me three times.” And he went outside and wept bitterly.","status":"source_text","id":"mat-26-75"},{"book":"mat","chapter":27,"verse":1,"text":"When morning came, all the chief priests and the elders of the people took counsel against Jesus so that they might put Him to death.","status":"source_text","id":"mat-27-1"},{"book":"mat","chapter":27,"verse":2,"text":"They bound Him, led Him away, and handed Him over to Pilate the governor.","status":"source_text","id":"mat-27-2"},{"book":"mat","chapter":27,"verse":3,"text":"Then Judas, the one who had handed Him over, when he saw that Jesus had been condemned, regretted what he had done and returned the thirty pieces of silver to the chief priests and elders,","status":"source_text","id":"mat-27-3"},{"book":"mat","chapter":27,"verse":4,"text":"saying, “I have sinned by handing over innocent blood.” But they said, “What is that to us? See to it yourself.”","status":"source_text","id":"mat-27-4"},{"book":"mat","chapter":27,"verse":5,"text":"And throwing the pieces of silver into the temple, he departed and went away and hanged himself.","status":"source_text","id":"mat-27-5"},{"book":"mat","chapter":27,"verse":6,"text":"The chief priests took the pieces of silver and said, “It is not lawful to put them into the temple treasury, since they are the price of blood.”","status":"source_text","id":"mat-27-6"},{"book":"mat","chapter":27,"verse":7,"text":"After taking counsel, they bought with them the potter’s field as a burial place for strangers.","status":"source_text","id":"mat-27-7"},{"book":"mat","chapter":27,"verse":8,"text":"Therefore that field has been called the Field of Blood to this day.","status":"source_text","id":"mat-27-8"},{"book":"mat","chapter":27,"verse":9,"text":"Then what was spoken through Jeremiah the prophet was fulfilled: “They took the thirty pieces of silver, the price of the One whose price had been set, whom some of the sons of Israel had priced,","status":"source_text","id":"mat-27-9"},{"book":"mat","chapter":27,"verse":10,"text":"and they gave them for the potter’s field, as the Lord directed me.”","status":"source_text","id":"mat-27-10"},{"book":"mat","chapter":27,"verse":11,"text":"Now Jesus stood before the governor, and the governor questioned Him, saying, “Are You the King of the Jews?” Jesus said, “You have said it.”","status":"source_text","id":"mat-27-11"},{"book":"mat","chapter":27,"verse":12,"text":"And while He was being accused by the chief priests and elders, He answered nothing.","status":"source_text","id":"mat-27-12"},{"book":"mat","chapter":27,"verse":13,"text":"Then Pilate said to Him, “Do You not hear how many things they testify against You?”","status":"source_text","id":"mat-27-13"},{"book":"mat","chapter":27,"verse":14,"text":"But He did not answer him, not even one word, so that the governor was greatly amazed.","status":"source_text","id":"mat-27-14"},{"book":"mat","chapter":27,"verse":15,"text":"Now at the feast the governor was accustomed to release to the crowd one prisoner whom they wanted.","status":"source_text","id":"mat-27-15"},{"book":"mat","chapter":27,"verse":16,"text":"At that time they had a notorious prisoner called Barabbas.","status":"source_text","id":"mat-27-16"},{"book":"mat","chapter":27,"verse":17,"text":"So when they had gathered, Pilate said to them, “Whom do you want me to release for you: Barabbas, or Jesus who is called Christ?”","status":"source_text","id":"mat-27-17"},{"book":"mat","chapter":27,"verse":18,"text":"For he knew that they had handed Him over because of envy.","status":"source_text","id":"mat-27-18"},{"book":"mat","chapter":27,"verse":19,"text":"While he was sitting on the judgment seat, his wife sent word to him: “Have nothing to do with that righteous man, for I suffered much today in a dream because of Him.”","status":"source_text","id":"mat-27-19"},{"book":"mat","chapter":27,"verse":20,"text":"But the chief priests and elders persuaded the crowds to ask for Barabbas and to destroy Jesus.","status":"source_text","id":"mat-27-20"},{"book":"mat","chapter":27,"verse":21,"text":"The governor answered them, “Which of the two do you want me to release for you?” They said, “Barabbas.”","status":"source_text","id":"mat-27-21"},{"book":"mat","chapter":27,"verse":22,"text":"Pilate said to them, “What then shall I do with Jesus who is called Christ?” They all said, “Let Him be crucified!”","status":"source_text","id":"mat-27-22"},{"book":"mat","chapter":27,"verse":23,"text":"He said, “Why? What evil has He done?” But they cried out all the more, “Let Him be crucified!”","status":"source_text","id":"mat-27-23"},{"book":"mat","chapter":27,"verse":24,"text":"When Pilate saw that he was accomplishing nothing but that a riot was beginning, he took water and washed his hands before the crowd, saying, “I am innocent of this man’s blood. See to it yourselves.”","status":"source_text","id":"mat-27-24"},{"book":"mat","chapter":27,"verse":25,"text":"And all the people answered, “His blood be on us and on our children!”","status":"source_text","id":"mat-27-25"},{"book":"mat","chapter":27,"verse":26,"text":"Then he released Barabbas for them, but after having Jesus flogged, he handed Him over to be crucified.","status":"source_text","id":"mat-27-26"},{"book":"mat","chapter":27,"verse":27,"text":"Then the governor’s soldiers took Jesus into the governor’s headquarters and gathered the whole cohort around Him.","status":"source_text","id":"mat-27-27"},{"book":"mat","chapter":27,"verse":28,"text":"They stripped Him and put a scarlet cloak on Him.","status":"source_text","id":"mat-27-28"},{"book":"mat","chapter":27,"verse":29,"text":"And twisting together a crown of thorns, they put it on His head and a reed in His right hand. Kneeling before Him, they mocked Him, saying, “Hail, King of the Jews!”","status":"source_text","id":"mat-27-29"},{"book":"mat","chapter":27,"verse":30,"text":"They spat on Him, took the reed, and struck Him on the head.","status":"source_text","id":"mat-27-30"},{"book":"mat","chapter":27,"verse":31,"text":"After they had mocked Him, they stripped off the cloak, put His own garments on Him, and led Him away to crucify Him.","status":"source_text","id":"mat-27-31"},{"book":"mat","chapter":27,"verse":32,"text":"As they went out, they found a man of Cyrene named Simon. They compelled him to carry His cross.","status":"source_text","id":"mat-27-32"},{"book":"mat","chapter":27,"verse":33,"text":"When they came to a place called Golgotha, which means Place of a Skull,","status":"source_text","id":"mat-27-33"},{"book":"mat","chapter":27,"verse":34,"text":"they gave Him wine mixed with gall to drink, but after tasting it He was unwilling to drink.","status":"source_text","id":"mat-27-34"},{"book":"mat","chapter":27,"verse":35,"text":"After crucifying Him, they divided His garments by casting lots.","status":"source_text","id":"mat-27-35"},{"book":"mat","chapter":27,"verse":36,"text":"And sitting down, they kept watch over Him there.","status":"source_text","id":"mat-27-36"},{"book":"mat","chapter":27,"verse":37,"text":"Above His head they put the charge against Him, which read: “THIS IS JESUS, THE KING OF THE JEWS.”","status":"source_text","id":"mat-27-37"},{"book":"mat","chapter":27,"verse":38,"text":"Then two robbers were crucified with Him, one on His right and one on His left.","status":"source_text","id":"mat-27-38"},{"book":"mat","chapter":27,"verse":39,"text":"Those passing by blasphemed Him, shaking their heads","status":"source_text","id":"mat-27-39"},{"book":"mat","chapter":27,"verse":40,"text":"and saying, “You who would destroy the temple and build it in three days, save Yourself! If You are the Son of God, come down from the cross!”","status":"source_text","id":"mat-27-40"},{"book":"mat","chapter":27,"verse":41,"text":"In the same way the chief priests, with the scribes and elders, mocked Him, saying,","status":"source_text","id":"mat-27-41"},{"book":"mat","chapter":27,"verse":42,"text":"“He saved others; He cannot save Himself. He is the King of Israel! Let Him come down now from the cross, and we will believe in Him.","status":"source_text","id":"mat-27-42"},{"book":"mat","chapter":27,"verse":43,"text":"He trusted in God; let God rescue Him now, if He wants Him, for He said, ‘I am God’s Son.’”","status":"source_text","id":"mat-27-43"},{"book":"mat","chapter":27,"verse":44,"text":"The robbers who were crucified with Him also insulted Him in the same way.","status":"source_text","id":"mat-27-44"},{"book":"mat","chapter":27,"verse":45,"text":"From the sixth hour darkness came over all the land until the ninth hour.","status":"source_text","id":"mat-27-45"},{"book":"mat","chapter":27,"verse":46,"text":"About the ninth hour Jesus cried out with a loud voice, saying, “Eli, Eli, lema sabachthani?” that is, “My God, My God, why have You forsaken Me?”","status":"source_text","id":"mat-27-46"},{"book":"mat","chapter":27,"verse":47,"text":"When some of those standing there heard it, they said, “This man is calling Elijah.”","status":"source_text","id":"mat-27-47"},{"book":"mat","chapter":27,"verse":48,"text":"Immediately one of them ran, took a sponge, filled it with sour wine, put it on a reed, and gave it to Him to drink.","status":"source_text","id":"mat-27-48"},{"book":"mat","chapter":27,"verse":49,"text":"But the others said, “Leave Him alone. Let us see whether Elijah comes to save Him.”","status":"source_text","id":"mat-27-49"},{"book":"mat","chapter":27,"verse":50,"text":"And Jesus cried out again with a loud voice and gave up His spirit.","status":"source_text","id":"mat-27-50"},{"book":"mat","chapter":27,"verse":51,"text":"And behold, the curtain of the temple was torn in two from top to bottom, and the earth shook and the rocks were split.","status":"source_text","id":"mat-27-51"},{"book":"mat","chapter":27,"verse":52,"text":"The tombs were opened, and many bodies of the saints who had fallen asleep were raised.","status":"source_text","id":"mat-27-52"},{"book":"mat","chapter":27,"verse":53,"text":"Coming out of the tombs after His resurrection, they entered the holy city and appeared to many.","status":"source_text","id":"mat-27-53"},{"book":"mat","chapter":27,"verse":54,"text":"When the centurion and those with him who were guarding Jesus saw the earthquake and what had happened, they were greatly afraid and said, “Truly this was God’s Son.”","status":"source_text","id":"mat-27-54"},{"book":"mat","chapter":27,"verse":55,"text":"There were also many women there looking on from a distance, who had followed Jesus from Galilee, serving Him.","status":"source_text","id":"mat-27-55"},{"book":"mat","chapter":27,"verse":56,"text":"Among them were Mary Magdalene, Mary the mother of James and Joseph, and the mother of the sons of Zebedee.","status":"source_text","id":"mat-27-56"},{"book":"mat","chapter":27,"verse":57,"text":"When evening came, a rich man from Arimathea named Joseph came, who had also become a disciple of Jesus.","status":"source_text","id":"mat-27-57"},{"book":"mat","chapter":27,"verse":58,"text":"He went to Pilate and asked for the body of Jesus. Then Pilate ordered it to be given to him.","status":"source_text","id":"mat-27-58"},{"book":"mat","chapter":27,"verse":59,"text":"Joseph took the body and wrapped it in a clean linen cloth","status":"source_text","id":"mat-27-59"},{"book":"mat","chapter":27,"verse":60,"text":"and laid it in his own new tomb, which he had cut in the rock. He rolled a large stone against the entrance of the tomb and went away.","status":"source_text","id":"mat-27-60"},{"book":"mat","chapter":27,"verse":61,"text":"Mary Magdalene and the other Mary were there, sitting opposite the tomb.","status":"source_text","id":"mat-27-61"},{"book":"mat","chapter":27,"verse":62,"text":"On the next day, which is after the day of preparation, the chief priests and Pharisees gathered before Pilate,","status":"source_text","id":"mat-27-62"},{"book":"mat","chapter":27,"verse":63,"text":"saying, “Sir, we remember that while that deceiver was still alive he said, ‘After three days I will be raised.’","status":"source_text","id":"mat-27-63"},{"book":"mat","chapter":27,"verse":64,"text":"Therefore command the tomb to be made secure until the third day, lest His disciples come and steal Him and tell the people, ‘He has been raised from the dead.’ Then the last deception will be worse than the first.”","status":"source_text","id":"mat-27-64"},{"book":"mat","chapter":27,"verse":65,"text":"Pilate said to them, “You have a guard. Go, make it as secure as you know how.”","status":"source_text","id":"mat-27-65"},{"book":"mat","chapter":27,"verse":66,"text":"So they went and made the tomb secure by sealing the stone and setting the guard.","status":"source_text","id":"mat-27-66"},{"book":"mat","chapter":28,"verse":1,"text":"After the Sabbath, as the first day of the week was dawning, Mary Magdalene and the other Mary came to see the tomb.","status":"source_text","id":"mat-28-1"},{"book":"mat","chapter":28,"verse":2,"text":"And behold, there was a great earthquake, for an angel of the Lord descended from heaven, came, rolled away the stone, and sat on it.","status":"source_text","id":"mat-28-2"},{"book":"mat","chapter":28,"verse":3,"text":"His appearance was like lightning, and his clothing white as snow.","status":"source_text","id":"mat-28-3"},{"book":"mat","chapter":28,"verse":4,"text":"For fear of him, the guards trembled and became like dead men.","status":"source_text","id":"mat-28-4"},{"book":"mat","chapter":28,"verse":5,"text":"But the angel answered the women, “Do not be afraid, for I know that you are looking for Jesus who was crucified.","status":"source_text","id":"mat-28-5"},{"book":"mat","chapter":28,"verse":6,"text":"He is not here, for He has been raised, just as He said. Come, see the place where He was lying.","status":"source_text","id":"mat-28-6"},{"book":"mat","chapter":28,"verse":7,"text":"And go quickly and tell His disciples, ‘He has been raised from the dead, and behold, He is going ahead of you into Galilee. There you will see Him.’ Behold, I have told you.”","status":"source_text","id":"mat-28-7"},{"book":"mat","chapter":28,"verse":8,"text":"They left the tomb quickly with fear and great joy and ran to tell His disciples.","status":"source_text","id":"mat-28-8"},{"book":"mat","chapter":28,"verse":9,"text":"And behold, Jesus met them and said, “Greetings!” They came to Him, took hold of His feet, and worshiped Him.","status":"source_text","id":"mat-28-9"},{"book":"mat","chapter":28,"verse":10,"text":"Then Jesus said to them, “Do not be afraid. Go tell My brothers to go to Galilee, and there they will see Me.”","status":"source_text","id":"mat-28-10"},{"book":"mat","chapter":28,"verse":11,"text":"While they were going, behold, some of the guard went into the city and reported to the chief priests everything that had happened.","status":"source_text","id":"mat-28-11"},{"book":"mat","chapter":28,"verse":12,"text":"After gathering with the elders and taking counsel, they gave a large sum of money to the soldiers,","status":"source_text","id":"mat-28-12"},{"book":"mat","chapter":28,"verse":13,"text":"saying, “Say, ‘His disciples came by night and stole Him while we were sleeping.’","status":"source_text","id":"mat-28-13"},{"book":"mat","chapter":28,"verse":14,"text":"And if this comes to the governor’s ears, we will persuade him and keep you free from concern.”","status":"source_text","id":"mat-28-14"},{"book":"mat","chapter":28,"verse":15,"text":"They took the money and did as they had been instructed, and this account has been widely spread among the Jews to this day.","status":"source_text","id":"mat-28-15"},{"book":"mat","chapter":28,"verse":16,"text":"The eleven disciples went to Galilee, to the mountain where Jesus had directed them.","status":"source_text","id":"mat-28-16"},{"book":"mat","chapter":28,"verse":17,"text":"When they saw Him, they worshiped Him, but some doubted.","status":"source_text","id":"mat-28-17"},{"book":"mat","chapter":28,"verse":18,"text":"Jesus came and spoke to them, saying, “All authority in heaven and on earth has been given to Me.","status":"source_text","id":"mat-28-18"},{"book":"mat","chapter":28,"verse":19,"text":"Therefore go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,","status":"source_text","id":"mat-28-19"},{"book":"mat","chapter":28,"verse":20,"text":"teaching them to keep everything I commanded you. And behold, I am with you all the days until the completion of the age.”","status":"source_text","id":"mat-28-20"}]},{"key":"mrk","name":"Mark","nameKo":"마가복음","chapters":16,"counts":[45,28,35,41,43,56,37,38,50,52,33,44,37,72,47,20],"verses":[{"book":"mrk","chapter":1,"verse":1,"text":"The beginning of the good news of Jesus Christ.","status":"reviewed_2026_10_05","id":"mrk-1-1"},{"book":"mrk","chapter":1,"verse":2,"text":"As it is written in Isaiah the prophet: “Look, I am sending my messenger ahead of you, who will prepare your way.”","status":"reviewed_2026_10_05","id":"mrk-1-2"},{"book":"mrk","chapter":1,"verse":3,"text":"“A voice cries out in the wilderness: ‘Prepare the way of the Lord; make His paths straight.’”","status":"reviewed_2026_10_05","id":"mrk-1-3"},{"book":"mrk","chapter":1,"verse":4,"text":"John appeared in the wilderness, baptizing and proclaiming a baptism of repentance for the forgiveness of sins.","status":"reviewed_2026_10_05","id":"mrk-1-4"},{"book":"mrk","chapter":1,"verse":5,"text":"People from the whole Judean countryside and all Jerusalem were going out to him. They were baptized by him in the Jordan River, confessing their sins.","status":"reviewed_2026_10_05","id":"mrk-1-5"},{"book":"mrk","chapter":1,"verse":6,"text":"John wore camel’s hair clothing with a leather belt around his waist, and he ate locusts and wild honey.","status":"reviewed_2026_10_05","id":"mrk-1-6"},{"book":"mrk","chapter":1,"verse":7,"text":"He proclaimed, “After me comes one stronger than I am. I am not worthy to bend down and untie the strap of His sandals.”","status":"reviewed_2026_10_05","id":"mrk-1-7"},{"book":"mrk","chapter":1,"verse":8,"text":"“I baptized you with water, but He will baptize you with the Holy Spirit.”","status":"reviewed_2026_10_05","id":"mrk-1-8"},{"book":"mrk","chapter":1,"verse":9,"text":"In those days Jesus came from Nazareth in Galilee and was baptized by John in the Jordan.","status":"reviewed_2026_10_05","id":"mrk-1-9"},{"book":"mrk","chapter":1,"verse":10,"text":"As He came up out of the water, He immediately saw the heavens being torn open and the Spirit descending on Him like a dove.","status":"reviewed_2026_10_05","id":"mrk-1-10"},{"book":"mrk","chapter":1,"verse":11,"text":"A voice came from heaven: “You are my beloved Son; I delight in you.”","status":"reviewed_2026_10_05","id":"mrk-1-11"},{"book":"mrk","chapter":1,"verse":12,"text":"Immediately the Spirit drove Him out into the wilderness.","status":"reviewed_2026_10_05","id":"mrk-1-12"},{"book":"mrk","chapter":1,"verse":13,"text":"He was in the wilderness for forty days, being tested by Satan. He was with the wild animals, and the angels were serving Him.","status":"reviewed_2026_10_05","id":"mrk-1-13"},{"book":"mrk","chapter":1,"verse":14,"text":"After John was handed over, Jesus came into Galilee proclaiming the good news of God.","status":"reviewed_2026_10_05","id":"mrk-1-14"},{"book":"mrk","chapter":1,"verse":15,"text":"He said, “The appointed time has been fulfilled, and the kingdom of God has drawn near. Repent and believe the good news.”","status":"reviewed_2026_10_05","id":"mrk-1-15"},{"book":"mrk","chapter":1,"verse":16,"text":"As He passed along the Sea of Galilee, He saw Simon and Simon’s brother Andrew casting a net into the sea, for they were fishermen.","status":"reviewed_2026_10_05","id":"mrk-1-16"},{"book":"mrk","chapter":1,"verse":17,"text":"Jesus said to them, “Come after me, and I will make you become fishers of people.”","status":"reviewed_2026_10_05","id":"mrk-1-17"},{"book":"mrk","chapter":1,"verse":18,"text":"Immediately they left their nets and followed Him.","status":"reviewed_2026_10_05","id":"mrk-1-18"},{"book":"mrk","chapter":1,"verse":19,"text":"Going a little farther, He saw James son of Zebedee and his brother John. They too were in the boat, mending the nets.","status":"reviewed_2026_10_05","id":"mrk-1-19"},{"book":"mrk","chapter":1,"verse":20,"text":"Immediately He called them. They left their father Zebedee in the boat with the hired workers and went after Him.","status":"reviewed_2026_10_05","id":"mrk-1-20"},{"book":"mrk","chapter":1,"verse":21,"text":"They went into Capernaum. On the Sabbath He entered the synagogue and began to teach.","status":"reviewed_2026_10_05","id":"mrk-1-21"},{"book":"mrk","chapter":1,"verse":22,"text":"The people were astonished at His teaching, for He taught them as one who had authority, unlike the scribes.","status":"reviewed_2026_10_05","id":"mrk-1-22"},{"book":"mrk","chapter":1,"verse":23,"text":"Just then, a man with an unclean spirit was in their synagogue, and he cried out,","status":"reviewed_2026_10_05","id":"mrk-1-23"},{"book":"mrk","chapter":1,"verse":24,"text":"“What do you want with us, Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.”","status":"reviewed_2026_10_05","id":"mrk-1-24"},{"book":"mrk","chapter":1,"verse":25,"text":"Jesus rebuked the spirit: “Be silent, and come out of him!”","status":"reviewed_2026_10_05","id":"mrk-1-25"},{"book":"mrk","chapter":1,"verse":26,"text":"The unclean spirit convulsed the man, cried out with a loud voice, and came out of him.","status":"reviewed_2026_10_05","id":"mrk-1-26"},{"book":"mrk","chapter":1,"verse":27,"text":"They were all stunned and debated among themselves: “What is this? A new teaching—with authority! He commands even the unclean spirits, and they obey Him.”","status":"reviewed_2026_10_05","id":"mrk-1-27"},{"book":"mrk","chapter":1,"verse":28,"text":"News about Him immediately spread everywhere throughout the surrounding region of Galilee.","status":"reviewed_2026_10_05","id":"mrk-1-28"},{"book":"mrk","chapter":1,"verse":29,"text":"Immediately after leaving the synagogue, they went with James and John to the home of Simon and Andrew.","status":"reviewed_2026_10_05","id":"mrk-1-29"},{"book":"mrk","chapter":1,"verse":30,"text":"Simon’s mother-in-law was lying sick with a fever, and they immediately told Jesus about her.","status":"reviewed_2026_10_05","id":"mrk-1-30"},{"book":"mrk","chapter":1,"verse":31,"text":"He went to her, took her by the hand, and raised her up. The fever left her, and she began to serve them.","status":"reviewed_2026_10_05","id":"mrk-1-31"},{"book":"mrk","chapter":1,"verse":32,"text":"That evening, after the sun had set, people brought Him all who were sick and those troubled by demons.","status":"reviewed_2026_10_05","id":"mrk-1-32"},{"book":"mrk","chapter":1,"verse":33,"text":"The whole town had gathered at the door.","status":"reviewed_2026_10_05","id":"mrk-1-33"},{"book":"mrk","chapter":1,"verse":34,"text":"He healed many people suffering from various diseases and drove out many demons. He would not let the demons speak, because they knew Him.","status":"reviewed_2026_10_05","id":"mrk-1-34"},{"book":"mrk","chapter":1,"verse":35,"text":"Very early, while it was still dark, He got up, went out to a deserted place, and prayed there.","status":"reviewed_2026_10_05","id":"mrk-1-35"},{"book":"mrk","chapter":1,"verse":36,"text":"Simon and those with him went in pursuit of Jesus.","status":"reviewed_2026_10_05","id":"mrk-1-36"},{"book":"mrk","chapter":1,"verse":37,"text":"They found Him and said, “Everyone is looking for you.”","status":"reviewed_2026_10_05","id":"mrk-1-37"},{"book":"mrk","chapter":1,"verse":38,"text":"He said to them, “Let us go elsewhere, to the neighboring towns, so that I may proclaim the message there too. That is why I came out.”","status":"reviewed_2026_10_05","id":"mrk-1-38"},{"book":"mrk","chapter":1,"verse":39,"text":"He went throughout Galilee, proclaiming the message in their synagogues and driving out demons.","status":"reviewed_2026_10_05","id":"mrk-1-39"},{"book":"mrk","chapter":1,"verse":40,"text":"A man with leprosy came to Him, pleading on his knees: “If you are willing, you can make me clean.”","status":"reviewed_2026_10_05","id":"mrk-1-40"},{"book":"mrk","chapter":1,"verse":41,"text":"Moved with anger, Jesus stretched out His hand, touched him, and said, “I am willing. Be made clean.”","status":"reviewed_2026_10_05","id":"mrk-1-41"},{"book":"mrk","chapter":1,"verse":42,"text":"Immediately the leprosy left him, and he was made clean.","status":"reviewed_2026_10_05","id":"mrk-1-42"},{"book":"mrk","chapter":1,"verse":43,"text":"Jesus warned him sternly and immediately sent him away,","status":"reviewed_2026_10_05","id":"mrk-1-43"},{"book":"mrk","chapter":1,"verse":44,"text":"and said, “See that you tell no one anything. Instead, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”","status":"reviewed_2026_10_05","id":"mrk-1-44"},{"book":"mrk","chapter":1,"verse":45,"text":"But the man went out and began to proclaim it widely, spreading the report. As a result, Jesus could no longer enter a town openly; He stayed outside in deserted places. Yet people came to Him from every direction.","status":"reviewed_2026_10_05","id":"mrk-1-45"},{"book":"mrk","chapter":2,"verse":1,"text":"Some days later Jesus returned to Capernaum, and word spread that he was at home.","status":"source_text","id":"mrk-2-1"},{"book":"mrk","chapter":2,"verse":2,"text":"So many gathered that there was no room even at the door, and he spoke the word to them.","status":"source_text","id":"mrk-2-2"},{"book":"mrk","chapter":2,"verse":3,"text":"They brought a paralyzed man to him, carried by four people.","status":"source_text","id":"mrk-2-3"},{"book":"mrk","chapter":2,"verse":4,"text":"Unable to reach him through the crowd, they opened the roof above him and lowered the mat on which the paralyzed man lay.","status":"source_text","id":"mrk-2-4"},{"book":"mrk","chapter":2,"verse":5,"text":"Seeing their faith, Jesus said to the paralyzed man, Child, your sins are forgiven.","status":"source_text","id":"mrk-2-5"},{"book":"mrk","chapter":2,"verse":6,"text":"Some scribes sitting there began reasoning in their hearts.","status":"source_text","id":"mrk-2-6"},{"book":"mrk","chapter":2,"verse":7,"text":"Why does this man speak like this? It is blasphemy! Who can forgive sins except God alone?","status":"source_text","id":"mrk-2-7"},{"book":"mrk","chapter":2,"verse":8,"text":"Jesus at once perceived what they were thinking inwardly and asked, Why do you reason this way in your hearts?","status":"source_text","id":"mrk-2-8"},{"book":"mrk","chapter":2,"verse":9,"text":"Which is easier to say to this man: Your sins are forgiven, or, Rise, take up your mat and walk?","status":"source_text","id":"mrk-2-9"},{"book":"mrk","chapter":2,"verse":10,"text":"But so that you may know that the Son of Man has authority on earth to forgive sins, he said to the paralyzed man,","status":"source_text","id":"mrk-2-10"},{"book":"mrk","chapter":2,"verse":11,"text":"I tell you, rise, take your mat and go home.","status":"source_text","id":"mrk-2-11"},{"book":"mrk","chapter":2,"verse":12,"text":"He got up, immediately took his mat and went out before everyone. They were amazed and glorified God, saying they had never seen anything like it.","status":"source_text","id":"mrk-2-12"},{"book":"mrk","chapter":2,"verse":13,"text":"Jesus went out beside the sea again; the whole crowd came to him, and he taught them.","status":"source_text","id":"mrk-2-13"},{"book":"mrk","chapter":2,"verse":14,"text":"Passing by, Jesus saw Levi son of Alphaeus sitting at the tax booth. He said, Follow me, and Levi rose and followed him.","status":"source_text","id":"mrk-2-14"},{"book":"mrk","chapter":2,"verse":15,"text":"As Jesus reclined at table in his house, many tax collectors and sinners ate with him and his disciples, for many were following him.","status":"source_text","id":"mrk-2-15"},{"book":"mrk","chapter":2,"verse":16,"text":"When scribes of the Pharisees saw him eating with sinners and tax collectors, they asked his disciples, Why does he eat with them?","status":"source_text","id":"mrk-2-16"},{"book":"mrk","chapter":2,"verse":17,"text":"Jesus heard and replied, The healthy do not need a physician, but the sick do. I came to call sinners, not the righteous.","status":"source_text","id":"mrk-2-17"},{"book":"mrk","chapter":2,"verse":18,"text":"John's disciples and the Pharisees were fasting. People came and asked Jesus why his disciples, unlike theirs, did not fast.","status":"source_text","id":"mrk-2-18"},{"book":"mrk","chapter":2,"verse":19,"text":"Jesus said, Can wedding guests fast while the bridegroom is with them? As long as he remains with them, they cannot fast.","status":"source_text","id":"mrk-2-19"},{"book":"mrk","chapter":2,"verse":20,"text":"But a day will come when the bridegroom is taken from them; then they will fast.","status":"source_text","id":"mrk-2-20"},{"book":"mrk","chapter":2,"verse":21,"text":"No one sews a piece of unshrunk cloth on an old garment; the new patch pulls away and makes the tear worse.","status":"source_text","id":"mrk-2-21"},{"book":"mrk","chapter":2,"verse":22,"text":"Nor does anyone put new wine into old skins. The wine would burst them and both wine and skins would be lost; new wine belongs in fresh skins.","status":"source_text","id":"mrk-2-22"},{"book":"mrk","chapter":2,"verse":23,"text":"On a Sabbath Jesus passed through fields of grain, and his disciples began picking heads of grain as they went.","status":"source_text","id":"mrk-2-23"},{"book":"mrk","chapter":2,"verse":24,"text":"The Pharisees asked, Look, why are your disciples doing what is not permitted on the Sabbath?","status":"source_text","id":"mrk-2-24"},{"book":"mrk","chapter":2,"verse":25,"text":"Jesus replied, Have you never read what David did when he and his companions were hungry and had nothing to eat?","status":"source_text","id":"mrk-2-25"},{"book":"mrk","chapter":2,"verse":26,"text":"He entered God's house in the days of Abiathar the high priest, ate the bread of the Presence reserved for priests, and gave it to his companions.","status":"source_text","id":"mrk-2-26"},{"book":"mrk","chapter":2,"verse":27,"text":"Then he said, The Sabbath was made for people, not people for the Sabbath.","status":"source_text","id":"mrk-2-27"},{"book":"mrk","chapter":2,"verse":28,"text":"Therefore the Son of Man is lord even of the Sabbath.","status":"source_text","id":"mrk-2-28"},{"book":"mrk","chapter":3,"verse":1,"text":"Jesus entered the synagogue again, where a man had a withered hand.","status":"source_text","id":"mrk-3-1"},{"book":"mrk","chapter":3,"verse":2,"text":"They watched to see whether Jesus would heal him on the Sabbath, hoping for grounds to accuse him.","status":"source_text","id":"mrk-3-2"},{"book":"mrk","chapter":3,"verse":3,"text":"Jesus told the man with the withered hand, Stand here in the middle.","status":"source_text","id":"mrk-3-3"},{"book":"mrk","chapter":3,"verse":4,"text":"He asked them, Is it lawful on the Sabbath to do good or to do harm, to save life or to kill? They remained silent.","status":"source_text","id":"mrk-3-4"},{"book":"mrk","chapter":3,"verse":5,"text":"He looked around at them in anger, grieved by their hard hearts. He told the man to stretch out his hand; he did so, and it was restored.","status":"source_text","id":"mrk-3-5"},{"book":"mrk","chapter":3,"verse":6,"text":"The Pharisees went out at once and plotted with the Herodians how to destroy Jesus.","status":"source_text","id":"mrk-3-6"},{"book":"mrk","chapter":3,"verse":7,"text":"Jesus withdrew with his disciples to the sea, and a great crowd from Galilee followed him.","status":"source_text","id":"mrk-3-7"},{"book":"mrk","chapter":3,"verse":8,"text":"Many also came from Judea, Jerusalem, Idumea, beyond the Jordan, and around Tyre and Sidon, having heard what he was doing.","status":"source_text","id":"mrk-3-8"},{"book":"mrk","chapter":3,"verse":9,"text":"Jesus told his disciples to keep a small boat ready so that the crowd would not crush him.","status":"source_text","id":"mrk-3-9"},{"book":"mrk","chapter":3,"verse":10,"text":"He had healed many, so those suffering illnesses pressed forward to touch him.","status":"source_text","id":"mrk-3-10"},{"book":"mrk","chapter":3,"verse":11,"text":"Whenever unclean spirits saw him, they fell down before him and cried, You are the Son of God!","status":"source_text","id":"mrk-3-11"},{"book":"mrk","chapter":3,"verse":12,"text":"But he warned them sternly not to make him known.","status":"source_text","id":"mrk-3-12"},{"book":"mrk","chapter":3,"verse":13,"text":"Jesus went up the mountain and summoned those he wanted, and they came to him.","status":"source_text","id":"mrk-3-13"},{"book":"mrk","chapter":3,"verse":14,"text":"He appointed twelve to be with him and to be sent out to preach,","status":"source_text","id":"mrk-3-14"},{"book":"mrk","chapter":3,"verse":15,"text":"and to have authority to drive out demons.","status":"source_text","id":"mrk-3-15"},{"book":"mrk","chapter":3,"verse":16,"text":"He appointed the twelve and gave Simon the name Peter.","status":"source_text","id":"mrk-3-16"},{"book":"mrk","chapter":3,"verse":17,"text":"James son of Zebedee and his brother John he named Boanerges, meaning sons of thunder.","status":"source_text","id":"mrk-3-17"},{"book":"mrk","chapter":3,"verse":18,"text":"There were also Andrew, Philip, Bartholomew, Matthew, Thomas, James son of Alphaeus, Thaddaeus and Simon the Cananaean.","status":"source_text","id":"mrk-3-18"},{"book":"mrk","chapter":3,"verse":19,"text":"And there was Judas Iscariot, who betrayed him.","status":"source_text","id":"mrk-3-19"},{"book":"mrk","chapter":3,"verse":20,"text":"When Jesus came home, a crowd gathered again, leaving them no chance even to eat.","status":"source_text","id":"mrk-3-20"},{"book":"mrk","chapter":3,"verse":21,"text":"When his family heard, they came to restrain him, for people were saying that he was out of his mind.","status":"source_text","id":"mrk-3-21"},{"book":"mrk","chapter":3,"verse":22,"text":"Scribes from Jerusalem said he was possessed by Beelzebul and drove out demons through the ruler of the demons.","status":"source_text","id":"mrk-3-22"},{"book":"mrk","chapter":3,"verse":23,"text":"Jesus called them and spoke in parables: How can Satan drive out Satan?","status":"source_text","id":"mrk-3-23"},{"book":"mrk","chapter":3,"verse":24,"text":"If a kingdom is divided against itself, that kingdom cannot stand.","status":"source_text","id":"mrk-3-24"},{"book":"mrk","chapter":3,"verse":25,"text":"And if a household is divided against itself, that household cannot stand.","status":"source_text","id":"mrk-3-25"},{"book":"mrk","chapter":3,"verse":26,"text":"So if Satan rises against himself and is divided, he cannot stand; his end has come.","status":"source_text","id":"mrk-3-26"},{"book":"mrk","chapter":3,"verse":27,"text":"No one can enter a strong man's house and take his goods without first tying him up. Only then can his house be plundered.","status":"source_text","id":"mrk-3-27"},{"book":"mrk","chapter":3,"verse":28,"text":"Truly I tell you, every sin people commit and every blasphemy they utter can be forgiven,","status":"source_text","id":"mrk-3-28"},{"book":"mrk","chapter":3,"verse":29,"text":"but whoever blasphemes the Holy Spirit has no forgiveness forever and is guilty of an eternal sin.","status":"source_text","id":"mrk-3-29"},{"book":"mrk","chapter":3,"verse":30,"text":"He said this because they were saying that he had an unclean spirit.","status":"source_text","id":"mrk-3-30"},{"book":"mrk","chapter":3,"verse":31,"text":"His mother and brothers arrived and stood outside, sending someone to call him.","status":"source_text","id":"mrk-3-31"},{"book":"mrk","chapter":3,"verse":32,"text":"The crowd sitting around him said, Your mother and brothers and sisters are outside looking for you.","status":"source_text","id":"mrk-3-32"},{"book":"mrk","chapter":3,"verse":33,"text":"He answered, Who are my mother and my brothers?","status":"source_text","id":"mrk-3-33"},{"book":"mrk","chapter":3,"verse":34,"text":"Looking at those seated around him, he said, Here are my mother and my brothers.","status":"source_text","id":"mrk-3-34"},{"book":"mrk","chapter":3,"verse":35,"text":"Whoever does the will of God is my brother and sister and mother.","status":"source_text","id":"mrk-3-35"},{"book":"mrk","chapter":4,"verse":1,"text":"Jesus began teaching beside the sea again. When a large crowd gathered, he sat in a boat on the water while everyone remained on the shore.","status":"source_text","id":"mrk-4-1"},{"book":"mrk","chapter":4,"verse":2,"text":"He taught them many things through parables, saying,","status":"source_text","id":"mrk-4-2"},{"book":"mrk","chapter":4,"verse":3,"text":"Listen! A sower went out to sow.","status":"source_text","id":"mrk-4-3"},{"book":"mrk","chapter":4,"verse":4,"text":"As he sowed, some seed fell along the path, and birds came and ate it.","status":"source_text","id":"mrk-4-4"},{"book":"mrk","chapter":4,"verse":5,"text":"Other seed fell on rocky ground with little soil and sprang up quickly.","status":"source_text","id":"mrk-4-5"},{"book":"mrk","chapter":4,"verse":6,"text":"But when the sun rose it was scorched, and without root it withered.","status":"source_text","id":"mrk-4-6"},{"book":"mrk","chapter":4,"verse":7,"text":"Some seed fell among thorns; as the thorns grew they choked it, and it yielded no fruit.","status":"source_text","id":"mrk-4-7"},{"book":"mrk","chapter":4,"verse":8,"text":"Other seed fell on good soil, grew and bore fruit, producing thirty, sixty or a hundred times as much.","status":"source_text","id":"mrk-4-8"},{"book":"mrk","chapter":4,"verse":9,"text":"Then he said, Whoever has ears to hear should listen.","status":"source_text","id":"mrk-4-9"},{"book":"mrk","chapter":4,"verse":10,"text":"When he was alone, those around him with the Twelve asked him about the parables.","status":"source_text","id":"mrk-4-10"},{"book":"mrk","chapter":4,"verse":11,"text":"He said, To you the mystery of God's kingdom has been given; to those outside, everything comes in parables,","status":"source_text","id":"mrk-4-11"},{"book":"mrk","chapter":4,"verse":12,"text":"so that they may look and yet not perceive, and hear yet not understand; otherwise they might turn and be forgiven.","status":"source_text","id":"mrk-4-12"},{"book":"mrk","chapter":4,"verse":13,"text":"He asked, If you do not grasp this parable, how will you understand any of the others?","status":"source_text","id":"mrk-4-13"},{"book":"mrk","chapter":4,"verse":14,"text":"The sower sows the word.","status":"source_text","id":"mrk-4-14"},{"book":"mrk","chapter":4,"verse":15,"text":"Those beside the path hear the word, but Satan immediately comes and takes away what was sown in them.","status":"source_text","id":"mrk-4-15"},{"book":"mrk","chapter":4,"verse":16,"text":"Those sown on rocky ground hear the word and immediately receive it with joy.","status":"source_text","id":"mrk-4-16"},{"book":"mrk","chapter":4,"verse":17,"text":"They have no root in themselves and last only a while; when trouble or persecution comes because of the word, they quickly fall away.","status":"source_text","id":"mrk-4-17"},{"book":"mrk","chapter":4,"verse":18,"text":"Others are sown among thorns. They hear the word,","status":"source_text","id":"mrk-4-18"},{"book":"mrk","chapter":4,"verse":19,"text":"but the worries of this age, the deceit of wealth and desires for other things come in and choke it, leaving it unfruitful.","status":"source_text","id":"mrk-4-19"},{"book":"mrk","chapter":4,"verse":20,"text":"Those sown on good soil hear and accept the word and bear fruit thirty, sixty and a hundredfold.","status":"source_text","id":"mrk-4-20"},{"book":"mrk","chapter":4,"verse":21,"text":"He asked, Is a lamp brought in to be put under a basket or bed? Is it not meant for a stand?","status":"source_text","id":"mrk-4-21"},{"book":"mrk","chapter":4,"verse":22,"text":"For nothing is hidden except to be brought to light, and nothing kept secret except to be revealed.","status":"source_text","id":"mrk-4-22"},{"book":"mrk","chapter":4,"verse":23,"text":"Whoever has ears to hear should listen.","status":"source_text","id":"mrk-4-23"},{"book":"mrk","chapter":4,"verse":24,"text":"He said, Pay attention to what you hear. The measure you use will be measured to you, and more will be added.","status":"source_text","id":"mrk-4-24"},{"book":"mrk","chapter":4,"verse":25,"text":"The one who has will be given more; from one who has not, even what he has will be taken.","status":"source_text","id":"mrk-4-25"},{"book":"mrk","chapter":4,"verse":26,"text":"He also said, God's kingdom is like someone scattering seed on the earth.","status":"source_text","id":"mrk-4-26"},{"book":"mrk","chapter":4,"verse":27,"text":"Night after night he sleeps and rises, while the seed sprouts and grows, though he does not know how.","status":"source_text","id":"mrk-4-27"},{"book":"mrk","chapter":4,"verse":28,"text":"The soil bears fruit by itself: first a blade, then an ear, then full grain in the ear.","status":"source_text","id":"mrk-4-28"},{"book":"mrk","chapter":4,"verse":29,"text":"When the crop is ready he immediately puts in the sickle, because harvest has arrived.","status":"source_text","id":"mrk-4-29"},{"book":"mrk","chapter":4,"verse":30,"text":"He asked, How shall we compare God's kingdom, or with what parable shall we describe it?","status":"source_text","id":"mrk-4-30"},{"book":"mrk","chapter":4,"verse":31,"text":"It is like a mustard seed: when sown in the soil, it is smaller than the other seeds there.","status":"source_text","id":"mrk-4-31"},{"book":"mrk","chapter":4,"verse":32,"text":"But once planted, it grows larger than the garden plants, putting out branches so great that birds can nest in its shade.","status":"source_text","id":"mrk-4-32"},{"book":"mrk","chapter":4,"verse":33,"text":"Jesus spoke the word to them in many such parables, as far as they could understand.","status":"source_text","id":"mrk-4-33"},{"book":"mrk","chapter":4,"verse":34,"text":"He did not speak to them without a parable; in private he explained everything to his disciples.","status":"source_text","id":"mrk-4-34"},{"book":"mrk","chapter":4,"verse":35,"text":"That evening Jesus said to his disciples, Let us cross to the other side.","status":"source_text","id":"mrk-4-35"},{"book":"mrk","chapter":4,"verse":36,"text":"They left the crowd and took Jesus as he was in the boat, and other boats accompanied him.","status":"source_text","id":"mrk-4-36"},{"book":"mrk","chapter":4,"verse":37,"text":"A fierce windstorm arose, and waves broke into the boat until it began filling with water.","status":"source_text","id":"mrk-4-37"},{"book":"mrk","chapter":4,"verse":38,"text":"Jesus was asleep on a cushion in the stern. They woke him, saying, Teacher, do you not care that we are dying?","status":"source_text","id":"mrk-4-38"},{"book":"mrk","chapter":4,"verse":39,"text":"He rose, rebuked the wind and said to the sea, Be still! Be quiet! The wind stopped and a great calm followed.","status":"source_text","id":"mrk-4-39"},{"book":"mrk","chapter":4,"verse":40,"text":"He asked them, Why are you so afraid? Do you still have no faith?","status":"source_text","id":"mrk-4-40"},{"book":"mrk","chapter":4,"verse":41,"text":"They were filled with awe and asked one another, Who is this, that even wind and sea obey him?","status":"source_text","id":"mrk-4-41"},{"book":"mrk","chapter":5,"verse":1,"text":"They came across the sea to the country of the Ge
