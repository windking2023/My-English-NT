id, “Behold My mother and My brothers!","status":"source_text","id":"mat-12-49"},{"book":"mat","chapter":12,"verse":50,"text":"For whoever does the will of My Father who is in the heavens, that person is My brother and sister and mother.”","status":"source_text","id":"mat-12-50"},{"book":"mat","chapter":13,"verse":1,"text":"That day Jesus went out of the house and sat beside the sea.","status":"source_text","id":"mat-13-1"},{"book":"mat","chapter":13,"verse":2,"text":"And large crowds gathered around Him, so that He got into a boat and sat down, while the whole crowd stood on the shore.","status":"source_text","id":"mat-13-2"},{"book":"mat","chapter":13,"verse":3,"text":"And He spoke many things to them in parables, saying, “Behold, the sower went out to sow.","status":"source_text","id":"mat-13-3"},{"book":"mat","chapter":13,"verse":4,"text":"And as he sowed, some seeds fell beside the road, and the birds came and devoured them.","status":"source_text","id":"mat-13-4"},{"book":"mat","chapter":13,"verse":5,"text":"Others fell on rocky places where they did not have much soil, and immediately they sprang up because they had no depth of soil.","status":"source_text","id":"mat-13-5"},{"book":"mat","chapter":13,"verse":6,"text":"But when the sun rose, they were scorched; and because they had no root, they withered away.","status":"source_text","id":"mat-13-6"},{"book":"mat","chapter":13,"verse":7,"text":"Others fell among the thorns, and the thorns came up and choked them.","status":"source_text","id":"mat-13-7"},{"book":"mat","chapter":13,"verse":8,"text":"But others fell on the good soil and produced fruit, some a hundredfold, some sixty, and some thirty.","status":"source_text","id":"mat-13-8"},{"book":"mat","chapter":13,"verse":9,"text":"The one who has ears, let him hear.”","status":"source_text","id":"mat-13-9"},{"book":"mat","chapter":13,"verse":10,"text":"And the disciples came and said to Him, “Why do You speak to them in parables?”","status":"source_text","id":"mat-13-10"},{"book":"mat","chapter":13,"verse":11,"text":"He answered them, “To you it has been given to know the mysteries of the kingdom of the heavens, but to them it has not been given.","status":"source_text","id":"mat-13-11"},{"book":"mat","chapter":13,"verse":12,"text":"For whoever has, more will be given, and he will have abundance; but whoever does not have, even what he has will be taken away from him.","status":"source_text","id":"mat-13-12"},{"book":"mat","chapter":13,"verse":13,"text":"Therefore I speak to them in parables, because seeing they do not see, and hearing they do not hear or understand.","status":"source_text","id":"mat-13-13"},{"book":"mat","chapter":13,"verse":14,"text":"And in them the prophecy of Isaiah is fulfilled, which says, ‘You will indeed hear but never understand, and you will indeed see but never perceive.","status":"source_text","id":"mat-13-14"},{"book":"mat","chapter":13,"verse":15,"text":"For the heart of this people has become dull; with their ears they have heard heavily, and they have closed their eyes, lest they should see with their eyes, hear with their ears, understand with their heart, turn, and I would heal them.’","status":"source_text","id":"mat-13-15"},{"book":"mat","chapter":13,"verse":16,"text":"But blessed are your eyes because they see, and your ears because they hear.","status":"source_text","id":"mat-13-16"},{"book":"mat","chapter":13,"verse":17,"text":"For truly I say to you, many prophets and righteous people desired to see what you see and did not see it, and to hear what you hear and did not hear it.","status":"source_text","id":"mat-13-17"},{"book":"mat","chapter":13,"verse":18,"text":"You, therefore, hear the parable of the sower.","status":"source_text","id":"mat-13-18"},{"book":"mat","chapter":13,"verse":19,"text":"When anyone hears the word of the kingdom and does not understand it, the evil one comes and snatches away what was sown in his heart. This is the one sown beside the road.","status":"source_text","id":"mat-13-19"},{"book":"mat","chapter":13,"verse":20,"text":"The one sown on rocky places is the one who hears the word and immediately receives it with joy,","status":"source_text","id":"mat-13-20"},{"book":"mat","chapter":13,"verse":21,"text":"yet he has no root in himself but lasts only for a time; and when affliction or persecution arises because of the word, immediately he stumbles.","status":"source_text","id":"mat-13-21"},{"book":"mat","chapter":13,"verse":22,"text":"The one sown among the thorns is the one who hears the word, but the anxiety of this age and the deceitfulness of riches choke the word, and it becomes unfruitful.","status":"source_text","id":"mat-13-22"},{"book":"mat","chapter":13,"verse":23,"text":"But the one sown on the good soil is the one who hears the word and understands it, who indeed bears fruit and produces, one a hundredfold, another sixty, and another thirty.”","status":"source_text","id":"mat-13-23"},{"book":"mat","chapter":13,"verse":24,"text":"He set another parable before them, saying, “The kingdom of the heavens may be compared to a man who sowed good seed in his field.","status":"source_text","id":"mat-13-24"},{"book":"mat","chapter":13,"verse":25,"text":"But while people were sleeping, his enemy came and sowed weeds among the wheat and went away.","status":"source_text","id":"mat-13-25"},{"book":"mat","chapter":13,"verse":26,"text":"When the plants sprouted and produced fruit, then the weeds also appeared.","status":"source_text","id":"mat-13-26"},{"book":"mat","chapter":13,"verse":27,"text":"The servants of the master of the house came and said to him, ‘Master, did you not sow good seed in your field? Where then did the weeds come from?’","status":"source_text","id":"mat-13-27"},{"book":"mat","chapter":13,"verse":28,"text":"He said to them, ‘An enemy did this.’ The servants said to him, ‘Then do you want us to go and gather them?’","status":"source_text","id":"mat-13-28"},{"book":"mat","chapter":13,"verse":29,"text":"But he said, ‘No, lest in gathering the weeds you uproot the wheat along with them.","status":"source_text","id":"mat-13-29"},{"book":"mat","chapter":13,"verse":30,"text":"Let both grow together until the harvest; and at harvest time I will tell the reapers: Gather the weeds first and bind them in bundles to burn them, but gather the wheat into my barn.’”","status":"source_text","id":"mat-13-30"},{"book":"mat","chapter":13,"verse":31,"text":"He set another parable before them, saying, “The kingdom of the heavens is like a mustard seed that a man took and sowed in his field.","status":"source_text","id":"mat-13-31"},{"book":"mat","chapter":13,"verse":32,"text":"It is smaller than all the seeds, but when it has grown it is larger than the garden plants and becomes a tree, so that the birds of heaven come and nest in its branches.”","status":"source_text","id":"mat-13-32"},{"book":"mat","chapter":13,"verse":33,"text":"He spoke another parable to them: “The kingdom of the heavens is like leaven that a woman took and hid in three measures of flour until all of it was leavened.”","status":"source_text","id":"mat-13-33"},{"book":"mat","chapter":13,"verse":34,"text":"Jesus spoke all these things to the crowds in parables, and apart from a parable He spoke nothing to them.","status":"source_text","id":"mat-13-34"},{"book":"mat","chapter":13,"verse":35,"text":"This was so that what was spoken through the prophet might be fulfilled: “I will open My mouth in parables; I will utter things hidden from the foundation of the world.”","status":"source_text","id":"mat-13-35"},{"book":"mat","chapter":13,"verse":36,"text":"Then He left the crowds and went into the house. His disciples came to Him, saying, “Explain to us the parable of the weeds of the field.”","status":"source_text","id":"mat-13-36"},{"book":"mat","chapter":13,"verse":37,"text":"He answered, “The one who sows the good seed is the Son of Man.","status":"source_text","id":"mat-13-37"},{"book":"mat","chapter":13,"verse":38,"text":"The field is the world, and the good seed—these are the sons of the kingdom; the weeds are the sons of the evil one.","status":"source_text","id":"mat-13-38"},{"book":"mat","chapter":13,"verse":39,"text":"The enemy who sowed them is the devil, the harvest is the completion of the age, and the reapers are angels.","status":"source_text","id":"mat-13-39"},{"book":"mat","chapter":13,"verse":40,"text":"Therefore, just as the weeds are gathered and burned with fire, so it will be at the completion of the age.","status":"source_text","id":"mat-13-40"},{"book":"mat","chapter":13,"verse":41,"text":"The Son of Man will send His angels, and they will gather out of His kingdom all causes of stumbling and those who practice lawlessness,","status":"source_text","id":"mat-13-41"},{"book":"mat","chapter":13,"verse":42,"text":"and they will throw them into the furnace of fire. There will be weeping and gnashing of teeth.","status":"source_text","id":"mat-13-42"},{"book":"mat","chapter":13,"verse":43,"text":"Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.","status":"source_text","id":"mat-13-43"},{"book":"mat","chapter":13,"verse":44,"text":"The kingdom of the heavens is like treasure hidden in a field, which a man found and hid again; and from his joy he goes and sells all that he has and buys that field.","status":"source_text","id":"mat-13-44"},{"book":"mat","chapter":13,"verse":45,"text":"Again, the kingdom of the heavens is like a merchant seeking fine pearls.","status":"source_text","id":"mat-13-45"},{"book":"mat","chapter":13,"verse":46,"text":"When he found one pearl of great value, he went and sold all that he had and bought it.","status":"source_text","id":"mat-13-46"},{"book":"mat","chapter":13,"verse":47,"text":"Again, the kingdom of the heavens is like a net cast into the sea and gathering every kind.","status":"source_text","id":"mat-13-47"},{"book":"mat","chapter":13,"verse":48,"text":"When it was full, they drew it up on the shore, sat down, gathered the good into containers, but threw the bad away.","status":"source_text","id":"mat-13-48"},{"book":"mat","chapter":13,"verse":49,"text":"So it will be at the completion of the age. The angels will go out and separate the evil from among the righteous","status":"source_text","id":"mat-13-49"},{"book":"mat","chapter":13,"verse":50,"text":"and throw them into the furnace of fire. There will be weeping and gnashing of teeth.","status":"source_text","id":"mat-13-50"},{"book":"mat","chapter":13,"verse":51,"text":"“Have you understood all these things?” They said to Him, “Yes.”","status":"source_text","id":"mat-13-51"},{"book":"mat","chapter":13,"verse":52,"text":"And He said to them, “Therefore every scribe who has become a disciple for the kingdom of the heavens is like a master of a house who brings out of his treasure things new and old.”","status":"source_text","id":"mat-13-52"},{"book":"mat","chapter":13,"verse":53,"text":"When Jesus had finished these parables, He departed from there.","status":"source_text","id":"mat-13-53"},{"book":"mat","chapter":13,"verse":54,"text":"And coming to His hometown, He taught them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these mighty works?","status":"source_text","id":"mat-13-54"},{"book":"mat","chapter":13,"verse":55,"text":"Is this not the carpenter’s son? Is not His mother called Mary, and His brothers James and Joseph and Simon and Judas?","status":"source_text","id":"mat-13-55"},{"book":"mat","chapter":13,"verse":56,"text":"And are not all His sisters with us? Where then did this man get all these things?”","status":"source_text","id":"mat-13-56"},{"book":"mat","chapter":13,"verse":57,"text":"And they stumbled because of Him. But Jesus said to them, “A prophet is not without honor except in his hometown and in his own household.”","status":"source_text","id":"mat-13-57"},{"book":"mat","chapter":13,"verse":58,"text":"And He did not do many mighty works there because of their unbelief.","status":"source_text","id":"mat-13-58"},{"book":"mat","chapter":14,"verse":1,"text":"At that time Herod the tetrarch heard the report about Jesus","status":"source_text","id":"mat-14-1"},{"book":"mat","chapter":14,"verse":2,"text":"and said to his servants, “This is John the Baptist. He has been raised from the dead, and therefore these powers are at work in him.”","status":"source_text","id":"mat-14-2"},{"book":"mat","chapter":14,"verse":3,"text":"For Herod had seized John, bound him, and put him in prison because of Herodias, the wife of Philip his brother.","status":"source_text","id":"mat-14-3"},{"book":"mat","chapter":14,"verse":4,"text":"For John had been saying to him, “It is not lawful for you to have her.”","status":"source_text","id":"mat-14-4"},{"book":"mat","chapter":14,"verse":5,"text":"And though he wanted to kill him, he feared the crowd because they regarded John as a prophet.","status":"source_text","id":"mat-14-5"},{"book":"mat","chapter":14,"verse":6,"text":"But when Herod’s birthday came, the daughter of Herodias danced in their midst and pleased Herod,","status":"source_text","id":"mat-14-6"},{"book":"mat","chapter":14,"verse":7,"text":"so that with an oath he promised to give her whatever she asked.","status":"source_text","id":"mat-14-7"},{"book":"mat","chapter":14,"verse":8,"text":"Prompted by her mother, she said, “Give me here on a platter the head of John the Baptist.”","status":"source_text","id":"mat-14-8"},{"book":"mat","chapter":14,"verse":9,"text":"And the king was grieved, but because of his oaths and those reclining at table with him, he commanded it to be given.","status":"source_text","id":"mat-14-9"},{"book":"mat","chapter":14,"verse":10,"text":"And he sent and had John beheaded in the prison.","status":"source_text","id":"mat-14-10"},{"book":"mat","chapter":14,"verse":11,"text":"His head was brought on a platter and given to the girl, and she brought it to her mother.","status":"source_text","id":"mat-14-11"},{"book":"mat","chapter":14,"verse":12,"text":"And his disciples came, took the body, and buried it; then they went and told Jesus.","status":"source_text","id":"mat-14-12"},{"book":"mat","chapter":14,"verse":13,"text":"When Jesus heard this, He withdrew from there in a boat to a deserted place by Himself. When the crowds heard it, they followed Him on foot from the cities.","status":"source_text","id":"mat-14-13"},{"book":"mat","chapter":14,"verse":14,"text":"When He came out, He saw a large crowd, was moved with compassion for them, and healed their sick.","status":"source_text","id":"mat-14-14"},{"book":"mat","chapter":14,"verse":15,"text":"When evening came, the disciples came to Him, saying, “This place is deserted and the hour is already late. Send the crowds away so that they may go into the villages and buy food for themselves.”","status":"source_text","id":"mat-14-15"},{"book":"mat","chapter":14,"verse":16,"text":"But Jesus said to them, “They have no need to go away. You give them something to eat.”","status":"source_text","id":"mat-14-16"},{"book":"mat","chapter":14,"verse":17,"text":"They said to Him, “We have nothing here except five loaves and two fish.”","status":"source_text","id":"mat-14-17"},{"book":"mat","chapter":14,"verse":18,"text":"And He said, “Bring them here to Me.”","status":"source_text","id":"mat-14-18"},{"book":"mat","chapter":14,"verse":19,"text":"Then He ordered the crowds to sit down on the grass. Taking the five loaves and the two fish, looking up to heaven, He blessed them; and breaking the loaves, He gave them to the disciples, and the disciples gave them to the crowds.","status":"source_text","id":"mat-14-19"},{"book":"mat","chapter":14,"verse":20,"text":"And they all ate and were satisfied. They picked up what remained of the broken pieces—twelve baskets full.","status":"source_text","id":"mat-14-20"},{"book":"mat","chapter":14,"verse":21,"text":"Those who ate were about five thousand men, besides women and children.","status":"source_text","id":"mat-14-21"},{"book":"mat","chapter":14,"verse":22,"text":"Immediately He compelled the disciples to get into the boat and go ahead of Him to the other side, while He sent the crowds away.","status":"source_text","id":"mat-14-22"},{"book":"mat","chapter":14,"verse":23,"text":"After sending the crowds away, He went up on the mountain by Himself to pray. When evening came, He was there alone.","status":"source_text","id":"mat-14-23"},{"book":"mat","chapter":14,"verse":24,"text":"But the boat was already many stadia from the land, being battered by the waves, for the wind was against them.","status":"source_text","id":"mat-14-24"},{"book":"mat","chapter":14,"verse":25,"text":"And in the fourth watch of the night He came to them, walking on the sea.","status":"source_text","id":"mat-14-25"},{"book":"mat","chapter":14,"verse":26,"text":"When the disciples saw Him walking on the sea, they were terrified and said, “It is a ghost!” And they cried out in fear.","status":"source_text","id":"mat-14-26"},{"book":"mat","chapter":14,"verse":27,"text":"But immediately Jesus spoke to them, saying, “Take courage; it is I. Do not be afraid.”","status":"source_text","id":"mat-14-27"},{"book":"mat","chapter":14,"verse":28,"text":"Peter answered Him, “Lord, if it is You, command me to come to You on the water.”","status":"source_text","id":"mat-14-28"},{"book":"mat","chapter":14,"verse":29,"text":"And He said, “Come.” Peter got out of the boat and walked on the water and came toward Jesus.","status":"source_text","id":"mat-14-29"},{"book":"mat","chapter":14,"verse":30,"text":"But seeing the strong wind, he became afraid; and beginning to sink, he cried out, “Lord, save me!”","status":"source_text","id":"mat-14-30"},{"book":"mat","chapter":14,"verse":31,"text":"Immediately Jesus stretched out His hand and took hold of him, saying, “You of little faith, why did you doubt?”","status":"source_text","id":"mat-14-31"},{"book":"mat","chapter":14,"verse":32,"text":"And when they got into the boat, the wind ceased.","status":"source_text","id":"mat-14-32"},{"book":"mat","chapter":14,"verse":33,"text":"Those in the boat bowed before Him, saying, “Truly You are God’s Son.”","status":"source_text","id":"mat-14-33"},{"book":"mat","chapter":14,"verse":34,"text":"And when they had crossed over, they came to the land of Gennesaret.","status":"source_text","id":"mat-14-34"},{"book":"mat","chapter":14,"verse":35,"text":"When the men of that place recognized Him, they sent word throughout that whole surrounding region and brought to Him all who were sick.","status":"source_text","id":"mat-14-35"},{"book":"mat","chapter":14,"verse":36,"text":"And they pleaded with Him that they might only touch the fringe of His garment; and as many as touched it were completely healed.","status":"source_text","id":"mat-14-36"},{"book":"mat","chapter":15,"verse":1,"text":"Then Pharisees and scribes came to Jesus from Jerusalem, saying,","status":"source_text","id":"mat-15-1"},{"book":"mat","chapter":15,"verse":2,"text":"“Why do Your disciples transgress the tradition of the elders? For they do not wash their hands when they eat bread.”","status":"source_text","id":"mat-15-2"},{"book":"mat","chapter":15,"verse":3,"text":"He answered them, “And why do you transgress the commandment of God because of your tradition?","status":"source_text","id":"mat-15-3"},{"book":"mat","chapter":15,"verse":4,"text":"For God said, ‘Honor your father and your mother,’ and, ‘The one who speaks evil of father or mother must surely die.’","status":"source_text","id":"mat-15-4"},{"book":"mat","chapter":15,"verse":5,"text":"But you say, ‘Whoever says to his father or mother, “Whatever benefit you might have received from me is a gift offered to God,”","status":"source_text","id":"mat-15-5"},{"book":"mat","chapter":15,"verse":6,"text":"need not honor his father.’ Thus you have made the word of God invalid because of your tradition.","status":"source_text","id":"mat-15-6"},{"book":"mat","chapter":15,"verse":7,"text":"Hypocrites! Isaiah prophesied rightly about you, saying,","status":"source_text","id":"mat-15-7"},{"book":"mat","chapter":15,"verse":8,"text":"‘This people honors Me with their lips, but their heart is far away from Me.","status":"source_text","id":"mat-15-8"},{"book":"mat","chapter":15,"verse":9,"text":"In vain they worship Me, teaching as teachings the commandments of men.’”","status":"source_text","id":"mat-15-9"},{"book":"mat","chapter":15,"verse":10,"text":"And calling the crowd to Him, He said to them, “Hear and understand:","status":"source_text","id":"mat-15-10"},{"book":"mat","chapter":15,"verse":11,"text":"It is not what enters the mouth that defiles a person, but what comes out of the mouth—this defiles a person.”","status":"source_text","id":"mat-15-11"},{"book":"mat","chapter":15,"verse":12,"text":"Then the disciples came and said to Him, “Do You know that the Pharisees stumbled when they heard this saying?”","status":"source_text","id":"mat-15-12"},{"book":"mat","chapter":15,"verse":13,"text":"He answered, “Every plant that My heavenly Father did not plant will be uprooted.","status":"source_text","id":"mat-15-13"},{"book":"mat","chapter":15,"verse":14,"text":"Leave them. They are blind guides of the blind; and if a blind person guides a blind person, both will fall into a pit.”","status":"source_text","id":"mat-15-14"},{"book":"mat","chapter":15,"verse":15,"text":"Peter said to Him, “Explain this parable to us.”","status":"source_text","id":"mat-15-15"},{"book":"mat","chapter":15,"verse":16,"text":"And He said, “Are you also still without understanding?","status":"source_text","id":"mat-15-16"},{"book":"mat","chapter":15,"verse":17,"text":"Do you not understand that everything entering the mouth goes into the stomach and is expelled into the latrine?","status":"source_text","id":"mat-15-17"},{"book":"mat","chapter":15,"verse":18,"text":"But the things coming out of the mouth come from the heart, and these defile a person.","status":"source_text","id":"mat-15-18"},{"book":"mat","chapter":15,"verse":19,"text":"For out of the heart come evil thoughts, murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.","status":"source_text","id":"mat-15-19"},{"book":"mat","chapter":15,"verse":20,"text":"These are the things that defile a person; but eating with unwashed hands does not defile a person.”","status":"source_text","id":"mat-15-20"},{"book":"mat","chapter":15,"verse":21,"text":"And Jesus went away from there and withdrew into the region of Tyre and Sidon.","status":"source_text","id":"mat-15-21"},{"book":"mat","chapter":15,"verse":22,"text":"And behold, a Canaanite woman from that region came out and cried, “Have mercy on me, Lord, Son of David! My daughter is severely demon-possessed.”","status":"source_text","id":"mat-15-22"},{"book":"mat","chapter":15,"verse":23,"text":"But He did not answer her a word. His disciples came and urged Him, saying, “Send her away, because she keeps crying out behind us.”","status":"source_text","id":"mat-15-23"},{"book":"mat","chapter":15,"verse":24,"text":"He answered, “I was sent only to the lost sheep of the house of Israel.”","status":"source_text","id":"mat-15-24"},{"book":"mat","chapter":15,"verse":25,"text":"But she came and bowed before Him, saying, “Lord, help me.”","status":"source_text","id":"mat-15-25"},{"book":"mat","chapter":15,"verse":26,"text":"He answered, “It is not good to take the children’s bread and throw it to the little dogs.”","status":"source_text","id":"mat-15-26"},{"book":"mat","chapter":15,"verse":27,"text":"She said, “Yes, Lord, yet even the little dogs eat the crumbs that fall from their masters’ table.”","status":"source_text","id":"mat-15-27"},{"book":"mat","chapter":15,"verse":28,"text":"Then Jesus answered her, “Woman, great is your faith! Let it be done for you as you desire.” And her daughter was healed from that hour.","status":"source_text","id":"mat-15-28"},{"book":"mat","chapter":15,"verse":29,"text":"Jesus departed from there and came beside the Sea of Galilee; and going up on the mountain, He sat there.","status":"source_text","id":"mat-15-29"},{"book":"mat","chapter":15,"verse":30,"text":"Large crowds came to Him, bringing with them the lame, blind, crippled, mute, and many others. They laid them at His feet, and He healed them.","status":"source_text","id":"mat-15-30"},{"book":"mat","chapter":15,"verse":31,"text":"So the crowd marveled when they saw the mute speaking, the crippled restored, the lame walking, and the blind seeing; and they glorified the God of Israel.","status":"source_text","id":"mat-15-31"},{"book":"mat","chapter":15,"verse":32,"text":"Jesus called His disciples to Him and said, “I am moved with compassion for the crowd, because they have remained with Me three days already and have nothing to eat. I do not want to send them away hungry, lest they faint on the way.”","status":"source_text","id":"mat-15-32"},{"book":"mat","chapter":15,"verse":33,"text":"The disciples said to Him, “Where in this deserted place could we get so many loaves as to satisfy such a large crowd?”","status":"source_text","id":"mat-15-33"},{"book":"mat","chapter":15,"verse":34,"text":"Jesus said to them, “How many loaves do you have?” They said, “Seven, and a few small fish.”","status":"source_text","id":"mat-15-34"},{"book":"mat","chapter":15,"verse":35,"text":"And He commanded the crowd to sit down on the ground.","status":"source_text","id":"mat-15-35"},{"book":"mat","chapter":15,"verse":36,"text":"Taking the seven loaves and the fish, He gave thanks, broke them, and gave them to the disciples, and the disciples gave them to the crowds.","status":"source_text","id":"mat-15-36"},{"book":"mat","chapter":15,"verse":37,"text":"They all ate and were satisfied; and they picked up seven baskets full of the broken pieces that remained.","status":"source_text","id":"mat-15-37"},{"book":"mat","chapter":15,"verse":38,"text":"Those who ate were four thousand men, besides women and children.","status":"source_text","id":"mat-15-38"},{"book":"mat","chapter":15,"verse":39,"text":"And after sending the crowds away, He got into the boat and went to the region of Magadan.","status":"source_text","id":"mat-15-39"},{"book":"mat","chapter":16,"verse":1,"text":"The Pharisees and Sadducees came and, testing Him, asked Him to show them a sign from heaven.","status":"source_text","id":"mat-16-1"},{"book":"mat","chapter":16,"verse":2,"text":"He answered them, “When evening comes, you say, ‘It will be fair weather, for the sky is red,’","status":"source_text","id":"mat-16-2"},{"book":"mat","chapter":16,"verse":3,"text":"and in the morning, ‘Today it will be stormy, for the sky is red and overcast.’ You know how to discern the appearance of the sky, but can you not discern the signs of the times?","status":"source_text","id":"mat-16-3"},{"book":"mat","chapter":16,"verse":4,"text":"An evil and adulterous generation seeks a sign, but no sign will be given to it except the sign of Jonah.” And He left them and went away.","status":"source_text","id":"mat-16-4"},{"book":"mat","chapter":16,"verse":5,"text":"When the disciples reached the other side, they had forgotten to bring bread.","status":"source_text","id":"mat-16-5"},{"book":"mat","chapter":16,"verse":6,"text":"Jesus said to them, “Watch out and beware of the leaven of the Pharisees and Sadducees.”","status":"source_text","id":"mat-16-6"},{"book":"mat","chapter":16,"verse":7,"text":"They reasoned among themselves, saying, “It is because we brought no bread.”","status":"source_text","id":"mat-16-7"},{"book":"mat","chapter":16,"verse":8,"text":"Knowing this, Jesus said, “You of little faith, why are you reasoning among yourselves because you have no bread?","status":"source_text","id":"mat-16-8"},{"book":"mat","chapter":16,"verse":9,"text":"Do you still not understand? Do you not remember the five loaves for the five thousand, and how many baskets you gathered?","status":"source_text","id":"mat-16-9"},{"book":"mat","chapter":16,"verse":10,"text":"Or the seven loaves for the four thousand, and how many baskets you gathered?","status":"source_text","id":"mat-16-10"},{"book":"mat","chapter":16,"verse":11,"text":"How is it that you do not understand that I was not speaking to you about bread? But beware of the leaven of the Pharisees and Sadducees.”","status":"source_text","id":"mat-16-11"},{"book":"mat","chapter":16,"verse":12,"text":"Then they understood that He had not told them to beware of the leaven of bread, but of the teaching of the Pharisees and Sadducees.","status":"source_text","id":"mat-16-12"},{"book":"mat","chapter":16,"verse":13,"text":"When Jesus came into the region of Caesarea Philippi, He asked His disciples, “Who do people say that the Son of Man is?”","status":"source_text","id":"mat-16-13"},{"book":"mat","chapter":16,"verse":14,"text":"They said, “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”","status":"source_text","id":"mat-16-14"},{"book":"mat","chapter":16,"verse":15,"text":"He said to them, “But who do you say that I am?”","status":"source_text","id":"mat-16-15"},{"book":"mat","chapter":16,"verse":16,"text":"Simon Peter answered, “You are the Christ, the Son of the living God.”","status":"source_text","id":"mat-16-16"},{"book":"mat","chapter":16,"verse":17,"text":"Jesus answered him, “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you, but My Father who is in heaven.","status":"source_text","id":"mat-16-17"},{"book":"mat","chapter":16,"verse":18,"text":"And I also say to you that you are Peter, and upon this rock I will build My assembly [also: church], and the gates of Hades will not prevail against it.","status":"source_text","id":"mat-16-18"},{"book":"mat","chapter":16,"verse":19,"text":"I will give you the keys of the kingdom of the heavens; whatever you bind on earth will have been bound in the heavens, and whatever you loose on earth will have been loosed in the heavens.”","status":"source_text","id":"mat-16-19"},{"book":"mat","chapter":16,"verse":20,"text":"Then He strictly commanded the disciples to tell no one that He was the Christ.","status":"source_text","id":"mat-16-20"},{"book":"mat","chapter":16,"verse":21,"text":"From that time Jesus began to show His disciples that He must go to Jerusalem, suffer many things from the elders, chief priests, and scribes, be killed, and on the third day be raised.","status":"source_text","id":"mat-16-21"},{"book":"mat","chapter":16,"verse":22,"text":"Peter took Him aside and began to rebuke Him, saying, “Far be it from You, Lord! This shall never happen to You!”","status":"source_text","id":"mat-16-22"},{"book":"mat","chapter":16,"verse":23,"text":"But He turned and said to Peter, “Get behind Me, Satan! You are a stumbling block to Me, because you are not setting your mind on the things of God, but on the things of people.”","status":"source_text","id":"mat-16-23"},{"book":"mat","chapter":16,"verse":24,"text":"Then Jesus said to His disciples, “If anyone wants to come after Me, let him deny himself, take up his cross, and follow Me.","status":"source_text","id":"mat-16-24"},{"book":"mat","chapter":16,"verse":25,"text":"For whoever wants to save his life will lose it, but whoever loses his life because of Me will find it.","status":"source_text","id":"mat-16-25"},{"book":"mat","chapter":16,"verse":26,"text":"For what will it benefit a person if he gains the whole world but forfeits his life? Or what will a person give in exchange for his life?","status":"source_text","id":"mat-16-26"},{"book":"mat","chapter":16,"verse":27,"text":"For the Son of Man is going to come in the glory of His Father with His angels, and then He will repay each person according to his deeds.","status":"source_text","id":"mat-16-27"},{"book":"mat","chapter":16,"verse":28,"text":"Truly I say to you, there are some standing here who will certainly not taste death until they see the Son of Man coming in His kingdom.”","status":"source_text","id":"mat-16-28"},{"book":"mat","chapter":17,"verse":1,"text":"Six days later Jesus took Peter, James, and John his brother and brought them up a high mountain by themselves.","status":"source_text","id":"mat-17-1"},{"book":"mat","chapter":17,"verse":2,"text":"And He was transfigured before them; His face shone like the sun, and His garments became white as the light.","status":"source_text","id":"mat-17-2"},{"book":"mat","chapter":17,"verse":3,"text":"And behold, Moses and Elijah appeared to them, talking with Him.","status":"source_text","id":"mat-17-3"},{"book":"mat","chapter":17,"verse":4,"text":"Peter said to Jesus, “Lord, it is good for us to be here. If You wish, I will make three shelters here: one for You, one for Moses, and one for Elijah.”","status":"source_text","id":"mat-17-4"},{"book":"mat","chapter":17,"verse":5,"text":"While he was still speaking, behold, a bright cloud overshadowed them, and a voice from the cloud said, “This is My beloved Son, in whom I delight. Listen to Him!”","status":"source_text","id":"mat-17-5"},{"book":"mat","chapter":17,"verse":6,"text":"When the disciples heard this, they fell facedown and were greatly afraid.","status":"source_text","id":"mat-17-6"},{"book":"mat","chapter":17,"verse":7,"text":"Jesus came and touched them, saying, “Rise, and do not be afraid.”","status":"source_text","id":"mat-17-7"},{"book":"mat","chapter":17,"verse":8,"text":"When they lifted up their eyes, they saw no one except Jesus Himself.","status":"source_text","id":"mat-17-8"},{"book":"mat","chapter":17,"verse":9,"text":"As they were coming down from the mountain, Jesus commanded them, “Tell the vision to no one until the Son of Man is raised from the dead.”","status":"source_text","id":"mat-17-9"},{"book":"mat","chapter":17,"verse":10,"text":"The disciples asked Him, “Why then do the scribes say that Elijah must come first?”","status":"source_text","id":"mat-17-10"},{"book":"mat","chapter":17,"verse":11,"text":"He answered, “Elijah indeed comes and will restore all things.","status":"source_text","id":"mat-17-11"},{"book":"mat","chapter":17,"verse":12,"text":"But I tell you that Elijah has already come, and they did not recognize him but did to him whatever they wished. So also the Son of Man is about to suffer at their hands.”","status":"source_text","id":"mat-17-12"},{"book":"mat","chapter":17,"verse":13,"text":"Then the disciples understood that He had spoken to them about John the Baptist.","status":"source_text","id":"mat-17-13"},{"book":"mat","chapter":17,"verse":14,"text":"When they came to the crowd, a man approached Him, kneeling before Him","status":"source_text","id":"mat-17-14"},{"book":"mat","chapter":17,"verse":15,"text":"and saying, “Lord, have mercy on my son, because he suffers severely from seizures; for he often falls into the fire and often into the water.","status":"source_text","id":"mat-17-15"},{"book":"mat","chapter":17,"verse":16,"text":"I brought him to Your disciples, but they could not heal him.”","status":"source_text","id":"mat-17-16"},{"book":"mat","chapter":17,"verse":17,"text":"Jesus answered, “O unbelieving and twisted generation! How long shall I be with you? How long shall I bear with you? Bring him here to Me.”","status":"source_text","id":"mat-17-17"},{"book":"mat","chapter":17,"verse":18,"text":"And Jesus rebuked the demon, and it came out of him; and the boy was healed from that hour.","status":"source_text","id":"mat-17-18"},{"book":"mat","chapter":17,"verse":19,"text":"Then the disciples came to Jesus privately and said, “Why could we not cast it out?”","status":"source_text","id":"mat-17-19"},{"book":"mat","chapter":17,"verse":20,"text":"He said to them, “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move; and nothing will be impossible for you.”","status":"source_text","id":"mat-17-20"},{"book":"mat","chapter":17,"verse":21,"text":"—","status":"absent_from_critical_text","id":"mat-17-21"},{"book":"mat","chapter":17,"verse":22,"text":"As they were gathering in Galilee, Jesus said to them, “The Son of Man is about to be handed over into the hands of people,","status":"source_text","id":"mat-17-22"},{"book":"mat","chapter":17,"verse":23,"text":"and they will kill Him, and on the third day He will be raised.” And they were deeply grieved.","status":"source_text","id":"mat-17-23"},{"book":"mat","chapter":17,"verse":24,"text":"When they came to Capernaum, those who collected the two-drachma temple tax came to Peter and said, “Does your teacher not pay the two drachmas?”","status":"source_text","id":"mat-17-24"},{"book":"mat","chapter":17,"verse":25,"text":"He said, “Yes.” When he entered the house, Jesus spoke first: “What do you think, Simon? From whom do the kings of the earth collect toll or tax—from their sons or from others?”","status":"source_text","id":"mat-17-25"},{"book":"mat","chapter":17,"verse":26,"text":"When he said, “From others,” Jesus said to him, “Then the sons are free.","status":"source_text","id":"mat-17-26"},{"book":"mat","chapter":17,"verse":27,"text":"But so that we may not cause them to stumble, go to the sea, cast a hook, and take the first fish that comes up. Open its mouth and you will find a stater. Take that and give it to them for Me and for yourself.”","status":"source_text","id":"mat-17-27"},{"book":"mat","chapter":18,"verse":1,"text":"At that time the disciples came to Jesus, saying, “Who then is greatest in the kingdom of the heavens?”","status":"source_text","id":"mat-18-1"},{"book":"mat","chapter":18,"verse":2,"text":"And calling a little child, He placed the child in their midst","status":"source_text","id":"mat-18-2"},{"book":"mat","chapter":18,"verse":3,"text":"and said, “Truly I say to you, unless you turn and become like little children, you will certainly not enter the kingdom of the heavens.","status":"source_text","id":"mat-18-3"},{"book":"mat","chapter":18,"verse":4,"text":"Therefore whoever humbles himself like this little child is the greatest in the kingdom of the heavens.","status":"source_text","id":"mat-18-4"},{"book":"mat","chapter":18,"verse":5,"text":"And whoever receives one such little child in My name receives Me.","status":"source_text","id":"mat-18-5"},{"book":"mat","chapter":18,"verse":6,"text":"But whoever causes one of these little ones who believe in Me to stumble, it would be better for him that a large millstone be hung around his neck and that he be drowned in the depth of the sea.","status":"source_text","id":"mat-18-6"},{"book":"mat","chapter":18,"verse":7,"text":"Woe to the world because of causes of stumbling! For it is necessary that causes of stumbling come, but woe to the person through whom the cause of stumbling comes!","status":"source_text","id":"mat-18-7"},{"book":"mat","chapter":18,"verse":8,"text":"If your hand or your foot causes you to stumble, cut it off and throw it away. It is better for you to enter life crippled or lame than to have two hands or two feet and be thrown into the eternal fire.","status":"source_text","id":"mat-18-8"},{"book":"mat","chapter":18,"verse":9,"text":"And if your eye causes you to stumble, tear it out and throw it away. It is better for you to enter life with one eye than to have two eyes and be thrown into the Gehenna of fire.","status":"source_text","id":"mat-18-9"},{"book":"mat","chapter":18,"verse":10,"text":"See that you do not despise one of these little ones, for I tell you that in heaven their angels always see the face of My Father who is in heaven.","status":"source_text","id":"mat-18-10"},{"book":"mat","chapter":18,"verse":11,"text":"—","status":"absent_from_critical_text","id":"mat-18-11"},{"book":"mat","chapter":18,"verse":12,"text":"What do you think? If a man has a hundred sheep and one of them goes astray, will he not leave the ninety-nine on the mountains and go seek the one that went astray?","status":"source_text","id":"mat-18-12"},{"book":"mat","chapter":18,"verse":13,"text":"And if he finds it, truly I say to you, he rejoices over it more than over the ninety-nine that did not go astray.","status":"source_text","id":"mat-18-13"},{"book":"mat","chapter":18,"verse":14,"text":"So it is not the will of your Father who is in heaven that one of these little ones should perish.","status":"source_text","id":"mat-18-14"},{"book":"mat","chapter":18,"verse":15,"text":"If your brother sins against you, go and show him his fault between you and him alone. If he listens to you, you have gained your brother.","status":"source_text","id":"mat-18-15"},{"book":"mat","chapter":18,"verse":16,"text":"But if he does not listen, take one or two more with you, so that every matter may be established by the mouth of two or three witnesses.","status":"source_text","id":"mat-18-16"},{"book":"mat","chapter":18,"verse":17,"text":"If he refuses to listen to them, tell it to the assembly [also: church]. And if he refuses to listen even to the assembly, let him be to you as a Gentile and a tax collector.","status":"source_text","id":"mat-18-17"},{"book":"mat","chapter":18,"verse":18,"text":"Truly I say to you, whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.","status":"source_text","id":"mat-18-18"},{"book":"mat","chapter":18,"verse":19,"text":"Again I say to you that if two of you agree on earth about anything they ask, it will be done for them by My Father who is in heaven.","status":"source_text","id":"mat-18-19"},{"book":"mat","chapter":18,"verse":20,"text":"For where two or three are gathered into My name, there I am in their midst.”","status":"source_text","id":"mat-18-20"},{"book":"mat","chapter":18,"verse":21,"text":"Then Peter came and said to Him, “Lord, how often will my brother sin against me and I forgive him? Up to seven times?”","status":"source_text","id":"mat-18-21"},{"book":"mat","chapter":18,"verse":22,"text":"Jesus said to him, “I do not say to you up to seven times, but up to seventy-seven times [or: seventy times seven].","status":"source_text","id":"mat-18-22"},{"book":"mat","chapter":18,"verse":23,"text":"Therefore the kingdom of the heavens may be compared to a king who wished to settle accounts with his servants.","status":"source_text","id":"mat-18-23"},{"book":"mat","chapter":18,"verse":24,"text":"When he began to settle them, one who owed ten thousand talents was brought to him.","status":"source_text","id":"mat-18-24"},{"book":"mat","chapter":18,"verse":25,"text":"Since he could not pay, the master ordered him to be sold, with his wife and children and all that he had, and payment to be made.","status":"source_text","id":"mat-18-25"},{"book":"mat","chapter":18,"verse":26,"text":"So the servant fell down and bowed before him, saying, ‘Be patient with me, and I will repay you everything.’","status":"source_text","id":"mat-18-26"},{"book":"mat","chapter":18,"verse":27,"text":"Moved with compassion, the master of that servant released him and forgave the debt.","status":"source_text","id":"mat-18-27"},{"book":"mat","chapter":18,"verse":28,"text":"But that servant went out and found one of his fellow servants who owed him a hundred denarii. He seized him and began choking him, saying, ‘Pay what you owe!’","status":"source_text","id":"mat-18-28"},{"book":"mat","chapter":18,"verse":29,"text":"So his fellow servant fell down and pleaded with him, saying, ‘Be patient with me, and I will repay you.’","status":"source_text","id":"mat-18-29"},{"book":"mat","chapter":18,"verse":30,"text":"But he was unwilling; instead, he went and threw him into prison until he should pay what was owed.","status":"source_text","id":"mat-18-30"},{"book":"mat","chapter":18,"verse":31,"text":"When his fellow servants saw what had happened, they were deeply grieved and went and reported to their master everything that had happened.","status":"source_text","id":"mat-18-31"},{"book":"mat","chapter":18,"verse":32,"text":"Then his master summoned him and said, ‘Evil servant! I forgave you all that debt because you pleaded with me.","status":"source_text","id":"mat-18-32"},{"book":"mat","chapter":18,"verse":33,"text":"Should you not also have shown mercy to your fellow servant, just as I showed mercy to you?’","status":"source_text","id":"mat-18-33"},{"book":"mat","chapter":18,"verse":34,"text":"And in anger his master handed him over to the tormentors until he should pay everything he owed.","status":"source_text","id":"mat-18-34"},{"book":"mat","chapter":18,"verse":35,"text":"So also My heavenly Father will do to you if each of you does not forgive his brother from your heart.”","status":"source_text","id":"mat-18-35"},{"book":"mat","chapter":19,"verse":1,"text":"When Jesus had finished these sayings, He departed from Galilee and went into the region of Judea beyond the Jordan.","status":"source_text","id":"mat-19-1"},{"book":"mat","chapter":19,"verse":2,"text":"Large crowds followed Him, and He healed them there.","status":"source_text","id":"mat-19-2"},{"book":"mat","chapter":19,"verse":3,"text":"Pharisees came to Him, testing Him and saying, “Is it lawful for a man to divorce his wife for any reason?”","status":"source_text","id":"mat-19-3"},{"book":"mat","chapter":19,"verse":4,"text":"He answered, “Have you not read that the Creator from the beginning made them male and female","status":"source_text","id":"mat-19-4"},{"book":"mat","chapter":19,"verse":5,"text":"and said, ‘For this reason a man shall leave his father and mother and be joined to his wife, and the two shall become one flesh’?","status":"source_text","id":"mat-19-5"},{"book":"mat","chapter":19,"verse":6,"text":"So they are no longer two, but one flesh. Therefore what God has joined together, let no one separate.”","status":"source_text","id":"mat-19-6"},{"book":"mat","chapter":19,"verse":7,"text":"They said to Him, “Why then did Moses command us to give a certificate of divorce and send her away?”","status":"source_text","id":"mat-19-7"},{"book":"mat","chapter":19,"verse":8,"text":"He said to them, “Because of your hardness of heart Moses allowed you to divorce your wives, but from the beginning it was not so.","status":"source_text","id":"mat-19-8"},{"book":"mat","chapter":19,"verse":9,"text":"And I tell you that whoever divorces his wife, except for sexual immorality, and marries another commits adultery.”","status":"source_text","id":"mat-19-9"},{"book":"mat","chapter":19,"verse":10,"text":"The disciples said to Him, “If such is the situation of a man with his wife, it is better not to marry.”","status":"source_text","id":"mat-19-10"},{"book":"mat","chapter":19,"verse":11,"text":"But He said to them, “Not everyone can receive this saying, but only those to whom it has been given.","status":"source_text","id":"mat-19-11"},{"book":"mat","chapter":19,"verse":12,"text":"For there are eunuchs who were born that way, and there are eunuchs who were made eunuchs by people, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of the heavens. Let the one who can receive this receive it.”","status":"source_text","id":"mat-19-12"},{"book":"mat","chapter":19,"verse":13,"text":"Then little children were brought to Him so that He might lay His hands on them and pray, but the disciples rebuked them.","status":"source_text","id":"mat-19-13"},{"book":"mat","chapter":19,"verse":14,"text":"Jesus said, “Allow the little children, and do not hinder them from coming to Me, for the kingdom of the heavens belongs to such as these.”","status":"source_text","id":"mat-19-14"},{"book":"mat","chapter":19,"verse":15,"text":"And after laying His hands on them, He departed from there.","status":"source_text","id":"mat-19-15"},{"book":"mat","chapter":19,"verse":16,"text":"And behold, a man came to Him and said, “Teacher, what good thing must I do that I may have eternal life?”","status":"source_text","id":"mat-19-16"},{"book":"mat","chapter":19,"verse":17,"text":"He said to him, “Why do you ask Me about what is good? There is One who is good. But if you want to enter life, keep the commandments.”","status":"source_text","id":"mat-19-17"},{"book":"mat","chapter":19,"verse":18,"text":"He said to Him, “Which ones?” Jesus said, “‘You shall not murder. You shall not commit adultery. You shall not steal. You shall not bear false witness.","status":"source_text","id":"mat-19-18"},{"book":"mat","chapter":19,"verse":19,"text":"Honor your father and mother,’ and, ‘You shall love your neighbor as yourself.’”","status":"source_text","id":"mat-19-19"},{"book":"mat","chapter":19,"verse":20,"text":"The young man said to Him, “I have kept all these. What do I still lack?”","status":"source_text","id":"mat-19-20"},{"book":"mat","chapter":19,"verse":21,"text":"Jesus said to him, “If you want to be complete [also: mature, whole], go, sell your possessions and give to the poor, and you will have treasure in heaven; and come, follow Me.”","status":"source_text","id":"mat-19-21"},{"book":"mat","chapter":19,"verse":22,"text":"But when the young man heard this word, he went away sorrowful, for he had many possessions.","status":"source_text","id":"mat-19-22"},{"book":"mat","chapter":19,"verse":23,"text":"Jesus said to His disciples, “Truly I say to you, it is difficult for a rich person to enter the kingdom of the heavens.","status":"source_text","id":"mat-19-23"},{"book":"mat","chapter":19,"verse":24,"text":"Again I tell you, it is easier for a camel to pass through the eye of a needle than for a rich person to enter the kingdom of God.”","status":"source_text","id":"mat-19-24"},{"book":"mat","chapter":19,"verse":25,"text":"When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”","status":"source_text","id":"mat-19-25"},{"book":"mat","chapter":19,"verse":26,"text":"Looking at them, Jesus said, “With people this is impossible, but with God all things are possible.”","status":"source_text","id":"mat-19-26"},{"book":"mat","chapter":19,"verse":27,"text":"Then Peter answered Him, “Behold, we have left everything and followed You. What then will there be for us?”","status":"source_text","id":"mat-19-27"},{"book":"mat","chapter":19,"verse":28,"text":"Jesus said to them, “Truly I say to you, in the renewal, when the Son of Man sits on the throne of His glory, you who have followed Me will also sit on twelve thrones, judging the twelve tribes of Israel.","status":"source_text","id":"mat-19-28"},{"book":"mat","chapter":19,"verse":29,"text":"And everyone who has left houses or brothers or sisters or father or mother or children or fields because of My name will receive a hundredfold and will inherit eternal life.","status":"source_text","id":"mat-19-29"},{"book":"mat","chapter":19,"verse":30,"text":"But many who are first will be last, and the last first.","status":"source_text","id":"mat-19-30"},{"book":"mat","chapter":20,"verse":1,"text":"For the kingdom of the heavens is like a master of a house who went out early in the morning to hire workers for his vineyard.","status":"source_text","id":"mat-20-1"},{"book":"mat","chapter":20,"verse":2,"text":"After agreeing with the workers for a denarius for the day, he sent them into his vineyard.","status":"source_text","id":"mat-20-2"},{"book":"mat","chapter":20,"verse":3,"text":"And going out about the third hour, he saw others standing idle in the marketplace.","status":"source_text","id":"mat-20-3"},{"book":"mat","chapter":20,"verse":4,"text":"He said to them, ‘You also go into the vineyard, and whatever is right I will give you.’ So they went.","status":"source_text","id":"mat-20-4"},{"book":"mat","chapter":20,"verse":5,"text":"Again he went out about the sixth and the ninth hour and did the same.","status":"source_text","id":"mat-20-5"},{"book":"mat","chapter":20,"verse":6,"text":"And about the eleventh hour he went out and found others standing there, and he said to them, ‘Why have you been standing here idle all day?’","status":"source_text","id":"mat-20-6"},{"book":"mat","chapter":20,"verse":7,"text":"They said to him, ‘Because no one hired us.’ He said to them, ‘You also go into the vineyard.’","status":"source_text","id":"mat-20-7"},{"book":"mat","chapter":20,"verse":8,"text":"When evening came, the owner of the vineyard said to his manager, ‘Call the workers and pay them their wages, beginning with the last and going to the first.’","status":"source_text","id":"mat-20-8"},{"book":"mat","chapter":20,"verse":9,"text":"Those hired about the eleventh hour came and each received a denarius.","status":"source_text","id":"mat-20-9"},{"book":"mat","chapter":20,"verse":10,"text":"When the first came, they thought they would receive more, but they too each received a denarius.","status":"source_text","id":"mat-20-10"},{"book":"mat","chapter":20,"verse":11,"text":"When they received it, they began grumbling against the master of the house,","status":"source_text","id":"mat-20-11"},{"book":"mat","chapter":20,"verse":12,"text":"saying, ‘These last worked only one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’","status":"source_text","id":"mat-20-12"},{"book":"mat","chapter":20,"verse":13,"text":"But he answered one of them, ‘Friend, I am doing you no wrong. Did you not agree with me for a denarius?","status":"source_text","id":"mat-20-13"},{"book":"mat","chapter":20,"verse":14,"text":"Take what is yours and go. I want to give to this last one the same as I give to you.","status":"source_text","id":"mat-20-14"},{"book":"mat","chapter":20,"verse":15,"text":"Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am generous?’","status":"source_text","id":"mat-20-15"},{"book":"mat","chapter":20,"verse":16,"text":"So the last will be first, and the first last.","status":"source_text","id":"mat-20-16"},{"book":"mat","chapter":20,"verse":17,"text":"As Jesus was going up to Jerusalem, He took the twelve disciples aside by themselves, and on the way He said to them,","status":"source_text","id":"mat-20-17"},{"book":"mat","chapter":20,"verse":18,"text":"“Behold, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn Him to death.","status":"source_text","id":"mat-20-18"},{"book":"mat","chapter":20,"verse":19,"text":"They will hand Him over to the Gentiles to mock and flog and crucify Him, and on the third day He will be raised.”","status":"source_text","id":"mat-20-19"},{"book":"mat","chapter":20,"verse":20,"text":"Then the mother of the sons of Zebedee came to Him with her sons, bowing before Him and asking something from Him.","status":"source_text","id":"mat-20-20"},{"book":"mat","chapter":20,"verse":21,"text":"He said to her, “What do you want?” She said to Him, “Say that these two sons of mine may sit, one at Your right and one at Your left, in Your kingdom.”","status":"source_text","id":"mat-20-21"},{"book":"mat","chapter":20,"verse":22,"text":"Jesus answered, “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to Him, “We are able.”","status":"source_text","id":"mat-20-22"},{"book":"mat","chapter":20,"verse":23,"text":"He said to them, “You will indeed drink My cup, but to sit at My right and at My left is not Mine to give, except to those for whom it has been prepared by My Father.”","status":"source_text","id":"mat-20-23"},{"book":"mat","chapter":20,"verse":24,"text":"When the ten heard this, they were indignant with the two brothers.","status":"source_text","id":"mat-20-24"},{"book":"mat","chapter":20,"verse":25,"text":"But Jesus called them to Himself and said, “You know that the rulers of the Gentiles lord it over them, and their great ones exercise authority over them.","status":"source_text","id":"mat-20-25"},{"book":"mat","chapter":20,"verse":26,"text":"It shall not be so among you. Rather, whoever wants to become great among you shall be your servant,","status":"source_text","id":"mat-20-26"},{"book":"mat","chapter":20,"verse":27,"text":"and whoever wants to be first among you shall be your slave,","status":"source_text","id":"mat-20-27"},{"book":"mat","chapter":20,"verse":28,"text":"just as the Son of Man came not to be served but to serve, and to give His life as a ransom in place of many.”","status":"source_text","id":"mat-20-28"},{"book":"mat","chapter":20,"verse":29,"text":"As they went out from Jericho, a large crowd followed Him.","status":"source_text","id":"mat-20-29"},{"book":"mat","chapter":20,"verse":30,"text":"And behold, two blind men sitting beside the road, when they heard that Jesus was passing by, cried out, “Lord, Son of David, have mercy on us!”","status":"source_text","id":"mat-20-30"},{"book":"mat","chapter":20,"verse":31,"text":"The crowd rebuked them so that they would be silent, but they cried out all the more, “Lord, Son of David, have mercy on us!”","status":"source_text","id":"mat-20-31"},{"book":"mat","chapter":20,"verse":32,"text":"Jesus stopped, called them, and said, “What do you want Me to do for you?”","status":"source_text","id":"mat-20-32"},{"book":"mat","chapter":20,"verse":33,"text":"They said to Him, “Lord, let our eyes be opened.”","status":"source_text","id":"mat-20-33"},{"book":"mat","chapter":20,"verse":34,"text":"Moved with compassion, Jesus touched their eyes, and immediately they received their sight and followed Him.","status":"source_text","id":"mat-20-34"},{"book":"mat","chapter":21,"verse":1,"text":"When they drew near to Jerusalem and came to Bethphage on the Mount of Olives, Jesus sent two disciples,","status":"source_text","id":"mat-21-1"},{"book":"mat","chapter":21,"verse":2,"text":"saying to them, “Go into the village opposite you, and immediately you will find a donkey tied and a colt with her. Untie them and bring them to Me.","status":"source_text","id":"mat-21-2"},{"book":"mat","chapter":21,"verse":3,"text":"If anyone says anything to you, you shall say, ‘The Lord needs them,’ and he will send them at once.”","status":"source_text","id":"mat-21-3"},{"book":"mat","chapter":21,"verse":4,"text":"This took place so that what was spoken through the prophet might be fulfilled:","status":"source_text","id":"mat-21-4"},{"book":"mat","chapter":21,"verse":5,"text":"“Say to the daughter of Zion, ‘Behold, your King is coming to you, gentle and mounted on a donkey, and on a colt, the foal of a beast of burden.’”","status":"source_text","id":"mat-21-5"},{"book":"mat","chapter":21,"verse":6,"text":"The disciples went and did just as Jesus had directed them.","status":"source_text","id":"mat-21-6"},{"book":"mat","chapter":21,"verse":7,"text":"They brought the donkey and the colt, laid their garments on them, and He sat on them.","status":"source_text","id":"mat-21-7"},{"book":"mat","chapter":21,"verse":8,"text":"A very large crowd spread their garments on the road, while others cut branches from the trees and spread them on the road.","status":"source_text","id":"mat-21-8"},{"book":"mat","chapter":21,"verse":9,"text":"The crowds going before Him and those following were crying out, “Hosanna to the Son of David! Blessed is the One who comes in the name of the Lord! Hosanna in the highest!”","status":"source_text","id":"mat-21-9"},{"book":"mat","chapter":21,"verse":10,"text":"When He entered Jerusalem, the whole city was stirred, saying, “Who is this?”","status":"source_text","id":"mat-21-10"},{"book":"mat","chapter":21,"verse":11,"text":"The crowds were saying, “This is the prophet Jesus, from Nazareth of Galilee.”","status":"source_text","id":"mat-21-11"},{"book":"mat","chapter":21,"verse":12,"text":"Jesus entered the temple and drove out all who were buying and selling in the temple. He overturned the tables of the money changers and the seats of those selling doves.","status":"source_text","id":"mat-21-12"},{"book":"mat","chapter":21,"verse":13,"text":"And He said to them, “It is written, ‘My house shall be called a house of prayer,’ but you are making it a den of robbers.”","status":"source_text","id":"mat-21-13"},{"book":"mat","chapter":21,"verse":14,"text":"The blind and the lame came to Him in the temple, and He healed them.","status":"source_text","id":"mat-21-14"},{"book":"mat","chapter":21,"verse":15,"text":"But when the chief priests and the scribes saw the marvelous things He did and the children crying out in the temple, “Hosanna to the Son of David!” they were indignant.","status":"source_text","id":"mat-21-15"},{"book":"mat","chapter":21,"verse":16,"text":"They said to Him, “Do You hear what these are saying?” Jesus said to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies You have prepared praise’?”","status":"source_text","id":"mat-21-16"},{"book":"mat","chapter":21,"verse":17,"text":"And leaving them, He went out of the city to Bethany and spent the night there.","status":"source_text","id":"mat-21-17"},{"book":"mat","chapter":21,"verse":18,"text":"Early in the morning, as He returned to the city, He became hungry.","status":"source_text","id":"mat-21-18"},{"book":"mat","chapter":21,"verse":19,"text":"Seeing a fig tree by the road, He went to it and found nothing on it except leaves. He said to it, “May no fruit ever come from you again.” And the fig tree withered at once.","status":"source_text","id":"mat-21-19"},{"book":"mat","chapter":21,"verse":20,"text":"When the disciples saw it, they marveled, saying, “How did the fig tree wither at once?”","status":"source_text","id":"mat-21-20"},{"book":"mat","chapter":21,"verse":21,"text":"Jesus answered them, “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be lifted up and thrown into the sea,’ it will happen.","status":"source_text","id":"mat-21-21"},{"book":"mat","chapter":21,"verse":22,"text":"And whatever you ask in prayer, believing, you will receive.”","status":"source_text","id":"mat-21-22"},{"book":"mat","chapter":21,"verse":23,"text":"When He entered the temple, the chief priests and the elders of the people came to Him as He was teaching and said, “By what authority are You doing these things, and who gave You this authority?”","status":"source_text","id":"mat-21-23"},{"book":"mat","chapter":21,"verse":24,"text":"Jesus answered them, “I also will ask you one question. If you tell Me, I too will tell you by what authority I do these things.","status":"source_text","id":"mat-21-24"},{"book":"mat","chapter":21,"verse":25,"text":"The baptism of John—where was it from? From heaven or from people?” They reasoned among themselves, saying, “If we say, ‘From heaven,’ He will say to us, ‘Why then did you not believe him?’","status":"source_text","id":"mat-21-25"},{"book":"mat","chapter":21,"verse":26,"text":"But if we say, ‘From people,’ we fear the crowd, for they all regard John as a prophet.”","status":"source_text","id":"mat-21-26"},{"book":"mat","chapter":21,"verse":27,"text":"So they answered Jesus, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.","status":"source_text","id":"mat-21-27"},{"book":"mat","chapter":21,"verse":28,"text":"“But what do you think? A man had two sons. He went to the first and said, ‘Son, go work in the vineyard today.’","status":"source_text","id":"mat-21-28"},{"book":"mat","chapter":21,"verse":29,"text":"He answered, ‘I will not,’ but afterward he changed his mind and went.","status":"source_text","id":"mat-21-29"},{"book":"mat","chapter":21,"verse":30,"text":"The man went to the second and said the same. He answered, ‘I will, sir,’ but did not go.","status":"source_text","id":"mat-21-30"},{"book":"mat","chapter":21,"verse":31,"text":"Which of the two did the will of his father?” They said, “The first.” Jesus said to them, “Truly I say to you, tax collectors and prostitutes are entering the kingdom of God ahead of you.","status":"source_text","id":"mat-21-31"},{"book":"mat","chapter":21,"verse":32,"text":"For John came to you in the way of righteousness, and you did not believe him, but the tax collectors and prostitutes believed him. Yet even after seeing this, you did not afterward change your minds and believe him.","status":"source_text","id":"mat-21-32"},{"book":"mat","chapter":21,"verse":33,"text":"“Hear another parable. There was a master of a house who planted a vineyard, put a fence around it, dug a winepress in it, and built a tower. He leased it to tenant farmers and went away.","status":"source_text","id":"mat-21-33"},{"book":"mat","chapter":21,"verse":34,"text":"When the season for the fruit drew near, he sent his servants to the farmers to receive his fruit.","status":"source_text","id":"mat-21-34"},{"book":"mat","chapter":21,"verse":35,"text":"But the farmers took his servants; one they beat, another they killed, and another they stoned.","status":"source_text","id":"mat-21-35"},{"book":"mat","chapter":21,"verse":36,"text":"Again he sent other servants, more than the first, and they did the same to them.","status":"source_text","id":"mat-21-36"},{"book":"mat","chapter":21,"verse":37,"text":"Finally he sent his son to them, saying, ‘They will respect my son.’","status":"source_text","id":"mat-21-37"},{"book":"mat","chapter":21,"verse":38,"text":"But when the farmers saw the son, they said among themselves, ‘This is the heir. Come, let us kill him and take his inheritance.’","status":"source_text","id":"mat-21-38"},{"book":"mat","chapter":21,"verse":39,"text":"So they took him, threw him out of the vineyard, and killed him.","status":"source_text","id":"mat-21-39"},{"book":"mat","chapter":21,"verse":40,"text":"When therefore the owner of the vineyard comes, what will he do to those farmers?”","status":"source_text","id":"mat-21-40"},{"book":"mat","chapter":21,"verse":41,"text":"They said to Him, “He will miserably destroy those evil men and lease the vineyard to other farmers who will give him the fruits in their seasons.”","status":"source_text","id":"mat-21-41"},{"book":"mat","chapter":21,"verse":42,"text":"Jesus said to them, “Have you never read in the Scriptures, ‘The stone the builders rejected has become the head of the corner. This came from the Lord, and it is marvelous in our eyes’?","status":"source_text","id":"mat-21-42"},{"book":"mat","chapter":21,"verse":43,"text":"Therefore I tell you that the kingdom of God will be taken away from you and given to a people producing its fruits.","status":"source_text","id":"mat-21-43"},{"book":"mat","chapter":21,"verse":44,"text":"The one who falls on this stone will be broken to pieces, and on whomever it falls, it will crush him.”","status":"source_text","id":"mat-21-44"},{"book":"mat","chapter":21,"verse":45,"text":"When the chief priests and the Pharisees heard His parables, they knew that He was speaking about them.","status":"source_text","id":"mat-21-45"},{"book":"mat","chapter":21,"verse":46,"text":"They sought to seize Him, but they feared the crowds, because the people regarded Him as a prophet.","status":"source_text","id":"mat-21-46"},{"book":"mat","chapter":22,"verse":1,"text":"Jesus spoke to them again in parables, saying,","status":"source_text","id":"mat-22-1"},{"book":"mat","chapter":22,"verse":2,"text":"“The kingdom of the heavens may be compared to a king who prepared a wedding feast for his son.","status":"source_text","id":"mat-22-2"},{"book":"mat","chapter":22,"verse":3,"text":"He sent his servants to call those who had been invited to the wedding feast, but they were unwilling to come.","status":"source_text","id":"mat-22-3"},{"book":"mat","chapter":22,"verse":4,"text":"Again he sent other servants, saying, ‘Tell those who are invited: Behold, I have prepared my banquet; my oxen and fattened animals have been slaughtered, and everything is ready. Come to the wedding feast.’","status":"source_text","id":"mat-22-4"},{"book":"mat","chapter":22,"verse":5,"text":"But they paid no attention and went away, one to his own field and another to his business.","status":"source_text","id":"mat-22-5"},{"book":"mat","chapter":22,"verse":6,"text":"The rest seized his servants, mistreated them, and killed them.","status":"source_text","id":"mat-22-6"},{"book":"mat","chapter":22,"verse":7,"text":"The king was enraged. He sent his armies, destroyed those murderers, and burned their city.","status":"source_text","id":"mat-22-7"},{"book":"mat","chapter":22,"verse":8,"text":"Then he said to his servants, ‘The wedding feast is ready, but those invited were not worthy.","status":"source_text","id":"mat-22-8"},{"book":"mat","chapter":22,"verse":9,"text":"Therefore go to the outlets of the roads and invite to the wedding feast as many as you find.’","status":"source_text","id":"mat-22-9"},{"book":"mat","chapter":22,"verse":10,"text":"Those servants went out into the roads and gathered everyone they found, both evil and good, and the wedding hall was filled with guests.","status":"source_text","id":"mat-22-10"},{"book":"mat","chapter":22,"verse":11,"text":"When the king came in to see the guests, he saw there a man who was not wearing a wedding garment.","status":"source_text","id":"mat-22-11"},{"book":"mat","chapter":22,"verse":12,"text":"He said to him, ‘Friend, how did you come in here without a wedding garment?’ And he was speechless.","status":"source_text","id":"mat-22-12"},{"book":"mat","chapter":22,"verse":13,"text":"Then the king said to the servants, ‘Bind his hands and feet and throw him into the outer darkness. There will be weeping and grinding of teeth.’","status":"source_text","id":"mat-22-13"},{"book":"mat","chapter":22,"verse":14,"text":"For many are called, but few are chosen.”","status":"source_text","id":"mat-22-14"},{"book":"mat","chapter":22,"verse":15,"text":"Then the Pharisees went and plotted how they might trap Him in His words.","status":"source_text","id":"mat-22-15"},{"book":"mat","chapter":22,"verse":16,"text":"They sent their disciples to Him with the Herodians, saying, “Teacher, we know that You are truthful and teach the way of God in truth, and You are not concerned about anyone, for You do not look at the face of people.","status":"source_text","id":"mat-22-16"},{"book":"mat","chapter":22,"verse":17,"text":"Tell us then, what do You think? Is it lawful to pay the poll tax to Caesar, or not?”","status":"source_text","id":"mat-22-17"},{"book":"mat","chapter":22,"verse":18,"text":"But Jesus, knowing their evil intent, said, “Why do you test Me, hypocrites?","status":"source_text","id":"mat-22-18"},{"book":"mat","chapter":22,"verse":19,"text":"Show Me the coin used for the tax.” And they brought Him a denarius.","status":"source_text","id":"mat-22-19"},{"book":"mat","chapter":22,"verse":20,"text":"He said to them, “Whose image and inscription is this?”","status":"source_text","id":"mat-22-20"},{"book":"mat","chapter":22,"verse":21,"text":"They said, “Caesar’s.” Then He said to them, “Therefore give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”","status":"source_text","id":"mat-22-21"},{"book":"mat","chapter":22,"verse":22,"text":"When they heard this, they marveled, and leaving Him, they went away.","status":"source_text","id":"mat-22-22"},{"book":"mat","chapter":22,"verse":23,"text":"That same day Sadducees, who say there is no resurrection, came to Him and questioned Him,","status":"source_text","id":"mat-22-23"},{"book":"mat","chapter":22,"verse":24,"text":"saying, “Teacher, Moses said, ‘If a man dies having no children, his brother shall marry his wife and raise up offspring for his brother.’","status":"source_text","id":"mat-22-24"},{"book":"mat","chapter":22,"verse":25,"text":"Now there were seven brothers among us. The first married and died, and having no offspring, he left his wife to his brother.","status":"source_text","id":"mat-22-25"},{"book":"mat","chapter":22,"verse":26,"text":"So also the second and the third, down to the seventh.","status":"source_text","id":"mat-22-26"},{"book":"mat","chapter":22,"verse":27,"text":"Last of all, the woman died.","status":"source_text","id":"mat-22-27"},{"book":"mat","chapter":22,"verse":28,"text":"In the resurrection, therefore, whose wife of the seven will she be? For they all had her.”","status":"source_text","id":"mat-22-28"},{"book":"mat","chapter":22,"verse":29,"text":"Jesus answered them, “You are mistaken because you know neither the Scriptures nor the power of God.","status":"source_text","id":"mat-22-29"},{"book":"mat","chapter":22,"verse":30,"text":"For in the resurrection they neither marry nor are given in marriage, but are like angels in heaven.","status":"source_text","id":"mat-22-30"},{"book":"mat","chapter":22,"verse":31,"text":"But concerning the resurrection of the dead, have you not read what was spoken to you by God:","status":"source_text","id":"mat-22-31"},{"book":"mat","chapter":22,"verse":32,"text":"‘I am the God of Abraham and the God of Isaac and the God of Jacob’? He is not the God of the dead, but of the living.”","status":"source_text","id":"mat-22-32"},{"book":"mat","chapter":22,"verse":33,"text":"When the crowds heard this, they were astonished at His teaching.","status":"source_text","id":"mat-22-33"},{"book":"mat","chapter":22,"verse":34,"text":"But when the Pharisees heard that He had silenced the Sadducees, they gathered together.","status":"source_text","id":"mat-22-34"},{"book":"mat","chapter":22,"verse":35,"text":"And one of them, a lawyer, asked Him a question, testing Him:","status":"source_text","id":"mat-22-35"},{"book":"mat","chapter":22,"verse":36,"text":"“Teacher, which commandment is great in the Law?”","status":"source_text","id":"mat-22-36"},{"book":"mat","chapter":22,"verse":37,"text":"He said to him, “‘You shall love the Lord your God with all your heart and with all your soul and with all your mind.’","status":"source_text","id":"mat-22-37"},{"book":"mat","chapter":22,"verse":38,"text":"This is the great and first commandment.","status":"source_text","id":"mat-22-38"},{"book":"mat","chapter":22,"verse":39,"text":"And the second is like it: ‘You shall love your neighbor as yourself.’","status":"source_text","id":"mat-22-39"},{"book":"mat","chapter":22,"verse":40,"text":"On these two commandments hang the whole Law and the Prophets.”","status":"source_text","id":"mat-22-40"},{"book":"mat","chapter":22,"verse":41,"text":"Now while the Pharisees were gathered together, Jesus asked them,","status":"source_text","id":"mat-22-41"},{"book":"mat","chapter":22,"verse":42,"text":"“What do you think about the Christ? Whose son is He?” They said to Him, “David’s.”","status":"source_text","id":"mat-22-42"},{"book":"mat","chapter":22,"verse":43,"text":"He said to them, “How then does David in the Spirit call Him Lord, saying,","status":"source_text","id":"mat-22-43"},{"book":"mat","chapter":22,"verse":44,"text":"‘The Lord said to my Lord, “Sit at My right hand until I put Your enemies under Your feet”’?","status":"source_text","id":"mat-22-44"},{"book":"mat","chapter":22,"verse":45,"text":"If David calls Him Lord, how is He his son?”","status":"source_text","id":"mat-22-45"},{"book":"mat","chapter":22,"verse":46,"text":"No one was able to answer Him a word, nor did anyone dare from that day to question Him any further.","status":"source_text","id":"mat-22-46"},{"book":"mat","chapter":23,"verse":1,"text":"Then Jesus spoke to the crowds and to His disciples,","status":"source_text","id":"mat-23-1"},{"book":"mat","chapter":23,"verse":2,"text":"saying, “The scribes and the Pharisees sit in Moses’ seat.","status":"source_text","id":"mat-23-2"},{"book":"mat","chapter":23,"verse":3,"text":"Therefore do and keep whatever they tell you, but do not do according to their works, for they say and do not do.","status":"source_text","id":"mat-23-3"},{"book":"mat","chapter":23,"verse":4,"text":"They tie up heavy burdens, hard to bear, and lay them on people’s shoulders, but they themselves are unwilling to move them with their finger.","status":"source_text","id":"mat-23-4"},{"book":"mat","chapter":23,"verse":5,"text":"They do all their works to be seen by people. They broaden their phylacteries and lengthen the fringes of their garments.","status":"source_text","id":"mat-23-5"},{"book":"mat","chapter":23,"verse":6,"text":"They love the place of honor at banquets and the best seats in the synagogues,","status":"source_text","id":"mat-23-6"},{"book":"mat","chapter":23,"verse":7,"text":"greetings in the marketplaces, and being called ‘Rabbi’ by people.","status":"source_text","id":"mat-23-7"},{"book":"mat","chapter":23,"verse":8,"text":"But you are not to be called ‘Rabbi,’ for One is your Teacher, and you are all brothers.","status":"source_text","id":"mat-23-8"},{"book":"mat","chapter":23,"verse":9,"text":"And do not call anyone on earth your father, for One is your Father, the One in heaven.","status":"source_text","id":"mat-23-9"},{"book":"mat","chapter":23,"verse":10,"text":"Nor are you to be called leaders, for One is your Leader, the Christ.","status":"source_text","id":"mat-23-10"},{"book":"mat","chapter":23,"verse":11,"text":"The greatest among you shall be your servant.","status":"source_text","id":"mat-23-11"},{"book":"mat","chapter":23,"verse":12,"text":"Whoever exalts himself will be humbled, and whoever humbles himself will be exalted.","status":"source_text","id":"mat-23-12"},{"book":"mat","chapter":23,"verse":13,"text":"But woe to you, scribes and Pharisees, hypocrites! You shut the kingdom of the heavens in people’s faces. You yourselves do not enter, nor do you allow those entering to go in.","status":"source_text","id":"mat-23-13"},{"book":"mat","chapter":23,"verse":14,"text":"—","status":"absent_from_critical_text","id":"mat-23-14"},{"book":"mat","chapter":23,"verse":15,"text":"Woe to you, scribes and Pharisees, hypocrites! You travel over sea and land to make one convert, and when he becomes one, you make him twice as much a son of Gehenna as yourselves.","status":"source_text","id":"mat-23-15"},{"book":"mat","chapter":23,"verse":16,"text":"Woe to you, blind guides, who say, ‘Whoever swears by the temple, it is nothing; but whoever swears by the gold of the temple is bound by his oath.’","status":"source_text","id":"mat-23-16"},{"book":"mat","chapter":23,"verse":17,"text":"Fools and blind men! Which is greater, the gold or the temple that makes the gold holy?","status":"source_text","id":"mat-23-17"},{"book":"mat","chapter":23,"verse":18,"text":"And you say, ‘Whoever swears by the altar, it is nothing; but whoever swears by the gift on it is bound by his oath.’","status":"source_text","id":"mat-23-18"},{"book":"mat","chapter":23,"verse":19,"text":"Blind men! Which is greater, the gift or the altar that makes the gift holy?","status":"source_text","id":"mat-23-19"},{"book":"mat","chapter":23,"verse":20,"text":"Therefore whoever swears by the altar swears by it and by everything on it.","status":"source_text","id":"mat-23-20"},{"book":"mat","chapter":23,"verse":21,"text":"And whoever swears by the temple swears by it and by the One who dwells in it.","status":"source_text","id":"mat-23-21"},{"book":"mat","chapter":23,"verse":22,"text":"And whoever swears by heaven swears by the throne of God and by the One who sits on it.","status":"source_text","id":"mat-23-22"},{"book":"mat","chapter":23,"verse":23,"text":"Woe to you, scribes and Pharisees, hypocrites! You give a tenth of mint and dill and cumin, but you have neglected the weightier matters of the Law—justice, mercy, and faithfulness. These you ought to have done without neglecting the others.","status":"source_text","id":"mat-23-23"},{"book":"mat","chapter":23,"verse":24,"text":"Blind guides! You strain out a gnat but swallow a camel.","status":"source_text","id":"mat-23-24"},{"book":"mat","chapter":23,"verse":25,"text":"Woe to you, scribes and Pharisees, hypocrites! You clean the outside of the cup and dish, but inside they are
